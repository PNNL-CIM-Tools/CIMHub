[build-system]
requires = ["setuptools~=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "cimhub_core"
description = "CIMHub core: shared .cimtbl import contract, export getters and native-model utilities"
readme = "README.md"
version = "3.0.0a0"
requires-python = ">=3.11"
license = { text = "BSD-2-Clause" }
authors = [
  { name = "Pacific Northwest National Laboratory", email = "gridappsd@pnnl.gov" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "cim-graph>=0.6.0a1,<0.7",
  "cim-topology",
  "cim-profiles",
  "cim-tables",
  "linkml-runtime~=1.9.5",
  "pyyaml",
  "requests",
]

[project.urls]
"Homepage" = "https://github.com/PNNL-CIM-Tools/CIMHub"
"Bug Tracker" = "https://github.com/PNNL-CIM-Tools/CIMHub/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "shapes/*.cimtbl"]
