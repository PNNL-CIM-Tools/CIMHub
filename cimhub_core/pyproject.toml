[build-system]
requires = ["setuptools~=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "cimhub_core"
description = "CIMHub core: shared .cimtbl import contract, export getters and native-model utilities"
readme = "README.md"
version = "3.0.0"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Alex Anderson", email = "19935503+AAndersn@users.noreply.github.com" },
  { name = "Tylor Slay" },
  { name = "Kapil Duwadi" },
  { name = "Nathan Gray" },
  { name = "Craig Allwardt", email = "3979063+craig8@users.noreply.github.com" },
  { name = "Andy Fisher" },
]
maintainers = [
  { name = "Pacific Northwest National Laboratory", email = "gridappsd@pnnl.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "cim-graph>=0.6.0a1,<0.7",
  "cim-topology>=0.1.0a2,<0.2",
  "cim-profiles>=0.2.0a1,<0.3",
  "cim-tables>=0.1.0a1,<0.2",
  "linkml-runtime~=1.9.5",
  "pyyaml",
  "requests",
]

[project.urls]
"Homepage" = "https://github.com/PNNL-CIM-Tools/CIMHub"
"Bug Tracker" = "https://github.com/PNNL-CIM-Tools/CIMHub/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "shapes/*.cimtbl"]
