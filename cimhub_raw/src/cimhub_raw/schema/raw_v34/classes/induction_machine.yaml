id: https://gridappsd.org/cimhub/raw_v34/classes/induction_machine
name: induction_machine
title: Induction Machine Record
description: raw RAW Induction Machine Record
imports:
  - linkml:types
  - ../types/common_types
prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34
default_prefix: raw
classes:
  InductionMachineRecord:
    description: Induction machine data record
    attributes:
      bus_id:
        description: I - Bus number or extended bus name
        range: integer
        required: true
        annotations:
          order: 1
          value_type: int
          separator: ","
      name:
        description: ID - Machine identifier (one or two characters)
        range: string
        required: false
        annotations:
          order: 2
          value_type: string
          width: 2
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: "1"
      status:
        description: ST - Machine status (1 in-service, 0 out-of-service)
        range: integer
        required: false
        annotations:
          order: 3
          value_type: int
          separator: ","
          raw_default: 1
      scode:
        description: SC - Machine standard code (1 NEMA, 2 IEC)
        range: integer
        required: false
        annotations:
          order: 4
          value_type: int
          separator: ","
          raw_default: 1
      dcode:
        description: DC - Machine design code (0 custom, 1-5 NEMA or IEC design)
        range: integer
        required: false
        annotations:
          order: 5
          value_type: int
          separator: ","
          raw_default: 2
      area:
        description: AREA - Area number (1 through 9999)
        range: integer
        required: false
        annotations:
          order: 6
          value_type: int
          separator: ","
          raw_default_rule: "area of bus I"
      zone:
        description: ZONE - Zone number (1 through 9999)
        range: integer
        required: false
        annotations:
          order: 7
          value_type: int
          separator: ","
          raw_default_rule: "zone of bus I"
      owner:
        description: OWNER - Owner number (1 through 9999)
        range: integer
        required: false
        annotations:
          order: 8
          value_type: int
          separator: ","
          raw_default_rule: "owner of bus I"
      tcode:
        description: TC - Mechanical load torque model (1 power law, 2 WECC)
        range: integer
        required: false
        annotations:
          order: 9
          value_type: int
          separator: ","
          raw_default: 1
      bcode:
        description: BC - Machine base power code (1 mechanical MW, 2 electrical MVA)
        range: integer
        required: false
        annotations:
          order: 10
          value_type: int
          separator: ","
          raw_default: 1
      mbase:
        description: MBASE - Machine base power in MW or MVA (unit per BCODE)
        range: float
        required: false
        annotations:
          order: 11
          value_type: float
          precision: 4
          separator: ","
          raw_default_rule: "system base MVA"
      ratekv:
        description: RATEKV - Machine rated voltage in kV line-to-line (0 uses the base voltage of bus I)
        range: float
        required: false
        unit:
          ucum_code: "kV"
        annotations:
          order: 12
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      pcode:
        description: PC - Scheduled power code (1 mechanical MW output, 2 electrical MW drawn)
        range: integer
        required: false
        annotations:
          order: 13
          value_type: int
          separator: ","
          raw_default: 1
      pset:
        description: PSET - Scheduled active power in MW at 1.0 pu terminal voltage (positive means motoring)
        range: float
        required: false
        unit:
          ucum_code: "MW"
        annotations:
          order: 14
          value_type: float
          precision: 4
          separator: ","
      h:
        description: H - Machine inertia in pu on MBASE
        range: float
        required: false
        annotations:
          order: 15
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      a:
        description: A - Load torque coefficient A (WECC model only)
        range: float
        required: false
        annotations:
          order: 16
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      b:
        description: B - Load torque coefficient B (WECC model only)
        range: float
        required: false
        annotations:
          order: 17
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      d:
        description: D - Load torque coefficient D (power law exponent term, or WECC)
        range: float
        required: false
        annotations:
          order: 18
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      e:
        description: E - Load torque coefficient E (WECC model only)
        range: float
        required: false
        annotations:
          order: 19
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      ra:
        description: RA - Armature resistance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 20
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      xa:
        description: XA - Armature leakage reactance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 21
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      xm:
        description: XM - Unsaturated magnetizing reactance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 22
          value_type: float
          precision: 4
          separator: ","
          raw_default: 2.5
      r1:
        description: R1 - First rotor cage resistance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 23
          value_type: float
          precision: 4
          separator: ","
          raw_default: 999.0
      x1:
        description: X1 - First rotor cage reactance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 24
          value_type: float
          precision: 4
          separator: ","
          raw_default: 999.0
      r2:
        description: R2 - Second rotor cage resistance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 25
          value_type: float
          precision: 4
          separator: ","
          raw_default: 999.0
      x2:
        description: X2 - Second rotor cage reactance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 26
          value_type: float
          precision: 4
          separator: ","
          raw_default: 999.0
      x3:
        description: X3 - Third rotor reactance in pu on MBASE and RATEKV
        range: float
        required: false
        annotations:
          order: 27
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      e1:
        description: E1 - First terminal voltage point on the saturation curve in pu on RATEKV
        range: float
        required: false
        annotations:
          order: 28
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0
      se1:
        description: SE1 - Saturation factor at terminal voltage E1
        range: float
        required: false
        annotations:
          order: 29
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      e2:
        description: E2 - Second terminal voltage point on the saturation curve in pu on RATEKV
        range: float
        required: false
        annotations:
          order: 30
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.2
      se2:
        description: SE2 - Saturation factor at terminal voltage E2
        range: float
        required: false
        annotations:
          order: 31
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      ia1:
        description: IA1 - First stator current in pu for stator leakage saturation
        range: float
        required: false
        annotations:
          order: 32
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      ia2:
        description: IA2 - Second stator current in pu for stator leakage saturation
        range: float
        required: false
        annotations:
          order: 33
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0
      xamult:
        description: XAMULT - Multiplier for the saturated XA (0 to 1.0)
        range: float
        required: false
        annotations:
          order: 34
          value_type: float
          precision: 4
          separator: ""  # No separator after last field
          raw_default: 1.0
