id: https://gridappsd.org/cimhub/raw_v34/classes/switched_shunt
name: switched_shunt
title: Switched Shunt Record
description: raw RAW Switched Shunt Record (variable-length single line)
imports:
  - linkml:types
  - ../types/common_types
prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34
default_prefix: raw
classes:
  SwitchedShuntRecord:
    description: |
      Switched shunt compensator data record.
      Variable-length format:
      - Fixed fields: I, MODSW, ADJM, STAT, VSWHI, VSWLO, SWREG, RMPCT, RMIDNT, BINIT
      - Variable blocks: Up to 8 N/B pairs (only non-zero blocks are serialized)
      - Final field: NREG (only if remote regulation is used)
      Maps to CIM: cim.ShuntCompensator, cim.LinearShuntCompensator
    attributes:
      # ==== FIXED FIELDS ====
      bus_number:
        description: I - Bus number or extended bus name where the switched shunt is connected
        range: integer
        required: true
        annotations:
          order: 1
          value_type: int
          separator: ","
      modsw:
        description: MODSW - Control mode (0 locked, 1 discrete local or remote voltage, 2 continuous voltage, 3-6 reactive power or admittance control)
        range: integer
        required: false
        annotations:
          order: 2
          value_type: int
          separator: ","
          raw_default: 1
      adjm:
        description: ADJM - Adjustment method (0 switch in input order, 1 next highest or lowest total admittance)
        range: integer
        required: false
        annotations:
          order: 3
          value_type: int
          separator: ","
          raw_default: 0
      status:
        description: STAT - Switched shunt status (0=out of service, 1=in service)
        range: integer
        required: false
        annotations:
          order: 4
          value_type: int
          separator: ","
          raw_default: 1
      vswhi:
        description: VSWHI - Voltage upper limit for switching in per-unit
        range: float
        required: false
        annotations:
          order: 5
          value_type: float
          precision: 5
          separator: ","
          raw_default: 1.0
      vswlo:
        description: VSWLO - Voltage lower limit for switching in per-unit
        range: float
        required: false
        annotations:
          order: 6
          value_type: float
          precision: 5
          separator: ","
          raw_default: 1.0
      swreg:
        description: SWREG - Bus number or extended bus name of the regulated bus (0 or own bus for local control)
        range: integer
        required: false
        annotations:
          order: 7
          value_type: int
          separator: ","
          raw_default: 0
      rmpct:
        description: RMPCT - Percent of required Mvar contribution (must be positive)
        range: float
        required: false
        annotations:
          order: 8
          value_type: float
          precision: 4
          separator: ","
          raw_default: 100.0
      rmidnt:
        description: RMIDNT - Name of the VSC dc line (MODSW 4) or FACTS device (MODSW 6)
        range: string
        required: false
        annotations:
          order: 9
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: ""
      binit:
        description: BINIT - Initial switched shunt admittance in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 10
          value_type: float
          precision: 5
          separator: ","
          raw_default: 0.0
      # ==== VARIABLE BLOCKS (N/B pairs) ====
      n1:
        description: N1 - Number of steps for block 1 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 11
          value_type: int
          separator: ","
          serialize_if: "custom:n1 != 0"
          raw_default: 0
      b1:
        description: B1 - Admittance increment for each step in block 1 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 12
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n1 != 0"
          raw_default: 0.0
      n2:
        description: N2 - Number of steps for block 2 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 13
          value_type: int
          separator: ","
          serialize_if: "custom:n2 != 0"
          raw_default: 0
      b2:
        description: B2 - Admittance increment for each step in block 2 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 14
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n2 != 0"
          raw_default: 0.0
      n3:
        description: N3 - Number of steps for block 3 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 15
          value_type: int
          separator: ","
          serialize_if: "custom:n3 != 0"
          raw_default: 0
      b3:
        description: B3 - Admittance increment for each step in block 3 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 16
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n3 != 0"
          raw_default: 0.0
      n4:
        description: N4 - Number of steps for block 4 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 17
          value_type: int
          separator: ","
          serialize_if: "custom:n4 != 0"
          raw_default: 0
      b4:
        description: B4 - Admittance increment for each step in block 4 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 18
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n4 != 0"
          raw_default: 0.0
      n5:
        description: N5 - Number of steps for block 5 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 19
          value_type: int
          separator: ","
          serialize_if: "custom:n5 != 0"
          raw_default: 0
      b5:
        description: B5 - Admittance increment for each step in block 5 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 20
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n5 != 0"
          raw_default: 0.0
      n6:
        description: N6 - Number of steps for block 6 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 21
          value_type: int
          separator: ","
          serialize_if: "custom:n6 != 0"
          raw_default: 0
      b6:
        description: B6 - Admittance increment for each step in block 6 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 22
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n6 != 0"
          raw_default: 0.0
      n7:
        description: N7 - Number of steps for block 7 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 23
          value_type: int
          separator: ","
          serialize_if: "custom:n7 != 0"
          raw_default: 0
      b7:
        description: B7 - Admittance increment for each step in block 7 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 24
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n7 != 0"
          raw_default: 0.0
      n8:
        description: N8 - Number of steps for block 8 (0 to 9)
        range: integer
        required: false
        annotations:
          order: 25
          value_type: int
          separator: ","
          serialize_if: "custom:n8 != 0"
          raw_default: 0
      b8:
        description: B8 - Admittance increment for each step in block 8 in Mvar at unity voltage
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 26
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:n8 != 0"
          raw_default: 0.0
      # ==== TRAILING FIELD ====
      nreg:
        description: NREG - Node number of bus SWREG (0 if SWREG is not in a substation)
        range: integer
        required: false
        annotations:
          order: 27
          value_type: int
          separator: ""  # No separator after last field
          raw_default: 0
