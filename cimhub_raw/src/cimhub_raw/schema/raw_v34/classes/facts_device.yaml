id: https://gridappsd.org/cimhub/raw_v34/classes/facts_device
name: facts_device
title: FACTS Device Record
description: raw RAW FACTS Device Record

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  FactsDeviceRecord:
    description: FACTS control device data record
    attributes:
      name:
        description: NAME - FACTS device name
        range: string
        required: true
        annotations:
          order: 1
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","

      ibus:
        description: I - Sending end bus number or extended bus name
        range: integer
        required: true
        annotations:
          order: 2
          value_type: int
          separator: ","

      jbus:
        description: J - Terminal end bus number or extended bus name (0 for a STATCON)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 3
          value_type: int
          separator: ","
          raw_default: 0

      mode:
        description: MODE - Control mode
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 4
          value_type: int
          separator: ","
          raw_default: 1

      pdes:
        description: PDES - Desired active power flow in MW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 5
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      qdes:
        description: QDES - Desired reactive power flow in MVAr
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 6
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      vset:
        description: VSET - Voltage setpoint in pu
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          order: 7
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      shmx:
        description: SHMX - Maximum shunt current in MVA at unity voltage
        range: float
        required: false
        ifabsent: float(9999.0)
        unit:
          ucum_code: "MVA"
        annotations:
          order: 8
          value_type: float
          precision: 4
          separator: ","
          raw_default: 9999.0

      trmx:
        description: TRMX - Maximum bridge active power transfer in MW
        range: float
        required: false
        ifabsent: float(9999.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 9
          value_type: float
          precision: 4
          separator: ","
          raw_default: 9999.0

      vtmn:
        description: VTMN - Minimum voltage limit at the terminal end bus in pu
        range: float
        required: false
        ifabsent: float(0.9)
        annotations:
          order: 10
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.9

      vtmx:
        description: VTMX - Maximum voltage limit at the terminal end bus in pu
        range: float
        required: false
        ifabsent: float(1.1)
        annotations:
          order: 11
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.1

      vsmx:
        description: VSMX - Maximum series voltage in pu
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          order: 12
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      imx:
        description: IMX - Maximum series current in MVA at unity voltage (0 for no limit)
        range: float
        required: false
        ifabsent: float(9999.0)
        unit:
          ucum_code: "MVA"
        annotations:
          order: 13
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      linx:
        description: LINX - Reactance of dummy series element in pu
        range: float
        required: false
        ifabsent: float(0.05)
        annotations:
          order: 14
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.05

      rmpct:
        description: RMPCT - Percent of required Mvar supplied by the shunt element (must be positive)
        range: float
        required: false
        ifabsent: float(100.0)
        annotations:
          order: 15
          value_type: float
          precision: 4
          separator: ","
          raw_default: 100.0

      owner:
        description: OWNER - Owner number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 16
          value_type: int
          separator: ","
          raw_default: 1

      set1:
        description: SET1 - Series setpoint 1 (R for MODE 3; magnitude or Vd for MODE 4, 7, 8)
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          order: 17
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      set2:
        description: SET2 - Series setpoint 2 (X for MODE 3; angle or Vq for MODE 4, 7, 8)
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          order: 18
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      vsref:
        description: VSREF - Series voltage reference code (0 sending end voltage, 1 series current)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 19
          value_type: int
          separator: ","
          raw_default: 0

      remot:
        description: FCREG - Bus number or extended bus name of the bus whose voltage the shunt regulates (0 for sending end)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 20
          value_type: int
          separator: ","
          raw_default: 0

      mname:
        description: MNAME - Name of the master FACTS device when this device is an IPFC slave (MODE 6 or 8)
        range: string
        required: false
        ifabsent: string("            ")
        annotations:
          order: 21
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: ""

      nreg:
        description: NREG - Node number of bus FCREG (0 if FCREG is not in a substation)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 22
          value_type: int
          separator: ""  # No separator after last field
          raw_default: 0
