id: https://gridappsd.org/cimhub/raw_v34/classes/load
name: load
title: Load Record
description: raw RAW Load Record

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  LoadRecord:
    description: Load data record
    attributes:
      bus_number:
        description: I - Bus number
        range: integer
        required: true
        annotations:
          order: 1
          value_type: int
          separator: ","

      load_id:
        description: ID - Load identifier (1 or 2 characters)
        range: string
        required: false
        ifabsent: string("1 ")
        annotations:
          order: 2
          value_type: string
          width: 2
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: "1"

      status:
        description: STAT - Load status (0=out of service, 1=in service)
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 3
          value_type: int
          separator: ","
          raw_default: 1

      area:
        description: AREA - Area number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 4
          value_type: int
          separator: ","

      zone:
        description: ZONE - Zone number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 5
          value_type: int
          separator: ","

      constant_real_power:
        description: PL - Active power component of constant MVA load in MW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 6
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      constant_imag_power:
        description: QL - Reactive power component of constant MVA load in MVAr
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 7
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      constant_current_real_power:
        description: IP - Active power component of constant current load in MW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 8
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      constant_current_imag_power:
        description: IQ - Reactive power component of constant current load in MVAr
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 9
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      constant_admittance_real_power:
        description: YP - Active power component of constant admittance load in MW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 10
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      constant_admittance_imag_power:
        description: YQ - Reactive power component of constant admittance load in MVAr
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 11
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      owner:
        description: OWNER - Owner number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 12
          value_type: int
          separator: ","

      scale:
        description: SCALE - Load scaling flag
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          order: 13
          value_type: int
          separator: ","
          raw_default: 1

      interruptible:
        description: INTRPT - Interruptible load flag
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 14
          value_type: int
          separator: ","
          raw_default: 0

      dgenp:
        description: DGENP - Distributed generation active power in MW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MW"
        annotations:
          order: 15
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      dgenq:
        description: DGENQ - Distributed generation reactive power in MVAr
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          order: 16
          value_type: float
          precision: 3
          separator: ","
          raw_default: 0.0

      dgenf:
        description: DGENM - Distributed generation operation mode (0=off, 1=on)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          order: 17
          value_type: int
          separator: ""  # No separator after last field
          raw_default: 0
