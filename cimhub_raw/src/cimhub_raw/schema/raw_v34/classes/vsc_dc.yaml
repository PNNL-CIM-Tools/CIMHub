id: https://gridappsd.org/cimhub/raw_v34/classes/vsc_dc
name: vsc_dc
title: Voltage Source Converter DC Transmission Line Record
description: raw RAW VSC DC Transmission Line Record (2 lines per record)

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  VscDcRecord:
    description: |
      Voltage source converter (VSC) DC transmission line data record.

      Multi-line format:
      - Line 1: VSC DC line identification, resistance, and ownership
      - Line 2: Converter data and control parameters

      Maps to CIM: cim.DCLineSegment, cim.VsConverter

    attributes:
      # ==== LINE 1: VSC DC Line Data ====
      name:
        # NOT an identifier: two VscDcRecords (rectifier + inverter) share the
        # same NAME per DC line. Marking it identifier: true would make
        # GraphModel silently drop the second converter. Uniqueness comes from a
        # composite runtime .ID (name + ibus) assigned by the reader/exporter.
        description: NAME - VSC DC line name (12 characters)
        range: string
        required: true
        annotations:
          line_number: 1
          order: 1
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","

      mdc:
        description: MDC - Control mode (0=out of service, 1=in service)
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 2
          value_type: int
          separator: ","
          raw_default: 1

      rdc:
        description: RDC - DC line resistance in ohms (must be positive)
        range: float
        required: true
        ifabsent: float(0.0)
        unit:
          ucum_code: "ohm"
        annotations:
          line_number: 1
          order: 3
          value_type: float
          precision: 5
          separator: ","

      o1:
        description: O1 - Owner 1 number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 4
          value_type: int
          separator: ","
          raw_default: 1

      f1:
        description: F1 - Fraction of ownership for owner 1 (0.0 to 1.0)
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          line_number: 1
          order: 5
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o2:
        description: O2 - Owner 2 number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 6
          value_type: int
          separator: ","
          raw_default: 0

      f2:
        description: F2 - Fraction of ownership for owner 2 (0.0 to 1.0)
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 7
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o3:
        description: O3 - Owner 3 number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 8
          value_type: int
          separator: ","
          raw_default: 0

      f3:
        description: F3 - Fraction of ownership for owner 3 (0.0 to 1.0)
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 9
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o4:
        description: O4 - Owner 4 number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 10
          value_type: int
          separator: ","
          raw_default: 0

      f4:
        description: F4 - Fraction of ownership for owner 4 (0.0 to 1.0)
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 11
          value_type: float
          precision: 4
          separator: ""
          raw_default: 1.0

      # ==== LINE 2: Converter Data ====
      ibus:
        description: IBUS - Converter bus number
        range: integer
        required: true
        annotations:
          line_number: 2
          order: 1
          value_type: int
          separator: ","

      converter_type:
        description: TYPE - Converter DC control code (0=out of service, 1=DC voltage control, 2=MW control)
        range: integer
        required: true
        ifabsent: int(1)
        annotations:
          line_number: 2
          order: 2
          value_type: int
          separator: ","

      mode:
        description: MODE - Converter AC control mode (1=AC voltage control, 2=fixed AC power factor)
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 2
          order: 3
          value_type: int
          separator: ","
          raw_default: 1

      dcset:
        description: DCSET - DC voltage setpoint (TYPE 1) or power demand (TYPE 2, + into AC network)
        range: float
        required: true
        ifabsent: float(0.0)
        annotations:
          line_number: 2
          order: 4
          value_type: float
          precision: 4
          separator: ","
          note: "Unit depends on TYPE - kV for TYPE 1 (DC voltage), MW for TYPE 2 (power)"

      acset:
        description: ACSET - AC voltage setpoint in pu (MODE 1) or power factor setpoint (MODE 2)
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          line_number: 2
          order: 5
          value_type: float
          precision: 4
          separator: ","
          comments: "Unit depends on MODE - pu for MODE 1 (AC voltage), power factor for MODE 2"
          raw_default: 1.0

      aloss:
        description: ALOSS - Constant converter loss coefficient in kW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 2
          order: 6
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      bloss:
        description: BLOSS - Linear converter loss coefficient in kW per ampere of DC current
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "kW/A"
        annotations:
          line_number: 2
          order: 7
          value_type: float
          precision: 5
          separator: ","
          raw_default: 0.0

      minloss:
        description: MINLOSS - Minimum converter loss in kW
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 2
          order: 8
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      smax:
        description: SMAX - Converter MVA rating in MVA (0 = unlimited)
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 2
          order: 9
          value_type: float
          precision: 2
          separator: ","
          raw_default: 0.0

      imax:
        description: IMAX - Converter AC current rating in amperes (0 = unlimited)
        range: float
        required: false
        ifabsent: float(0.0)
        unit:
          ucum_code: "A"
        annotations:
          line_number: 2
          order: 10
          value_type: float
          precision: 2
          separator: ","
          raw_default: 0.0

      pwf:
        description: PWF - Power weighting factor (0 to 1) splitting the reduction between active and reactive power when the rating is exceeded
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          line_number: 2
          order: 11
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      maxq:
        description: MAXQ - Maximum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        ifabsent: float(9999.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 2
          order: 12
          value_type: float
          precision: 2
          separator: ","
          raw_default: 9999.0

      minq:
        description: MINQ - Minimum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        ifabsent: float(-9999.0)
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 2
          order: 13
          value_type: float
          precision: 2
          separator: ","
          raw_default: -9999.0

      vsreg:
        description: VSREG - Bus number whose voltage is regulated by this converter (0=own bus)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 2
          order: 14
          value_type: int
          separator: ","
          raw_default: 0

      rmpct:
        description: RMPCT - Percent of the total Mvar at the regulated bus supplied by this converter (must be positive)
        range: float
        required: false
        ifabsent: float(100.0)
        annotations:
          line_number: 2
          order: 15
          value_type: float
          precision: 2
          separator: ","
          raw_default: 100.0

      nreg:
        description: NREG - Node number of bus VSREG (0 if VSREG is not in a substation)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 2
          order: 16
          value_type: int
          separator: ""
          raw_default: 0
