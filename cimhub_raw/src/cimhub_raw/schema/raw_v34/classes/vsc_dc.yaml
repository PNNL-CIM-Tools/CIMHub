id: https://gridappsd.org/cimhub/raw_v34/classes/vsc_dc
name: vsc_dc
title: Voltage Source Converter DC Transmission Line Record
description: "raw RAW VSC DC Transmission Line Record (3 lines per record: the line, then its two converters)"

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  VscDcRecord:
    description: |
      Voltage source converter (VSC) DC transmission line data record.

      Multi-line format:
      - Line 1: VSC DC line identification, resistance, and ownership
      - Lines 2 and 3: the two converters' data and control parameters

      Maps to CIM: cim.DCLineSegment, cim.VsConverter

    attributes:
      # ==== LINE 1: VSC DC Line Data ====
      name:
        description: NAME - VSC DC line name (12 characters)
        range: string
        required: true
        identifier: true
        annotations:
          line_number: 1
          order: 1
          value_type: string
          width: 12
          quote: true
          quote_char: "'"

      mdc:
        description: MDC - Control mode (0=out of service, 1=in service)
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 2
          value_type: int
          raw_default: 1

      rdc:
        description: RDC - DC line resistance in ohms (must be positive)
        range: float
        required: true
        unit:
          ucum_code: "ohm"
        annotations:
          line_number: 1
          order: 3
          value_type: float
          precision: 5

      o1:
        description: O1 - Owner 1 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 4
          value_type: int
          raw_default: 1

      f1:
        description: F1 - Fraction of ownership for owner 1 (0.0 to 1.0)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 5
          value_type: float
          precision: 4
          raw_default: 1.0

      o2:
        description: O2 - Owner 2 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 6
          value_type: int
          raw_default: 0

      f2:
        description: F2 - Fraction of ownership for owner 2 (0.0 to 1.0)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 7
          value_type: float
          precision: 4
          raw_default: 1.0

      o3:
        description: O3 - Owner 3 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 8
          value_type: int
          raw_default: 0

      f3:
        description: F3 - Fraction of ownership for owner 3 (0.0 to 1.0)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 9
          value_type: float
          precision: 4
          raw_default: 1.0

      o4:
        description: O4 - Owner 4 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 10
          value_type: int
          raw_default: 0

      f4:
        description: F4 - Fraction of ownership for owner 4 (0.0 to 1.0)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 11
          value_type: float
          precision: 4
          raw_default: 1.0

      # ==== LINE 2: Converter 1 Data ====
      ibus_1:
        description: IBUS - (converter 1) Converter bus number
        range: integer
        required: true
        annotations:
          line_number: 2
          order: 1
          value_type: int

      converter_type_1:
        description: TYPE - (converter 1) Converter DC control code (0=out of service, 1=DC voltage control, 2=MW control)
        range: integer
        required: true
        annotations:
          line_number: 2
          order: 2
          value_type: int

      mode_1:
        description: MODE - (converter 1) Converter AC control mode (1=AC voltage control, 2=fixed AC power factor)
        range: integer
        required: false
        annotations:
          line_number: 2
          order: 3
          value_type: int
          raw_default: 1

      dcset_1:
        description: DCSET - (converter 1) DC voltage setpoint (TYPE 1) or power demand (TYPE 2, + into AC network)
        range: float
        required: true
        annotations:
          line_number: 2
          order: 4
          value_type: float
          precision: 4
          note: "Unit depends on TYPE - kV for TYPE 1 (DC voltage), MW for TYPE 2 (power)"

      acset_1:
        description: ACSET - (converter 1) AC voltage setpoint in pu (MODE 1) or power factor setpoint (MODE 2)
        range: float
        required: false
        annotations:
          line_number: 2
          order: 5
          value_type: float
          precision: 4
          comments: "Unit depends on MODE - pu for MODE 1 (AC voltage), power factor for MODE 2"
          raw_default: 1.0

      aloss_1:
        description: ALOSS - (converter 1) Constant converter loss coefficient in kW
        range: float
        required: false
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 2
          order: 6
          value_type: float
          precision: 4
          raw_default: 0.0

      bloss_1:
        description: BLOSS - (converter 1) Linear converter loss coefficient in kW per ampere of DC current
        range: float
        required: false
        unit:
          ucum_code: "kW/A"
        annotations:
          line_number: 2
          order: 7
          value_type: float
          precision: 5
          raw_default: 0.0

      minloss_1:
        description: MINLOSS - (converter 1) Minimum converter loss in kW
        range: float
        required: false
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 2
          order: 8
          value_type: float
          precision: 4
          raw_default: 0.0

      smax_1:
        description: SMAX - (converter 1) Converter MVA rating in MVA (0 = unlimited)
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 2
          order: 9
          value_type: float
          precision: 2
          raw_default: 0.0

      imax_1:
        description: IMAX - (converter 1) Converter AC current rating in amperes (0 = unlimited)
        range: float
        required: false
        unit:
          ucum_code: "A"
        annotations:
          line_number: 2
          order: 10
          value_type: float
          precision: 2
          raw_default: 0.0

      pwf_1:
        description: PWF - (converter 1) Power weighting factor (0 to 1) splitting the reduction between active and reactive power when the rating is exceeded
        range: float
        required: false
        annotations:
          line_number: 2
          order: 11
          value_type: float
          precision: 4
          raw_default: 1.0

      maxq_1:
        description: MAXQ - (converter 1) Maximum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 2
          order: 12
          value_type: float
          precision: 2
          raw_default: 9999.0

      minq_1:
        description: MINQ - (converter 1) Minimum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 2
          order: 13
          value_type: float
          precision: 2
          raw_default: -9999.0

      vsreg_1:
        description: VSREG - (converter 1) Bus number whose voltage is regulated by this converter (0=own bus)
        range: integer
        required: false
        annotations:
          line_number: 2
          order: 14
          value_type: int
          raw_default: 0

      rmpct_1:
        description: RMPCT - (converter 1) Percent of the total Mvar at the regulated bus supplied by this converter (must be positive)
        range: float
        required: false
        annotations:
          line_number: 2
          order: 15
          value_type: float
          precision: 2
          raw_default: 100.0

      nreg_1:
        description: NREG - (converter 1) Node number of bus VSREG (0 if VSREG is not in a substation)
        range: integer
        required: false
        annotations:
          line_number: 2
          order: 16
          value_type: int
          raw_default: 0
      # ==== LINE 3: Converter 2 Data ====
      ibus_2:
        description: IBUS - (converter 2) Converter bus number
        range: integer
        required: true
        annotations:
          line_number: 3
          order: 1
          value_type: int

      converter_type_2:
        description: TYPE - (converter 2) Converter DC control code (0=out of service, 1=DC voltage control, 2=MW control)
        range: integer
        required: true
        annotations:
          line_number: 3
          order: 2
          value_type: int

      mode_2:
        description: MODE - (converter 2) Converter AC control mode (1=AC voltage control, 2=fixed AC power factor)
        range: integer
        required: false
        annotations:
          line_number: 3
          order: 3
          value_type: int
          raw_default: 1

      dcset_2:
        description: DCSET - (converter 2) DC voltage setpoint (TYPE 1) or power demand (TYPE 2, + into AC network)
        range: float
        required: true
        annotations:
          line_number: 3
          order: 4
          value_type: float
          precision: 4
          note: "Unit depends on TYPE - kV for TYPE 1 (DC voltage), MW for TYPE 2 (power)"

      acset_2:
        description: ACSET - (converter 2) AC voltage setpoint in pu (MODE 1) or power factor setpoint (MODE 2)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 5
          value_type: float
          precision: 4
          comments: "Unit depends on MODE - pu for MODE 1 (AC voltage), power factor for MODE 2"
          raw_default: 1.0

      aloss_2:
        description: ALOSS - (converter 2) Constant converter loss coefficient in kW
        range: float
        required: false
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 3
          order: 6
          value_type: float
          precision: 4
          raw_default: 0.0

      bloss_2:
        description: BLOSS - (converter 2) Linear converter loss coefficient in kW per ampere of DC current
        range: float
        required: false
        unit:
          ucum_code: "kW/A"
        annotations:
          line_number: 3
          order: 7
          value_type: float
          precision: 5
          raw_default: 0.0

      minloss_2:
        description: MINLOSS - (converter 2) Minimum converter loss in kW
        range: float
        required: false
        unit:
          ucum_code: "kW"
        annotations:
          line_number: 3
          order: 8
          value_type: float
          precision: 4
          raw_default: 0.0

      smax_2:
        description: SMAX - (converter 2) Converter MVA rating in MVA (0 = unlimited)
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 3
          order: 9
          value_type: float
          precision: 2
          raw_default: 0.0

      imax_2:
        description: IMAX - (converter 2) Converter AC current rating in amperes (0 = unlimited)
        range: float
        required: false
        unit:
          ucum_code: "A"
        annotations:
          line_number: 3
          order: 10
          value_type: float
          precision: 2
          raw_default: 0.0

      pwf_2:
        description: PWF - (converter 2) Power weighting factor (0 to 1) splitting the reduction between active and reactive power when the rating is exceeded
        range: float
        required: false
        annotations:
          line_number: 3
          order: 11
          value_type: float
          precision: 4
          raw_default: 1.0

      maxq_2:
        description: MAXQ - (converter 2) Maximum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 3
          order: 12
          value_type: float
          precision: 2
          raw_default: 9999.0

      minq_2:
        description: MINQ - (converter 2) Minimum reactive power limit in MVAr (not used when MODE is 2)
        range: float
        required: false
        unit:
          ucum_code: "MVAr"
        annotations:
          line_number: 3
          order: 13
          value_type: float
          precision: 2
          raw_default: -9999.0

      vsreg_2:
        description: VSREG - (converter 2) Bus number whose voltage is regulated by this converter (0=own bus)
        range: integer
        required: false
        annotations:
          line_number: 3
          order: 14
          value_type: int
          raw_default: 0

      rmpct_2:
        description: RMPCT - (converter 2) Percent of the total Mvar at the regulated bus supplied by this converter (must be positive)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 15
          value_type: float
          precision: 2
          raw_default: 100.0

      nreg_2:
        description: NREG - (converter 2) Node number of bus VSREG (0 if VSREG is not in a substation)
        range: integer
        required: false
        annotations:
          line_number: 3
          order: 16
          value_type: int
          raw_default: 0
