          value_type: float
          precision: 4
          separator: ","

      vecgrp:
        description: VECGRP - Vector group (12 characters)
        range: string
        required: false
        ifabsent: string("            ")
        annotations:
          line_number: 1
          order: 21
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","

      zcod:
        description: ZCOD - Impedance correction table number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 22
          value_type: int
