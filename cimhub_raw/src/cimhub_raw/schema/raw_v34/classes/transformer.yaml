          separator: ","
          raw_default: 0

      rma1:
        description: RMA1 - Winding 1 upper limit (pu or kV per CW, or degrees for |COD| 3 or 5)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 18
          value_type: float
          precision: 5
          separator: ","
          raw_default_rule: "1.1 if CW is 1 or 3 and |COD| is not 3 or 5; no default otherwise"

      rmi1:
        description: RMI1 - Winding 1 lower limit (pu or kV per CW, or degrees for |COD| 3 or 5)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 19
          value_type: float
          precision: 5
          separator: ","
          raw_default_rule: "0.9 if CW is 1 or 3 and |COD| is not 3 or 5; no default otherwise"

      vma1:
        description: VMA1 - Winding 1 upper limit (pu bus voltage, Mvar or MW per |COD|)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 20
          value_type: float
          precision: 5
          separator: ","
          raw_default_rule: "1.1 if |COD| is 1; no default for |COD| 2, 3 or 5"

      vmi1:
