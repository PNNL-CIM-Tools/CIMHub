id: https://gridappsd.org/cimhub/raw_v34/classes/transformer
name: transformer
title: Transformer Record
description: raw RAW Transformer Record (2 or 3 winding, 4 lines per record)

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  TransformerRecord:
    description: |
      Transformer data record (2 or 3 winding).

      Multi-line format:
      - Line 1: Basic identification and ownership
      - Line 2: Impedance data
      - Line 3: Winding 1 data
      - Line 4: Winding 2 data
      - Line 5: Winding 3 data (only if K != 0)

      Maps to CIM: cim.PowerTransformer, cim.PowerTransformerEnd

    attributes:
      # ==== LINE 1: Basic Data ====
      i:
        description: I - Winding 1 bus number
        range: integer
        required: true
        annotations:
          line_number: 1
          order: 1
          value_type: int
          separator: ","

      j:
        description: J - Winding 2 bus number
        range: integer
        required: true
        annotations:
          line_number: 1
          order: 2
          value_type: int
          separator: ","

      k:
        description: K - Winding 3 bus number (0 for 2-winding)
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 3
          value_type: int
          separator: ","
          raw_default: 0

      circuit:
        description: CKT - Circuit identifier (1 or 2 characters)
        range: string
        required: false
        annotations:
          line_number: 1
          order: 4
          value_type: string
          width: 2
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: "1"

      cw:
        description: CW - Winding data I/O code
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 5
          value_type: int
          separator: ","
          raw_default: 1

      cz:
        description: CZ - Impedance data I/O code
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 6
          value_type: int
          separator: ","
          raw_default: 1

      cm:
        description: CM - Magnetizing admittance I/O code
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 7
          value_type: int
          separator: ","
          raw_default: 1

      mag1:
        description: MAG1 - Magnetizing conductance in pu (CM 1, system MVA base) or no-load loss in W (CM 2)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 8
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      mag2:
        description: MAG2 - Magnetizing susceptance in pu (CM 1, system MVA base) or exciting current in pu (CM 2)
        range: float
        required: false
        annotations:
          line_number: 1
          order: 9
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      nmetr:
        description: NMETR - Metered end flag (1, 2, or 3)
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 10
          value_type: int
          separator: ","
          raw_default: 2

      name:
        description: NAME - Transformer name (40 characters)
        range: string
        required: false
        annotations:
          line_number: 1
          order: 11
          value_type: string
          width: 40
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: ""

      status:
        description: STAT - Transformer status (0 out of service, 1 in service; 3-winding also 2, 3, 4 = one winding out)
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 12
          value_type: int
          separator: ","
          raw_default: 1

      o1:
        description: O1 - Owner 1 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 13
          value_type: int
          separator: ","
          raw_default_rule: "owner assigned to bus I"

      f1:
        description: F1 - Fraction of ownership for owner 1
        range: float
        required: false
        annotations:
          line_number: 1
          order: 14
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o2:
        description: O2 - Owner 2 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 15
          value_type: int
          separator: ","
          raw_default: 0

      f2:
        description: F2 - Fraction of ownership for owner 2
        range: float
        required: false
        annotations:
          line_number: 1
          order: 16
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o3:
        description: O3 - Owner 3 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 17
          value_type: int
          separator: ","
          raw_default: 0

      f3:
        description: F3 - Fraction of ownership for owner 3
        range: float
        required: false
        annotations:
          line_number: 1
          order: 18
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      o4:
        description: O4 - Owner 4 number
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 19
          value_type: int
          separator: ","
          raw_default: 0

      f4:
        description: F4 - Fraction of ownership for owner 4
        range: float
        required: false
        annotations:
          line_number: 1
          order: 20
          value_type: float
          precision: 4
          separator: ","
          raw_default: 1.0

      vecgrp:
        description: VECGRP - Vector group (12 characters)
        range: string
        required: false
        annotations:
          line_number: 1
          order: 21
          value_type: string
          width: 12
          quote: true
          quote_char: "'"
          separator: ","
          raw_default: ""

      zcod:
        description: ZCOD - Impedance correction method (0 winding impedances, 1 bus-to-bus impedances); 3-winding only
        range: integer
        required: false
        annotations:
          line_number: 1
          order: 22
          value_type: int
          separator: ""
          serialize_if: "custom:k != 0"
          raw_default: 0

      # ==== LINE 2: Impedance Data ====
      r1_2:
        description: R1-2 - Winding 1-2 resistance in pu (CZ 1 system base, CZ 2 SBASE1-2) or load loss in W (CZ 3)
        range: float
        required: false
        annotations:
          line_number: 2
          order: 1
          value_type: float
          precision: 5
          separator: ","
          raw_default: 0.0

      x1_2:
        description: X1-2 - Winding 1-2 reactance in pu (CZ 1 system base, CZ 2 SBASE1-2) or impedance magnitude in pu (CZ 3)
        range: float
        required: true
        annotations:
          line_number: 2
          order: 2
          value_type: float
          precision: 5
          separator: ","

      sbase1_2:
        description: SBASE1-2 - Winding 1-2 base MVA
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 2
          order: 3
          value_type: float
          precision: 2
          separator: ","
          raw_default_rule: "SBASE (system base MVA)"

      r2_3:
        description: R2-3 - Winding 2-3 resistance in pu (CZ 1 system base, CZ 2 SBASE2-3) or load loss in W (CZ 3); 3-winding only
        range: float
        required: false
        annotations:
          line_number: 2
          order: 4
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:k != 0"
          raw_default: 0.0

      x2_3:
        description: X2-3 - Winding 2-3 reactance in pu (CZ 1 system base, CZ 2 SBASE2-3) or impedance magnitude in pu (CZ 3); 3-winding only
        range: float
        required: false
        annotations:
          line_number: 2
          order: 5
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:k != 0"

      sbase2_3:
        description: SBASE2-3 - Winding 2-3 base MVA (3-winding only)
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 2
          order: 6
          value_type: float
          precision: 2
          separator: ","
          serialize_if: "custom:k != 0"
          raw_default_rule: "SBASE (system base MVA)"

      r3_1:
        description: R3-1 - Winding 3-1 resistance in pu (CZ 1 system base, CZ 2 SBASE3-1) or load loss in W (CZ 3); 3-winding only
        range: float
        required: false
        annotations:
          line_number: 2
          order: 7
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:k != 0"
          raw_default: 0.0

      x3_1:
        description: X3-1 - Winding 3-1 reactance in pu (CZ 1 system base, CZ 2 SBASE3-1) or impedance magnitude in pu (CZ 3); 3-winding only
        range: float
        required: false
        annotations:
          line_number: 2
          order: 8
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:k != 0"

      sbase3_1:
        description: SBASE3-1 - Winding 3-1 base MVA (3-winding only)
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 2
          order: 9
          value_type: float
          precision: 2
          separator: ","
          serialize_if: "custom:k != 0"
          raw_default_rule: "SBASE (system base MVA)"

      vmstar:
        description: VMSTAR - Star point voltage magnitude in pu
        range: float
        required: false
        annotations:
          line_number: 2
          order: 10
          value_type: float
          precision: 5
          separator: ","
          serialize_if: "custom:k != 0"
          raw_default: 1.0

      anstar:
        description: ANSTAR - Star point voltage angle in degrees
        range: float
        required: false
        unit:
          ucum_code: "deg"
        annotations:
          line_number: 2
          order: 11
          value_type: float
          precision: 5
          separator: ""
          serialize_if: "custom:k != 0"
          raw_default: 0.0

      # ==== LINE 3: Winding 1 Data ====
      windv1:
        description: WINDV1 - Winding 1 turns ratio in pu (CW 1 or 3) or voltage in kV (CW 2)
        range: float
        required: false
        annotations:
          line_number: 3
          order: 1
          value_type: float
          precision: 5
          separator: ","
          raw_default_rule: "1.0 if CW is 1 or 3; bus I base voltage if CW is 2"

      nomv1:
        description: NOMV1 - Winding 1 nominal voltage in kV
        range: float
        required: false
        unit:
          ucum_code: "kV"
        annotations:
          line_number: 3
          order: 2
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      ang1:
        description: ANG1 - Winding 1 phase shift angle in degrees
        range: float
        required: false
        unit:
          ucum_code: "deg"
        annotations:
          line_number: 3
          order: 3
          value_type: float
          precision: 4
          separator: ","
          raw_default: 0.0

      rate1_1:
        description: RATE1-1 - Winding 1 rating 1 in MVA (or current as MVA, per XFRRAT)
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          line_number: 3
          order: 4
          value_type: float
          precision: 2
          separator: ","
          raw_default: 0.0

      rate1_2:
        description: RATE1-2 - Winding 1 rating 2 in MVA (or current as MVA, per XFRRAT)
