id: https://gridappsd.org/cimhub/raw_v34/classes/transformer
name: transformer
title: Transformer Record
description: raw RAW Transformer Record (2 or 3 winding, 4 lines per record)

imports:
  - linkml:types
  - ../types/common_types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  TransformerRecord:
    description: |
      Transformer data record (2 or 3 winding).

      Multi-line format:
      - Line 1: Basic identification and ownership
      - Line 2: Impedance data
      - Line 3: Winding 1 data
      - Line 4: Winding 2 data
      - Line 5: Winding 3 data (only if K != 0)

      Maps to CIM: cim.PowerTransformer, cim.PowerTransformerEnd

    attributes:
      # ==== LINE 1: Basic Data ====
      i:
        description: I - Winding 1 bus number
        range: integer
        required: true
        annotations:
          line_number: 1
          order: 1
          value_type: int
          separator: ","

      j:
        description: J - Winding 2 bus number
        range: integer
        required: true
        annotations:
          line_number: 1
          order: 2
          value_type: int
          separator: ","

      k:
        description: K - Winding 3 bus number (0 for 2-winding)
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 3
          value_type: int
          separator: ","

      circuit:
        description: CKT - Circuit identifier (1 or 2 characters)
        range: string
        required: true
        ifabsent: string("1 ")
        annotations:
          line_number: 1
          order: 4
          value_type: string
          width: 2
          quote: true
          quote_char: "'"
          separator: ","

      cw:
        description: CW - Winding data I/O code
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 5
          value_type: int
          separator: ","

      cz:
        description: CZ - Impedance data I/O code
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 6
          value_type: int
          separator: ","

      cm:
        description: CM - Magnetizing admittance I/O code
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 7
          value_type: int
          separator: ","

      mag1:
        description: MAG1 - Magnetizing conductance in pu
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 8
          value_type: float
          precision: 4
          separator: ","

      mag2:
        description: MAG2 - Magnetizing susceptance in pu
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 9
          value_type: float
          precision: 4
          separator: ","

      nmetr:
        description: NMETR - Metered end flag (1, 2, or 3)
        range: integer
        required: false
        ifabsent: int(2)
        annotations:
          line_number: 1
          order: 10
          value_type: int
          separator: ","

      name:
        description: NAME - Transformer name (40 characters)
        range: string
        required: false
        ifabsent: string("                                        ")
        annotations:
          line_number: 1
          order: 11
          value_type: string
          width: 40
          quote: true
          quote_char: "'"
          separator: ","

      status:
        description: STAT - Transformer status (0=out of service, 1=in service)
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 12
          value_type: int
          separator: ","

      o1:
        description: O1 - Owner 1 number
        range: integer
        required: false
        ifabsent: int(1)
        annotations:
          line_number: 1
          order: 13
          value_type: int
          separator: ","

      f1:
        description: F1 - Fraction of ownership for owner 1
        range: float
        required: false
        ifabsent: float(1.0)
        annotations:
          line_number: 1
          order: 14
          value_type: float
          precision: 4
          separator: ","

      o2:
        description: O2 - Owner 2 number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 15
          value_type: int
          separator: ","

      f2:
        description: F2 - Fraction of ownership for owner 2
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 16
          value_type: float
          precision: 4
          separator: ","

      o3:
        description: O3 - Owner 3 number
        range: integer
        required: false
        ifabsent: int(0)
        annotations:
          line_number: 1
          order: 17
          value_type: int
          separator: ","

      f3:
        description: F3 - Fraction of ownership for owner 3
        range: float
        required: false
        ifabsent: float(0.0)
        annotations:
          line_number: 1
          order: 18
          value_type: float
          precision: 4
          separator: ","

      o4:
