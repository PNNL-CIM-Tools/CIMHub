id: https://gridappsd.org/cimhub/raw_v34/classes/case_identification
name: case_identification
title: Case Identification Record
description: raw RAW Case Identification Record (IC)

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  raw: https://gridappsd.org/cimhub/raw_v34

default_prefix: raw

classes:
  CaseIdentificationRecord:
    description: Case identification and system-wide data record
    attributes:
      new_case_flag:
        description: IC - Change code (0=base case, other=adding/changing data)
        range: integer
        required: true
        identifier: true
        annotations:
          order: 1
          value_type: int
          raw_default: 0

      system_base_mva:
        description: SBASE - System base MVA
        range: float
        required: false
        unit:
          ucum_code: "MVA"
        annotations:
          order: 2
          value_type: float
          precision: 2
          raw_default: 100.0

      revision:
        description: REV - raw revision number (34 for v34)
        range: float
        required: false
        annotations:
          order: 3
          value_type: float
          precision: 0

      transformer_ratings_units:
        description: XFRRAT - Transformer ratings units flag
        range: integer
        required: false
        annotations:
          order: 4
          value_type: int

      branch_ratings_units:
        description: NXFRAT - Non-transformer branch ratings units flag (<=0 MVA, >0 current as MVA)
        range: integer
        required: false
        annotations:
          order: 5
          value_type: int

      system_base_frequency:
        description: BASFRQ - System base frequency in Hz
        range: float
        required: false
        unit:
          ucum_code: "Hz"
        annotations:
          order: 6
          value_type: float
          precision: 2

      titles:
        description: Title lines (up to 2 lines)
        range: string
        multivalued: true
        required: false
        comments:
          - Serialized on separate lines after first data line

      general:
        description: GENERAL record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      gauss:
        description: GAUSS record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      newton:
        description: NEWTON record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      adjust:
        description: ADJUST record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      tysl:
        description: TYSL record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      solver:
        description: SOLVER record
        range: string
        required: false
        comments:
          - Optional record, serialized as complete line

      ratings:
        description: RATING records (up to 12)
        range: RatingRecord
        inlined: true
        inlined_as_list: true
        multivalued: true
        required: false
        comments:
          - Optional records, each serialized on separate line

  RatingRecord:
    description: RATING record naming one rating set (1-12)
    comments:
      - Written as RATING, <set number>, "<name>", "<description>"
      - If no RATING record is given for set n, its name is RATEn and its description is RATING SET n
    attributes:
      rating_set_number:
        description: RATING set number (1-12)
        range: integer
        required: true
        identifier: true
        annotations:
          order: 1
          value_type: int

      rating_name:
        description: RATING set name (6 characters, used as a report column heading)
        range: string
        required: true
        annotations:
          order: 2
          value_type: string
          width: 6
          quote: true
          quote_char: '"'

      rating_description:
        description: RATING set description (32 characters)
        range: string
        required: true
        annotations:
          order: 3
          value_type: string
          width: 32
          quote: true
          quote_char: '"'
