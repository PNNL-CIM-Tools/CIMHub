id: https://gridappsd.org/cimhub/distopf/classes/regulator
name: regulator
title: Regulator Record
description: DistOPF voltage regulator record.

imports:
  - linkml:types

prefixes:
  linkml: https://w3id.org/linkml/
  distopf: https://gridappsd.org/cimhub/distopf
  cim: http://iec.ch/TC57/CIM100#

default_prefix: distopf

classes:
  RegulatorRecord:
    description: >-
      Step voltage regulator data record for DistOPF. Tap positions are
      integer step counts (positive = raise, negative = lower).

      Note: the `id` field is a synthetic identifier not present in the CSV.
      The reader constructs it as "{fb}_{tb}" (for example, "1_2").
    exact_mappings:
      - cim:RatioTapChanger
    comments:
      - >-
        DistOPF RegulatorRecord maps to a CIM RatioTapChanger attached to a
        TransformerEnd, on the PowerTransformer identified by the fb/tb bus
        pair. Import creates one RatioTapChanger (with a TapChangerControl)
        per record on end 2, using tap_a as the tap position; a record with
        no transformer between fb and tb (upstream also puts regulators on
        switch branches) is skipped with a warning. Export: there is no
        RatioTapChanger exporter; the PowerTransformer exporter emits one
        record per winding bus pair whose ends carry RatioTapChangers.
        Per-phase regulator transformers between the same buses (each
        setting only its own phase's tap) merge into one record with their
        taps summed.

    attributes:
      id:
        description: >-
          Synthetic identifier constructed as "{fb}_{tb}" (for example, "1_2").
          Not present in the CSV; generated by the reader.
        range: string
        required: true
        identifier: true
        comments:
          - >-
            DistOPF-only: a synthetic key built from fb/tb, not a CIM identity.
            The CIM RatioTapChanger is identified by its own mRID and named
            "reg_{fb}_{tb}" on import.
        # No order annotation: this field is not serialized to CSV

      fb:
        description: From-bus integer index.
        range: integer
        required: true
        related_mappings:
          - cim:PowerTransformerEnd.Terminal
        comments:
          - >-
            Structural mapping via traversal. Import: the transformer is the
            first PowerTransformer whose Terminals connect the
            ConnectivityNodes at bus indices fb and tb. Export: fb = the bus
            index of the winding's from end (PowerTransformerEnd or
            TransformerTankEnd 1), the same fb as the transformer's
            BranchRecord.
        annotations:
          order: 1
          value_type: int
          separator: ","

      tb:
        description: To-bus integer index.
        range: integer
        required: true
        related_mappings:
          - cim:PowerTransformerEnd.Terminal
        comments:
          - >-
            Same traversal as fb (see the fb comment). Import: the
            RatioTapChanger is attached to the transformer's endNumber 2
            PowerTransformerEnd. Export: tb = the bus index of the winding's
            to end, the same tb as the transformer's BranchRecord.
        annotations:
          order: 2
          value_type: int
          separator: ","

      from_name:
        description: From-bus name label (the ConnectivityNode name).
        range: string
        required: false
        ifabsent: string("")
        comments:
          - >-
            Not used on import (the transformer is located by fb/tb bus index,
            not by name). Export: from_name = the from-side ConnectivityNode's
            name.
        annotations:
          order: 3
          value_type: string
          quote: false
          separator: ","

      to_name:
        description: To-bus name label (the ConnectivityNode name).
        range: string
        required: false
        ifabsent: string("")
        comments:
          - >-
            Not used on import (the transformer is located by fb/tb bus index,
            not by name). Export: to_name = the to-side ConnectivityNode's
            name.
        annotations:
          order: 4
          value_type: string
          quote: false
          separator: ","

      phases:
        description: Regulated phases (abc, a, b, c, ab, ac, bc).
        range: string
        required: false
        ifabsent: string("abc")
        comments:
          - >-
            Not used on import. Export: always written as "abc"; the
            controlled phases show only in which of tap_a/tap_b/tap_c are set.
        todos:
          - >-
            Export always writes phases="abc" regardless of which phases the
            source RatioTapChangers actually control.
        annotations:
          order: 5
          value_type: string
          quote: false
          separator: ","

      tap_a:
        description: Phase A tap position, in steps (0.0 = neutral).
        range: float
        required: false
        ifabsent: float(0.0)
        close_mappings:
          - cim:RatioTapChanger.step
        comments:
          - >-
            Import: RatioTapChanger.step = tap_a directly (tap_a is used as
            the single representative tap position for the transformer end,
            regardless of phase; neutralStep 0, steps −16..16, ptRatio =
            V_ln / 120, TapChangerControl target 120 V). Export: tap_a =
            step − neutralStep of a RatioTapChanger on a TransformerTankEnd
            whose phase is A (orderedPhases, falling back to phases); a
            RatioTapChanger on a PowerTransformerEnd (or with no a/b/c phase)
            sets tap_a, tap_b, and tap_c alike.
        todos:
          - >-
            Import uses tap_a for the whole regulator, so per-phase taps
            (tap_b/tap_c) are lost on import.
        annotations:
          order: 6
          value_type: float
          separator: ","

      tap_b:
        description: Phase B tap position, in steps (0.0 = neutral).
        range: float
        required: false
        ifabsent: float(0.0)
        comments:
          - >-
            Not used on import (only tap_a is read; see the tap_a comment).
            Export: tap_b = step − neutralStep for phase B, following the same
            logic as tap_a.
        todos:
          - >-
            Import does not read tap_b — a per-phase RatioTapChanger for
            phase B is never created from this field.
        annotations:
          order: 7
          value_type: float
          separator: ","

      tap_c:
        description: Phase C tap position, in steps (0.0 = neutral).
        range: float
        required: false
        ifabsent: float(0.0)
        comments:
          - >-
            Not used on import (only tap_a is read; see the tap_a comment).
            Export: tap_c = step − neutralStep for phase C, following the same
            logic as tap_a.
        todos:
          - >-
            Import does not read tap_c — a per-phase RatioTapChanger for
            phase C is never created from this field.
        annotations:
          order: 8
          value_type: float
          separator: ""  # No separator after last field
