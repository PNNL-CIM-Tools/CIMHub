[build-system]
requires = ["setuptools~=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "cimhub_distopf"
description = "CIMHub DistOPF converter: DistOPF CSV cases <-> .cimtbl <-> cim18v17"
readme = "README.md"
version = "3.0.0a0"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Pacific Northwest National Laboratory", email = "gridappsd@pnnl.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "cimhub-core>=3.0.0a0,<3.1",
  "cim-tables>=0.1.0a1,<0.2",
  "linkml-runtime~=1.9.5",
]

[project.urls]
"Homepage" = "https://github.com/PNNL-CIM-Tools/CIMHub"
"Bug Tracker" = "https://github.com/PNNL-CIM-Tools/CIMHub/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["*.yaml"]
