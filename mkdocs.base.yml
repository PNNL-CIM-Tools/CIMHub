# Shared by every CIMHub docs site: the root landing site (mkdocs.yml) and one site per package
# (cimhub_<pkg>/mkdocs.yml, which starts with `INHERIT: ../mkdocs.base.yml`). A site sets its own site_name,
# site_url, edit_uri, extra.social and nav. scripts/build-docs.sh builds them all into site/.
site_author: PNNL CIM Tools
repo_url: https://github.com/PNNL-CIM-Tools/CIMHub
repo_name: PNNL-CIM-Tools/CIMHub
copyright: Copyright &copy; 2026 Battelle Memorial Institute. BSD 3-Clause.

theme:
  name: material
  icon:
    logo: material/hub
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - toc.follow

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false          # outputs are stored in the notebooks; the build does not run them
      ignore_h1_titles: true
      show_input: true
      markdown_cell_processor: mkdocs

validation:
  anchors: warn          # --strict fails on a link to a missing heading
  unrecognized_links: warn

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path: [docs, .]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
