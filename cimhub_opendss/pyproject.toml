[build-system]
requires = ["setuptools~=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "cimhub_opendss"
description = "CIMHub OpenDSS converter: .dss <-> .cimtbl <-> cim18v17"
readme = "README.md"
version = "2.1.0"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Alex Anderson", email = "19935503+AAndersn@users.noreply.github.com" },
  { name = "Tylor Slay" },
  { name = "Kapil Duwadi" },
  { name = "Nathan Gray" },
  { name = "Craig Allwardt", email = "3979063+craig8@users.noreply.github.com" },
  { name = "Andy Fisher" },
]
maintainers = [
  { name = "Pacific Northwest National Laboratory", email = "gridappsd@pnnl.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "cimhub-core>=2.1.0a1,<2.2",
  "cim-topology>=0.1.2a1,<0.2",
  "cim-tables>=0.1.1a1,<0.2",
  "pyyaml",
]

[project.optional-dependencies]
# schedule time points (players, LoadShapes) in the Parquet sidecar: cimhub_core.time_points
time-points = [
  "cimhub-core[time-points]>=2.1.0a1,<2.2",
]

[project.urls]
"Homepage" = "https://github.com/PNNL-CIM-Tools/CIMHub"
"Bug Tracker" = "https://github.com/PNNL-CIM-Tools/CIMHub/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.package-data]
"*" = ["*.yaml"]
