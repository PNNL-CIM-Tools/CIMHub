# Build the site (run from cimhub_opendss/; nothing here touches the workspace's uv.lock):
#   1. generate the schema reference (never committed; docs/.gitignore lists it):
#        uvx --with-requirements docs/requirements-mkdocs.txt --from linkml gen-doc \
#            -d docs/schema_ref src/cimhub_opendss/schema/linkml/opendss.yaml
#   2. build (or replace "build" with "serve" to preview):
#        uvx --with-requirements docs/requirements-mkdocs.txt mkdocs build --strict -d /tmp/dss-site
site_name: CIMHub OpenDSS
site_description: OpenDSS to CIM (cim18v17) importer and exporter
site_author: Pacific Northwest National Laboratory
repo_url: https://github.com/PNNL-CIM-Tools/CIMHub
repo_name: PNNL-CIM-Tools/CIMHub

copyright: Copyright &copy; 2025 Battelle Memorial Institute, All rights reserved.

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PNNL-CIM-Tools/CIMHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cimhub_opendss/

extra_css:
  - stylesheets/extra.css

exclude_docs: |
  requirements-mkdocs.txt

# The mapping specs link to plan files in the repository (.development/), which are not part of the site, and the
# generated schema pages are reached through schema_ref/index.md rather than the nav. Both are expected.
validation:
  nav:
    omitted_files: ignore
  links:
    not_found: info

nav:
  - Home: index.md
  - Usage:
      - Quick start: usage/quickstart.md
      - Import (DSS to CIM): usage/import.md
      - Export (CIM to DSS): usage/export.md
      - Round trip: usage/roundtrip.md
  - Mapping:
      - Import mapping (.cimtbl): CIMTBL_MAPPING.md
      - Export mapping: EXPORT_MAPPING.md
  - Coverage: coverage/overview.md
  - Schema Reference: schema_ref/index.md
