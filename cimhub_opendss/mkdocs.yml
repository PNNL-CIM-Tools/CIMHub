# cimhub-opendss's site, served at https://pnnl-cim-tools.github.io/CIMHub/opendss/. Build everything with
# scripts/build-docs.sh, or this site alone: scripts/build-docs.sh opendss (add --serve to preview). The schema
# reference (docs/schema/) is generated from the LinkML schema by that script and never committed.
INHERIT: ../mkdocs.base.yml
site_name: CIMHub OpenDSS
site_url: https://pnnl-cim-tools.github.io/CIMHub/opendss/
site_description: OpenDSS decks to and from CIM (cim18v17) - the reader, writer, importer and exporter
edit_uri: edit/develop/cimhub_opendss/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PNNL-CIM-Tools/CIMHub/tree/develop/cimhub_opendss
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/cimhub-opendss/

not_in_nav: |
  schema/*
  guide/*.dss

nav:
  - Home: index.md
  - User guide:
      - guide/index.md
      - Getting started:
          - Installation: guide/installation.md
          - Quick start: guide/quickstart.ipynb
      - Converting:
          - Import (DSS to CIM): guide/import.md
          - Export (CIM to DSS): guide/export.md
          - Round trip: guide/roundtrip.md
          - What converts: guide/coverage.md
  - Conversion reference:
      - reference/index.md
      - Sources, options and coordinates: reference/sources.md
      - Lines, wires and switches: reference/lines.md
      - Transformers and regulators: reference/transformers.md
      - Loads, capacitors and shapes: reference/loads.md
      - DER and machines: reference/der.md
  - Developer docs:
      - developer/index.md
      - Architecture: developer/architecture.md
      - Reader and writer: developer/reader-writer.md
      - The importer: developer/importer.md
      - The exporter: developer/exporter.md
      - The LinkML schema: developer/schema.md
      - Testing: developer/testing.md
      - Mapping specs:
          - Import mapping (.cimtbl): CIMTBL_MAPPING.md
          - Export mapping: EXPORT_MAPPING.md
  - Schema reference: schema/index.md
