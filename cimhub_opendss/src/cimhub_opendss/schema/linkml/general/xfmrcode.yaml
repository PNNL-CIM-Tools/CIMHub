id: https://gridappsd.github.io/dss-graph/general/xfmrcode
name: xfmrcode
title: OpenDSS Xfmrcode Component Schema
description: >-
  LinkML schema for OpenDSS Xfmrcode objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-40).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Xfmrcode:
    description: >-
      A Xfmrcode object in OpenDSS representing a transformer library entry
      (catalog) that can be referenced by Transformer objects via the XfmrCode
      property.
    class_uri: dss:Xfmrcode
    close_mappings:
      - cim:TransformerTankConfiguration
    comments:
      - >-
        Import: a TransformerTankConfiguration xc_ + name (xfmrcode.cimtbl),
        built from the instances that use it and written only for a code an
        unregulated instance uses; a 3-phase code has a TransformerTankEnd per
        winding, a 1-phase one TransformerLugs. Export: one XfmrCode per
        configuration a unit uses; an unused one is skipped and logged.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: TransformerTankConfiguration.name, mRID = xc_ + name,
            lowercased. Export: Names, the XfmrCode namespace.

      # (1) phases
      phases:
        description: >-
          Number of phases this transformer. Default is 3.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        annotations:
          order: 1
          dss_default: int(3)
        comments:
          - >-
            Import: structural; 3 = TankEnd template, 1 = lug template, others
            raise. Export: read through the first unit that uses the
            configuration.

      # (2) windings
      windings:
        description: >-
          Number of windings, this transformer. Default is 2.
        range: integer
        required: false
        minimum_value: 2
        annotations:
          order: 2
          dss_default: int(2)
        comments:
          - >-
            Import: structural; one TransformerWinding each, 2 or 3. Export: the
            unit's winding count.

      # (3) wdg
      wdg:
        description: >-
          Set this = to the number of the winding you wish to define.
        range: integer
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: structural; the winding Rneut/Xneut belong to, none = the
            last. Export: the grounded winding.

      # (4) conn
      conn:
        description: >-
          Connection of this winding. Default is wye.
        range: ConnectionType
        required: false
        annotations:
          order: 4
          dss_default: string(wye)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks and bare values
            into the array form (conns). Export: not written; the arrays carry
            every winding.

      # (5) kV
      kV:
        description: >-
          For 2-or 3-phase, enter phase-phase kV rating. Otherwise, enter actual
          winding voltage rating.
        range: float
        required: false
        annotations:
          order: 5
          dss_default: float(12.47)
        todos:
          - "Importer bug: writes TransformerEndInfo.ratedU instead of the real ratedVoltage field."
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks and bare values
            into the array form (kVs). Export: not written; the arrays carry
            every winding.

      # (6) kVA
      kVA:
        description: >-
          Base kVA rating of the winding.
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(1000.0)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks and bare values
            into the array form (kVAs). Export: not written; the arrays carry
            every winding.

      # (7) tap
      tap:
        description: >-
          Per unit tap that this winding is normally on. Default is 1.0.
        range: string
        required: false
        annotations:
          order: 7
          dss_default: float(1.0)
        todos:
          - "tap/taps[] not read by the importer. If implemented, it should scale TransformerEndInfo.ratedVoltage rather than being stored separately."
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks and bare values
            into the array form (taps). Export: not written; the arrays carry
            every winding.

      # (8) %R
      pct_R:
        description: >-
          Percent resistance this winding. Default is 0.2%.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(0.2)
          dss_name: "%R"
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks and bare values
            into the array form (pct_Rs). Export: not written; the arrays carry
            every winding.

      # (9) Rneut
      Rneut:
        description: >-
          Default = -1. If negative, neutral is floating.
        range: float
        required: false
        annotations:
          order: 9
        exact_mappings:
          - cim:TransformerEnd.rground
        comments:
          - >-
            Import: TransformerTankEnd.rground (ohm) of winding wdg, else the
            last, when >= 0; on a 1-phase code it raises. Export: rground (ohm)
            of the grounded winding.

      # (10) Xneut
      Xneut:
        description: >-
          Neutral reactance of wye(star)-connected winding in actual ohms.
        range: float
        required: false
        annotations:
          order: 10
        exact_mappings:
          - cim:TransformerEnd.xground
        comments:
          - >-
            Import: TransformerTankEnd.xground (ohm), with Rneut >= 0. Export:
            xground (ohm) of the grounded winding.

      # (11) conns
      conns:
        description: >-
          Use this to specify all the Winding connections at once using an array.
        range: ConnectionType
        multivalued: true
        required: false
        annotations:
          order: 11
        close_mappings:
          - cim:TransformerTankEnd.connectionKind
        comments:
          - >-
            Import: 3-phase: TransformerTankEnd.connectionKind (D, Y; grounding
            is the instance's), a center tap's secondary halves I; default wye.
            Export: D -> delta, Y/Yn/I -> wye.

      # (12) kVs
      kVs:
        description: >-
          Use this to specify the kV ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        annotations:
          order: 12
        close_mappings:
          - cim:TransformerWinding.baseU
          - cim:TransformerWinding.ratedU
        comments:
          - >-
            Import: TransformerWinding.baseU (kV, the coil); ratedU
            phase-to-phase from the instances' bus system (x sqrt 3, x 2 for a
            split-phase half), and instances that disagree raise. Export: baseU
            of a coil, ratedU of a 3-phase winding.

      # (13) kVAs
      kVAs:
        description: >-
          Use this to specify the kVA ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        annotations:
          order: 13
        close_mappings:
          - cim:TransformerWinding.ratedS
          - cim:TransformerWinding.baseS
        comments:
          - >-
            Import: TransformerWinding.ratedS (kVA; a split-phase half is kVA /
            2); baseS = winding 1's kVA on every coil. Export: a coil's baseS,
            else ratedS, in kVA.

      # (14) taps
      taps:
        description: >-
          Use this to specify the normal per unit taps of all windings at once.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 14
        todos:
          - "taps[] not read by the importer; see tap todos."
        comments:
          - >-
            Import: structural; a tap other than 1 raises (a fixed tap is not
            mapped). Export: not written; a tap is the instance's.

      # (15) Xhl
      Xhl:
        description: >-
          Use this to specify the percent reactance, H-L (winding 1 to winding 2).
          Default is 7.
        range: float
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 1-2 x (percent on the From winding's baseU and baseS);
            default 7. Export: mesh (1,2) x.

      # (16) Xht
      Xht:
        description: >-
          Use this to specify the percent reactance, H-T (winding 1 to winding 3).
          Default is 35.
        range: float
        required: false
        annotations:
          order: 16
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 1-3 x; default 35. Export: mesh (1,3) x.

      # (17) Xlt
      Xlt:
        description: >-
          Use this to specify the percent reactance, L-T (winding 2 to winding 3).
          Default is 30.
        range: float
        required: false
        annotations:
          order: 17
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 2-3 x; default 30. Export: mesh (2,3) x.

      # (18) Xscarray
      Xscarray:
        description: >-
          Use this to specify the percent reactance between all pairs of windings
          as an array. Replaces Xhl, Xht, Xlt for >3-winding transformers.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 18
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: untranscribed; more than 3 windings raise. Export: not
            written.

      # (19) thermal
      thermal:
        description: >-
          Thermal time constant of the transformer in hours.
        range: string
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (20) n
      n:
        description: >-
          n Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (21) m
      m:
        description: >-
          m Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (22) flrise
      flrise:
        description: >-
          Temperature rise, deg C, for full load.
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (23) hsrise
      hsrise:
        description: >-
          Hot spot temperature rise, deg C.
        range: string
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (24) %loadloss
      pct_loadloss:
        description: >-
          Percent load loss at full load. Total winding resistive losses.
        range: float
        required: false
        annotations:
          order: 24
          dss_name: "%loadloss"
        todos:
          - "%loadloss is not exported; the exporter always recomputes %R per winding from TransformerEndInfo.r, so a roundtrip that only set %loadloss will export as %Rs[] instead."
        close_mappings:
          - cim:TransformerWinding.r
        comments:
          - >-
            Import: derived; with pct_Rs unset, r = loadloss / 2 on windings 1
            and 2; set with pct_Rs, the two must agree. Export: not written; %Rs
            carries each winding's r.

      # (25) %noloadloss
      pct_noloadloss:
        description: >-
          Percent no load losses at rated excitation voltage. Core losses.
        range: float
        required: false
        annotations:
          order: 25
          dss_name: "%noloadloss"
        close_mappings:
          - cim:TransformerTankConfiguration.noLoadLoss
        comments:
          - >-
            Import: derived; noLoadLoss (kW) = % x winding 1 kVA. Export: the
            core g.

      # (26) normhkVA
      normhkVA:
        description: >-
          Normal maximum kVA rating of H winding (winding 1).
        range: float
        required: false
        annotations:
          order: 26
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Import: untranscribed (a tank rating). Export: unset.

      # (27) emerghkVA
      emerghkVA:
        description: >-
          Emergency (contingency) kVA rating of H winding (winding 1).
        range: float
        required: false
        annotations:
          order: 27
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Import: untranscribed (a tank rating). Export: unset.

      # (28) MaxTap
      MaxTap:
        description: >-
          Max per unit tap for the active winding. Default is 1.10.
        range: string
        required: false
        annotations:
          order: 28
        todos:
          - "No TapChangerInfo is created by the importer/exporter. MaxTap/MinTap/NumTaps should together populate TapChangerInfo.highStep/lowStep/stepVoltageIncrement, attached to the tapped TransformerEndInfo."
        close_mappings:
          - cim:TapChanger.highStep
        comments:
          - >-
            Import: untranscribed on a code; a regulated instance takes it
            (regcontrol.cimtbl). Export: not written; the range stays on each
            instance.

      # (29) MinTap
      MinTap:
        description: >-
          Min per unit tap for the active winding. Default is 0.90.
        range: string
        required: false
        annotations:
          order: 29
        todos:
          - "Not implemented; see MaxTap todos."
        close_mappings:
          - cim:TapChanger.lowStep
        comments:
          - >-
            Import: untranscribed on a code; a regulated instance takes it
            (regcontrol.cimtbl). Export: not written; the range stays on each
            instance.

      # (30) NumTaps
      NumTaps:
        description: >-
          Total number of taps between min and max tap. Default is 32.
        range: integer
        required: false
        annotations:
          order: 30
        todos:
          - "Not implemented; see MaxTap todos."
        close_mappings:
          - cim:RatioTapChanger.stepVoltageIncrement
        comments:
          - >-
            Import: untranscribed on a code; a regulated instance takes it
            (regcontrol.cimtbl). Export: not written; the range stays on each
            instance.

      # (31) %imag
      pct_imag:
        description: >-
          Percent magnetizing current.
        range: float
        required: false
        annotations:
          order: 31
          dss_name: "%imag"
        exact_mappings:
          - cim:TransformerTankConfiguration.percentMagnetizingCurrent
        comments:
          - >-
            Import: percentMagnetizingCurrent (percent). Export: the core b.

      # (32) ppm_antifloat
      ppm_antifloat:
        description: >-
          ppm (parts per million) anti-float factor. Default=1 ppm.
        range: float
        required: false
        annotations:
          order: 32
        comments:
          - >-
            Import: untranscribed (numerical aid of the DSS solver). Export:
            unset.

      # (33) %Rs
      pct_Rs:
        description: >-
          Use this property to specify all the winding %resistances using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 33
          dss_name: "%Rs"
        exact_mappings:
          - cim:TransformerWinding.r
        comments:
          - >-
            Import: winding r (percent on its own baseS); default 0.2. Export:
            winding r x kVA_n / kVA_1; an unset r is 0.

      # (34) X12
      X12:
        description: >-
          Alternative to Xhl for specifying the percent reactance from winding 1
          to winding 2.
        range: float
        required: false
        annotations:
          order: 34
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of Xhl; with Xhl they must agree. Export: not written.

      # (35) X13
      X13:
        description: >-
          Alternative to Xht for specifying the percent reactance from winding 1
          to winding 3.
        range: float
        required: false
        annotations:
          order: 35
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of Xht; with Xht they must agree. Export: not written.

      # (36) X23
      X23:
        description: >-
          Alternative to Xlt for specifying the percent reactance from winding 2
          to winding 3.
        range: float
        required: false
        annotations:
          order: 36
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of Xlt; with Xlt they must agree. Export: not written.

      # (37) RdcOhms
      RdcOhms:
        description: >-
          Winding dc resistance in OHMS.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 37
        exact_mappings:
          - cim:TransformerWinding.rDC
        comments:
          - >-
            Import: copied per winding to the template's TransformerWinding.rDC
            (ohm); the reader takes each value for the active wdg=, and some
            windings without one raise. Export: each template winding's rDC,
            written one wdg= block per winding.

      # (38) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the transformer, to
          be used only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 38
        comments:
          - >-
            Import: structural; the number of Ratings (one by default). Seasons
            without Ratings, or a count other than the Ratings', raises: the
            engine keeps Seasons of them and pads with zeros. Export: the number
            of the template's season ratings.

      # (39) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 39
        close_mappings:
          - cim:ApparentPowerLimit.normalValue
        comments:
          - >-
            Import: copied, kVA; one ApparentPowerLimit per season n, of type
            olt_season<n>, in the OperationalLimitSet <xc>_ratings that the
            TransformerTankConfiguration names (EquipmentConfiguration.OperationalLimitSet).
            Export: the template's olt_season<n> ApparentPowerLimits, in season
            order.

      # (40) like
      like:
        description: >-
          Make like another object, e.g.: New XfmrCode.X2 like=X1 ...
        range: string
        required: false
        annotations:
          order: 40
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
