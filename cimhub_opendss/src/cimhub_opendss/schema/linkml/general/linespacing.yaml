id: https://gridappsd.github.io/dss-graph/general/linespacing
name: linespacing
title: OpenDSS Linespacing Component Schema
description: >-
  LinkML schema for OpenDSS Linespacing objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-11).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Linespacing:
    description: >-
      A Linespacing object in OpenDSS defining the physical arrangement (XY
      coordinates) of conductors in a cross-section, used for geometric
      impedance calculation.
    class_uri: dss:Linespacing
    exact_mappings:
      - cim:XYSpacing
    comments:
      - >-
        Import: a LineSpacing becomes a template XYSpacing spc_<name> with one XYConductorPosition
        per conductor in linespacing.cimtbl (CIM 18 template, not a WireSpacingInfo catalog).
        Export: not written as a LineSpacing; the LineGeometry carries the positions inline.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to XYSpacing.name; mRID = spc_ + name, lowercased; isTemplate = true.
            Export: not written; the LineGeometry carries the positions inline (B2).

      # (1) nconds
      nconds:
        description: >-
          Number of wires in this geometry (phase + neutral conductors).
        range: integer
        required: false
        minimum_value: 1
        annotations:
          order: 1
        related_mappings:
          - cim:XYConductorPosition
        comments:
          - >-
            Import: structural; one XYConductorPosition per conductor, sequenceNumber 1..nconds; x
            and h must have nconds values. Export: not written; the LineGeometry carries the
            positions inline (B2).

      # (2) nphases
      nphases:
        description: >-
          Number of retained phase conductors (nconds minus neutrals).
        range: integer
        required: false
        minimum_value: 1
        annotations:
          order: 2
        close_mappings:
          - cim:ConductorPosition.kind
        comments:
          - >-
            Import: structural; kind: phase for conductors 1..nphases, neutral after. Export: not
            written; the LineGeometry carries the positions inline (B2).

      # (3) x
      x:
        description: >-
          Array of wire X coordinates (horizontal position), one per conductor.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 3
        exact_mappings:
          - cim:SpacingPosition.xCoord
        comments:
          - >-
            Import: structural; XYConductorPosition.xCoord (<units>), one per conductor. Export: not
            written; the LineGeometry carries the positions inline (B2).

      # (4) h
      h:
        description: >-
          Array of wire Heights (vertical position), one per conductor.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 4
        exact_mappings:
          - cim:SpacingPosition.yCoord
        comments:
          - >-
            Import: structural; XYConductorPosition.yCoord (<units>), one per conductor. Export: not
            written; the LineGeometry carries the positions inline (B2).

      # (5) units
      units:
        description: >-
          Units for x and h: {mi|kft|km|m|Ft|in|cm}. Initial default is ft.
        range: string
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: mapped; the length unit of xCoord and yCoord (LENGTH_UNIT); unset raises.
            Export: not written; the LineGeometry carries the positions inline (B2).

      # (6) detailed
      detailed:
        description: >-
          {Yes/True | No/False} Default = Yes. If No, uses equivalent spacing
          formulas instead of actual geometry.
        range: boolean
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the equivalent-distance form has no positions). Export: not written; the
            LineGeometry carries the positions inline (B2).

      # (7) EqDistPhPh
      EqDistPhPh:
        description: >-
          Equivalent distance between phase conductors.
        range: string
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the equivalent-distance form has no positions). Export: not written; the
            LineGeometry carries the positions inline (B2).

      # (8) EqDistPhN
      EqDistPhN:
        description: >-
          Equivalent distance between phase and neutral conductors.
        range: string
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the equivalent-distance form has no positions). Export: not written; the
            LineGeometry carries the positions inline (B2).

      # (9) AvgPhaseHeight
      AvgPhaseHeight:
        description: >-
          Average height of phase conductors.
        range: string
        required: false
        annotations:
          order: 9
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the equivalent-distance form has no positions). Export: not written; the
            LineGeometry carries the positions inline (B2).

      # (10) AvgNeutralHeight
      AvgNeutralHeight:
        description: >-
          Average height of neutral conductors.
        range: string
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the equivalent-distance form has no positions). Export: not written; the
            LineGeometry carries the positions inline (B2).

      # (11) like
      like:
        description: >-
          Make like another object, e.g.: New LineSpacing.S2 like=S1 ...
        range: string
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written;
            the LineGeometry carries the positions inline (B2).
