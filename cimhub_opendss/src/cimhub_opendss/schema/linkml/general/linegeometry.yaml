id: https://gridappsd.github.io/dss-graph/general/linegeometry
name: linegeometry
title: OpenDSS Linegeometry Component Schema
description: >-
  LinkML schema for OpenDSS Linegeometry objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Linegeometry:
    description: >-
      A Linegeometry object in OpenDSS.
    class_uri: dss:Linegeometry
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) nconds
      nconds:
        description: >-
          Number of conductors in this geometry
        range: integer
        required: false
        minimum_value: 1
        annotations:
          order: 1

      # (2) nphases
      nphases:
        description: >-
          Number of phases
        range: integer
        required: false
        minimum_value: 1
        annotations:
          order: 2

      # (3) cond
      cond:
        description: >-
          Set this = number of the conductor you wish to define
        range: integer
        required: false
        annotations:
          order: 3

      # (4) wire
      wire:
        description: >-
          Code from WireData
        range: string
        required: false
        annotations:
          order: 4

      # (5) x
      x:
        description: >-
          x coordinate
        range: float
        required: false
        annotations:
          order: 5

      # (6) h
      h:
        description: >-
          Height of conductor
        range: float
        required: false
        annotations:
          order: 6

      # (7) units
      units:
        description: >-
          Units for x and h: {mi|kft|km|m|Ft|in|cm } Initial default is "ft", but defaults to last unit defined
        range: string
        required: false
        annotations:
          order: 7

      # (8) normamps
      normamps:
        description: >-
          Normal ampacity, amperes for the line
        range: float
        required: false
        annotations:
          order: 8

      # (9) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes
        range: float
        required: false
        annotations:
          order: 9

      # (10) reduce
      reduce:
        description: >-
          {Yes | No} Default = no
        range: boolean
        required: false
        annotations:
          order: 10

      # (11) spacing
      spacing:
        description: >-
          Reference to a LineSpacing for use in a line constants calculation
        range: string
        required: false
        annotations:
          order: 11

      # (12) wires
      wires:
        description: >-
          Array of WireData names for use in a line constants calculation
        range: string
        multivalued: true
        required: false
        annotations:
          order: 12

      # (13) cncable
      cncable:
        description: >-
          Code from CNData
        range: string
        required: false
        annotations:
          order: 13

      # (14) tscable
      tscable:
        description: >-
          Code from TSData
        range: string
        required: false
        annotations:
          order: 14

      # (15) cncables
      cncables:
        description: >-
          Array of CNData names for cable parameter calculation
        range: string
        multivalued: true
        required: false
        annotations:
          order: 15

      # (16) tscables
      tscables:
        description: >-
          Array of TSData names for cable parameter calculation
        range: string
        multivalued: true
        required: false
        annotations:
          order: 16

      # (internal) xs / hs — per-conductor position arrays built from inline
      # cond=N x=... h=... syntax; not part of the DSS spec but used internally.
      xs:
        description: >-
          Per-conductor x coordinates (populated from inline cond= blocks)
        range: float
        multivalued: true
        required: false

      hs:
        description: >-
          Per-conductor h (height) coordinates (populated from inline cond= blocks)
        range: float
        multivalued: true
        required: false

      # (17) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used only when defining seasonal ratings using the "Ratings" property
        range: integer
        required: false
        annotations:
          order: 17

      # (18) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True
        range: float
        multivalued: true
        required: false
        annotations:
          order: 18

      # (19) LineType
      LineType:
        description: >-
          Code designating the type of line
        range: string
        required: false
        annotations:
          order: 19

      # (20) conductors
      conductors:
        description: >-
          Array of conductor names for use in line constants calculation
        range: string
        multivalued: true
        required: false
        annotations:
          order: 20

      # (21) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 21
