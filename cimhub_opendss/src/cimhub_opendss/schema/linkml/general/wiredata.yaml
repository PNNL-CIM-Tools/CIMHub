id: https://gridappsd.github.io/dss-graph/general/wiredata
name: wiredata
title: OpenDSS Wiredata Component Schema
description: >-
  LinkML schema for OpenDSS Wiredata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-14).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Wiredata:
    description: >-
      A Wiredata object in OpenDSS defining physical conductor properties
      (resistance, GMR, radius) used by LineGeometry and Line objects for
      geometric impedance calculation.
    class_uri: dss:Wiredata
    exact_mappings:
      - cim:OverheadWireInfo
    comments:
      - >-
        OpenDSS Wiredata maps to CIM OverheadWireInfo (catalog entry for an overhead
        conductor). All physical dimensions are stored in SI units (meters, ohm/m).
        Reference: wiredata.py converter.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - "Direct name mapping; no conversion needed."

      # (1) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits).
        range: float
        required: false
        annotations:
          order: 1
        exact_mappings:
          - cim:OverheadWireInfo.rDC20
        comments:
          - >-
            Import: OverheadWireInfo.rDC20 = Rdc converted to ohm/m using Runits
            (e.g. ohm/kft × 1/304.8 = ohm/m). Export: Rdc = rDC20 in selected units.
            CIM stores in ohm/m (SI base).

      # (2) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 2
        exact_mappings:
          - cim:OverheadWireInfo.rAC25
        comments:
          - >-
            Import: OverheadWireInfo.rAC25 = Rac converted to ohm/m using Runits.
            Export: Rac = rAC25 in selected units.

      # (3) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm}.
          Default=none.
        range: string
        required: false
        annotations:
          order: 3
        comments:
          - "OpenDSS-only (N/A): unit selector consumed during import to convert Rdc/Rac to ohm/m; not stored on CIM."

      # (4) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz (geometric mean radius).
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 4
        exact_mappings:
          - cim:OverheadWireInfo.gmr
        comments:
          - >-
            Import: OverheadWireInfo.gmr = GMRac converted to meters using GMRunits.
            Export: GMRac = gmr in selected units. CIM stores in m (SI base).

      # (5) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm}. Default=none.
        range: string
        required: false
        annotations:
          order: 5
        comments:
          - "OpenDSS-only (N/A): unit selector consumed during import for GMRac conversion; not stored on CIM."

      # (6) radius
      radius:
        description: >-
          Outside radius of conductor.
        range: float
        required: false
        annotations:
          order: 6
        exact_mappings:
          - cim:OverheadWireInfo.radius
        comments:
          - >-
            Import: OverheadWireInfo.radius = radius converted to meters using radunits.
            Export: radius = OverheadWireInfo.radius in selected units. CIM stores in m.

      # (7) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm}. Default=none.
        range: string
        required: false
        annotations:
          order: 7
        comments:
          - "OpenDSS-only (N/A): unit selector consumed during import for radius/diam conversion; not stored on CIM."

      # (8) normamps
      normamps:
        description: >-
          Normal ampacity, amperes.
        range: float
        required: false
        annotations:
          order: 8
        exact_mappings:
          - cim:WireInfo.ratedCurrent
        comments:
          - "Import: OverheadWireInfo.ratedCurrent = normamps. Export: normamps = ratedCurrent. Units: amperes in both DSS and CIM."

      # (9) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes.
        range: float
        required: false
        annotations:
          order: 9
        comments:
          - "OpenDSS-only (N/A): emergency current rating; no separate CIM field on OverheadWireInfo (CIM ratedCurrent corresponds to normal rating)."
        todos:
          - "No CIM equivalent for emergency rating on WireInfo; requires CIM extension."

      # (10) diam
      diam:
        description: >-
          Diameter; alternative method for entering radius. diam = 2 × radius.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 10
        exact_mappings:
          - cim:OverheadWireInfo.radius
        comments:
          - "Import: OverheadWireInfo.radius = diam / 2 (converted via radunits). Alternate form for radius property."

      # (11) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used
          only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 11
        comments:
          - "OpenDSS-only (N/A): seasonal ratings count; no direct CIM equivalent on WireInfo catalog object."

      # (12) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 12
        related_mappings:
          - cim:OperationalLimit
        todos:
          - "Seasonal ratings converter not yet implemented on WireInfo."

      # (13) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calculations.
        range: float
        required: false
        annotations:
          order: 13
        exact_mappings:
          - cim:OverheadWireInfo.coreRadius
        comments:
          - >-
            Import: OverheadWireInfo.coreRadius = Capradius converted to meters using radunits.
            Export: Capradius = coreRadius in selected units.

      # (14) like
      like:
        description: >-
          Make like another object, e.g.: New Wiredata.W2 like=W1 ...
        range: string
        required: false
        annotations:
          order: 14
        comments:
          - "OpenDSS-only (N/A): DSS template/copy directive resolved at parse time; no CIM equivalent."
