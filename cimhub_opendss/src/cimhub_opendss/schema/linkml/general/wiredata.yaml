id: https://gridappsd.github.io/dss-graph/general/wiredata
name: wiredata
title: OpenDSS Wiredata Component Schema
description: >-
  LinkML schema for OpenDSS Wiredata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-14).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Wiredata:
    description: >-
      A Wiredata object in OpenDSS defining physical conductor properties
      (resistance, GMR, radius) used by LineGeometry and Line objects for
      geometric impedance calculation.
    class_uri: dss:Wiredata
    exact_mappings:
      - cim:OverheadWireInfo
    comments:
      - >-
        Import: WireData becomes an OverheadWireInfo in wire.cimtbl, with its normal and emergency
        CurrentLimit in an OperationalLimitSet. Export: OverheadWireInfo is written as WireData
        (exporter/wire.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to OverheadWireInfo.name; mRID = prefix + name, lowercased. Export:
            Names, one namespace for the three catalogs.

      # (1) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits).
        range: float
        required: false
        annotations:
          order: 1
        exact_mappings:
          - cim:ConductorInfo.rDC20
        comments:
          - >-
            Import: copied to OverheadWireInfo.rDC20 (ohm/<Runits>); DC resistance (DSS gives no
            temperature). Export: get_wire_info.r_dc20 (ohm/m); Rdc and Rac both unset raises.

      # (2) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 2
        close_mappings:
          - cim:ConductorInfo.rAC25
        comments:
          - >-
            Import: copied to OverheadWireInfo.rAC25 (ohm/<Runits>); DSS: resistance at 60 Hz,
            temperature unstated. Export: rule, get_wire_info.r_ac25 (ohm/m); unset -> not written,
            the engine's 1.02 x Rdc.

      # (3) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm}.
          Default=none.
        range: string
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: mapped; the unit of Rdc, Rac in the header (LENGTH_UNIT); unset raises (every
            wire in the sweep sets it). Export: m (B1).

      # (4) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz (geometric mean radius).
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 4
        exact_mappings:
          - cim:WireInfo.gmr
        comments:
          - >-
            Import: copied to OverheadWireInfo.gmr (<GMRunits>); unset raises (the engine's 0.7788 x
            radius default; no deck in the sweep omits it). Export: rule, get_wire_info.gmr (m);
            unset -> not written, the engine's 0.7788 x radius.

      # (5) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm}. Default=none.
        range: string
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: mapped; the unit of GMRac in the header (LENGTH_UNIT); unset raises (every wire
            in the sweep sets it). Export: m (B1).

      # (6) radius
      radius:
        description: >-
          Outside radius of conductor.
        range: float
        required: false
        annotations:
          order: 6
        exact_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: copied to OverheadWireInfo.radius (<radunits>); one of radius and diam. Export:
            get_wire_info.radius (m); unset raises.

      # (7) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm}. Default=none.
        range: string
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: mapped; the unit of radius, diam and every cable dimension in the header
            (LENGTH_UNIT); unset raises (every wire in the sweep sets it). Export: m (B1).

      # (8) normamps
      normamps:
        description: >-
          Normal ampacity, amperes.
        range: float
        required: false
        annotations:
          order: 8
        exact_mappings:
          - cim:ConductingAssetInfo.ratedCurrent
        comments:
          - >-
            Import: copied to OverheadWireInfo.ratedCurrent (A); also the normal CurrentLimit of the
            wire's OperationalLimitSet <mRID>_limits (AssetInfo.OperationalLimitSet); unset with
            emergamps set: emergamps / 1.5, the engine's rule. Export: the wire's normal limit, else
            ratedCurrent (A).

      # (9) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes.
        range: float
        required: false
        annotations:
          order: 9
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; the emergency CurrentLimit of the wire's OperationalLimitSet
            <mRID>_limits (AssetInfo.OperationalLimitSet). Export: rule, the wire's emergency limit
            (A); unset -> not written, the engine's 1.5 x normamps.
        todos:
          - "No CIM equivalent for emergency rating on WireInfo; requires CIM extension."

      # (10) diam
      diam:
        description: >-
          Diameter; alternative method for entering radius. diam = 2 × radius.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 10
        close_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: derived; radius = diam / 2 (radius_from_diameter). Export: not written, radius
            is written instead.

      # (11) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used
          only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (an indexed rating array that names no calendar season; home
            OperationalLimitType.season). Export: not written, not in CIM (untranscribed or raising
            on import).

      # (12) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (with Seasons). Export: not written, not in CIM (untranscribed or raising on
            import).
        todos:
          - "Seasonal ratings converter not yet implemented on WireInfo."

      # (13) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calculations.
        range: float
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the radius for capacitance; not WireInfo.coreRadius). Export: not written, not
            in CIM (untranscribed or raising on import).

      # (14) like
      like:
        description: >-
          Make like another object, e.g.: New Wiredata.W2 like=W1 ...
        range: string
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
