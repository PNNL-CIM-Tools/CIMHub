id: https://gridappsd.github.io/dss-graph/general/loadshape
name: loadshape
title: OpenDSS Loadshape Component Schema
description: >-
  LinkML schema for OpenDSS Loadshape objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-24).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Loadshape:
    description: >-
      A Loadshape object in OpenDSS.
    class_uri: dss:Loadshape
    close_mappings:
      - cim:ConformLoadGroup
      - cim:ConformLoadSchedule
      - cim:EnergyConnectionSchedule
    comments:
      - >-
        Import: a LoadShape a Load names as yearly becomes a ConformLoadGroup lg_<name> with a
        ConformLoadSchedule ls_<name> (points in the Parquet sidecar); one a PVSystem, Storage or
        Generator names becomes that device's EnergyConnectionSchedule. A shape nothing names is not
        mapped.
      - >-
        Export: each ConformLoadSchedule with points is written as a LoadShape; device shapes come
        back from the device's EnergyConnectionSchedule (exporter/loadshape.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to ConformLoadGroup.name, ConformLoadSchedule.name; mRID = lg_ / ls_ +
            name, lowercased. Export: the group's name (Names).

      # (1) npts
      npts:
        description: >-
          Max number of points to expect in load shape vectors
        range: integer
        required: false
        annotations:
          order: 1
        related_mappings:
          - cim:RegularIntervalSchedule.TimePoints
        comments:
          - >-
            Import: structural; the number of points the engine reads: unset, none of mult (inline
            or from a file; engine-checked), so the group has no schedule. Export: the number of
            points.

      # (2) interval
      interval:
        description: >-
          Time interval for fixed interval data, hrs
        range: float
        required: false
        annotations:
          order: 2
        exact_mappings:
          - cim:RegularIntervalSchedule.timeStep
        comments:
          - >-
            Import: copied to ConformLoadSchedule.timeStep (h); the interval slot the deck assigned
            last (the engine's rule); 0 (an hour array) raises; none: 1 h. Export: not written,
            timeStep is written as sinterval (s).

      # (3) mult
      mult:
        description: >-
          Array of multiplier values for active power (P) or other key value (such as pu V for Vsource)
        range: float
        multivalued: true
        required: false
        annotations:
          order: 3
        exact_mappings:
          - cim:RegularTimePoint.value1
        comments:
          - >-
            Import: copied to RegularTimePoint.value1; the points, in the Parquet sidecar;
            action=normalize divides them by their peak. Export: value1 of each point, in sequence
            order.

      # (4) hour
      hour:
        description: >-
          Array of hour values
        range: float
        multivalued: true
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (an irregular shape has no RegularIntervalSchedule). Export: not written, not in
            CIM; the engine's default.

      # (5) mean
      mean:
        description: >-
          Mean of the active power multipliers
        range: float
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed; a Monte Carlo statistic; the engine computes it from mult.
            Export: not written, not in CIM; the engine's default.

      # (6) stddev
      stddev:
        description: >-
          Standard deviation of active power multipliers
        range: float
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: untranscribed; a Monte Carlo statistic; the engine computes it from mult.
            Export: not written, not in CIM; the engine's default.

      # (7) csvfile
      csvfile:
        description: >-
          Switch input of active power load curve data to a CSV text file containing (hour, mult) points, or simply (mult) values for fixed time interval data, one per line
        range: integer
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the reader reads mult=(file=...)). Export: not written, not in CIM; the
            engine's default.

      # (8) sngfile
      sngfile:
        description: >-
          Switch input of active power load curve data to a binary file of singles containing (hour, mult) points, or simply (mult) values for fixed time interval data, packed one after another
        range: integer
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the reader reads mult=(file=...)). Export: not written, not in CIM; the
            engine's default.

      # (9) dblfile
      dblfile:
        description: >-
          Switch input of active power load curve data to a binary file of doubles containing (hour, mult) points, or simply (mult) values for fixed time interval data, packed one after another
        range: integer
        required: false
        annotations:
          order: 9
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the reader reads mult=(file=...)). Export: not written, not in CIM; the
            engine's default.

      # (10) action
      action:
        description: >-
          {NORMALIZE | DblSave | SngSave} After defining load curve data, setting action=normalize will modify the multipliers so that the peak is 1
        range: string
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: derived; normalize: mult and qmult each divided by its largest magnitude, as the
            engine does (one assigned after it raises). Export: not written, not in CIM; the
            engine's default.

      # (11) qmult
      qmult:
        description: >-
          Array of multiplier values for reactive power (Q)
        range: float
        multivalued: true
        required: false
        annotations:
          order: 11
        exact_mappings:
          - cim:RegularTimePoint.value2
        comments:
          - >-
            Import: copied to RegularTimePoint.value2; in the sidecar; unset: Q follows mult (the
            engine's rule), value2 unset. Export: value2 of each point; unset when value2 is (Q
            follows mult).

      # (12) UseActual
      UseActual:
        description: >-
          {Yes | No* | True | False*} If true, signifies to Load, Generator, Vsource, or other objects to use the return value as the actual kW, kvar, kV, or other value rather than a multiplier
        range: boolean
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: structural; Yes raises: a Load naming it takes the shape's peak as its kW, or
            keeps its own, by command order, which the record does not keep (engine-checked).
            Export: not written, not in CIM; the engine's default.

      # (13) Pmax
      Pmax:
        description: >-
          kW value at the time of max power
        range: float
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: untranscribed; used only with UseActual. Export: not written, not in CIM; the
            engine's default.

      # (14) Qmax
      Qmax:
        description: >-
          kvar value at the time of max kW power
        range: float
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: untranscribed; used only with UseActual. Export: not written, not in CIM; the
            engine's default.

      # (15) sinterval
      sinterval:
        description: >-
          Specify fixed interval in SECONDS
        range: string
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:RegularIntervalSchedule.timeStep
        comments:
          - >-
            Import: copied to ConformLoadSchedule.timeStep (s); the interval slot the deck assigned
            last (the engine's rule); 0 (an hour array) raises; none: 1 h. Export: timeStep (s).

      # (16) minterval
      minterval:
        description: >-
          Specify fixed interval in MINUTES
        range: string
        required: false
        annotations:
          order: 16
        exact_mappings:
          - cim:RegularIntervalSchedule.timeStep
        comments:
          - >-
            Import: copied to ConformLoadSchedule.timeStep (min); the interval slot the deck
            assigned last (the engine's rule); 0 (an hour array) raises; none: 1 h. Export: not
            written, timeStep is written as sinterval (s).

      # (17) Pbase
      Pbase:
        description: >-
          Base P value for normalization
        range: string
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (a normalize base). Export: not written, not in CIM; the engine's default.

      # (18) Qbase
      Qbase:
        description: >-
          Base Q value for normalization
        range: string
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (a normalize base). Export: not written, not in CIM; the engine's default.

      # (19) Pmult
      Pmult:
        description: >-
          Synonym for "mult"
        range: string
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (a synonym of mult). Export: not written, not in CIM; the engine's default.

      # (20) PQCSVFile
      PQCSVFile:
        description: >-
          Switch input to a CSV text file containing (active, reactive) power (P, Q) multiplier pairs, one per row
        range: float
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the reader reads mult=(file=...)). Export: not written, not in CIM; the
            engine's default.

      # (21) MemoryMapping
      MemoryMapping:
        description: >-
          {Yes | No* | True | False*} Enables the memory mapping functionality for dealing with large amounts of load shapes
        range: boolean
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed; how the engine stores the points. Export: not written, not in
            CIM; the engine's default.

      # (22) Mode
      Mode:
        description: >-
          {carryover | default} carryover will initialize generator dispatch from latest Pgen/Qgen in memory
        range: float
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed; generator dispatch; no effect on a Load. Export: not written, not
            in CIM; the engine's default.

      # (23) Interpolation
      Interpolation:
        description: >-
          {AVG* | EDGE} Defines the interpolation method used for connecting distant dots within the load shape
        range: string
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Import: untranscribed; AVG and EDGE agree at the solution steps, which are on the
            interval grid. Export: not written, not in CIM; the engine's
            default.

      # (24) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
