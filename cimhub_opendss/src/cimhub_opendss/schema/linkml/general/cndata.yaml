id: https://gridappsd.github.io/dss-graph/general/cndata
name: cndata
title: OpenDSS Cndata Component Schema
description: >-
  LinkML schema for OpenDSS Cndata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-23).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Cndata:
    description: >-
      A Cndata object in OpenDSS.
    class_uri: dss:Cndata
    exact_mappings:
      - cim:ConcentricNeutralCableInfo
    comments:
      - >-
        Import: CNData becomes a ConcentricNeutralCableInfo in wire.cimtbl, with its normal and
        emergency CurrentLimit in an OperationalLimitSet. Export: written as CNData
        (exporter/wire.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.name; mRID = prefix + name, lowercased.
            Export: Names, one namespace for the three catalogs.

      # (1) k
      k:
        description: >-
          Number of concentric neutral strands; default is 2
        range: integer
        required: false
        annotations:
          order: 1
        exact_mappings:
          - cim:ConcentricNeutralCableInfo.neutralStrandCount
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.neutralStrandCount. Export:
            cable.neutral_strand_count.

      # (2) DiaStrand
      DiaStrand:
        description: >-
          Diameter of a concentric neutral strand; same units as core conductor radius; no default
        range: float
        required: false
        annotations:
          order: 2
        close_mappings:
          - cim:ConcentricNeutralCableInfo.neutralStrandRadius
        comments:
          - >-
            Import: derived; neutralStrandRadius = DiaStrand / 2 (radius_from_diameter), radunits.
            Export: 2 x cable.neutral_strand_radius (m).

      # (3) GmrStrand
      GmrStrand:
        description: >-
          Geometric mean radius of a concentric neutral strand; same units as core conductor GMR; defaults to 0
        range: float
        required: false
        annotations:
          order: 3
        exact_mappings:
          - cim:ConcentricNeutralCableInfo.neutralStrandGmr
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.neutralStrandGmr (<GMRunits>); in GMRunits,
            as DSS says. Export: cable.neutral_strand_gmr (m).

      # (4) Rstrand
      Rstrand:
        description: >-
          AC resistance of a concentric neutral strand; same units as core conductor resistance; no default
        range: float
        required: false
        annotations:
          order: 4
        close_mappings:
          - cim:ConcentricNeutralCableInfo.neutralStrandRDC20
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.neutralStrandRDC20 (ohm/<Runits>); DSS
            calls it the strand's AC resistance. Export: cable.neutral_strand_r_dc20 (ohm/m), CIM's
            only strand resistance.

      # (5) SemiconLayer
      SemiconLayer:
        description: >-
          {Yes/True | No/False}  Default is Yes
        range: boolean
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, not in CIM (untranscribed or raising on import).

      # (6) EpsR
      EpsR:
        description: >-
          Insulation layer relative permittivity; default is 2
        range: float
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: untranscribed; insulation relative permittivity. Export: not written, no
            permittivity on CableInfo; the engine's 2.3.

      # (7) InsLayer
      InsLayer:
        description: >-
          Insulation layer thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 7
        exact_mappings:
          - cim:WireInfo.insulationThickness
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.insulationThickness (<radunits>). Export:
            cable.insulation_thickness (m).

      # (8) DiaIns
      DiaIns:
        description: >-
          Diameter over insulation layer; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 8
        exact_mappings:
          - cim:CableInfo.diameterOverInsulation
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.diameterOverInsulation (<radunits>).
            Export: cable.diameter_over_insulation (m).

      # (9) DiaCable
      DiaCable:
        description: >-
          Diameter over cable; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 9
        close_mappings:
          - cim:CableInfo.diameterOverJacket
          - cim:ConcentricNeutralCableInfo.diameterOverNeutral
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.diameterOverJacket (<radunits>),
            ConcentricNeutralCableInfo.diameterOverNeutral (<radunits>); the outer diameter. Export:
            cable.diameter_over_neutral (m), the circle of the strands; unset raises.

      # (10) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits)
        range: float
        required: false
        annotations:
          order: 10
        exact_mappings:
          - cim:ConductorInfo.rDC20
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.rDC20 (ohm/<Runits>); DC resistance (DSS
            gives no temperature). Export: get_wire_info.r_dc20 (ohm/m); Rdc and Rac both unset
            raises.

      # (11) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 11
        close_mappings:
          - cim:ConductorInfo.rAC25
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.rAC25 (ohm/<Runits>); DSS: resistance at 60
            Hz, temperature unstated. Export: rule, get_wire_info.r_ac25 (ohm/m); unset -> not
            written, the engine's 1.02 x Rdc.

      # (12) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: mapped; the unit of Rdc, Rac, Rstrand in the header (LENGTH_UNIT); unset raises
            (every wire in the sweep sets it). Export: m (B1).

      # (13) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 13
        exact_mappings:
          - cim:WireInfo.gmr
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.gmr (<GMRunits>); unset raises (the
            engine's 0.7788 x radius default; no deck in the sweep omits it). Export: rule,
            get_wire_info.gmr (m); unset -> not written, the engine's 0.7788 x radius.

      # (14) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: mapped; the unit of GMRac, GmrStrand in the header (LENGTH_UNIT); unset raises
            (every wire in the sweep sets it). Export: m (B1).

      # (15) radius
      radius:
        description: >-
          Outside radius of conductor
        range: float
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.radius (<radunits>); one of radius and
            diam. Export: get_wire_info.radius (m); unset raises.

      # (16) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 16
        comments:
          - >-
            Import: mapped; the unit of radius, diam and every cable dimension in the header
            (LENGTH_UNIT); unset raises (every wire in the sweep sets it). Export: m (B1).

      # (17) normamps
      normamps:
        description: >-
          Normal ampacity, amperes
        range: float
        required: false
        annotations:
          order: 17
        exact_mappings:
          - cim:ConductingAssetInfo.ratedCurrent
        comments:
          - >-
            Import: copied to ConcentricNeutralCableInfo.ratedCurrent (A); also the normal
            CurrentLimit of the wire's OperationalLimitSet <mRID>_limits
            (AssetInfo.OperationalLimitSet); unset with emergamps set: emergamps / 1.5, the engine's
            rule. Export: the wire's normal limit, else ratedCurrent (A).

      # (18) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes
        range: float
        required: false
        annotations:
          order: 18
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; the emergency CurrentLimit of the wire's OperationalLimitSet
            <mRID>_limits (AssetInfo.OperationalLimitSet). Export: rule, the wire's emergency limit
            (A); unset -> not written, the engine's 1.5 x normamps.

      # (19) diam
      diam:
        description: >-
          Diameter; Alternative method for entering radius
        range: float
        required: false
        annotations:
          order: 19
        close_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: derived; radius = diam / 2 (radius_from_diameter). Export: not written, radius
            is written instead.

      # (20) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used only when defining seasonal ratings using the "Ratings" property
        range: integer
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (an indexed rating array that names no calendar season; home
            OperationalLimitType.season). Export: not written, not in CIM (untranscribed or raising
            on import).

      # (21) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True
        range: float
        multivalued: true
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (with Seasons). Export: not written, not in CIM (untranscribed or raising on
            import).

      # (22) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calcs
        range: float
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the radius for capacitance; not WireInfo.coreRadius). Export: not written, not
            in CIM (untranscribed or raising on import).

      # (23) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
