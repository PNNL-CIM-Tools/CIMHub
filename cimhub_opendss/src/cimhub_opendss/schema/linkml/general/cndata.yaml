id: https://gridappsd.github.io/dss-graph/general/cndata
name: cndata
title: OpenDSS Cndata Component Schema
description: >-
  LinkML schema for OpenDSS Cndata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-23).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Cndata:
    description: >-
      A Cndata object in OpenDSS.
    class_uri: dss:Cndata
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) k
      k:
        description: >-
          Number of concentric neutral strands; default is 2
        range: integer
        required: false
        annotations:
          order: 1

      # (2) DiaStrand
      DiaStrand:
        description: >-
          Diameter of a concentric neutral strand; same units as core conductor radius; no default
        range: float
        required: false
        annotations:
          order: 2

      # (3) GmrStrand
      GmrStrand:
        description: >-
          Geometric mean radius of a concentric neutral strand; same units as core conductor GMR; defaults to 0
        range: float
        required: false
        annotations:
          order: 3

      # (4) Rstrand
      Rstrand:
        description: >-
          AC resistance of a concentric neutral strand; same units as core conductor resistance; no default
        range: float
        required: false
        annotations:
          order: 4

      # (5) SemiconLayer
      SemiconLayer:
        description: >-
          {Yes/True | No/False}  Default is Yes
        range: boolean
        required: false
        annotations:
          order: 5

      # (6) EpsR
      EpsR:
        description: >-
          Insulation layer relative permittivity; default is 2
        range: float
        required: false
        annotations:
          order: 6

      # (7) InsLayer
      InsLayer:
        description: >-
          Insulation layer thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 7

      # (8) DiaIns
      DiaIns:
        description: >-
          Diameter over insulation layer; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 8

      # (9) DiaCable
      DiaCable:
        description: >-
          Diameter over cable; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 9

      # (10) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits)
        range: float
        required: false
        annotations:
          order: 10

      # (11) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 11

      # (12) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 12

      # (13) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 13

      # (14) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 14

      # (15) radius
      radius:
        description: >-
          Outside radius of conductor
        range: float
        required: false
        annotations:
          order: 15

      # (16) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 16

      # (17) normamps
      normamps:
        description: >-
          Normal ampacity, amperes
        range: float
        required: false
        annotations:
          order: 17

      # (18) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes
        range: float
        required: false
        annotations:
          order: 18

      # (19) diam
      diam:
        description: >-
          Diameter; Alternative method for entering radius
        range: float
        required: false
        annotations:
          order: 19

      # (20) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used only when defining seasonal ratings using the "Ratings" property
        range: integer
        required: false
        annotations:
          order: 20

      # (21) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True
        range: float
        multivalued: true
        required: false
        annotations:
          order: 21

      # (22) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calcs
        range: float
        required: false
        annotations:
          order: 22

      # (23) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 23
