id: https://gridappsd.github.io/dss-graph/general/tsdata
name: tsdata
title: OpenDSS Tsdata Component Schema
description: >-
  LinkML schema for OpenDSS Tsdata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Tsdata:
    description: >-
      A Tsdata object in OpenDSS.
    class_uri: dss:Tsdata
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) DiaShield
      DiaShield:
        description: >-
          Diameter over tape shield; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 1

      # (2) TapeLayer
      TapeLayer:
        description: >-
          Tape shield thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 2

      # (3) TapeLap
      TapeLap:
        description: >-
          Tape Lap in percent; default 20
        range: float
        required: false
        annotations:
          order: 3

      # (4) EpsR
      EpsR:
        description: >-
          Insulation layer relative permittivity; default is 2
        range: float
        required: false
        annotations:
          order: 4

      # (5) InsLayer
      InsLayer:
        description: >-
          Insulation layer thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 5

      # (6) DiaIns
      DiaIns:
        description: >-
          Diameter over insulation layer; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 6

      # (7) DiaCable
      DiaCable:
        description: >-
          Diameter over cable; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 7

      # (8) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits)
        range: float
        required: false
        annotations:
          order: 8

      # (9) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 9

      # (10) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 10

      # (11) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 11

      # (12) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 12

      # (13) radius
      radius:
        description: >-
          Outside radius of conductor
        range: float
        required: false
        annotations:
          order: 13

      # (14) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 14

      # (15) normamps
      normamps:
        description: >-
          Normal ampacity, amperes
        range: float
        required: false
        annotations:
          order: 15

      # (16) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes
        range: float
        required: false
        annotations:
          order: 16

      # (17) diam
      diam:
        description: >-
          Diameter; Alternative method for entering radius
        range: float
        required: false
        annotations:
          order: 17

      # (18) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used only when defining seasonal ratings using the "Ratings" property
        range: integer
        required: false
        annotations:
          order: 18

      # (19) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True
        range: float
        multivalued: true
        required: false
        annotations:
          order: 19

      # (20) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calcs
        range: float
        required: false
        annotations:
          order: 20

      # (21) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 21
