id: https://gridappsd.github.io/dss-graph/general/tsdata
name: tsdata
title: OpenDSS Tsdata Component Schema
description: >-
  LinkML schema for OpenDSS Tsdata objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Tsdata:
    description: >-
      A Tsdata object in OpenDSS.
    class_uri: dss:Tsdata
    exact_mappings:
      - cim:TapeShieldCableInfo
    comments:
      - >-
        Import: TSData becomes a TapeShieldCableInfo in wire.cimtbl, with its normal and emergency
        CurrentLimit in an OperationalLimitSet. Export: written as TSData (exporter/wire.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.name; mRID = prefix + name, lowercased. Export:
            Names, one namespace for the three catalogs.

      # (1) DiaShield
      DiaShield:
        description: >-
          Diameter over tape shield; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 1
        close_mappings:
          - cim:CableInfo.diameterOverScreen
        comments:
          - >-
            Import: derived; diameterOverScreen = DiaShield - 2 TapeLayer (screen_diameter): DSS
            measures over the tape, CIM's screen diameter is the shield's inside (ExportCIMXML).
            Export: cable.diameter_over_screen + 2 x tape_thickness (m): DSS measures over the tape.

      # (2) TapeLayer
      TapeLayer:
        description: >-
          Tape shield thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 2
        exact_mappings:
          - cim:TapeShieldCableInfo.tapeThickness
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.tapeThickness (<radunits>). Export:
            cable.tape_thickness (m).

      # (3) TapeLap
      TapeLap:
        description: >-
          Tape Lap in percent; default 20
        range: float
        required: false
        annotations:
          order: 3
        exact_mappings:
          - cim:TapeShieldCableInfo.tapeLap
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.tapeLap (percent). Export: cable.tape_lap
            (percent).

      # (4) EpsR
      EpsR:
        description: >-
          Insulation layer relative permittivity; default is 2
        range: float
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: untranscribed; insulation relative permittivity. Export: not written, no
            permittivity on CableInfo; the engine's 2.3.

      # (5) InsLayer
      InsLayer:
        description: >-
          Insulation layer thickness; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 5
        exact_mappings:
          - cim:WireInfo.insulationThickness
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.insulationThickness (<radunits>). Export:
            cable.insulation_thickness (m).

      # (6) DiaIns
      DiaIns:
        description: >-
          Diameter over insulation layer; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 6
        exact_mappings:
          - cim:CableInfo.diameterOverInsulation
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.diameterOverInsulation (<radunits>). Export:
            cable.diameter_over_insulation (m).

      # (7) DiaCable
      DiaCable:
        description: >-
          Diameter over cable; same units as radius; no default
        range: float
        required: false
        annotations:
          order: 7
        exact_mappings:
          - cim:CableInfo.diameterOverJacket
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.diameterOverJacket (<radunits>); the outer
            diameter. Export: cable.diameter_over_jacket (m).

      # (8) Rdc
      Rdc:
        description: >-
          dc Resistance, ohms per unit length (see Runits)
        range: float
        required: false
        annotations:
          order: 8
        exact_mappings:
          - cim:ConductorInfo.rDC20
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.rDC20 (ohm/<Runits>); DC resistance (DSS gives no
            temperature). Export: get_wire_info.r_dc20 (ohm/m); Rdc and Rac both unset raises.

      # (9) Rac
      Rac:
        description: >-
          Resistance at 60 Hz per unit length
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 9
        close_mappings:
          - cim:ConductorInfo.rAC25
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.rAC25 (ohm/<Runits>); DSS: resistance at 60 Hz,
            temperature unstated. Export: rule, get_wire_info.r_ac25 (ohm/m); unset -> not written,
            the engine's 1.02 x Rdc.

      # (10) Runits
      Runits:
        description: >-
          Length units for resistance: ohms per {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: mapped; the unit of Rdc, Rac in the header (LENGTH_UNIT); unset raises (every
            wire in the sweep sets it). Export: m (B1).

      # (11) GMRac
      GMRac:
        description: >-
          GMR at 60 Hz
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 11
        exact_mappings:
          - cim:WireInfo.gmr
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.gmr (<GMRunits>); unset raises (the engine's
            0.7788 x radius default; no deck in the sweep omits it). Export: rule, get_wire_info.gmr
            (m); unset -> not written, the engine's 0.7788 x radius.

      # (12) GMRunits
      GMRunits:
        description: >-
          Units for GMR: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: mapped; the unit of GMRac in the header (LENGTH_UNIT); unset raises (every wire
            in the sweep sets it). Export: m (B1).

      # (13) radius
      radius:
        description: >-
          Outside radius of conductor
        range: float
        required: false
        annotations:
          order: 13
        exact_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.radius (<radunits>); one of radius and diam.
            Export: get_wire_info.radius (m); unset raises.

      # (14) radunits
      radunits:
        description: >-
          Units for outside radius: {mi|kft|km|m|Ft|in|cm|mm} Default=none
        range: string
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: mapped; the unit of radius, diam and every cable dimension in the header
            (LENGTH_UNIT); unset raises (every wire in the sweep sets it). Export: m (B1).

      # (15) normamps
      normamps:
        description: >-
          Normal ampacity, amperes
        range: float
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:ConductingAssetInfo.ratedCurrent
        comments:
          - >-
            Import: copied to TapeShieldCableInfo.ratedCurrent (A); also the normal CurrentLimit of
            the wire's OperationalLimitSet <mRID>_limits (AssetInfo.OperationalLimitSet); unset with
            emergamps set: emergamps / 1.5, the engine's rule. Export: the wire's normal limit, else
            ratedCurrent (A).

      # (16) emergamps
      emergamps:
        description: >-
          Emergency ampacity, amperes
        range: float
        required: false
        annotations:
          order: 16
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; the emergency CurrentLimit of the wire's OperationalLimitSet
            <mRID>_limits (AssetInfo.OperationalLimitSet). Export: rule, the wire's emergency limit
            (A); unset -> not written, the engine's 1.5 x normamps.

      # (17) diam
      diam:
        description: >-
          Diameter; Alternative method for entering radius
        range: float
        required: false
        annotations:
          order: 17
        close_mappings:
          - cim:WireInfo.radius
        comments:
          - >-
            Import: derived; radius = diam / 2 (radius_from_diameter). Export: not written, radius
            is written instead.

      # (18) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used only when defining seasonal ratings using the "Ratings" property
        range: integer
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (an indexed rating array that names no calendar season; home
            OperationalLimitType.season). Export: not written, not in CIM (untranscribed or raising
            on import).

      # (19) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True
        range: float
        multivalued: true
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (with Seasons). Export: not written, not in CIM (untranscribed or raising on
            import).

      # (20) Capradius
      Capradius:
        description: >-
          Equivalent conductor radius for capacitance calcs
        range: float
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (the radius for capacitance; not WireInfo.coreRadius). Export: not written, not
            in CIM (untranscribed or raising on import).

      # (21) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
