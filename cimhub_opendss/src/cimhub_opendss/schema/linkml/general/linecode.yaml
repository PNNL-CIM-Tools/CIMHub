id: https://gridappsd.github.io/dss-graph/general/linecode
name: linecode
title: OpenDSS Linecode Component Schema
description: >-
  LinkML schema for OpenDSS Linecode objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-28).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Linecode:
    description: >-
      A Linecode object in OpenDSS defining per-unit-length impedance data shared
      by multiple lines. Depending on whether sequence impedances or matrices are
      provided, the converter creates either a PerLengthSequenceImpedance or a
      PerLengthPhaseImpedance + PhaseImpedanceData.
    class_uri: dss:Linecode
    close_mappings:
      - cim:PerLengthSequenceImpedance
      - cim:PerLengthPhaseImpedance
    related_mappings:
      - cim:WireConfiguration
    comments:
      - >-
        Import: a LineCode becomes a template PerLengthSequenceImpedance (r1/x1/r0/x0 with C1, C0 or
        B1, B0), or a PerLengthPhaseImpedance with PhaseImpedanceData rows
        (rmatrix/xmatrix/cmatrix), plus its WireConfiguration lc_<name>_wc (isTemplate=true), in
        linecode.cimtbl. Values are copied per length in the code's units.
      - >-
        Export: every template PerLengthImpedance is written as a LineCode per metre, C from b at
        the network's base frequency (exporter/linecode.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to PerLengthPhaseImpedance.name, PerLengthSequenceImpedance.name,
            WireConfiguration.name; mRID = lc_ + name, lowercased. Export: Names.

      # (1) nphases
      nphases:
        description: >-
          Number of phases in the line this line code data represents. Default is 3.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        annotations:
          order: 1
          dss_default: int(3)
        close_mappings:
          - cim:PerLengthPhaseImpedance.conductorCount
        comments:
          - >-
            Import: copied to PerLengthPhaseImpedance.conductorCount (the matrix order); a 1- or
            2-phase sequence code becomes a phase matrix as the engine builds the line.
            Export: phase code: conductorCount; sequence code: 3.

      # (2) r1
      r1:
        description: >-
          Positive-sequence Resistance, ohms per unit length.
        range: float
        required: false
        annotations:
          order: 2
          dss_default: float(0.058)
        exact_mappings:
          - cim:PerLengthSequenceImpedance.r
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.r (ohm/<units>). Export: sequence code: r
            (ohm/m).

      # (3) x1
      x1:
        description: >-
          Positive-sequence Reactance, ohms per unit length.
        range: float
        required: false
        annotations:
          order: 3
          dss_default: float(0.1206)
        exact_mappings:
          - cim:PerLengthSequenceImpedance.x
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.x (ohm/<units>). Export: sequence code: x
            (ohm/m).

      # (4) r0
      r0:
        description: >-
          Zero-sequence Resistance, ohms per unit length.
        range: float
        required: false
        annotations:
          order: 4
          dss_default: float(0.1784)
        exact_mappings:
          - cim:PerLengthSequenceImpedance.r0
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.r0 (ohm/<units>). Export: sequence code: r0
            (ohm/m); unset raises.

      # (5) x0
      x0:
        description: >-
          Zero-sequence Reactance, ohms per unit length.
        range: float
        required: false
        annotations:
          order: 5
          dss_default: float(0.4047)
        exact_mappings:
          - cim:PerLengthSequenceImpedance.x0
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.x0 (ohm/<units>). Export: sequence code: x0
            (ohm/m); unset raises.

      # (6) C1
      C1:
        description: >-
          Positive-sequence capacitance, nf per unit length.
        range: string
        required: false
        annotations:
          order: 6
          dss_default: float(3.4)
        close_mappings:
          - cim:PerLengthSequenceImpedance.bch
        comments:
          - >-
            Import: derived; PerLengthSequenceImpedance bch = 2 pi baseFreq C1 (b_from_c): nF -> nS.
            Export: rule, sequence code: c_from_b(bch) (nF/m); unset -> 0.

      # (7) C0
      C0:
        description: >-
          Zero-sequence capacitance, nf per unit length.
        range: string
        required: false
        annotations:
          order: 7
          dss_default: float(1.6)
        close_mappings:
          - cim:PerLengthSequenceImpedance.b0ch
        comments:
          - >-
            Import: derived; PerLengthSequenceImpedance b0ch = 2 pi baseFreq C0 (b_from_c): nF ->
            nS. Export: rule, sequence code: c_from_b(b0ch) (nF/m); unset -> 0.

      # (8) units
      units:
        description: >-
          One of (none|mi|km|kft|m|ft|in|cm) for the length units. Default is none
          (use Line object's units).
        range: string
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: mapped; the length unit of every per-length header via LENGTH_UNIT. Export: m
            (B1).

      # (9) rmatrix
      rmatrix:
        description: >-
          Resistance matrix, lower triangle, ohms per unit length.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 9
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.r
        comments:
          - >-
            Import: structural; PhaseImpedanceData r, one row per lower-triangle element. Export:
            phase code: r, lower triangle (ohm/m).

      # (10) xmatrix
      xmatrix:
        description: >-
          Reactance matrix, lower triangle, ohms per unit length.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 10
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.x
        comments:
          - >-
            Import: structural; PhaseImpedanceData x, one row per lower-triangle element. Export:
            phase code: x, lower triangle (ohm/m).

      # (11) cmatrix
      cmatrix:
        description: >-
          Nodal Capacitance matrix, lower triangle, nf per unit length.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 11
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.b
        comments:
          - >-
            Import: derived; PhaseImpedanceData b = 2 pi baseFreq C (b_from_c): nF -> nS. Export:
            rule, phase code: c_from_b(b), lower triangle (nF/m); unset -> zeros.

      # (12) baseFreq
      baseFreq:
        description: >-
          Frequency at which impedances are specified. Default is 60 Hz.
        range: string
        required: false
        annotations:
          order: 12
        exact_mappings:
          - cim:PerLengthImpedance.calculatedFrequency
        comments:
          - >-
            Import: copied to PerLengthPhaseImpedance.calculatedFrequency (Hz),
            PerLengthSequenceImpedance.calculatedFrequency (Hz); also the frequency of the derived
            b. Export: network.base_frequency (Hz); a calculatedFrequency that differs raises.

      # (13) normamps
      normamps:
        description: >-
          Normal ampere limit on line.
        range: float
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: untranscribed; catalog ratings have no home on PerLengthImpedance; instance
            limits or untranscribed. Export: not written, no rating on a
            PerLengthImpedance; the Line carries its own.
        todos:
          - "Per-length-impedance-level current limits not yet mapped. Should create a WireInfo.ratedCurrent or OperationalLimitSet if this is needed."

      # (14) emergamps
      emergamps:
        description: >-
          Emergency ampere limit on line (usually one-hour rating).
        range: float
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: untranscribed; catalog ratings have no home on PerLengthImpedance; instance
            limits or untranscribed. Export: not written, no rating on a
            PerLengthImpedance; the Line carries its own.
        todos:
          - "Emergency rating not yet mapped; same path as normamps."

      # (15) faultrate
      faultrate:
        description: >-
          Number of faults per unit length per year.
        range: float
        required: false
        annotations:
          order: 15
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed on import).
        todos:
          - "Requires CIM extension to roundtrip."

      # (16) pctperm
      pctperm:
        description: >-
          Percentage of the faults that become permanent.
        range: float
        required: false
        annotations:
          order: 16
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed on import).
        todos:
          - "Requires CIM extension to roundtrip."

      # (17) repair
      repair:
        description: >-
          Hours to repair.
        range: string
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed on import).
        todos:
          - "Requires CIM extension to roundtrip."

      # (18) Kron
      Kron:
        description: >-
          Kron = Y/N. If Yes, performs Kron reduction after impedance matrix
          is computed.
        range: string
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: untranscribed; input of the matrix calculation; no CIM home. Export: not
            written, not in CIM (untranscribed on import).

      # (19) Rg
      Rg:
        description: >-
          Carson earth return resistance per unit length used to compute
          impedance values at base frequency.
        range: float
        required: false
        annotations:
          order: 19
        close_mappings:
          - cim:PerLengthImpedance.rg
        comments:
          - >-
            Import: untranscribed; Carson earth return per length. Export: not written,
            PerLengthImpedance.rg set raises (not imported either).

      # (20) Xg
      Xg:
        description: >-
          Carson earth return reactance per unit length used to compute
          impedance values at base frequency.
        range: float
        required: false
        annotations:
          order: 20
        close_mappings:
          - cim:PerLengthImpedance.xg
        comments:
          - >-
            Import: untranscribed; Carson earth return per length. Export: not written,
            PerLengthImpedance.xg set raises (not imported either).

      # (21) rho
      rho:
        description: >-
          Default=100 meter ohms. Earth resistivity.
        range: float
        required: false
        annotations:
          order: 21
        close_mappings:
          - cim:EarthResistivity.rho
        comments:
          - >-
            Import: untranscribed; earth resistivity; home EarthResistivity.rho, an object of its
            own, not mapped until a deck sets it. Export: not written, not in CIM (untranscribed on
            import).

      # (22) neutral
      neutral:
        description: >-
          Designates which conductor is the neutral conductor that will be
          eliminated by Kron reduction.
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed; input of the matrix calculation; no CIM home. Export: not
            written, not in CIM (untranscribed on import).

      # (23) B1
      B1:
        description: >-
          Alternate way to specify C1. MicroS per unit length.
        range: string
        required: false
        annotations:
          order: 23
        exact_mappings:
          - cim:PerLengthSequenceImpedance.bch
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.bch (uS/<units>); the alternative to C1.
            Export: not written, C1 carries the susceptance.
        todos:
          - "B1 input path not yet implemented. B1 (µS/unit) → bch via bch = B1 × 1e-6 / length_factor."

      # (24) B0
      B0:
        description: >-
          Alternate way to specify C0. MicroS per unit length.
        range: string
        required: false
        annotations:
          order: 24
        exact_mappings:
          - cim:PerLengthSequenceImpedance.b0ch
        comments:
          - >-
            Import: copied to PerLengthSequenceImpedance.b0ch (uS/<units>); the alternative to C0.
            Export: not written, C0 carries the susceptance.
        todos:
          - "B0 input path not yet implemented."

      # (25) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used
          only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: untranscribed; catalog ratings have no home on PerLengthImpedance; instance
            limits or untranscribed. Export: not written, not in CIM (untranscribed on
            import).

      # (26) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is True.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: untranscribed; catalog ratings have no home on PerLengthImpedance; instance
            limits or untranscribed. Export: not written, not in CIM (untranscribed on
            import).
        todos:
          - "Seasonal ratings converter not yet implemented for LineCode."

      # (27) LineType
      LineType:
        description: >-
          Code designating the type of line.
        range: float
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: untranscribed; no home in the network profile parts. Export: not written, not in
            CIM (untranscribed on import).
        todos:
          - "LineType → PSRType mapping not yet implemented for LineCode."

      # (28) like
      like:
        description: >-
          Make like another object, e.g.: New LineCode.L2 like=L1 ...
        range: string
        required: false
        annotations:
          order: 28
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
