id: https://gridappsd.github.io/dss-graph/general/buscoords
name: buscoords
title: OpenDSS Buscoords Component Schema
description: >-
  LinkML schema for OpenDSS bus coordinates. Unlike every other class in this
  schema, Buscoords has no ``New Buscoords.x`` command: coordinates arrive as a
  headerless CSV referenced by a ``BusCoords`` or ``LatLongCoords`` directive in
  the DSS file tree. One row becomes one Buscoords instance.
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Buscoords:
    description: >-
      The geographic or projected position of a single bus, as one row of a
      BusCoords / LatLongCoords CSV (``BusName, c1, c2``).
    class_uri: dss:Buscoords
    close_mappings:
      - cim:PositionPoint
    related_mappings:
      - cim:Location
      - cim:CoordinateSystem
    comments:
      - >-
        Import: not a CIM class. Each bus coordinate sets the Location and PositionPoint of every
        equipment Terminal on that bus (buscoords.cimtbl, a bound_parts document); LatLongCoords
        picks the CoordinateSystem.
      - "Export: one row per bus from the equipment Locations (exporter/buscoords.py)."
    attributes:
      name:
        description: >-
          Bus name. Matched case-insensitively against ConnectivityNode names.
        range: string
        required: true
        identifier: true
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; picks the bus: every Terminal on it takes its coordinates. Export:
            the bus (Names.bus) of each Terminal of located equipment.

      # (1) x
      x:
        description: >-
          Horizontal coordinate — easting for projected files, longitude for
          LatLongCoords files.
        range: float
        required: false
        annotations:
          order: 1
        close_mappings:
          - cim:PositionPoint.xPosition
        comments:
          - >-
            Import: derived; geometry: a line's LINESTRING vertex at each Terminal bus, verbatim.
            Export: the Terminal's PositionPoint xPosition (get_location_coordinates); a bus only a
            device point touches is solved from it as the centroid of the device's buses.

      # (2) y
      y:
        description: >-
          Vertical coordinate — northing for projected files, latitude for
          LatLongCoords files.
        range: float
        required: false
        annotations:
          order: 2
        close_mappings:
          - cim:PositionPoint.yPosition
        comments:
          - "Import: derived; as x. Export: as x, from yPosition."

      # (3) geographic
      geographic:
        description: >-
          True when the row came from a ``LatLongCoords`` directive (x/y are
          longitude/latitude degrees) rather than a projected ``BusCoords`` file.
        range: boolean
        required: false
        annotations:
          order: 3
        close_mappings:
          - cim:CoordinateSystem.crsUrn
        comments:
          - >-
            Import: mapped; the directive (LatLongCoords -> true) picks the CoordinateSystem:
            COORDINATE_SYSTEMS. Export: crsUrn CRS84 -> true (LatLongCoords),
            OpenDSSLocalBusCoordinates -> false; others raise.
