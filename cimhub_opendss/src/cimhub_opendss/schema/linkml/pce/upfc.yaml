id: https://gridappsd.github.io/dss-graph/pce/upfc
name: upfc
title: OpenDSS Upfc Component Schema
description: >-
  LinkML schema for OpenDSS Upfc objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Upfc:
    description: >-
      A Upfc object in OpenDSS.
    class_uri: dss:Upfc
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) bus1
      bus1:
        description: >-
          Name of bus to which the input terminal (1) is connected
        range: float
        required: false
        annotations:
          order: 1

      # (2) bus2
      bus2:
        description: >-
          Name of bus to which the output terminal (2) is connected
        range: float
        required: false
        annotations:
          order: 2

      # (3) refkv
      refkv:
        description: >-
          Base Voltage expected at the output of the UPFC"refkv=0
        range: float
        required: false
        annotations:
          order: 3

      # (4) pf
      pf:
        description: >-
          Power factor target at the input terminal
        range: float
        required: false
        annotations:
          order: 4

      # (5) frequency
      frequency:
        description: >-
          UPFC working frequency
        range: string
        required: false
        annotations:
          order: 5

      # (6) phases
      phases:
        description: >-
          Number of phases
        range: integer
        required: false
        annotations:
          order: 6

      # (7) Xs
      Xs:
        description: >-
          Reactance of the series transformer of the UPFC, ohms (default=0
        range: float
        required: false
        annotations:
          order: 7

      # (8) Tol1
      Tol1:
        description: >-
          Tolerance in pu for the series PI controllerTol1=0
        range: float
        required: false
        annotations:
          order: 8

      # (9) Mode
      Mode:
        description: >-
          Integer used to define the control mode of the UPFC: 0 = Off, 1 = Voltage regulator, 2 = Phase angle regulator, 3 = Dual mode4 = It is a control mode where the user can set two different set ...
        range: integer
        required: false
        annotations:
          order: 9

      # (10) VpqMax
      VpqMax:
        description: >-
          Maximum voltage (in volts) delivered by the series voltage source (Default = 24 V)
        range: float
        required: false
        annotations:
          order: 10

      # (11) LossCurve
      LossCurve:
        description: >-
          Name of the XYCurve for describing the losses behavior as a function of the voltage at the input of the UPFC
        range: float
        required: false
        annotations:
          order: 11

      # (12) VHLimit
      VHLimit:
        description: >-
          High limit for the voltage at the input of the UPFC, if the voltage is above this value the UPFC turns off
        range: float
        required: false
        annotations:
          order: 12

      # (13) VLLimit
      VLLimit:
        description: >-
          low limit for the voltage at the input of the UPFC, if voltage is below this value the UPFC turns off
        range: float
        required: false
        annotations:
          order: 13

      # (14) CLimit
      CLimit:
        description: >-
          Current Limit for the UPFC, if the current passing through the UPFC is higher than this value the UPFC turns off
        range: float
        required: false
        annotations:
          order: 14

      # (15) refkv2
      refkv2:
        description: >-
          Base Voltage expected at the output of the UPFC for control modes 4 and 5
        range: float
        required: false
        annotations:
          order: 15

      # (16) kvarLimit
      kvarLimit:
        description: >-
          Maximum amount of reactive power (kvar) that can be absorved by the UPFC (Default = 5)
        range: float
        required: false
        annotations:
          order: 16

      # (17) Element
      Element:
        description: >-
          The name of the PD element monitored when operating with reactive power compensation
        range: float
        required: false
        annotations:
          order: 17

      # (18) spectrum
      spectrum:
        description: >-
          Name of harmonic spectrum for this source
        range: string
        required: false
        annotations:
          order: 18

      # (19) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 19

      # (20) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 20

      # (21) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 21
