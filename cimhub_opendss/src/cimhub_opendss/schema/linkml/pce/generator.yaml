id: https://gridappsd.github.io/dss-graph/pce/generator
name: generator
title: OpenDSS Generator Component Schema
description: >-
  LinkML schema for OpenDSS Generator objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-50).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Generator:
    description: >-
      A Generator object in OpenDSS representing a power generator connected
      to a bus in the distribution system.
    class_uri: dss:Generator
    exact_mappings:
      - cim:SynchronousMachine
    comments:
      - >-
        Import: a Generator becomes a SynchronousMachine in generator.cimtbl, with a voltage
        RegulatingControl for model 3; p = -kW and q = -kvar (the load sign). Dynamics settings are
        untranscribed.
      - >-
        Export: SynchronousMachine is written as a Generator (exporter/generator.py), model 3 from
        its own voltage control.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to SynchronousMachine.name; mRID = gen_ + name, lowercased. Export:
            Names, the Generator namespace; a wind unit as inverter_pieces names it.

      # (1) phases
      phases:
        description: >-
          Number of Phases, this Generator. Power is evenly divided among phases.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        related_mappings:
          - cim:Terminal.phases
        comments:
          - >-
            Import: structural; the conductor count; default 3. Export: the phase conductors; a
            delta across two is 1.
        todos:
          - "Per-phase detail is discarded. A per-phase-aware roundtrip would need RotatingMachinePhase objects (present in CIM18 but not in the cimhub_2026 profile used here — see the commented-out code in the importer)."
        annotations:
          order: 1
          dss_default: int(3)

      # (2) bus1
      bus1:
        description: >-
          Bus to which the Generator is connected. May include specific node
          specification.
        range: string
        required: false
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node and phases, by the shared phase rule. Export: bus_ref of the
            phase conductors; a wye machine's neutral is node 0.
        annotations:
          order: 2

      # (3) kv
      kv:
        description: >-
          Nominal rated (1.0 per unit) voltage, kV, for Generator. For 2- and
          3-phase Generators, specify phase-phase kV. Otherwise, for phases=1
          or phases>3, specify actual kV across each branch of the Generator.
        range: float
        required: false
        minimum_value: 0.0
        close_mappings:
          - cim:RotatingMachine.ratedU
        comments:
          - >-
            Import: derived; ratedU (kV, LL) = kv, x sqrt 3 for 1-phase wye; default 12.47.
            Export: ratedU (kV, LL), / sqrt 3 for 1-phase wye.
        annotations:
          order: 3
          dss_default: float(12.47)

      # (4) kW
      kW:
        description: >-
          Total base kW for the Generator. A positive value denotes power
          coming OUT of the element. This value is modified depending on the
          dispatch mode.
        range: float
        required: false
        close_mappings:
          - cim:RotatingMachine.p
        comments:
          - >-
            Import: derived; p (kW) = -kW (the load sign); default 1000. Export: get_der_output
            total p (kW, generation sign); a wind unit: its share of the connection's p
            (inverter_pieces).
        annotations:
          order: 4
          dss_default: float(1000.0)

      # (5) pf
      pf:
        description: >-
          Generator power factor. Default is 0.88. Enter negative for leading
          power factor. A positive power factor signifies the generator
          produces vars.
        range: float
        required: false
        minimum_value: -1.0
        maximum_value: 1.0
        close_mappings:
          - cim:RotatingMachine.q
        comments:
          - >-
            Import: derived; q (kVAr) = -kvar, kvar replayed from the kW, pf and kvar assignments in
            deck order (dispatched_kvar): each kW or pf recomputes kvar = kW x tan(acos
            abs(pf)). Export: not written, kvar carries q.
        annotations:
          order: 5
          dss_default: float(0.88)

      # (6) kvar
      kvar:
        description: >-
          Specify the base kvar. Alternative to specifying the power factor.
          Side effect: the power factor value is altered to agree.
        range: float
        required: false
        close_mappings:
          - cim:RotatingMachine.q
        comments:
          - >-
            Import: derived; sets the pf, kW / kVA with kvar's sign, at the kW of that moment.
            Export: get_der_output total q (kVAr, generation sign), after kW; a wind unit: its share
            of q.
        annotations:
          order: 6

      # (7) model
      model:
        description: >-
          Integer code for the model to use for generation variation with voltage.
          1=Constant kW at specified pf, 2=Constant admittance, 3=Const kW const kV,
          4=Const kW Fixed Q, 5=Const kW Fixed Q as reactance, 6=User model,
          7=Const kW kvar current-limited.
        range: GeneratorModel
        required: false
        related_mappings:
          - cim:RegulatingCondEq.RegulatingControl
        comments:
          - >-
            Import: structural; 1 and 7 dispatch kW/kvar; 3 adds a voltage RegulatingControl; 2, 4,
            5, 6 raise; default 1. Export: 3 (ConstantPV) when an enabled control regulates its own
            terminal's voltage, else 1 (ConstantPQ); model 7 comes back as 1.
        todos:
          - "No CIM equivalent for DSS generator model enumeration."
        annotations:
          order: 7
          dss_default: int(1)
          dss_valid_values: "1,2,3,4,5,6,7"

      # (8) Vminpu
      Vminpu:
        description: >-
          Minimum per unit voltage for which the Model is assumed to apply.
          Default is 0.90.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; below it the engine models the machine as constant Z; a
            power-flow setting. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Requires CIM extension to roundtrip (e.g. operational voltage limits)."
        annotations:
          order: 8
          dss_default: float(0.90)

      # (9) Vmaxpu
      Vmaxpu:
        description: >-
          Maximum per unit voltage for which the Model is assumed to apply.
          Default is 1.10.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; above it the engine models the machine as constant Z; a
            power-flow setting. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Requires CIM extension to roundtrip (e.g. operational voltage limits)."
        annotations:
          order: 9
          dss_default: float(1.10)

      # (10) yearly
      yearly:
        description: >-
          Dispatch shape to use for yearly simulations. Must be previously
          defined as a Loadshape object.
        range: string
        required: false
        close_mappings:
          - cim:EnergyConnectionSchedule
        comments:
          - >-
            Import: mapped to EnergyConnectionSchedule.name; the machine's EnergyConnectionSchedule
            <mRID>_yearly: -kW x mult, -kvar x mult per sample. Export: the machine's
            EnergyConnectionSchedule as a LoadShape, mult = p / kW.
        todos:
          - "LoadShape converter not yet implemented; roundtrip requires mapping DSS LoadShape to CIM RegularIntervalSchedule."
        annotations:
          order: 10

      # (11) daily
      daily:
        description: >-
          Dispatch shape to use for daily simulations. Must be previously
          defined as a Loadshape object of 24 hrs, typically.
        range: string
        required: false
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "LoadShape converter not yet implemented; roundtrip requires mapping DSS LoadShape to CIM RegularIntervalSchedule."
        annotations:
          order: 11

      # (12) duty
      duty:
        description: >-
          Load shape to use for duty cycle dispatch simulations such as for
          wind generation. Must be previously defined as a Loadshape object.
        range: string
        required: false
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "LoadShape converter not yet implemented; roundtrip requires mapping DSS LoadShape to CIM RegularIntervalSchedule."
        annotations:
          order: 12

      # (13) dispmode
      dispmode:
        description: >-
          Dispatch mode. Default, Loadlevel, or Price.
        range: DispatchMode
        required: false
        comments:
          - >-
            Import: untranscribed; a dispatch setting of time-series solutions; a snapshot does not
            use it; with a yearly shape, another than Default raises. Export: not written,
            untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS dispatch mode enumeration."
        annotations:
          order: 13

      # (14) dispvalue
      dispvalue:
        description: >-
          Dispatch value. If = 0.0 (default) then Generator follows dispatch
          curves. If > 0 then Generator is ON only when price or load exceeds
          this value.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dispatch setting of time-series solutions; a snapshot does not
            use it; with a yearly shape, above 0 raises. Export: not written, untranscribed or
            raising on import; not in CIM.
        todos:
          - "No CIM equivalent for dispatch trigger value."
        annotations:
          order: 14
          dss_default: float(0.0)

      # (15) conn
      conn:
        description: >-
          Connection type. Default is wye.
        range: ConnectionType
        required: false
        close_mappings:
          - cim:SynchronousMachine.earthing
        comments:
          - >-
            Import: mapped to SynchronousMachine.earthing; wye -> earthing true, delta -> false (no
            phaseConnection on a machine); default wye. Export: earthing true -> wye, false
            -> delta; unset raises.
        annotations:
          order: 15
          dss_default: string(wye)

      # (16) Rneut
      # Removed - not used

      # (17) Xneut
      # Removed - not used

      # (18) status
      status:
        description: >-
          Fixed or Variable. If Fixed, dispatch multipliers do not apply.
          Default is Variable.
        range: GenStatus
        required: false
        comments:
          - >-
            Import: untranscribed; Fixed/Variable: whether load multipliers scale it; a dispatch
            setting of time-series solutions; a snapshot does not use it. Export: not written,
            untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for Fixed/Variable dispatch status."
        annotations:
          order: 18

      # (19) class
      gen_class:
        description: >-
          An arbitrary integer number representing the class of Generator.
        range: integer
        required: false
        comments:
          - >-
            Import: untranscribed; a DSS report grouping. Export: not written, untranscribed or
            raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS generator class integer."
        annotations:
          order: 19
          dss_name: class
          dss_default: int(1)

      # (20) Vpu
      Vpu:
        description: >-
          Per Unit voltage set point for Model = 3. Default is 1.0.
        range: float
        required: false
        close_mappings:
          - cim:RegulatingControl.targetValue
        comments:
          - >-
            Import: derived; model 3: the control's targetValue (V) = Vpu x ratedU; default 1.
            Export: model 3: the control's target / ratedU.
        todos:
          - "No CIM equivalent for DSS Vpu (Model=3 set point)."
        annotations:
          order: 20
          dss_default: float(1.0)

      # (21) maxkvar
      maxkvar:
        description: >-
          Maximum kvar limit for Model = 3. Defaults to twice the specified
          load kvar.
        range: float
        required: false
        exact_mappings:
          - cim:SynchronousMachine.maxQ
        comments:
          - >-
            Import: copied to SynchronousMachine.maxQ (kVAr); model 3 only (another model raises);
            default 2 x kvar. Export: model 3: maxQ (kVAr); unset -> not written.
        todos:
          - "No CIM equivalent currently mapped for Generator maxkvar."
        annotations:
          order: 21

      # (22) minkvar
      minkvar:
        description: >-
          Minimum kvar limit for Model = 3. Enter a negative number if
          generator can absorb vars.
        range: float
        required: false
        exact_mappings:
          - cim:SynchronousMachine.minQ
        comments:
          - >-
            Import: copied to SynchronousMachine.minQ (kVAr); model 3 only (another model raises);
            default -2 x kvar. Export: model 3: minQ (kVAr); unset -> not written.
        todos:
          - "No CIM equivalent currently mapped for Generator minkvar."
        annotations:
          order: 22

      # (23) pvfactor
      pvfactor:
        description: >-
          Deceleration factor for P-V generator model (Model=3). Default is 0.1.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a convergence aid of the engine's model 3. Export: not written,
            untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS pvfactor."
        annotations:
          order: 23
          dss_default: float(0.1)

      # (24) forceon
      forceon:
        description: >-
          Forces generator ON despite requirements of other dispatch modes.
        range: boolean
        required: false
        comments:
          - >-
            Import: untranscribed; a dispatch setting of time-series solutions; a snapshot does not
            use it. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS forceon flag."
        annotations:
          order: 24
          dss_default: "false"

      # (25) kVA
      kVA:
        description: >-
          kVA rating of electrical machine. Defaults to 1.2 * kW if not
          specified.
        range: float
        required: false
        exact_mappings:
          - cim:RotatingMachine.ratedS
        comments:
          - >-
            Import: copied to SynchronousMachine.ratedS (kVA); default 1.2 x kW. Export: ratedS
            (kVA); a wind unit: its share of the inverter's ratedS.
        annotations:
          order: 25

      # (26) MVA
      MVA:
        description: >-
          MVA rating of electrical machine. Alternative to using kVA.
        range: float
        required: false
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (kVA is). Export: not written, kVA carries ratedS.
        todos:
          - "MVA is not read by the importer. If implemented, it should be treated as an alternate input for RotatingMachine.ratedS when kVA is absent."
        annotations:
          order: 26

      # (27) Xd
      Xd:
        description: >-
          Per unit synchronous reactance of machine. Default is 1.0.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Dynamic/fault study parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 27
          dss_default: float(1.0)

      # (28) Xdp
      Xdp:
        description: >-
          Per unit transient reactance of the machine. Used for Dynamics mode
          and Fault studies. Default is 0.27.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Dynamic/fault study parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 28
          dss_default: float(0.28)

      # (29) Xdpp
      Xdpp:
        description: >-
          Per unit subtransient reactance of the machine. Used for Harmonics.
          Default is 0.20.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Dynamic/fault study parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 29
          dss_default: float(0.20)

      # (30) H
      H:
        description: >-
          Per unit mass constant of the machine. MW-sec/MVA. Default is 1.0.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Dynamic parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 30
          dss_default: float(1.0)

      # (31) D
      D:
        description: >-
          Damping constant. Usual range is 0 to 4. Default is 1.0.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Dynamic parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 31
          dss_default: float(1.0)

      # (32) UserModel
      UserModel:
        description: >-
          Name of DLL containing user-written model for Dynamics studies.
        range: string
        required: false
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS UserModel DLL reference."
        annotations:
          order: 32

      # (33) UserData
      UserData:
        description: >-
          String that gets passed to user-written model.
        range: string
        required: false
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS UserData string."
        annotations:
          order: 33

      # (34) ShaftModel
      ShaftModel:
        description: >-
          Name of user-written DLL containing a Shaft model.
        range: string
        required: false
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS ShaftModel DLL reference."
        annotations:
          order: 34

      # (35) ShaftData
      ShaftData:
        description: >-
          String that gets passed to user-written shaft dynamic model.
        range: string
        required: false
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS ShaftData string."
        annotations:
          order: 35

      # (36) DutyStart
      DutyStart:
        description: >-
          Starting time offset [hours] into the duty cycle shape. Defaults to 0.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS DutyStart time offset."
        annotations:
          order: 36
          dss_default: float(0.0)

      # (37) debugtrace
      debugtrace:
        description: >-
          Turn this on to capture the progress of the generator model for each
          iteration.
        range: boolean
        required: false
        comments:
          - >-
            Import: untranscribed; a DSS debugging switch. Export: not written, untranscribed or
            raising on import; not in CIM.
        annotations:
          order: 37
          dss_default: "false"

      # (38) Balanced
      Balanced:
        description: >-
          For Model=7, force balanced current only for 3-phase generators.
          Default is No.
        range: boolean
        required: false
        comments:
          - >-
            Import: untranscribed; a power-flow setting of the engine's model. Export: not written,
            untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS Balanced flag."
        annotations:
          order: 38
          dss_default: "false"

      # (39) XRdp
      XRdp:
        description: >-
          X/R ratio for Xdp property for FaultStudy and Dynamic modes.
          Default is 20.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, no machine reactance or inertia in cim18v17; the engine's default.
        todos:
          - "Fault study parameter — requires CIM Dynamics profile extension to roundtrip."
        annotations:
          order: 39
          dss_default: float(20.0)

      # (40) UseFuel
      UseFuel:
        description: >-
          Activates the use of fuel for the operation of the generator.
        range: boolean
        required: false
        comments:
          - >-
            Import: untranscribed; a fuel-limited dispatch setting; a snapshot does not use it.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS fuel model parameters."
        annotations:
          order: 40
          dss_default: "false"

      # (41) FuelkWh
      FuelkWh:
        description: >-
          Nominal level of fuel for the generator (kWh). Only applies if
          UseFuel = Yes/True.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a fuel-limited dispatch setting; a snapshot does not use it.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS FuelkWh."
        annotations:
          order: 41
          dss_default: float(0.0)

      # (42) %Fuel
      pct_Fuel:
        description: >-
          Current amount of fuel available in percentage of FuelkWh (0-100).
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a fuel-limited dispatch setting; a snapshot does not use it.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS %Fuel."
        annotations:
          order: 42
          dss_name: "%Fuel"

      # (43) %Reserve
      pct_Reserve:
        description: >-
          Reserve level in percentage of FuelkWh (0-100).
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; a fuel-limited dispatch setting; a snapshot does not use it.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS %Reserve."
        annotations:
          order: 43
          dss_name: "%Reserve"

      # (44) Refuel
      Refuel:
        description: >-
          Boolean value to manually refuel the generator when needed.
        range: boolean
        required: false
        comments:
          - >-
            Import: untranscribed; a fuel-limited dispatch setting; a snapshot does not use it.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS Refuel flag."
        annotations:
          order: 44
          dss_default: "false"

      # (45) DynamicEq
      DynamicEq:
        description: >-
          Name of the dynamic equation (DynamicExp) for defining the dynamic
          behavior of the generator.
        range: string
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS DynamicEq reference."
        annotations:
          order: 45

      # (46) DynOut
      DynOut:
        description: >-
          Name of the variables within the Dynamic equation for governing
          generator dynamics.
        range: string
        multivalued: true
        required: false
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS DynOut variable list."
        annotations:
          order: 46

      # (47) spectrum
      spectrum:
        description: >-
          Name of harmonic voltage or current spectrum for this generator.
          Default is "default".
        range: string
        required: false
        comments:
          - >-
            Import: untranscribed; harmonics model; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "No CIM equivalent for DSS spectrum reference."
        annotations:
          order: 47
          dss_default: string(default)

      # (48) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        comments:
          - >-
            Import: untranscribed; no home on a machine. Export: not written, untranscribed or
            raising on import; not in CIM.
        todos:
          - "Extract base frequency from CIM circuit metadata on import; do not map to machine object."
        annotations:
          order: 48

      # (49) enabled
      enabled:
        description: >-
          Indicates whether this element is enabled.
        range: boolean
        required: false
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: copied to SynchronousMachine.normallyInService; default true. Export:
            get_in_service(which='normal'); unset -> not written.
        annotations:
          order: 49
          dss_default: "true"

      # (50) like
      like:
        description: >-
          Make like another object, e.g.: New Generator.G2 like=G1 ...
        range: string
        required: false
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
        annotations:
          order: 50

