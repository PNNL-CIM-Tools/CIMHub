id: https://gridappsd.github.io/dss-graph/pde/capacitor
name: capacitor
title: OpenDSS Capacitor Component Schema
description: >-
  LinkML schema for OpenDSS Capacitor objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Capacitor:
    description: >-
      A Capacitor object in OpenDSS representing a shunt or series capacitor
      bank connected to the distribution system.
    class_uri: dss:Capacitor
    exact_mappings:
      - cim:LinearShuntCompensator
    comments:
      - >-
        OpenDSS Capacitor maps to CIM LinearShuntCompensator. Per-phase
        susceptance information is carried on LinearShuntCompensatorPhase
        collections.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - "Direct name mapping; no conversion needed."

      # (1) bus1
      bus1:
        description: >-
          Name of first bus of 2-terminal capacitor. If only one bus specified,
          Bus2 will default to this bus, Node 0, and the capacitor will be a Yg
          shunt bank.
        range: string
        required: true
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Structural mapping via traversal: equipment.Terminals[0].ConnectivityNode.name.
            On export, phase suffix (.1.2.3) is reconstructed from LinearShuntCompensatorPhase
            objects ordered by SinglePhaseKind (A=1, B=2, C=3).
        annotations:
          order: 1

      # (2) bus2
      bus2:
        description: >-
          Name of 2nd bus. Defaults to all phases connected to first bus, node
          0, (Shunt Wye Connection) except when Bus2 explicitly specified.
        range: string
        required: false
        comments:
          - >-
            N/A for CIM roundtrip. OpenDSS shunt capacitors are single-terminal in CIM
            (LinearShuntCompensator has one Terminal to the bus; the neutral is implicit
            in grounded=True / phaseConnection=Y). Bus2 is only meaningful for two-terminal
            series capacitor configurations, which have no standard CIM equivalent.
        annotations:
          order: 2

      # (3) phases
      phases:
        description: >-
          Number of phases.
        range: integer
        required: false
        related_mappings:
          - cim:LinearShuntCompensatorPhase
        comments:
          - >-
            Import: inferred from the bus phase specification in bus1 via parse_bus_phases().
            Export: derived as len(shunt.ShuntCompensatorPhase). Phase count drives creation
            of LinearShuntCompensatorPhase objects, which also carry per-phase susceptance.
        annotations:
          order: 3

      # (4) kvar
      kvar:
        description: >-
          Total kvar, if one step, or ARRAY of kvar ratings for each step.
          Evenly divided among phases.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        close_mappings:
          - cim:LinearShuntCompensator.bPerSection
        comments:
          - >-
            Import: bPerSection = 0.001 × kvar_total / kV² / Numsteps (kvar → siemens).
            Export: kvar_total = bPerSection × kV² × 1000 × Numsteps.
            Same physical concept (reactive compensation); CIM stores susceptance per section
            in SI (siemens) rather than reactive power (kvar).
        annotations:
          order: 4

      # (5) kv
      kv:
        description: >-
          For 2, 3-phase, kV phase-phase. Otherwise specify actual can rating.
        range: float
        required: false
        minimum_value: 0.0
        exact_mappings:
          - cim:LinearShuntCompensator.nomU
        comments:
          - "Unit conversion: kV ↔ V (CIM stores SI base units via cim.Voltage)."
        annotations:
          order: 5

      # (6) conn
      conn:
        description: >-
          Connection type. Default is wye, which is equivalent to LN.
        range: ConnectionType
        required: false
        exact_mappings:
          - cim:LinearShuntCompensator.phaseConnection
        comments:
          - >-
            Import: wye → PhaseShuntConnectionKind.Y (grounded=True, b0PerSection=bPerSection);
            delta → PhaseShuntConnectionKind.D (grounded=False, b0PerSection=0).
            Export: PhaseShuntConnectionKind.Y → wye; PhaseShuntConnectionKind.D → delta.
        annotations:
          order: 6

      # (7) cmatrix
      cmatrix:
        description: >-
          Nodal cap. matrix, lower triangle, microfarads. All steps are assumed
          the same if this property is used.
        range: float
        multivalued: true
        required: false
        related_mappings:
          - cim:LinearShuntCompensatorPhase.bPerSection
        comments:
          - >-
            Lossy roundtrip: CIM stores only per-phase susceptance (diagonal elements);
            off-diagonal coupling terms are discarded. Diagonal index for phase i:
            i*(i+1)/2 + i. Conversion: B = 2π × 60 × C_µF × 1e-6 (siemens).
            Export reconstructs lower-triangle cmatrix with zeros on off-diagonals.
        annotations:
          order: 7
          dss_format: matrix

      # (8) cuf
      cuf:
        description: >-
          ARRAY of Capacitance, each phase, for each step, microfarads.
        range: float
        multivalued: true
        required: false
        related_mappings:
          - cim:LinearShuntCompensatorPhase.bPerSection
        comments:
          - >-
            Import: flat per-phase µF array converted to per-phase bPerSection.
            Conversion: B = 2π × 60 × C_µF × 1e-6 (siemens).
            Unlike cmatrix (lower-triangle), cuf is a simple flat array; one value per phase.
        todos:
          - "Exporter: B → µF per-phase path not yet implemented; cuf is not written on export."
        annotations:
          order: 8

      # (9) R
      R:
        description: >-
          ARRAY of series resistance in each phase (line), ohms. Default is 0.0.
        range: float
        multivalued: true
        required: false
        comments:
          - >-
            OpenDSS filter-capacitor feature (series R for harmonic filter tuning);
            no CIM equivalent in the standard profile.
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.seriesR) to roundtrip."
        annotations:
          order: 9

      # (10) XL
      XL:
        description: >-
          ARRAY of series inductive reactance(s) in each phase (line) for
          filter, ohms at base frequency. Default is 0.0.
        range: float
        multivalued: true
        required: false
        comments:
          - >-
            OpenDSS harmonic filter tuning parameter; no CIM equivalent in the standard profile.
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.seriesXL) to roundtrip."
        annotations:
          order: 10

      # (11) Harm
      Harm:
        description: >-
          ARRAY of harmonics to which each step is tuned. Zero is interpreted
          as meaning zero reactance (no filter). Default is zero.
        range: float
        multivalued: true
        required: false
        comments:
          - >-
            OpenDSS harmonic filter tuning parameter; no CIM equivalent in the standard profile.
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.filterHarmonic) to roundtrip."
        annotations:
          order: 11

      # (12) Numsteps
      Numsteps:
        description: >-
          Number of steps in this capacitor bank. Default = 1. Forces
          reallocation of the capacitance, reactor, and states array.
        range: integer
        required: false
        minimum_value: 1
        exact_mappings:
          - cim:LinearShuntCompensator.maximumSections
        comments:
          - >-
            Import: mapped to both normalSections and maximumSections (OpenDSS has one value
            for total steps; CIM distinguishes normal from maximum).
            Export: read from maximumSections.
        annotations:
          order: 12
          dss_default: int(1)

      # (13) states
      states:
        description: >-
          ARRAY of integers {1|0} states representing the state of each step
          (on|off). Defaults to 1 when reallocated (on). Capcontrol will modify
          this array as it turns steps on or off.
        range: integer
        multivalued: true
        required: false
        close_mappings:
          - cim:LinearShuntCompensator.sections
        comments:
          - >-
            Import: count of on steps (states[i] > 0) stored as sections (float).
            Export: sections → [1]*current_sections + [0]*(Numsteps - current_sections).
            CIM sections is a float count; DSS states is a binary per-step array.
        annotations:
          order: 13

      # (14) normamps
      normamps:
        description: >-
          Normal rated current. Defaults to 135% of per-phase rated current.
        range: float
        required: false
        related_mappings:
          - cim:OperationalLimit
        comments:
          - >-
            Intended target: a normal-rating CurrentLimit on an OperationalLimitSet
            attached to this equipment's terminal.
        todos:
          - "Converter not yet implemented; requires OperationalLimitSet + CurrentLimit creation."
        annotations:
          order: 14

      # (15) emergamps
      emergamps:
        description: >-
          Maximum or emerg current. Defaults to 180% of per-phase rated current.
        range: float
        required: false
        related_mappings:
          - cim:OperationalLimit
        comments:
          - >-
            Intended target: an emergency-rating CurrentLimit on an OperationalLimitSet
            attached to this equipment's terminal.
        todos:
          - "Converter not yet implemented; requires OperationalLimitSet + CurrentLimit creation."
        annotations:
          order: 15

      # (16) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: float
        required: false
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip (e.g. on FailureStatistic or AssetFailureInfo)."
        annotations:
          order: 16

      # (17) pctperm
      pct_perm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip (e.g. on FailureStatistic or AssetFailureInfo)."
        annotations:
          order: 17
          dss_name: "pctperm"

      # (18) repair
      repair:
        description: >-
          Hours to repair.
        range: float
        required: false
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip (e.g. on FailureStatistic or AssetFailureInfo)."
        annotations:
          order: 18

      # (19) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        comments:
          - >-
            Not stored on CIM LinearShuntCompensator; the base frequency is a circuit-level
            property in CIM (e.g. BaseFrequency on a subclass of PowerSystemResource).
            The µF ↔ susceptance conversion in cmatrix/cuf paths uses 60 Hz hardcoded;
            a non-60-Hz capacitor would need this value extracted from the circuit context.
        todos:
          - "Extract base frequency from circuit-level CIM attributes for non-60Hz systems."
        annotations:
          order: 19

      # (20) enabled
      enabled:
        description: >-
          Indicates whether this element is enabled.
        range: boolean
        required: false
        comments:
          - >-
            Import: if False, the capacitor is skipped entirely (returns None); no disabled
            CIM object is created.
            Export: N/A — all CIM LinearShuntCompensator objects are assumed enabled.
        annotations:
          order: 20
          dss_default: "true"

      # (21) like
      like:
        description: >-
          Make like another object, e.g.: New Capacitor.C2 like=c1 ...
        range: string
        required: false
        comments:
          - "OpenDSS template inheritance; resolved at parser time, no CIM equivalent needed."
        annotations:
          order: 21

# Enums are imported from common_enums.yaml
