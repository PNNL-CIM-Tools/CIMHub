id: https://gridappsd.github.io/dss-graph/pce/pvsystem
name: pvsystem
title: OpenDSS Pvsystem Component Schema
description: >-
  LinkML schema for OpenDSS Pvsystem objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-54).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Pvsystem:
    description: >-
      A Pvsystem object in OpenDSS representing a photovoltaic generator with
      inverter-based grid connection.
    class_uri: dss:Pvsystem
    close_mappings:
      - cim:PowerElectronicsConnection
      - cim:PhotoVoltaicUnit
    comments:
      - >-
        Import: one PVSystem becomes a PowerElectronicsConnection (the inverter) and a
        PhotoVoltaicUnit (the panel) in pvsystem.cimtbl; p, q are the engine's snapshot output in
        the load sign. Export: the connection is chopped into one PVSystem per unit
        (exporter/pvsystem.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.name; mRID = pv_ + name, lowercased; the
            unit is <mRID>_unit. Export: Names: the connection's for one unit, the unit's for
            several, <name>_<phase> per phase.

      # (1) phases
      phases:
        description: >-
          Number of Phases, this PVSystem element
        range: integer
        required: false
        annotations:
          order: 1
          dss_default: int(3)
        related_mappings:
          - cim:Terminal.phases
        comments:
          - >-
            Import: structural; the conductor count; default 3. Export: the phase conductors; a
            delta across two is 1.

      # (2) bus1
      bus1:
        description: >-
          Bus to which the PVSystem element is connected
        range: string
        required: false
        annotations:
          order: 2
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node and phases, by the shared phase rule. Export: bus_ref of the
            phase conductors; a wye inverter's neutral is node 0.

      # (3) kv
      kv:
        description: >-
          Nominal rated (1.0 per unit) voltage, kV, for PVSystem element. For
          2- and 3-phase PVSystems, specify phase-phase kV. Otherwise, specify
          actual kV across each branch.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 3
          dss_default: float(12.47)
        close_mappings:
          - cim:PowerElectronicsConnection.ratedU
        comments:
          - >-
            Import: derived; ratedU (kV, LL) = kv, x sqrt 3 for 1-phase wye; not checked
            against the bus; default 12.47. Export: ratedU (kV, LL), / sqrt 3 for 1-phase wye.

      # (4) irradiance
      irradiance:
        description: >-
          Get/set the present irradiance value in kW/sq-m
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 4
          dss_default: float(1.0)
          dss_name: "irrad"
        exact_mappings:
          - cim:PhotoVoltaicUnit.irradiance
        comments:
          - >-
            Import: copied to PhotoVoltaicUnit.irradiance (kW/m2); also p (pv_power); default 1.
            Export: the unit's irradiance (kW/m2); unset -> the unit's output / Pmpp
            (get_inverter_units p, generation sign).

      # (5) Pmpp
      Pmpp:
        description: >-
          Get/set the rated max power of the PV array for 1.0 kW/sq-m irradiance, kW.
        range: float
        required: false
        annotations:
          order: 5
          dss_default: float(500.0)
        close_mappings:
          - cim:PowerElectronicsUnit.maxP
        comments:
          - >-
            Import: copied to PhotoVoltaicUnit.maxP (kW); also p (pv_power); default 500. Export:
            the unit's maxP (kW), x 1/n for one of n phases; unset raises, a minP other than 0
            raises.

      # (6) %Pmpp
      pct_Pmpp:
        description: >-
          Upper limit on active power as a percentage of Pmpp
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(100.0)
          dss_name: "%Pmpp"
        close_mappings:
          - cim:PowerElectronicsConnection.p
        comments:
          - >-
            Import: derived; p is capped at Pmpp x %Pmpp / 100 (pv_power); default 100. Export:
            rule, 100 x output / Pmpp when the output is below Pmpp x irradiance, else not written;
            an output above it raises.

      # (7) Temperature
      Temperature:
        description: >-
          Get/set the present Temperature (deg C) for the P-T curve.
        range: float
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: untranscribed; acts only through a P-TCurve, which raises. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (8) pf
      pf:
        description: >-
          Nominally, the power factor for the output power. Default is 0.88.
          Consumed to compute kvar if kvar is not specified.
        range: float
        required: false
        minimum_value: -1.0
        maximum_value: 1.0
        annotations:
          order: 8
          dss_default: float(1.0)
        close_mappings:
          - cim:PowerElectronicsConnection.q
        comments:
          - >-
            Import: derived; q = -kW x tan(acos abs(pf)) with the sign of pf, unless kvar was
            assigned after it (the last of the two wins); default 1. Export: rule, with a
            yearly shape whose q is in proportion to p: p / hypot(p, q) with the sign of q; else
            kvar carries q.

      # (9) conn
      conn:
        description: >-
          ={wye|LN|delta|LL}
        range: string
        required: false
        annotations:
          order: 9
          dss_default: string(wye)
        close_mappings:
          - cim:PowerElectronicsConnection.phaseConnection
        comments:
          - >-
            Import: mapped to PowerElectronicsConnection.phaseConnection; wye -> Y, delta -> D;
            default wye. Export: phaseConnection Y/Yn -> wye, D -> delta; others raise.

      # (10) kvar
      kvar:
        description: >-
          Get/set the present kvar value. Positive is capacitive (generator convention).
        range: float
        required: false
        annotations:
          order: 10
        close_mappings:
          - cim:PowerElectronicsConnection.q
        comments:
          - >-
            Import: derived; q (kVAr) = -kvar (the load sign), unless pf was assigned after it.
            Above kVA it raises, off or on (the engine clamps it to kvarMax).
            Export: the unit's share of q (generation sign: -q).

      # (11) kVA
      kVA:
        description: >-
          kVA rating of inverter. Defaults to 1.1 * Pmpp.
        range: float
        required: false
        annotations:
          order: 11
          dss_default: float(500.0)
        exact_mappings:
          - cim:PowerElectronicsConnection.ratedS
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.ratedS (kVA); also caps p (var priority);
            default 500. Export: ratedS, the connection's, by the unit's share (inverter_pieces).

      # (12) %Cutin
      pct_Cutin:
        description: >-
          % cut-in power -- % of kVA rating of inverter. Below this, PVSystem is idle.
        range: float
        required: false
        annotations:
          order: 12
          dss_default: float(20.0)
          dss_name: "%Cutin"
        comments:
          - >-
            Import: structural; acts only after the inverter turns off; the snapshot state uses
            %Cutout; a yearly sample between %Cutout and %Cutin raises. Export: rule, 0 with a
            yearly shape, else not written.

      # (13) %Cutout
      pct_Cutout:
        description: >-
          % cut-out power -- % of kVA rating of inverter. Below this, PVSystem turns off.
        range: float
        required: false
        annotations:
          order: 13
          dss_default: float(20.0)
          dss_name: "%Cutout"
        close_mappings:
          - cim:PowerElectronicsConnection.p
        comments:
          - >-
            Import: derived; p = 0 when Pmpp x irradiance is below %Cutout of kVA, q too unless kvar
            is set (VarFollowInverter); default 20. Export: rule, 0 when the output is above 0 and
            Pmpp x irradiance below the engine's 20 % of kVA, or with a yearly shape; else not
            written.

      # (14) EffCurve
      EffCurve:
        description: >-
          An XYCurve object, previously defined, that describes the PER UNIT
          efficiency vs PER UNIT of rated kVA for the inverter.
        range: string
        required: false
        annotations:
          order: 14
        todos:
          - "No CIM equivalent. Inverter efficiency curve; requires CIM extension or mapping to a custom XYCurve linked to the PEC."
        comments:
          - >-
            Import: structural; raises: an efficiency curve changes the snapshot power. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (15) P-TCurve
      P_TCurve:
        description: >-
          An XYCurve object, previously defined, that describes the PV array
          PER UNIT Pmpp vs Temperature curve.
        range: string
        required: false
        annotations:
          order: 15
          dss_name: "P-TCurve"
        todos:
          - "No CIM equivalent. Temperature derating curve for PV panel; requires CIM extension."
        comments:
          - >-
            Import: structural; raises: a temperature curve changes the snapshot power. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (16) %R
      pct_R:
        description: >-
          Equivalent percent internal resistance, ohms. Default is 0.
        range: float
        required: false
        annotations:
          order: 16
          dss_name: "%R"
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (17) %X
      pct_X:
        description: >-
          Equivalent percent internal reactance, ohms. Default is 50.
        range: float
        required: false
        annotations:
          order: 17
          dss_name: "%X"
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (18) model
      model:
        description: >-
          Integer code (default=1) for the model to use for power output
          variation with voltage. 1=Constant P+jQ, 2=Constant Z, 3=Constant I.
        range: integer
        required: false
        annotations:
          order: 18
          dss_default: int(1)
          dss_valid_values: "1,2,3"
        comments:
          - >-
            Import: structural; 1 (constant P, PF) only; any other raises (ieee9500's Mode=7 is
            model=7, which the engine rejects too); default 1. Export: not written, model 1, the
            engine's default; others raise on import.

      # (19) Vminpu
      Vminpu:
        description: >-
          Minimum per unit voltage. Default = 0.9. Below this, inverter trips
          and the element goes to constant impedance mode.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 19
          dss_default: float(0.9)
        close_mappings:
          - cim:PowerElectronicsConnection.maxIFault
        comments:
          - >-
            Import: derived; maxIFault = 1 / Vminpu (the engine's CIM export); default 0.9. Export:
            1 / maxIFault (the importer's rule inverted); unset -> not written.

      # (20) Vmaxpu
      Vmaxpu:
        description: >-
          Maximum per unit voltage. Default = 1.1.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 20
          dss_default: float(1.1)
        comments:
          - >-
            Import: untranscribed; above it the engine models the PV as constant Z; a power-flow
            setting. Export: not written, untranscribed or raising on import; not in CIM.

      # (21) Balanced
      Balanced:
        description: >-
          {Yes | No*} Default is No. If true, force balanced operation.
        range: boolean
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (22) LimitCurrent
      LimitCurrent:
        description: >-
          Limits current magnitude to Vminpu value for both 1-phase and
          3-phase PVSystems similar to Generator Model 7.
        range: boolean
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (23) yearly
      yearly:
        description: >-
          Dispatch shape to use for yearly simulations. LoadShape name.
        range: string
        required: false
        annotations:
          order: 23
        close_mappings:
          - cim:EnergyConnectionSchedule
        comments:
          - >-
            Import: mapped to EnergyConnectionSchedule.name; the PV's EnergyConnectionSchedule
            <mRID>_yearly: pv_power at irradiance x mult per sample. Export: the connection's
            EnergyConnectionSchedule as a LoadShape, mult = p / (Pmpp x irradiance); %Cutin,
            %Cutout 0 and q by kvar or pf with it.
        todos:
          - "Loadshape converter not yet implemented. DSS LoadShape name should map to a CIM SeasonDayTypeSchedule or RegularIntervalSchedule linked to the PowerElectronicsConnection."

      # (24) daily
      daily:
        description: >-
          Dispatch shape to use for daily simulations. LoadShape name.
        range: string
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Loadshape converter not yet implemented."

      # (25) duty
      duty:
        description: >-
          Load shape to use for duty cycle dispatch simulations.
        range: string
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Loadshape converter not yet implemented."

      # (26) Tyearly
      Tyearly:
        description: >-
          Temperature shape to use for yearly simulations.
        range: string
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (27) Tdaily
      Tdaily:
        description: >-
          Temperature shape to use for daily simulations.
        range: string
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (28) Tduty
      Tduty:
        description: >-
          Temperature shape to use for duty cycle dispatch simulations.
        range: string
        required: false
        annotations:
          order: 28
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (29) class
      class_class:
        description: >-
          An arbitrary integer number representing the class of PVSystem element.
        range: integer
        required: false
        annotations:
          order: 29
          dss_name: "class"
        comments:
          - >-
            Import: untranscribed; a DSS report grouping. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (30) UserModel
      UserModel:
        description: >-
          Name of DLL containing user-written model for Dynamics studies.
        range: string
        required: false
        annotations:
          order: 30
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (31) UserData
      UserData:
        description: >-
          String that gets passed to user-written model for defining the data
          required for that model.
        range: string
        required: false
        annotations:
          order: 31
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (32) debugtrace
      debugtrace:
        description: >-
          {Yes | No }  Default is no. If true, writes debug trace to a file.
        range: boolean
        required: false
        annotations:
          order: 32
        comments:
          - >-
            Import: untranscribed; a DSS debugging switch. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (33) VarFollowInverter
      VarFollowInverter:
        description: >-
          Boolean variable (Yes|No) or (True|False). When True, reactive power
          follows the inverter dispatch.
        range: boolean
        required: false
        annotations:
          order: 33
        comments:
          - >-
            Import: derived; yes: an inverter that is off gives no kvar either (pv_power,
            engine-checked); default no. Export: not written, untranscribed or raising on import;
            not in CIM.

      # (34) DutyStart
      DutyStart:
        description: >-
          Starting time offset [hours] into the duty cycle shape. Default is 0.
        range: float
        required: false
        annotations:
          order: 34
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (35) WattPriority
      WattPriority:
        description: >-
          {Yes/No*/True/False} Set inverter to watt priority instead of the
          default var priority.
        range: boolean
        required: false
        annotations:
          order: 35
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it (var priority is
            mapped). Export: not written, untranscribed or raising on import; not in CIM.

      # (36) PFPriority
      PFPriority:
        description: >-
          {Yes/No*/True/False} Set inverter to operate with PF priority when
          in constant PF mode.
        range: boolean
        required: false
        annotations:
          order: 36
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (37) %PminNoVars
      pct_PminNoVars:
        description: >-
          Minimum active power as percentage of Pmpp under which there is no
          vars production/absorption.
        range: float
        required: false
        annotations:
          order: 37
          dss_name: "%PminNoVars"
        comments:
          - >-
            Import: structural; raises when nonzero; no deck in the sweep sets it. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (38) %PminkvarMax
      pct_PminkvarMax:
        description: >-
          Minimum active power as percentage of Pmpp that allows the inverter
          to produce/absorb reactive power up to its kvarMax or kvarMaxAbs.
        range: float
        required: false
        annotations:
          order: 38
          dss_name: "%PminkvarMax"
        comments:
          - >-
            Import: structural; raises when nonzero; no deck in the sweep sets it. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (39) kvarMax
      kvarMax:
        description: >-
          Maximum reactive power GENERATION (un-signed, kvar) for the inverter.
        range: float
        required: false
        annotations:
          order: 39
        exact_mappings:
          - cim:PowerElectronicsConnection.maxQ
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.maxQ (kVAr); default kVA. Export: maxQ, the
            connection's, by the unit's share (inverter_pieces); unset -> not written.

      # (40) kvarMaxAbs
      kvarMaxAbs:
        description: >-
          Maximum reactive power ABSORPTION (un-signed, kvar) for the inverter.
        range: float
        required: false
        annotations:
          order: 40
        close_mappings:
          - cim:PowerElectronicsConnection.minQ
        comments:
          - >-
            Import: derived; minQ (kVAr) = -kvarMaxAbs; default kVA. Export: -minQ, the
            connection's, by the unit's share (inverter_pieces); unset -> not written.

      # (41) kVDC
      kVDC:
        description: >-
          Indicates the rated voltage (kV) at the input of the inverter at
          the peak of PV energy production.
        range: float
        required: false
        annotations:
          order: 41
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (42) Kp
      Kp:
        description: >-
          It is the proportional gain for the PI controller within the inverter.
        range: float
        required: false
        annotations:
          order: 42
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (43) PITol
      PITol:
        description: >-
          It is the tolerance (%) for the closed loop controller of the inverter.
        range: float
        required: false
        annotations:
          order: 43
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (44) SafeVoltage
      SafeVoltage:
        description: >-
          Indicates the voltage level (%) respect to the base voltage level
          for which the Inverter will operate.
        range: float
        required: false
        annotations:
          order: 44
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (45) SafeMode
      SafeMode:
        description: >-
          (Read only) Indicates whether the inverter entered (Yes) or not (No)
          into Safe Mode.
        range: boolean
        required: false
        annotations:
          order: 45
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (46) DynamicEq
      DynamicEq:
        description: >-
          The name of the dynamic equation (DinamicExp) that will be used for
          defining the dynamic behavior of the generator.
        range: string
        required: false
        annotations:
          order: 46
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (47) DynOut
      DynOut:
        description: >-
          The name of the variables within the Dynamic equation that will be
          used to govern the PVSystem dynamics.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 47
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (48) ControlMode
      ControlMode:
        description: >-
          Defines the control mode for the inverter. {GFM | GFL*} Default is GFL.
        range: string
        required: false
        annotations:
          order: 48
        comments:
          - >-
            Import: structural; GFL only; GFM raises (raises when set: no deck in the sweep sets it,
            so a mapping waits for one). Export: not written, untranscribed or raising on import;
            not in CIM.

      # (49) AmpLimit
      AmpLimit:
        description: >-
          Is the current limiter per phase for the IBR when operating in GFM mode.
        range: float
        required: false
        annotations:
          order: 49
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (50) AmpLimitGain
      AmpLimitGain:
        description: >-
          Use it for fine tunning the current limiter when active, by default is 0.
        range: float
        required: false
        annotations:
          order: 50
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (51) spectrum
      spectrum:
        description: >-
          Name of harmonic voltage or current spectrum for this PVSystem element.
        range: string
        required: false
        annotations:
          order: 51
        comments:
          - >-
            Import: untranscribed; harmonics model; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (52) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 52
        comments:
          - >-
            Import: untranscribed; no home on an inverter. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (53) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
