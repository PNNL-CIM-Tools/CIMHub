id: https://gridappsd.github.io/dss-graph/pce/vccs
name: vccs
title: OpenDSS Vccs Component Schema
description: >-
  LinkML schema for OpenDSS Vccs objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-17).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Vccs:
    description: >-
      A Vccs object in OpenDSS.
    class_uri: dss:Vccs
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) bus1
      bus1:
        description: >-
          Name of bus to which source is connected
        range: string
        required: false
        annotations:
          order: 1

      # (2) phases
      phases:
        description: >-
          Number of phases
        range: integer
        required: false
        annotations:
          order: 2

      # (3) prated
      prated:
        description: >-
          Total rated power, in Watts
        range: float
        required: false
        annotations:
          order: 3

      # (4) vrated
      vrated:
        description: >-
          Rated line-to-line voltage, in Volts
        range: float
        required: false
        annotations:
          order: 4

      # (5) ppct
      ppct:
        description: >-
          Steady-state operating output, in percent of rated
        range: float
        required: false
        annotations:
          order: 5

      # (6) bp1
      bp1:
        description: >-
          XYCurve defining the input piece-wise linear block
        range: float
        required: false
        annotations:
          order: 6

      # (7) bp2
      bp2:
        description: >-
          XYCurve defining the output piece-wise linear block
        range: float
        required: false
        annotations:
          order: 7

      # (8) filter
      filter:
        description: >-
          XYCurve defining the digital filter coefficients (x numerator, y denominator)
        range: string
        required: false
        annotations:
          order: 8

      # (9) fsample
      fsample:
        description: >-
          Sample frequency [Hz} for the digital filter
        range: string
        required: false
        annotations:
          order: 9

      # (10) rmsmode
      rmsmode:
        description: >-
          True if only Hz is used to represent a phase-locked loop (PLL), ignoring the BP1, BP2 and time-domain transformations
        range: string
        required: false
        annotations:
          order: 10

      # (11) imaxpu
      imaxpu:
        description: >-
          Maximum output current in per-unit of rated; defaults to 1
        range: float
        required: false
        annotations:
          order: 11

      # (12) vrmstau
      vrmstau:
        description: >-
          Time constant in sensing Vrms for the PLL; defaults to 0
        range: string
        required: false
        annotations:
          order: 12

      # (13) irmstau
      irmstau:
        description: >-
          Time constant in producing Irms from the PLL; defaults to 0
        range: string
        required: false
        annotations:
          order: 13

      # (14) spectrum
      spectrum:
        description: >-
          Harmonic spectrum assumed for this source
        range: string
        required: false
        annotations:
          order: 14

      # (15) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 15

      # (16) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 16

      # (17) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 17
