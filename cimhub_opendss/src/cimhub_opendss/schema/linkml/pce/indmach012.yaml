id: https://gridappsd.github.io/dss-graph/pce/indmach012
name: indmach012
title: OpenDSS Indmach012 Component Schema
description: >-
  LinkML schema for OpenDSS Indmach012 objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-25).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Indmach012:
    description: >-
      A Indmach012 object in OpenDSS.
    class_uri: dss:Indmach012
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true

      # (1) phases
      phases:
        description: >-
          Number of Phases, this Induction Machine
        range: integer
        required: false
        annotations:
          order: 1

      # (2) bus1
      bus1:
        description: >-
          Bus to which the Induction Machine is connected
        range: string
        required: false
        annotations:
          order: 2

      # (3) kv
      kv:
        description: >-
          Nominal rated (1
        range: float
        required: false
        annotations:
          order: 3

      # (4) kW
      kW:
        description: >-
          Shaft Power, kW, for the Induction Machine
        range: float
        required: false
        annotations:
          order: 4

      # (5) pf
      pf:
        description: >-
          [Read Only] Present power factor for the machine
        range: float
        required: false
        annotations:
          order: 5

      # (6) conn
      conn:
        description: >-
          Connection of stator: Delta or Wye
        range: string
        required: false
        annotations:
          order: 6

      # (7) kVA
      kVA:
        description: >-
          Rated kVA for the machine
        range: float
        required: false
        annotations:
          order: 7

      # (8) H
      H:
        description: >-
          Per unit mass constant of the machine
        range: float
        required: false
        annotations:
          order: 8

      # (9) D
      D:
        description: >-
          Damping constant
        range: float
        required: false
        annotations:
          order: 9

      # (10) puRs
      puRs:
        description: >-
          Per unit stator resistance
        range: float
        required: false
        annotations:
          order: 10

      # (11) puXs
      puXs:
        description: >-
          Per unit stator leakage reactance
        range: float
        required: false
        annotations:
          order: 11

      # (12) puRr
      puRr:
        description: >-
          Per unit rotor  resistance
        range: float
        required: false
        annotations:
          order: 12

      # (13) puXr
      puXr:
        description: >-
          Per unit rotor leakage reactance
        range: float
        required: false
        annotations:
          order: 13

      # (14) puXm
      puXm:
        description: >-
          Per unit magnetizing reactance
        range: float
        required: false
        annotations:
          order: 14

      # (15) Slip
      Slip:
        description: >-
          Initial slip value
        range: float
        required: false
        annotations:
          order: 15

      # (16) MaxSlip
      MaxSlip:
        description: >-
          Max slip value to allow
        range: float
        required: false
        annotations:
          order: 16

      # (17) SlipOption
      SlipOption:
        description: >-
          Option for slip model
        range: string
        required: false
        annotations:
          order: 17

      # (18) Yearly
      Yearly:
        description: >-
          LOADSHAPE object to use for yearly simulations
        range: string
        required: false
        annotations:
          order: 18

      # (19) Daily
      Daily:
        description: >-
          LOADSHAPE object to use for daily simulations
        range: string
        required: false
        annotations:
          order: 19

      # (20) Duty
      Duty:
        description: >-
          LOADSHAPE object to use for duty cycle simulations
        range: string
        required: false
        annotations:
          order: 20

      # (21) Debugtrace
      Debugtrace:
        description: >-
          [Yes | No*] Write DebugTrace file
        range: boolean
        required: false
        annotations:
          order: 21

      # (22) spectrum
      spectrum:
        description: >-
          Name of harmonic voltage or current spectrum for this IndMach012
        range: string
        required: false
        annotations:
          order: 22

      # (23) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 23

      # (24) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 24

      # (25) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 25
