id: https://gridappsd.github.io/dss-graph/pce/storage
name: storage
title: OpenDSS Storage Component Schema
description: >-
  LinkML schema for OpenDSS Storage objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-65).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Storage:
    description: >-
      A Storage object in OpenDSS representing a battery energy storage system
      with inverter-based grid connection.
    class_uri: dss:Storage
    close_mappings:
      - cim:PowerElectronicsConnection
      - cim:BatteryUnit
    comments:
      - >-
        Import: one Storage becomes a PowerElectronicsConnection and a BatteryUnit in
        storage.cimtbl; p is the engine's snapshot dispatch in the load sign. Export: the connection
        is chopped into one Storage per unit (exporter/storage.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.name; mRID = storage_ + name, lowercased;
            the unit is <mRID>_unit. Export: Names: the connection's for one unit, the unit's for
            several, <name>_<phase> per phase.

      # (1) phases
      phases:
        description: >-
          Number of Phases, this Storage element
        range: integer
        required: false
        annotations:
          order: 1
          dss_default: int(3)
        related_mappings:
          - cim:Terminal.phases
        comments:
          - >-
            Import: structural; the conductor count; default 3. Export: the phase conductors; a
            delta across two is 1.

      # (2) bus1
      bus1:
        description: >-
          Bus to which the Storage element is connected
        range: string
        required: false
        annotations:
          order: 2
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node and phases, by the shared phase rule. Export: bus_ref of the
            phase conductors; a wye inverter's neutral is node 0.

      # (3) kv
      kv:
        description: >-
          Nominal rated (1.0 per unit) voltage, kV, for Storage element.
          For 2- and 3-phase Storage, specify phase-phase kV. Otherwise,
          specify actual kV across each branch.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 3
          dss_default: float(12.47)
        close_mappings:
          - cim:PowerElectronicsConnection.ratedU
        comments:
          - >-
            Import: derived; ratedU (kV, LL) = kv, x sqrt 3 for 1-phase wye; default 12.47.
            Export: ratedU (kV, LL), / sqrt 3 for 1-phase wye.

      # (4) conn
      conn:
        description: >-
          ={wye|LN|delta|LL}
        range: string
        required: false
        annotations:
          order: 4
          dss_default: string(wye)
        close_mappings:
          - cim:PowerElectronicsConnection.phaseConnection
        comments:
          - >-
            Import: mapped to PowerElectronicsConnection.phaseConnection; wye -> Y, delta -> D;
            default wye. Export: phaseConnection Y/Yn -> wye, D -> delta; others raise.

      # (5) kW
      kW:
        description: >-
          Get/set the requested kW value. Positive = discharging (generating).
        range: float
        required: false
        annotations:
          order: 5
        close_mappings:
          - cim:PowerElectronicsConnection.p
        comments:
          - >-
            Import: derived; replayed in deck order (battery_dispatch): > 0 sets the
            discharge setpoint and discharging, < 0 the charge setpoint and charging, 0 waiting.
            Export: not written, %Discharge/%Charge carry the output: the engine makes kW a percent
            of the kWrated of the moment, and kWrated is written after kW.

      # (6) kvar
      kvar:
        description: >-
          Get/set the requested kvar value. Positive = capacitive (generator convention).
        range: float
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: structural; raises when nonzero; no deck in the sweep sets it (q = 0). Export:
            not written, q must be 0 (it raises on import); another raises.

      # (7) pf
      pf:
        description: >-
          Get/set the requested PF value. Default is 1.0.
        range: float
        required: false
        minimum_value: -1.0
        maximum_value: 1.0
        annotations:
          order: 7
          dss_default: float(1.0)
        comments:
          - >-
            Import: structural; 1 only; another raises (the engine caps q by a kvarMax left from the
            default kVA); default 1. Export: not written, q is 0.

      # (8) kVA
      kVA:
        description: >-
          Indicates the inverter nameplate capability (in kVA).
        range: float
        required: false
        annotations:
          order: 8
        exact_mappings:
          - cim:PowerElectronicsConnection.ratedS
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.ratedS (kVA); also caps p; default kWrated.
            Export: ratedS, the connection's, by the unit's share (inverter_pieces).

      # (9) %Cutin
      pct_Cutin:
        description: >-
          Cut-in power as a percentage of inverter kVA rating.
        range: float
        required: false
        annotations:
          order: 9
          dss_name: "%Cutin"
        comments:
          - >-
            Import: untranscribed; an inverter cut-in; 0 by default for storage. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (10) %Cutout
      pct_Cutout:
        description: >-
          Cut-out power as a percentage of inverter kVA rating.
        range: float
        required: false
        annotations:
          order: 10
          dss_name: "%Cutout"
        comments:
          - >-
            Import: untranscribed; an inverter cut-out; 0 by default for storage. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (11) EffCurve
      EffCurve:
        description: >-
          An XYCurve object, previously defined, that describes the PER UNIT
          efficiency vs PER UNIT of rated kVA for the inverter.
        range: string
        required: false
        annotations:
          order: 11
        todos:
          - "No CIM equivalent. Inverter efficiency curve; requires CIM extension or mapping to a custom XYCurve linked to the PEC."
        comments:
          - >-
            Import: structural; raises: an efficiency curve changes the snapshot power. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (12) VarFollowInverter
      VarFollowInverter:
        description: >-
          Boolean variable (Yes|No) or (True|False). When True, reactive power
          follows the inverter dispatch.
        range: boolean
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: untranscribed; acts only with an InvControl. Export: not written, untranscribed
            or raising on import; not in CIM.

      # (13) kvarMax
      kvarMax:
        description: >-
          Indicates the maximum reactive power GENERATION (un-signed, kvar)
          for the inverter.
        range: float
        required: false
        annotations:
          order: 13
        exact_mappings:
          - cim:PowerElectronicsConnection.maxQ
        comments:
          - >-
            Import: copied to PowerElectronicsConnection.maxQ (kVAr); default kVA. Export: maxQ, the
            connection's, by the unit's share (inverter_pieces); unset -> not written.

      # (14) kvarMaxAbs
      kvarMaxAbs:
        description: >-
          Indicates the maximum reactive power ABSORPTION (un-signed, kvar)
          for the inverter.
        range: float
        required: false
        annotations:
          order: 14
        close_mappings:
          - cim:PowerElectronicsConnection.minQ
        comments:
          - >-
            Import: derived; minQ (kVAr) = -kvarMaxAbs; default kVA. Export: -minQ, the
            connection's, by the unit's share (inverter_pieces); unset -> not written.

      # (15) WattPriority
      WattPriority:
        description: >-
          {Yes/No*/True/False} Set inverter to watt priority instead of the
          default var priority.
        range: boolean
        required: false
        annotations:
          order: 15
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (16) PFPriority
      PFPriority:
        description: >-
          If set to true, priority is given to power factor and WattPriority
          is neglected.
        range: boolean
        required: false
        annotations:
          order: 16
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (17) %PminNoVars
      pct_PminNoVars:
        description: >-
          Minimum active power as percentage of kWrated under which there is
          no vars production/absorption.
        range: float
        required: false
        annotations:
          order: 17
          dss_name: "%PminNoVars"
        comments:
          - >-
            Import: structural; raises when nonzero; no deck in the sweep sets it. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (18) %PminkvarMax
      pct_PminkvarMax:
        description: >-
          Minimum active power as percentage of kWrated that allows the
          inverter to produce/absorb reactive power up to its maximum reactive
          power.
        range: float
        required: false
        annotations:
          order: 18
          dss_name: "%PminkvarMax"
        comments:
          - >-
            Import: structural; raises when nonzero; no deck in the sweep sets it. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (19) kWrated
      kWrated:
        description: >-
          kW rating of power output. Rated maximum active power.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 19
          dss_default: float(25.0)
        close_mappings:
          - cim:PowerElectronicsUnit.maxP
        comments:
          - >-
            Import: copied to BatteryUnit.maxP (kW); minP = -kWrated; also p by State; default 25.
            Export: the unit's maxP (kW), x 1/n for one of n phases; unset raises, a minP other than
            -maxP raises.

      # (20) %kWrated
      pct_kWrated:
        description: >-
          Upper limit on active power as a percentage of kWrated.
        range: float
        required: false
        annotations:
          order: 20
          dss_name: "%kWrated"
        comments:
          - >-
            Import: untranscribed; the kW limit of the dispatch modes, which raise. Export: not
            written, untranscribed or raising on import; not in CIM.

      # (21) kWhrated
      kWhrated:
        description: >-
          Rated Storage capacity in kWh.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 21
          dss_default: float(50.0)
        exact_mappings:
          - cim:BatteryUnit.ratedE
        comments:
          - >-
            Import: copied to BatteryUnit.ratedE (kWh); default 50. Export: ratedE (kWh), x 1/n for
            one of n phases; unset -> not written.

      # (22) kWhstored
      kWhstored:
        description: >-
          Present amount of energy stored, kWh.
        range: float
        required: false
        annotations:
          order: 22
        exact_mappings:
          - cim:BatteryUnit.storedE
        comments:
          - >-
            Import: copied to BatteryUnit.storedE (kWh); unless %stored was assigned after it (the
            last wins). Export: storedE (kWh), x 1/n for one of n phases; unset -> not written.

      # (23) %stored
      pct_stored:
        description: >-
          Present amount of energy stored, % of rated kWh.
        range: float
        required: false
        annotations:
          order: 23
          dss_default: float(100.0)
          dss_name: "%stored"
        close_mappings:
          - cim:BatteryUnit.storedE
        comments:
          - >-
            Import: derived; storedE (kWh) = %stored x kWhrated / 100 unless kWhstored was assigned
            after it; default 100. Export: not written, kWhstored carries the energy.

      # (24) %reserve
      pct_reserve:
        description: >-
          Percentage of rated kWh Storage capacity to be held in reserve for
          normal operation.
        range: float
        required: false
        annotations:
          order: 24
          dss_default: float(20.0)
          dss_name: "%reserve"
        close_mappings:
          - cim:BatteryUnit.minimumE
        comments:
          - >-
            Import: derived; minimumE (kWh) = %reserve x kWhrated / 100; default 20. Export:
            minimumE / ratedE x 100; either unset -> not written.

      # (25) State
      State:
        description: >-
          {idling | charging | discharging}  Get/Set present operational state.
        range: string
        required: false
        annotations:
          order: 25
          dss_default: string(idling)
        close_mappings:
          - cim:BatteryUnit.batteryState
        comments:
          - >-
            Import: mapped to BatteryUnit.batteryState; charging, discharging, idling -> waiting (by
            the first letter, as the engine reads it: the decks' charge). Export: batteryState
            charging, discharging, waiting -> charging, discharging, idling; others raise, and so
            does an output of the wrong sign.

      # (26) %Discharge
      pct_Discharge:
        description: >-
          Discharge rate (output power) in percentage of rated kW.
        range: float
        required: false
        annotations:
          order: 26
          dss_default: float(100.0)
          dss_name: "%Discharge"
        close_mappings:
          - cim:PowerElectronicsConnection.p
        comments:
          - >-
            Import: derived; the discharge setpoint kWrated x %Discharge / 100 until a kW > 0 sets
            it; default 100. Export: discharging: the unit's output / kWrated x 100.

      # (27) %Charge
      pct_Charge:
        description: >-
          Charging rate (input power) in percentage of rated kW.
        range: float
        required: false
        annotations:
          order: 27
          dss_default: float(100.0)
          dss_name: "%Charge"
        close_mappings:
          - cim:PowerElectronicsConnection.p
        comments:
          - >-
            Import: derived; the charge setpoint kWrated x %Charge / 100 until a kW < 0 sets it;
            default 100. Export: charging: -(the unit's output) / kWrated x 100.

      # (28) %EffCharge
      pct_EffCharge:
        description: >-
          Percentage efficiency for CHARGING the Storage element.
        range: float
        required: false
        annotations:
          order: 28
          dss_default: float(90.0)
          dss_name: "%EffCharge"
        exact_mappings:
          - cim:BatteryUnit.chargingEfficiency
        comments:
          - >-
            Import: copied to BatteryUnit.chargingEfficiency (percent); default 90. Export:
            chargingEfficiency (percent); unset -> not written.

      # (29) %EffDischarge
      pct_EffDischarge:
        description: >-
          Percentage efficiency for DISCHARGING the Storage element.
        range: float
        required: false
        annotations:
          order: 29
          dss_default: float(90.0)
          dss_name: "%EffDischarge"
        exact_mappings:
          - cim:BatteryUnit.dischargingEfficiency
        comments:
          - >-
            Import: copied to BatteryUnit.dischargingEfficiency (percent); default 90. Export:
            dischargingEfficiency (percent); unset -> not written.

      # (30) %IdlingkW
      pct_IdlingkW:
        description: >-
          Percentage of rated kW consumed by idling losses.
        range: float
        required: false
        annotations:
          order: 30
          dss_default: float(1.0)
          dss_name: "%IdlingkW"
        close_mappings:
          - cim:BatteryUnit.idlingP
        comments:
          - >-
            Import: derived; idlingP (kW) = %IdlingkW x kWrated / 100, also p when waiting; default
            1. Export: idlingP / kWrated x 100; waiting: its p (which idlingP, when set, must be).

      # (31) %Idlingkvar
      pct_Idlingkvar:
        description: >-
          Deprecated.
        range: float
        required: false
        annotations:
          order: 31
          dss_name: "%Idlingkvar"
        comments:
          - >-
            Import: untranscribed; deprecated in the engine. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (32) %R
      pct_R:
        description: >-
          Equivalent percentage internal resistance, ohms.
        range: float
        required: false
        annotations:
          order: 32
          dss_name: "%R"
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (33) %X
      pct_X:
        description: >-
          Equivalent percentage internal reactance, ohms.
        range: float
        required: false
        annotations:
          order: 33
          dss_name: "%X"
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (34) model
      model:
        description: >-
          Integer code (default=1) for the model to be used for power output
          variation with voltage.
        range: integer
        required: false
        annotations:
          order: 34
          dss_default: int(1)
        comments:
          - >-
            Import: structural; 1 (constant P, PF) only; any other raises; default 1. Export: not
            written, model 1, the engine's default; others raise on import.

      # (35) Vminpu
      Vminpu:
        description: >-
          Minimum per unit voltage. Default = 0.9.
        range: float
        required: false
        annotations:
          order: 35
          dss_default: float(0.9)
        close_mappings:
          - cim:PowerElectronicsConnection.maxIFault
        comments:
          - >-
            Import: derived; maxIFault = 1 / Vminpu (the engine's CIM export); default 0.9. Export:
            1 / maxIFault (the importer's rule inverted); unset -> not written.

      # (36) Vmaxpu
      Vmaxpu:
        description: >-
          Maximum per unit voltage. Default = 1.1.
        range: float
        required: false
        annotations:
          order: 36
          dss_default: float(1.1)
        comments:
          - >-
            Import: untranscribed; above it the engine models the battery as constant Z; a
            power-flow setting. Export: not written, untranscribed or raising on import; not in CIM.

      # (37) Balanced
      Balanced:
        description: >-
          {Yes | No*} Default is No. If true, force balanced operation.
        range: boolean
        required: false
        annotations:
          order: 37
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (38) LimitCurrent
      LimitCurrent:
        description: >-
          Limits current magnitude to Vminpu value for both 1-phase and
          3-phase Storage similar to Generator Model 7.
        range: boolean
        required: false
        annotations:
          order: 38
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (39) yearly
      yearly:
        description: >-
          Dispatch shape to use for yearly simulations. LoadShape name.
        range: string
        required: false
        annotations:
          order: 39
        close_mappings:
          - cim:EnergyConnectionSchedule
        comments:
          - >-
            Import: mapped to EnergyConnectionSchedule.name; DispMode=follow: the battery's
            EnergyConnectionSchedule <mRID>_yearly, mult x kWrated per sample. Export: the
            connection's EnergyConnectionSchedule as a LoadShape, mult = output / kWrated.
        todos:
          - "Loadshape converter not yet implemented."

      # (40) daily
      daily:
        description: >-
          Dispatch shape to use for daily simulations. LoadShape name.
        range: string
        required: false
        annotations:
          order: 40
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Loadshape converter not yet implemented."

      # (41) duty
      duty:
        description: >-
          Load shape to use for duty cycle dispatch simulations.
        range: integer
        required: false
        annotations:
          order: 41
        comments:
          - >-
            Import: untranscribed; a time-series curve; a snapshot does not use it. Export:
            not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Loadshape converter not yet implemented."

      # (42) DispMode
      DispMode:
        description: >-
          {DEFAULT | FOLLOW | EXTERNAL | LOADLEVEL | PRICE } Default = "DEFAULT".
          Dispatch mode for the storage element.
        range: string
        required: false
        annotations:
          order: 42
          dss_default: string(default)
        comments:
          - >-
            Import: structural; default, or follow with a yearly shape. Export: rule, follow
            with a yearly shape, else not written.

      # (43) DischargeTrigger
      DischargeTrigger:
        description: >-
          Dispatch trigger value for discharging the Storage.
        range: string
        required: false
        annotations:
          order: 43
        comments:
          - >-
            Import: untranscribed; acts only in a dispatch mode, which raises. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (44) ChargeTrigger
      ChargeTrigger:
        description: >-
          Dispatch trigger value for charging the Storage.
        range: string
        required: false
        annotations:
          order: 44
        comments:
          - >-
            Import: untranscribed; acts only in a dispatch mode, which raises. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (45) TimeChargeTrig
      TimeChargeTrig:
        description: >-
          Time of day in fractional hours (0230 = 2.5) at which storage
          element will automatically go into charge state.
        range: string
        required: false
        annotations:
          order: 45
        comments:
          - >-
            Import: untranscribed; acts only in a dispatch mode, which raises. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (46) class
      class_class:
        description: >-
          An arbitrary integer number representing the class of Storage element.
        range: integer
        required: false
        annotations:
          order: 46
          dss_name: "class"
        comments:
          - >-
            Import: untranscribed; a DSS report grouping. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (47) DynaDLL
      DynaDLL:
        description: >-
          Name of DLL containing user-written dynamics model for Dynamics-mode
          simulations.
        range: string
        required: false
        annotations:
          order: 47
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (48) DynaData
      DynaData:
        description: >-
          String that gets passed to the user-written dynamics model Edit function.
        range: string
        required: false
        annotations:
          order: 48
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (49) UserModel
      UserModel:
        description: >-
          Name of DLL containing user-written model for both power flow and
          dynamics.
        range: string
        required: false
        annotations:
          order: 49
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (50) UserData
      UserData:
        description: >-
          String that gets passed to user-written model for defining the data
          required for that model.
        range: string
        required: false
        annotations:
          order: 50
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (51) debugtrace
      debugtrace:
        description: >-
          {Yes | No }  Default is no. If true, writes debug trace to a file.
        range: boolean
        required: false
        annotations:
          order: 51
        comments:
          - >-
            Import: untranscribed; a DSS debugging switch. Export: not written, untranscribed or
            raising on import; not in CIM.

      # (52) kVDC
      kVDC:
        description: >-
          Indicates the rated voltage (kV) at the input of the inverter while
          the storage is discharging.
        range: float
        required: false
        annotations:
          order: 52
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (53) Kp
      Kp:
        description: >-
          It is the proportional gain for the PI controller within the inverter.
        range: string
        required: false
        annotations:
          order: 53
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (54) PITol
      PITol:
        description: >-
          It is the tolerance (%) for the closed loop controller of the inverter.
        range: string
        required: false
        annotations:
          order: 54
        comments:
          - >-
            Import: untranscribed; a dynamics setting; no home in the network profile parts. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (55) SafeVoltage
      SafeVoltage:
        description: >-
