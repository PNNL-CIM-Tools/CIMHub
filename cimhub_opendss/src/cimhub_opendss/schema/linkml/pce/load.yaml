id: https://gridappsd.github.io/dss-graph/pce/load
name: load
title: OpenDSS Load Component Schema
description: >-
  LinkML schema for OpenDSS Load objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-42).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Load:
    description: >-
      A Load object in OpenDSS representing an energy consumer connected
      to a bus in the distribution system.
    class_uri: dss:Load
    exact_mappings:
      - cim:EnergyConsumer
    close_mappings:
      - cim:ConformLoad
    comments:
      - >-
        Import: one EnergyConsumer ld_ + name (load.cimtbl), or a ConformLoad of
        its yearly shape's LoadGroup. Export: one Load per EnergyConsumer (also
        ConformLoad, NonConformLoad, StationSupply), or one per phase when the
        phases differ.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: EnergyConsumer.name, mRID = ld_ + name, lowercased. Export:
            Names; one load per phase is <name>_<phase>.

      # (1) phases
      phases:
        description: >-
          Number of Phases, this load. Load is evenly divided among phases.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        annotations:
          order: 1
          dss_default: int(3)
        comments:
          - >-
            Import: structural; the conductor count, default 3. Export: the
            phase conductors; a delta across two is 1.

      # (2) bus1
      bus1:
        description: >-
          Bus to which the load is connected. May include specific node
          specification.
        range: string
        required: true
        annotations:
          order: 2
        close_mappings:
          - cim:Terminal.ConnectivityNode
          - cim:Terminal.phases
        comments:
          - >-
            Import: the node and phases of the consumer (node 1/2/3 = A/B/C,
            s1/s2 on a split-phase island). Export: bus_ref of the phase
            conductors; a wye's neutral is node 0, so it must be grounded.

      # (3) kV
      kV:
        description: >-
          Nominal rated (1.0 per unit) voltage, kV, for load. For 2- and
          3-phase loads, specify phase-phase kV. Otherwise, specify actual
          kV across each branch of the load. If wye (star), specify
          phase-neutral kV. If delta or phase-phase connected, specify
          phase-phase kV.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 3
          dss_default: float(12.47)
        related_mappings:
          - cim:ConductingEquipment.BaseVoltage
        comments:
          - >-
            Import: checked, not written; it must be within 1 % of the bus's
            phase voltage, else it raises. Export: the BaseVoltage, LL for delta
            and 2-3 phases, LN for 1-phase wye.

      # (4) kW
      kW:
        description: >-
          Total base kW for the load. Normally, you would enter the maximum
          kW for the load for the first year and allow it to be adjusted by
          the load shapes, growth shapes, and global load multiplier.
        range: float
        required: false
        annotations:
          order: 4
          dss_default: float(10.0)
        exact_mappings:
          - cim:EnergyConsumer.p
        comments:
          - >-
            Import: p (kW). Export: p (kW) of get_phase_loads; per phase when
            the phases differ.

      # (5) pf
      pf:
        description: >-
          Load power factor. Enter negative for leading power factor (when
          kW and kvar have opposite signs).
        range: float
        required: false
        minimum_value: -1.0
        maximum_value: 1.0
        annotations:
          order: 5
          dss_default: float(0.88)
        close_mappings:
          - cim:EnergyConsumer.q
        comments:
          - >-
            Import: derived; with kW or kVA assigned last of kW, kvar and kVA,
            q = kW x tan(acos abs(pf)) with the sign of pf; pf never changes
            which pair the engine uses; default 0.88. Export: not written;
            kvar carries q.

      # (6) model
      model:
        description: >-
          Integer code for the model to use for load variation with voltage.
          1=Constant P+jQ (default), 2=Constant Z, 3=Const P Quadratic Q,
          4=Nominal Linear P Quadratic Q (CVR), 5=Constant I, 6=Const P
          Fixed Q, 7=Const P Fixed Impedance Q, 8=ZIPV.
        range: LoadModel
        required: false
        annotations:
          order: 6
          dss_default: int(1)
          dss_valid_values: "1,2,3,4,5,6,7,8"
        close_mappings:
          - cim:EnergyConsumer.LoadResponse
        comments:
          - >-
            Import: 1 -> zip_constant_pq, 2 -> zip_constant_z, 5 ->
            zip_constant_i, 4 -> an exp_<CVRwatts>_<CVRvars>
            LoadResponseCharacteristic; 3, 6, 7, 8 raise; default 1. Export: a
            pure ZIP gives 1, 2 or 5, an exponential 4; a mix raises.

      # (7) yearly
      yearly:
        description: >-
          LOADSHAPE object name for yearly simulations. Must be previously
          defined as a Loadshape object.
        range: string
        required: false
        annotations:
          order: 7
        todos:
          - "Loadshape converter not yet implemented. DSS LoadShape name should map to a CIM SeasonDayTypeSchedule or RegularIntervalSchedule linked to EnergyConsumer via LoadGroup."
        close_mappings:
          - cim:ConformLoad.LoadGroup
        comments:
          - >-
            Import: the load becomes a ConformLoad of the group lg_<shape>; a
            shape the deck does not define raises. Export: a ConformLoad's group
            schedule that is a LoadShape.

      # (8) daily
      daily:
        description: >-
          LOADSHAPE object name for daily simulations. Must be previously
          defined as a Loadshape object of 24 hrs, typically.
        range: string
        required: false
        annotations:
          order: 8
        todos:
          - "Loadshape converter not yet implemented. DSS LoadShape name should map to a CIM SeasonDayTypeSchedule or RegularIntervalSchedule linked to EnergyConsumer via LoadGroup."
        comments:
          - >-
            Import: untranscribed; a ConformLoad has one LoadGroup, its yearly
            shape's. Export: unset.

      # (9) duty
      duty:
        description: >-
          LOADSHAPE object name for duty cycle simulations. Must be
          previously defined as a Loadshape object. Typically would have
          time intervals less than 1 hr.
        range: string
        required: false
        annotations:
          order: 9
        todos:
          - "Loadshape converter not yet implemented. DSS LoadShape name should map to a CIM SeasonDayTypeSchedule or RegularIntervalSchedule linked to EnergyConsumer via LoadGroup."
        comments:
          - >-
            Import: untranscribed; a ConformLoad has one LoadGroup, its yearly
            shape's. Export: unset.

      # (10) growth
      growth:
        description: >-
          Growthshape object name to use for growth factors by years. Must
          be previously defined as a Growthshape object. Defaults to circuit
          default growth factor.
        range: string
        required: false
        annotations:
          order: 10
        todos:
          - "GrowthShape converter not yet implemented. DSS GrowthShape name should reference a CIM GrowthShape object."
        comments:
          - >-
            Import: untranscribed (a GrowthShape reference). Export: unset.

      # (11) conn
      conn:
        description: >-
          Connection type. Default is wye.
        range: ConnectionType
        required: false
        annotations:
          order: 11
          dss_default: string(wye)
        close_mappings:
          - cim:EnergyConsumer.phaseConnection
          - cim:EnergyConsumer.grounded
        comments:
          - >-
            Import: wye -> Y, grounded; delta -> D, not grounded; default wye.
            Export: Y/Yn -> wye, D -> delta; others raise.

      # (12) kvar
      kvar:
        description: >-
          Base kvar for specifying load as kW & kvar. Assumes kW has been
          already defined. Alternative to specifying the power factor.
        range: float
        required: false
        annotations:
          order: 12
        exact_mappings:
          - cim:EnergyConsumer.q
        comments:
          - >-
            Import: q (kVAr) when kvar is assigned last of kW, kvar and kVA,
            with kW as the engine holds it; the deck is replayed command by
            command. Export: q (kVAr) of get_phase_loads; per phase when the
            phases differ.

      # (13) Rneut
      Rneut:
        description: >-
          Neutral resistance of wye-connected load in actual ohms. Default
          is -1. If entered as negative, the neutral can be open or floating.
        range: float
        required: false
        annotations:
          order: 13
          dss_default: float(-1.0)
        todos:
          - "No CIM equivalent. Requires CIM extension (e.g. custom attribute on EnergyConsumer or dedicated NeutralImpedance class) to round-trip."
        comments:
          - >-
            Import: raises when >= 0 (a wye neutral impedance); no deck in the
            sweep sets it. Export: unset.

      # (14) Xneut
      Xneut:
        description: >-
          Neutral reactance of wye-connected load in actual ohms. May be
          positive or negative.
        range: float
        required: false
        annotations:
          order: 14
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Requires CIM extension alongside Rneut."
        comments:
          - >-
            Import: raises when set; no deck in the sweep sets it. Export:
            unset.

      # (15) status
      status:
        description: >-
          Load status. Variable=all multipliers apply, Fixed=no load
          multipliers (growth still applies), Exempt=not modified by
          global load multiplier.
        range: LoadStatus
        required: false
        annotations:
          order: 15
        todos:
          - "No CIM equivalent for load multiplier status flags. Requires CIM extension."
        comments:
          - >-
            Import: untranscribed (Fixed/Exempt, whether load multipliers scale
            it; DSS solution control; no home in the network profile parts).
            Export: unset.

      # (16) class
      load_class:
        description: >-
          An arbitrary integer number representing the class of load so
          that load values may be segregated by load value. Default is 1;
          not used internally.
        range: integer
        required: false
        annotations:
          order: 16
          dss_name: class
          dss_default: int(1)
        todos:
          - "No CIM equivalent. Could potentially map to a PSRType classification but no standard CIM field exists."
        comments:
          - >-
            Import: untranscribed (a DSS report grouping). Export: unset.

      # (17) Vminpu
      Vminpu:
        description: >-
          Minimum per unit voltage for which the MODEL is assumed to apply.
          Lower end of normal voltage range. Default is 0.95.
        range: float
        required: false
        annotations:
          order: 17
          dss_default: float(0.95)
        todos:
          - "No CIM equivalent. Requires CIM extension for per-unit voltage model applicability bounds."
        comments:
          - >-
            Import: untranscribed (below it the engine models the load as
            constant Z; DSS solution control; no home in the network profile
            parts). Export: unset.

      # (18) Vmaxpu
      Vmaxpu:
        description: >-
          Maximum per unit voltage for which the MODEL is assumed to apply.
          Default is 1.05.
        range: float
        required: false
        annotations:
          order: 18
          dss_default: float(1.05)
        todos:
          - "No CIM equivalent. Requires CIM extension alongside Vminpu."
        comments:
          - >-
            Import: untranscribed (above it the engine models the load as
            constant Z; DSS solution control; no home in the network profile
            parts). Export: unset.

      # (19) Vminnorm
      Vminnorm:
        description: >-
          Minimum per unit voltage for load EEN evaluations, Normal limit.
          Default is 0, which defaults to system vminnorm property.
        range: float
        required: false
        annotations:
          order: 19
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Requires CIM extension for normal-range voltage limit on loads."
        comments:
          - >-
            Import: untranscribed (an EnergyMeter UE threshold; DSS solution
            control; no home in the network profile parts). Export: unset.

      # (20) Vminemerg
      Vminemerg:
        description: >-
          Minimum per unit voltage for load UE evaluations, Emergency limit.
          Default is 0, which defaults to system vminemerg property.
        range: float
        required: false
        annotations:
          order: 20
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Requires CIM extension for emergency-range voltage limit on loads."
        comments:
          - >-
            Import: untranscribed (an EnergyMeter EEN threshold; DSS solution
            control; no home in the network profile parts). Export: unset.

      # (21) xfkVA
      xfkVA:
        description: >-
          Rated kVA of service transformer for allocating loads based on
          connected kVA at a bus. Default is 0.0.
        range: float
        required: false
        annotations:
          order: 21
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Load allocation metadata; requires CIM extension."
        comments:
          - >-
            Import: raises when set; with kW the engine takes whichever comes
            last, and the record keeps no order. Export: not written; kW carries
            p.

      # (22) allocationfactor
      allocationfactor:
        description: >-
          Allocation factor for allocating loads based on connected kVA at
          a bus. Default is 0.5.
        range: float
        required: false
        annotations:
          order: 22
          dss_default: float(0.5)
        todos:
          - "No CIM equivalent. Load allocation metadata; requires CIM extension alongside xfkVA."
        comments:
          - >-
            Import: raises when set; it scales xfkVA. Export: not written; kW
            carries p.

      # (23) kVA
      kVA:
        description: >-
          Specify base Load in kVA (and power factor).
        range: float
        required: false
        annotations:
          order: 23
        close_mappings:
          - cim:EnergyConsumer.p
          - cim:EnergyConsumer.q
        comments:
          - >-
            Import: derived; when kVA is assigned last of kW, kvar and kVA,
            p = kVA x abs(pf) and q = kVA x sin(acos abs(pf)) with the sign of
            pf as the engine holds it; the deck is replayed command by
            command. Export: not written; kW and kvar carry the power.

      # (24) %mean
      pct_mean:
        description: >-
          Percent mean value for load to use for monte carlo studies if no
          loadshape is assigned to this load. Default is 50.
        range: float
        required: false
        annotations:
          order: 24
          dss_name: "%mean"
          dss_default: float(50.0)
        todos:
          - "No CIM equivalent. Monte Carlo study metadata; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (a Monte Carlo setting; DSS solution control).
            Export: unset.

      # (25) %stddev
      pct_stddev:
        description: >-
          Percent Std deviation value for load to use for monte carlo
          studies if no loadshape is assigned to this load. Default is 10.
        range: float
        required: false
        annotations:
          order: 25
          dss_name: "%stddev"
          dss_default: float(10.0)
        todos:
          - "No CIM equivalent. Monte Carlo study metadata; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (a Monte Carlo setting; DSS solution control).
            Export: unset.

      # (26) CVRwatts
      CVRwatts:
        description: >-
          Percent reduction in active power per 1% reduction in voltage
          from 100% rated. Default is 1. Applies to Model=4 only.
        range: float
        required: false
        annotations:
          order: 26
          dss_default: float(1.0)
        exact_mappings:
          - cim:LoadResponseCharacteristic.pVoltageExponent
        comments:
          - >-
            Import: model 4 only; the exp_ row's pVoltageExponent; default 1.
            Export: pVoltageExponent, model 4 only.

      # (27) CVRvars
      CVRvars:
        description: >-
          Percent reduction in reactive power per 1% reduction in voltage
          from 100% rated. Default is 2. Applies to Model=4 only.
        range: float
        required: false
        annotations:
          order: 27
          dss_default: float(2.0)
        exact_mappings:
          - cim:LoadResponseCharacteristic.qVoltageExponent
        comments:
          - >-
            Import: model 4 only; the exp_ row's qVoltageExponent; default 2.
            Export: qVoltageExponent, model 4 only.

      # (28) kwh
      kwh:
        description: >-
          kWh billed for this period. Default is 0.
        range: float
        required: false
        annotations:
          order: 28
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Billing energy metadata; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (sizes the load only in the AllocateLoads
            command). Export: unset.

      # (29) kwhdays
      kwhdays:
        description: >-
          Length of kWh billing period in days (24 hr days). Default is 30.
        range: float
        required: false
        annotations:
          order: 29
          dss_default: float(30.0)
        todos:
          - "No CIM equivalent. Billing period metadata; requires CIM extension alongside kwh."
        comments:
          - >-
            Import: untranscribed (sizes the load only in the AllocateLoads
            command). Export: unset.

      # (30) Cfactor
      Cfactor:
        description: >-
          Factor relating average kW to peak kW. Default is 4.0.
        range: float
        required: false
        annotations:
          order: 30
          dss_default: float(4.0)
        todos:
          - "No CIM equivalent. Load factor metadata; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (sizes the load only in the AllocateLoads
            command). Export: unset.

      # (31) CVRcurve
      CVRcurve:
        description: >-
          Curve describing both watt and var factors as a function of time.
          Refers to a LoadShape object with both Mult and Qmult defined.
          Default is NONE.
        range: string
        required: false
        annotations:
          order: 31
        todos:
          - "Loadshape converter not yet implemented. CVRcurve LoadShape reference should map to a CIM schedule linked via LoadResponseCharacteristic."
        comments:
          - >-
            Import: untranscribed (a LoadShape reference; not mapped). Export:
            unset.

      # (32) NumCust
      NumCust:
        description: >-
          Number of customers, this load. Default is 1.
        range: integer
        required: false
        annotations:
          order: 32
          dss_default: int(1)
        exact_mappings:
          - cim:EnergyConsumer.customerCount
        comments:
          - >-
            Import: customerCount; default 1. Export: customerCount; per phase
            on the first load, 0 on the others.

      # (33) ZIPV
      ZIPV:
        description: >-
          Array of 7 coefficients for ZIP load model. First 3 are ZIP
          weighting factors for real power (should sum to 1). Next 3 are
          ZIP weighting factors for reactive power (should sum to 1).
          Last 1 is cut-off voltage in p.u. of base kV.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 33
        comments:
          - >-
            Import: untranscribed; used only by model 8, which raises. Export:
            not written; model 8 raises.

      # (34) %SeriesRL
      pct_SeriesRL:
        description: >-
          Percent of load that is series R-L for Harmonic studies. Default
          is 50. Remainder is assumed to be parallel R and L.
        range: float
        required: false
        annotations:
          order: 34
          dss_name: "%SeriesRL"
          dss_default: float(50.0)
        todos:
          - "No CIM equivalent. Harmonic study circuit decomposition; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (harmonics model; no home in the network
            profile parts). Export: unset.

      # (35) RelWeight
      RelWeight:
        description: >-
          Relative weighting factor for reliability calcs. Default is 1.
          Used to designate high priority loads such as hospitals.
        range: float
        required: false
        annotations:
          order: 35
          dss_default: float(1.0)
        todos:
          - "No CIM equivalent. Reliability priority weighting; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (a reliability weighting). Export: unset.

      # (36) Vlowpu
      Vlowpu:
        description: >-
          Per unit voltage at which the model switches to constant Z model
          (model=2). Default is 0.50.
        range: float
        required: false
        annotations:
          order: 36
          dss_default: float(0.50)
        todos:
          - "No CIM equivalent. Voltage-dependent model switching threshold; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (below it the engine models the load as open;
            DSS solution control; no home in the network profile parts). Export:
            unset.

      # (37) puXharm
      puXharm:
        description: >-
          Special reactance, pu (based on kVA, kV properties), for the
          series impedance branch in the load model for HARMONICS analysis.
          Default is 0.
        range: float
        required: false
        annotations:
          order: 37
          dss_default: float(0.0)
        todos:
          - "No CIM equivalent. Harmonic-mode series reactance; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (harmonics model; no home in the network
            profile parts). Export: unset.

      # (38) XRharm
      XRharm:
        description: >-
          X/R ratio of the special harmonics mode reactance specified by
          the puXHARM property at fundamental frequency. Default is 6.
        range: float
        required: false
        annotations:
          order: 38
          dss_default: float(6.0)
        todos:
          - "No CIM equivalent. Harmonic-mode X/R ratio; requires CIM extension alongside puXharm."
        comments:
          - >-
            Import: untranscribed (harmonics model; no home in the network
            profile parts). Export: unset.

      # (39) spectrum
      spectrum:
        description: >-
          Name of harmonic current spectrum for this load. Default is
          "defaultload".
        range: string
        required: false
        annotations:
          order: 39
          dss_default: string(defaultload)
        todos:
          - "No CIM equivalent. Harmonic current spectrum reference; requires CIM extension."
        comments:
          - >-
            Import: untranscribed (harmonics model; no home in the network
            profile parts). Export: unset.

      # (40) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 40
        todos:
          - "Not stored on CIM EnergyConsumer. Base frequency should be extracted from the CIM BaseVoltage or circuit-level object. Converter must derive this from circuit context."
        comments:
          - >-
            Import: untranscribed (no home on a load). Export: unset.

      # (41) enabled
      enabled:
        description: >-
          Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 41
          dss_default: "true"
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: normallyInService; default true. Export:
            get_in_service(which='normal'); unset -> not written.

      # (42) like
      like:
        description: >-
          Make like another object, e.g.: New Load.L2 like=L1 ...
        range: string
        required: false
        annotations:
          order: 42
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.

# Enums are imported from common_enums.yaml
