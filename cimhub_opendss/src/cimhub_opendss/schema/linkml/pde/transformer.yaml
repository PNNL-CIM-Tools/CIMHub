id: https://gridappsd.github.io/dss-graph/pde/transformer
name: transformer
title: OpenDSS Transformer Component Schema
description: >-
  LinkML schema for OpenDSS Transformer objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-57).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Transformer:
    description: >-
      A Transformer object in OpenDSS representing a multi-winding transformer
      connecting two or more buses in the distribution system.
    class_uri: dss:Transformer
    exact_mappings:
      - cim:PowerTransformer
    close_mappings:
      - cim:VoltageRegulator
      - cim:TransformerTank
    comments:
      - >-
        Import: every Transformer is a PowerTransformer (transformer.cimtbl,
        mRID xf_ + name) with one PowerTransformerEnd per distinct bus. A
        1-phase one adds a TransformerTank, TransformerPhaseEnds and a
        TransformerWinding per winding; one a RegControl names with equal
        winding kV is a VoltageRegulator (AutoTransformerEnds); an XfmrCode
        instance gets a tank on the code's TransformerTankConfiguration. Export:
        one Transformer per unit (a PowerTransformer, each tank of a
        several-tank one, an AutoTransformer).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: PowerTransformer.name, mRID = xf_ + name, lowercased.
            Export: Names; a one-unit transformer by itself, each tank of
            several by the tank.

      # (1) phases
      phases:
        description: >-
          Number of phases this transformer. Default is 3.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        annotations:
          order: 1
          dss_default: int(3)
        comments:
          - >-
            Import: structural; 1 = phase ends and windings, 3 = balanced ends,
            others raise; default 3 (row comment). Export: 3 when every winding
            has A, B, C, else 1 (a coil).

      # (2) windings
      windings:
        description: >-
          Number of windings, this transformers. Also is the number of
          terminals. Default is 2. This property triggers memory allocation for
          the Transformer and will cause other properties to revert to default
          values.
        range: integer
        required: false
        minimum_value: 2
        annotations:
          order: 2
          dss_default: int(2)
        comments:
          - >-
            Import: structural; 2 or 3, and it must match the buses; one end per
            distinct bus. Export: the number of windings of the unit.

      # (3) wdg
      wdg:
        description: >-
          Set this to the number of the winding you wish to define. Then set
          the values for this winding. Repeat for each winding.
        range: integer
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: structural; the winding Rneut/Xneut belong to (the reader's
            tag), none = the last. Export: the one winding grounded through
            rground/xground.

      # (4) bus
      bus:
        description: >-
          Bus connection spec for this winding.
        range: string
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (buses), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (5) conn
      conn:
        description: >-
          Connection of this winding. Default is wye with the neutral solidly
          grounded.
        range: ConnectionType
        required: false
        annotations:
          order: 5
          dss_default: string(wye)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (conns), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (6) kV
      kV:
        description: >-
          For 2-or 3-phase, enter phase-phase kV rating. Otherwise, kV rating
          of the actual winding.
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(12.47)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (kVs), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (7) kVA
      kVA:
        description: >-
          Base kVA rating of the winding. Side effect: forces change of max
          normal and emerg kVA ratings.
        range: float
        required: false
        annotations:
          order: 7
          dss_default: float(1000.0)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (kVAs), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (8) tap
      tap:
        description: >-
          Per unit tap that this winding is on.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(1.0)
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (taps), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (9) %R
      pct_R:
        description: >-
          Percent resistance this winding. Half of total for a 2-winding.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 9
          dss_default: float(0.2)
          dss_name: "%R"
        comments:
          - >-
            Import: structural; the reader folds wdg= blocks into the array form
            (pct_Rs), and a bare value raises. Export: not written; the arrays
            carry every winding.

      # (10) Rneut
      Rneut:
        description: >-
          Neutral resistance of wye (star)-connected winding in actual ohms.
          Default is -1. If entered as negative, the neutral is assumed to be
          open or floating.
        range: float
        required: false
        annotations:
          order: 10
          dss_default: float(-1.0)
        exact_mappings:
          - cim:TransformerEnd.rground
        comments:
          - >-
            Import: PowerTransformerEnd.rground (ohm) of winding wdg, else the
            last, when >= 0 on a 3-phase transformer (negative = none); >= 0 on
            a 1-phase transformer raises, and so does a second winding's (the
            reader). Export: rground
            (ohm) of the grounded winding, its neutral on node 4.

      # (11) Xneut
      Xneut:
        description: >-
          Neutral reactance of wye(star)-connected winding in actual ohms. May
          be positive or negative.
        range: float
        required: false
        annotations:
          order: 11
        exact_mappings:
          - cim:TransformerEnd.xground
        comments:
          - >-
            Import: PowerTransformerEnd.xground (ohm), with Rneut >= 0, 3-phase
            only; on a 1-phase transformer it is dropped without an error.
            Export: xground (ohm) of the grounded winding.

      # (12) buses
      buses:
        description: >-
          Use this to specify all the bus connections at once using an array.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 12
        close_mappings:
          - cim:Terminal.ConnectivityNode
          - cim:Terminal.phases
        comments:
          - >-
            Import: the node and phases of each end (PowerTransformerEnd node,
            phases), one end per distinct bus. Export: bus_ref of each winding's
            phases; a coil's N on .0, a 3-phase wye .1.2.3 or .1.2.3.4.

      # (13) conns
      conns:
        description: >-
          Use this to specify all the Winding connections at once using an
          array.
        range: ConnectionType
        multivalued: true
        required: false
        annotations:
          order: 13
        close_mappings:
          - cim:PowerTransformerEnd.connectionKind
          - cim:TransformerEnd.grounded
        comments:
          - >-
            Import: wye -> Y, or Yn when grounded (node 0 or Rneut >= 0), delta
            -> D, a split-phase secondary I; default wye. Export: D -> delta,
            Y/Yn/I -> wye.

      # (14) kVs
      kVs:
        description: >-
          Use this to specify the kV ratings of all windings at once using an
          array.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        annotations:
          order: 14
        close_mappings:
          - cim:PowerTransformerEnd.ratedU
          - cim:TransformerWinding.baseU
          - cim:TransformerWinding.ratedU
        comments:
          - >-
            Import: 3-phase: PowerTransformerEnd.ratedU (kV); 1-phase:
            TransformerWinding.baseU (kV), ratedU derived (x sqrt 3 for a coil
            on a 3-phase system, x 2 for a split-phase half). Export: a coil's
            baseU, a 3-phase winding's ratedU, in kV.

      # (15) kVAs
      kVAs:
        description: >-
          Use this to specify the kVA ratings of all windings at once using an
          array.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        annotations:
          order: 15
        close_mappings:
          - cim:PowerTransformerEnd.ratedS
          - cim:TransformerWinding.ratedS
          - cim:TransformerWinding.baseS
          - cim:AutoTransformerEnd.ratedS
        comments:
          - >-
            Import: PowerTransformerEnd.ratedS or TransformerWinding.ratedS
            (kVA; a split-phase half is kVA / 2); winding 1's kVA is every
            baseS. Export: a coil's baseS, else ratedS, in kVA.

      # (16) taps
      taps:
        description: >-
          Use this to specify the p.u. tap of all windings at once using an
          array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 16
        close_mappings:
          - cim:TapChanger.step
        comments:
          - >-
            Import: only the regulated winding's tap, as RatioTapChanger.step =
            (tap - 1) / increment (regcontrol.cimtbl); any other tap other than
            1 raises. Export: 1, and get_tap_ratio(actual) on the winding with
            the RatioTapChanger.

      # (17) XHL
      XHL:
        description: >-
          Percent reactance, H-L (winding 1 to winding 2). Use for 2- or
          3-winding transformers. On the kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 17
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 1-2 x (percent on winding 1's kVA); default 7 (row
            comment). Export: mesh (1,2) x.

      # (18) XHT
      XHT:
        description: >-
          Percent reactance, H-T (winding 1 to winding 3). Use for 3-winding
          transformers only. On the kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 18
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 1-3 x (percent on winding 1's kVA); default 35. Export:
            mesh (1,3) x.

      # (19) XLT
      XLT:
        description: >-
          Percent reactance, L-T (winding 2 to winding 3). Use for 3-winding
          transformers only. On the kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 19
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: mesh 2-3 x (percent on winding 1's kVA); default 30. Export:
            mesh (2,3) x.

      # (20) Xscarray
      Xscarray:
        description: >-
          Percent reactance between all pairs of windings as an array. All
          values are on the kVA base of winding 1.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 20
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: untranscribed; more than 3 windings raise. Export: not
            written.

      # (21) thermal
      thermal:
        description: >-
          Thermal time constant of the transformer in hours. Typically about 2.
        range: float
        required: false
        annotations:
          order: 21
          dss_default: float(2.0)
        todos:
          - >-
            No CIM equivalent in standard profile. Consider CIM extension for
            IEEE C57 thermal model parameters.
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (22) n
      n:
        description: >-
          n Exponent for thermal properties in IEEE C57. Typically 0.8.
        range: float
        required: false
        annotations:
          order: 22
          dss_default: float(0.8)
        todos:
          - >-
            No CIM equivalent. IEEE C57 exponent n for thermal model; requires
            CIM extension.
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (23) m
      m:
        description: >-
          m Exponent for thermal properties in IEEE C57. Typically 0.9 - 1.0.
        range: float
        required: false
        annotations:
          order: 23
          dss_default: float(0.9)
        todos:
          - >-
            No CIM equivalent. IEEE C57 exponent m for thermal model; requires
            CIM extension.
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (24) flrise
      flrise:
        description: >-
          Temperature rise, deg C, for full load. Default is 65.
        range: float
        required: false
        annotations:
          order: 24
          dss_default: float(65.0)
        todos:
          - >-
            No CIM equivalent. Full-load temperature rise (deg C); requires CIM
            extension.
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (25) hsrise
      hsrise:
        description: >-
          Hot spot temperature rise, deg C. Default is 15.
        range: float
        required: false
        annotations:
          order: 25
          dss_default: float(15.0)
        todos:
          - >-
            No CIM equivalent. Hot-spot temperature rise (deg C); requires CIM
            extension.
        comments:
          - >-
            Import: untranscribed (thermal model; no home in the network profile
            parts). Export: unset.

      # (26) %loadloss
      pct_loadloss:
        description: >-
          Percent load loss at full load. The %R of the High and Low windings
          (1 and 2) are adjusted to agree at rated kVA loading.
        range: float
        required: false
        annotations:
          order: 26
          dss_name: "%loadloss"
        close_mappings:
          - cim:PowerTransformerEnd.r
          - cim:TransformerWinding.r
        comments:
          - >-
            Import: derived; with pct_Rs unset, r = loadloss / 2 on windings 1
            and 2; set with pct_Rs, the two must agree. Export: not written; %Rs
            carries each winding's r.

      # (27) %noloadloss
      pct_noloadloss:
        description: >-
          Percent no load losses at rated excitatation voltage. Default is 0.
          Converts to a resistance in parallel with the magnetizing impedance
          in each winding.
        range: float
        required: false
        annotations:
          order: 27
          dss_name: "%noloadloss"
          dss_default: float(0.0)
        close_mappings:
          - cim:PowerTransformerEnd.g
          - cim:TransformerTank.noLoadLoss
        comments:
          - >-
            Import: derived; 3-phase: end 1 g (percent); 1-phase:
            TransformerTank.noLoadLoss (kW) = % x winding 1 kVA; a regulator has
            no home for it (row comment). Export: the core g.

      # (28) normhkVA
      normhkVA:
        description: >-
          Normal maximum kVA rating of H winding (winding 1). Usually 100%-110%
          of maximum nameplate rating. Defaults to 110% of kVA rating of
          Winding 1.
        range: float
        required: false
        annotations:
          order: 28
        todos:
          - >-
            No CIM equivalent. Normal H-winding kVA rating; consider
            OperationalLimitSet mapping.
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Import: untranscribed (a rating would be an instance
            OperationalLimitSet). Export: unset.

      # (29) emerghkVA
      emerghkVA:
        description: >-
          Emergency (contingency) kVA rating of H winding (winding 1). Usually
          140%-150% of maximum nameplate rating. Defaults to 150% of kVA rating
          of Winding 1.
        range: float
        required: false
        annotations:
          order: 29
        todos:
          - >-
            No CIM equivalent. Emergency H-winding kVA rating; consider
            OperationalLimitSet mapping.
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Import: untranscribed (a rating would be an instance
            OperationalLimitSet). Export: unset.

      # (30) sub
      sub:
        description: >-
          Designates whether this transformer is to be considered a substation.
          Default is No.
        range: boolean
        required: false
        annotations:
          order: 30
          dss_default: "false"
        todos:
          - >-
            Not read by the current importer or written by the exporter —
            the transformer's EquipmentContainer is always the feeder
            container, never a Substation. If implemented, sub=Yes should
            place the PowerTransformer in a CIM Substation container.
        comments:
          - >-
            Import: untranscribed (DSS report flag). Export: unset.

      # (31) MaxTap
      MaxTap:
        description: >-
          Max per unit tap for the active winding. Default is 1.10.
        range: float
        required: false
        annotations:
          order: 31
          dss_default: float(1.10)
        todos:
          - >-
            Not exported: the exporter reads back RatioTapChanger.step for
            tap= but never reconstructs MaxTap/MinTap/NumTaps from
            highStep/lowStep/stepVoltageIncrement.
        close_mappings:
          - cim:TapChanger.highStep
        comments:
          - >-
            Import: with MinTap and NumTaps, the RatioTapChanger range of a
            regulated transformer (regcontrol.cimtbl); default 1.1. Export:
            get_tap_ratio(high).

      # (32) MinTap
      MinTap:
        description: >-
          Min per unit tap for the active winding. Default is 0.90.
        range: float
        required: false
        annotations:
          order: 32
          dss_default: float(0.90)
        todos:
          - "Not exported; see MaxTap todos."
        close_mappings:
          - cim:TapChanger.lowStep
        comments:
          - >-
            Import: the RatioTapChanger range of a regulated transformer
            (regcontrol.cimtbl); default 0.9. Export: get_tap_ratio(low).

      # (33) NumTaps
      NumTaps:
        description: >-
          Total number of taps between min and max tap. Default is 32 (16 raise
          and 16 lower taps about the neutral position). The neutral position
          is not counted.
        range: integer
        required: false
        annotations:
          order: 33
          dss_default: int(32)
        todos:
          - "Not exported; see MaxTap todos."
        close_mappings:
          - cim:RatioTapChanger.stepVoltageIncrement
        comments:
          - >-
            Import: increment = (MaxTap - MinTap) / NumTaps, as the tap
            changer's steps (regcontrol.cimtbl); default 32. Export: highStep -
            lowStep.

      # (34) subname
      subname:
        description: >-
          Substation Name. Optional. Default is null. If specified, printed on
          plots.
        range: string
        required: false
        annotations:
          order: 34
        todos:
          - >-
            Not read by the current importer or written by the exporter;
            see sub todos. If implemented, would name the CIM Substation
            container created for sub=Yes transformers.
        comments:
          - >-
            Import: untranscribed (DSS report label). Export: unset.

      # (35) %imag
      pct_imag:
        description: >-
          Percent magnetizing current. Default=0.0. Magnetizing branch is in
          parallel with windings in each phase.
        range: float
        required: false
        annotations:
          order: 35
          dss_name: "%imag"
          dss_default: float(0.0)
        close_mappings:
          - cim:PowerTransformerEnd.b
          - cim:TransformerTank.percentMagnetizingCurrent
        comments:
          - >-
            Import: 3-phase: end 1 b (percent); 1-phase:
            TransformerTank.percentMagnetizingCurrent; a regulator has no home
            for it (row comment). Export: the core b.

      # (36) ppm_antifloat
      ppm_antifloat:
        description: >-
          Default=1 ppm. Parts per million of transformer winding VA rating
          connected to ground to protect against accidentally floating a winding
          without a reference.
        range: float
        required: false
        annotations:
          order: 36
          dss_default: float(1.0)
        todos:
          - >-
            No CIM equivalent. Anti-float grounding resistance in ppm; requires
            CIM extension or drop on export.
        comments:
          - >-
            Import: untranscribed (numerical aid of the DSS solver). Export:
            unset.

      # (37) %Rs
      pct_Rs:
        description: >-
          Use this property to specify all the winding %resistances using an
          array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 37
          dss_name: "%Rs"
        close_mappings:
          - cim:PowerTransformerEnd.r
          - cim:TransformerWinding.r
        comments:
          - >-
            Import: 3-phase: end r (percent); 1-phase: winding r (percent);
            default 0.2 (row comment). Export: winding r x kVA_n / kVA_1; an
            unset r is 0.

      # (38) bank
      bank:
        description: >-
          Name of the bank this transformer is part of, for CIM, MultiSpeak,
          and other interfaces.
        range: string
        required: false
        annotations:
          order: 38
        comments:
          - >-
            Import: untranscribed; each Transformer is its own PowerTransformer.
            Export: unset.

      # (39) XfmrCode
      XfmrCode:
        description: >-
          Name of a library entry for transformer properties. The named
          XfmrCode must already be defined.
        range: string
        required: false
        annotations:
          order: 39
        close_mappings:
          - cim:TransformerTank.TankConfiguration
        comments:
          - >-
            Import: an instance gets a TransformerTank on the code's template
            (xc_ + code); a regulated one takes the code's values inline.
            Export: the unit's TankConfiguration name.

      # (40) XRConst
      XRConst:
        description: >-
          Default is NO. Signifies whether or not the X/R is assumed contant
          for harmonic studies.
        range: boolean
        required: false
        annotations:
          order: 40
          dss_default: "false"
        todos:
          - >-
            No CIM equivalent. X/R constancy flag for harmonic studies; drop on
            export or store as extension attribute.
        comments:
          - >-
            Import: untranscribed (harmonics option). Export: unset.

      # (41) X12
      X12:
        description: >-
          Alternative to XHL for specifying the percent reactance from winding
          1 to winding 2. Use for 2- or 3-winding transformers. Percent on the
          kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 41
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of XHL; with XHL they must agree. Export: not written.

      # (42) X13
      X13:
        description: >-
          Alternative to XHT for specifying the percent reactance from winding
          1 to winding 3. Use for 3-winding transformers only. Percent on the
          kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 42
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of XHT; with XHT they must agree. Export: not written.

      # (43) X23
      X23:
        description: >-
          Alternative to XLT for specifying the percent reactance from winding
          2 to winding 3. Use for 3-winding transformers only. Percent on the
          kVA base of winding 1.
        range: float
        required: false
        annotations:
          order: 43
        exact_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: alias of XLT; with XLT they must agree. Export: not written.

      # (44) LeadLag
      LeadLag:
        description: >-
          Designation in mixed Delta-wye connections the relationship between
          HV to LV winding. Default is ANSI 30 deg lag.
        range: LeadLagType
        required: false
        annotations:
          order: 44
        todos:
          - >-
            No CIM equivalent in standard profile. Phase shift convention for
            mixed Delta-wye; requires CIM extension.
        close_mappings:
          - cim:PowerTransformer.vectorGroup
        comments:
          - >-
            Import: untranscribed; vectorGroup is not mapped yet. Export: unset.

      # (45) WdgCurrents
      # Skipped - Read only property

      # (46) Core
      Core:
        description: >-
          Core Type. Used for GIC analysis. Default is Shell.
        range: CoreType
        required: false
        annotations:
          order: 46
        todos:
          - >-
            No CIM equivalent in standard profile. Core type for GIC analysis
            (Shell/5-leg/3-leg); requires CIM extension.
        comments:
          - >-
            Import: untranscribed (core type; no home in the network profile
            parts). Export: unset.

      # (47) RdcOhms
      RdcOhms:
        description: >-
          Winding dc resistance in OHMS. Useful for GIC analysis. From
          transformer test report. Defaults to 85% of %R property.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 47
        exact_mappings:
          - cim:TransformerWinding.rDC
        comments:
          - >-
            Import: copied per winding to a 1-phase transformer's coil
            TransformerWinding.rDC (ohm); the reader takes each value for the
            active wdg=, and some windings without one raise. A 3-phase
            transformer by balanced ends (no TransformerWinding) and a regulator
            raise. Export: each winding's rDC, written one wdg= block per winding.

      # (48) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the transfomer, to be
          used only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 48
        comments:
          - >-
            Import: structural; the number of Ratings (one by default). Seasons
            without Ratings, or a count other than the Ratings', raises: the
            engine keeps Seasons of them and pads with zeros. Export: the number
            of the transformer's season ratings.

      # (49) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is
          True. Given in kVA.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 49
        close_mappings:
          - cim:ApparentPowerLimit.normalValue
        comments:
          - >-
            Import: copied, kVA; one ApparentPowerLimit per season n, of type
            olt_season<n>, in the OperationalLimitSet <xf>_ratings on the
            PowerTransformer (a regulator's VoltageRegulator). An instance by
            XfmrCode carries only its own; its code's are the template's.
            Export: the PowerTransformer's olt_season<n> ApparentPowerLimits, in
            season order.

      # (50) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 50
        todos:
          - >-
            Map to CIM OperationalLimitSet/CurrentLimit for normal rating;
            converter not yet implemented.
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Import: untranscribed (a rating would be an instance
            OperationalLimitSet). Export: unset.

      # (51) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 51
        todos:
          - >-
            Map to CIM OperationalLimitSet/CurrentLimit for emergency rating;
            converter not yet implemented.
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Import: untranscribed (a rating would be an instance
            OperationalLimitSet). Export: unset.

      # (52) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: float
        required: false
        annotations:
          order: 52
        todos:
          - >-
            No CIM equivalent in standard profile. Requires CIM extension for
            reliability data.
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (53) pctperm
      pct_perm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        annotations:
          order: 53
          dss_name: "pctperm"
        todos:
          - >-
            No CIM equivalent in standard profile. Requires CIM extension for
            reliability data.
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (54) repair
      repair:
        description: >-
          Hours to repair.
        range: float
        required: false
        annotations:
          order: 54
        todos:
          - >-
            No CIM equivalent in standard profile. Requires CIM extension for
            reliability data.
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (55) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 55
        todos:
          - >-
            Not stored on CIM PowerTransformer. Extract from circuit-level
            BaseVoltage or NetworkModelProject frequency attribute on export.
        comments:
          - >-
            Import: untranscribed (no home on a transformer). Export: unset.

      # (56) enabled
      enabled:
        description: >-
          Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 56
          dss_default: "true"
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: PowerTransformer.normallyInService (VoltageRegulator for a
            regulator). Export: get_in_service(which='normal'); unset -> not
            written.

      # (57) like
      like:
        description: >-
          Make like another object, e.g.: New Capacitor.C2 like=c1 ...
        range: string
        required: false
        annotations:
          order: 57
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.

# Enums are imported from common_enums.yaml
