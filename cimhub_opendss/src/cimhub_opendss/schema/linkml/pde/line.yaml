id: https://gridappsd.github.io/dss-graph/pde/line
name: line
title: OpenDSS Line Component Schema
description: >-
  LinkML schema for OpenDSS Line objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-42).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Line:
    description: >-
      A Line object in OpenDSS representing a power delivery line connecting
      two buses in the distribution system. If Switch=True the element is
      treated as a switching device instead.
    class_uri: dss:Line
    close_mappings:
      - cim:ACLineSegment
    narrow_mappings:
      - cim:LoadBreakSwitch
      - cim:Fuse
      - cim:Recloser
    comments:
      - >-
        Import: a Line becomes an ACLineSegment in line.cimtbl, referencing a WireConfiguration (its
        LineCode's template, its LineGeometry's, or a synthesized one for spacing=) or carrying its
        own PerLengthImpedance ln_<name>_lc (isTemplate=false). No impedance is computed from
        geometry.
      - >-
        Switch=y makes the Line a Switch (LoadBreakSwitch, or Fuse/Recloser when one names it as
        SwitchedObj). Export: an ACLineSegment is written by exporter/line.py, a Switch by
        exporter/switch.py. Details: CIMTBL_MAPPING.md#line-and-switches.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to ACLineSegment.name, Switch.name; mRID = ln_ + name (segment) or sw_ +
            name (switch), lowercased. Export: Names; a coupled group's: the group's, <line>_jumper1
            for each circuit, and <line>_jumper2 or a longer line's remainder <line>.

      # (1) bus1
      bus1:
        description: >-
          Name of bus to which first terminal is connected.
        range: string
        required: true
        annotations:
          order: 1
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node1, and the phases from its nodes: 1/2/3 = A/B/C, s1/s2 on a
            split-phase island; no nodes = 1..phases. Export: bus_ref(get_terminal_nodes[0],
            the phase conductors of get_conductor_phases); a coupled group's: <group>_1 on nodes
            1..n, its jumpers from each circuit's own bus, a remainder from <group>_2 on its
            circuit's nodes.

      # (2) bus2
      bus2:
        description: >-
          Name of bus to which 2nd terminal is connected.
        range: string
        required: false
        annotations:
          order: 2
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node2; its phase nodes must equal bus1's (a transposition raises).
            Export: bus_ref(get_terminal_nodes[1], the same phases); a coupled group's: <group>_2.

      # (3) linecode
      linecode:
        description: >-
          Name of linecode object describing line impedances. If no line code
          or impedance data are specified, the line defaults to 336 MCM ACSR
          on 4 ft spacing.
        range: string
        required: false
        annotations:
          order: 3
        related_mappings:
          - cim:ACLineSegment.WireConfiguration
        comments:
          - >-
            Import: structural; ACLineSegment.WireConfiguration = the WireConfiguration of the
            code's template for the line's unit (lc_<code>_wc or lc_<code>_<unit>_wc). Export: the template PerLengthImpedance's LineCode name (get_line_code); a
            line's own (isTemplate=false) is written inline.

      # (4) length
      length:
        description: >-
          Length of line. Default is 1.0. If units do not match the impedance
          data, specify units property.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 4
          dss_default: float(1.0)
        exact_mappings:
          - cim:Conductor.length
        comments:
          - >-
            Import: copied to ACLineSegment.length (<units>); default 1 (defaulted); none on a
            switch. Export: required_qty(length, m); lumped: km, unset -> 1; a coupled group's: its
            shortest line's, a remainder the rest of its line, a jumper 1 m.

      # (5) phases
      phases:
        description: >-
          Number of phases, this line.
        range: integer
        required: false
        minimum_value: 1
        maximum_value: 3
        annotations:
          order: 5
          dss_default: int(3)
        related_mappings:
          - cim:ACLineSegmentPhase.phase
        comments:
          - >-
            Import: structural; the phase count; unset = the code's or geometry's nphases, else 3;
            one that differs from the code's nphases raises. Export: the phase conductors
            (a neutral is reduced, B4); a coupled group's: every line's.

      # (6) r1
      r1:
        description: >-
          Positive-sequence Resistance, ohms per unit length. Setting any of
          R1, R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(0.058)
        close_mappings:
          - cim:PerLengthSequenceImpedance.r
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.
        todos:
          - "Converter bug: DSS r1 is documented as ohms per unit length, but the direct-impedance path (no linecode) stores it as total ohms without multiplying by length. Roundtrips correctly within this converter, but a line authored elsewhere with a true per-length r1 and length != 1 would import with the wrong total resistance."

      # (7) x1
      x1:
        description: >-
          Positive-sequence Reactance, ohms per unit length. Setting any of
          R1, R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 7
          dss_default: float(0.1206)
        close_mappings:
          - cim:PerLengthSequenceImpedance.x
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (8) r0
      r0:
        description: >-
          Zero-sequence Resistance, ohms per unit length. Setting any of R1,
          R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(0.1784)
        close_mappings:
          - cim:PerLengthSequenceImpedance.r0
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (9) x0
      x0:
        description: >-
          Zero-sequence Reactance, ohms per unit length. Setting any of R1,
          R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 9
          dss_default: float(0.4047)
        close_mappings:
          - cim:PerLengthSequenceImpedance.x0
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (10) C1
      C1:
        description: >-
          Positive-sequence capacitance, nf per unit length. Setting any of
          R1, R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 10
          dss_default: float(3.4)
        close_mappings:
          - cim:PerLengthSequenceImpedance.bch
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (11) C0
      C0:
        description: >-
          Zero-sequence capacitance, nf per unit length. Setting any of R1,
          R0, X1, X0, C1, C0 forces the program to use the symmetrical
          component line definition.
        range: float
        required: false
        annotations:
          order: 11
          dss_default: float(1.6)
        close_mappings:
          - cim:PerLengthSequenceImpedance.b0ch
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (12) rmatrix
      rmatrix:
        description: >-
          Resistance matrix, lower triangle, ohms per unit length. Order of
          the matrix is the number of phases. Using any of Rmatrix, Xmatrix,
          Cmatrix forces program to use matrix values for line impedance.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 12
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.r
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (13) xmatrix
      xmatrix:
        description: >-
          Reactance matrix, lower triangle, ohms per unit length. Order of
          the matrix is the number of phases. Using any of Rmatrix, Xmatrix,
          Cmatrix forces program to use matrix values for line impedance.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 13
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.x
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (14) cmatrix
      cmatrix:
        description: >-
          Nodal Capacitance matrix, lower triangle, nf per unit length. Order
          of the matrix is the number of phases. Using any of Rmatrix,
          Xmatrix, Cmatrix forces program to use matrix values.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 14
          dss_format: matrix
        close_mappings:
          - cim:PhaseImpedanceData.b
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            the line's own code (isTemplate=false) as a LineCode writes it; lumped: the whole-line
            value / km.

      # (15) Switch
      Switch:
        description: >-
          Designates this line as a switch for graphics and algorithmic
          purposes. Default is false. SIDE EFFECT: Sets r1=1.0, x1=1.0,
          r0=1.0, x0=1.0, c1=1.1, c0=1.0, length=0.001.
        range: boolean
        required: false
        annotations:
          order: 15
          dss_default: "false"
        related_mappings:
          - cim:Switch
        comments:
          - >-
            Import: structural; a Switch (sw_) instead of an ACLineSegment; class from its control. Export: not written, a Switch is exported by switch.py.

      # (16) Rg
      Rg:
        description: >-
          Carson earth return resistance per unit length used to compute
          impedance values at base frequency. Default is 0.01805 ohms per kft.
        range: float
        required: false
        annotations:
          order: 16
          dss_default: float(0.01805)
        close_mappings:
          - cim:PerLengthImpedance.rg
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (Carson earth return; the consumer's choice for geometry). Export: not written,
            not in CIM (untranscribed or raising on import).

      # (17) Xg
      Xg:
        description: >-
          Carson earth return reactance per unit length used to compute
          impedance values at base frequency. Default is 0.155081 ohms per kft.
        range: float
        required: false
        annotations:
          order: 17
          dss_default: float(0.155081)
        close_mappings:
          - cim:PerLengthImpedance.xg
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (Carson earth return; the consumer's choice for geometry). Export: not written,
            not in CIM (untranscribed or raising on import).

      # (18) rho
      rho:
        description: >-
          Earth resitivity used to compute earth correction factor. Default is
          100 meter ohms. Overrides Line geometry definition if specified.
        range: float
        required: false
        annotations:
          order: 18
          dss_default: float(100.0)
        close_mappings:
          - cim:EarthResistivity.rho
        comments:
          - >-
            Import: structural; the deck's EarthResistivity.rho (ohm-m), which every geometry line
            must agree on (geometry.earth_statement). Export: a geometry line's WireConfiguration
            EarthResistivity.rho (ohm-m), unset -> not written; a spacing line's: get_network_earth.

      # (19) geometry
      geometry:
        description: >-
          Geometry code for LineGeometry Object. Supercedes any previous
          definition of line impedance. CAUTION: may alter number of phases.
        range: string
        required: false
        annotations:
          order: 19
        related_mappings:
          - cim:ACLineSegment.WireConfiguration
        comments:
          - >-
            Import: structural; ACLineSegment.WireConfiguration = wc_<geometry>. Export: the
            (WireConfiguration, ySpacingOffset) LineGeometry name; a spacing line's:
            spacing_geometry_name of its owner.

      # (20) units
      units:
        description: >-
          Length Units. Default is None - assumes length units match impedance
          units.
        range: LengthUnit
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: mapped; the length unit (LENGTH_UNIT); unset: the template's unit.
            Export: m (B1); lumped: km (B6).

      # (21) spacing
      spacing:
        description: >-
          Reference to a LineSpacing for use in a line constants calculation.
          Must be used in conjunction with the Wires property.
        range: string
        required: false
        annotations:
          order: 21
        related_mappings:
          - cim:WireConfiguration.WireSpacing
        comments:
          - >-
            Import: structural; with spacing=: a synthesized WireConfiguration ln_<name>_wc on
            spc_<spacing>, conductors in order. Export: not written, positions are written inline in
            the LineGeometry (B2).

      # cncables written after spacing (21) and before wires (24) so OpenDSS
      # assigns cable positions before overhead wire positions
      cncables:
        description: >-
          Array of CNData names for use in a cable constants calculation. Must
          be used in conjunction with the Spacing property.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 22
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; with spacing=: a synthesized WireConfiguration ln_<name>_wc on
            spc_<spacing>, conductors in order. Export: not written, the LineGeometry carries the
            conductors (B2).

      # tscables written after cncables (22) and before wires (24)
      tscables:
        description: >-
          Array of TSData names for use in a cable constants calculation. Must
          be used in conjunction with the Spacing property.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 23
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; with spacing=: a synthesized WireConfiguration ln_<name>_wc on
            spc_<spacing>, conductors in order. Export: not written, the LineGeometry carries the
            conductors (B2).

      wires:
        description: >-
          Array of WireData names for use in an overhead line constants
          calculation. Must be used in conjunction with the Spacing property.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 24
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; with spacing=: a synthesized WireConfiguration ln_<name>_wc on
            spc_<spacing>, conductors in order. Export: not written, the LineGeometry carries the
            conductors (B2).

      EarthModel:
        description: >-
          Earth model to use for impedance calculations. This is used to
          override the global value for this line. Applies only when geometry
          property is used.
        range: EarthModelType
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: untranscribed; the earth model of the impedance calculation; the consumer's
            choice. Export: not written, the deck's Set earthmodel carries it (options.py: one model
            per deck).

      # (26) B1
      B1:
        description: >-
          Alternate way to specify C1. MicroS per unit length.
        range: float
        required: false
        annotations:
          order: 26
        close_mappings:
          - cim:PerLengthSequenceImpedance.bch
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            not written, C1/C0 carries the susceptance.
        todos:
          - "B1 input path not yet implemented. B1 (µS/unit) → bch via bch = B1 × 1e-6 × length. When present, should take precedence over C1 for bch calculation."

      # (27) B0
      B0:
        description: >-
          Alternate way to specify C0. MicroS per unit length.
        range: float
        required: false
        annotations:
          order: 27
        close_mappings:
          - cim:PerLengthSequenceImpedance.b0ch
        comments:
          - >-
            Import: the line's own PerLengthImpedance ln_<name>_lc (isTemplate=false) in
            line.cimtbl, per-length values in the line's units; untranscribed on a switch. Export:
            not written, C1/C0 carries the susceptance.
        todos:
          - "B0 input path not yet implemented. B0 (µS/unit) → b0ch via b0ch = B0 × 1e-6 × length."

      # (28) Seasons
      Seasons:
        description: >-
          Defines the number of ratings to be defined for the wire, to be used
          only when defining seasonal ratings using the Ratings property.
        range: integer
        required: false
        annotations:
          order: 28
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (an indexed rating array that names no calendar season; home
            OperationalLimitType.season). Export: not written, not in CIM (untranscribed or raising
            on import).

      # (29) Ratings
      Ratings:
        description: >-
          An array of ratings to be used when the seasonal ratings flag is
          True. Can be used to insert multiple ratings to change during a QSTS
          simulation.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 29
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (with Seasons). Export: not written, not in CIM (untranscribed or raising on
            import).
        todos:
          - "Seasonal ratings converter not yet implemented. Ratings array should map to multiple CurrentLimit objects on an OperationalLimitSet, one per season."

      # (30) LineType
      LineType:
        description: >-
          Code designating the type of line. OpenDSS currently does not use
          this internally. Default is OH.
        range: LineTypeCode
        required: false
        annotations:
          order: 30
        comments:
          - >-
            Import: untranscribed; no home in the network profile parts. Export: not written, not in
            CIM (untranscribed or raising on import).
        todos:
          - "LineType → PSRType mapping not yet implemented. DSS LineTypeCode (OH, UG, etc.) could be mapped to a PSRType classification on the ACLineSegment."

      # (31) EpsRmedium
      EpsRmedium:
        description: >-
          Relative Permittivity of the medium. Used by lines with a geometry
          definition. Default is 1.0 for air.
        range: float
        required: false
        annotations:
          order: 31
          dss_default: float(1.0)
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, not in CIM (untranscribed or raising on import).

      # (32) HeightOffset
      HeightOffset:
        description: >-
          Average Height (or depth) offset to be applied on top of coordinates
          of geometry or spacing. Use negative value for depth in underground
          lines. Default is 0.0.
        range: float
        required: false
        annotations:
          order: 32
          dss_default: float(0.0)
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, ySpacingOffset goes into the geometry's heights.

      # (33) HeightUnit
      HeightUnit:
        description: >-
          Height offset Units. If none is detected, meters is assumed.
        range: LengthUnit
        required: false
        annotations:
          order: 33
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, ySpacingOffset goes into the geometry's heights.

      # (34) conductors
      conductors:
        description: >-
          Array of conductor names for use in line constants calculation. Must
          be used in conjunction with the Spacing property. Specify conductor
          type followed by conductor name.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 34
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, not in CIM (untranscribed or raising on import).
        todos:
          - "Conductor converter not yet implemented. Names should resolve to WireInfo (OverheadWireInfo or CableInfo) objects."

      # (35) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 35
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; instance OperationalLimitSet ln_<name>_limits (see Ratings); on a
            switch untranscribed. Export: rule, get_current_limits normal (A); unset -> not written,
            the engine copies the catalog's.

      # (36) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 36
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; instance OperationalLimitSet ln_<name>_limits (see Ratings); on a
            switch untranscribed. Export: rule, get_current_limits emergency (A); unset -> not
            written, as normamps.

      # (37) faultrate
      faultrate:
        description: >-
          Failure rate PER UNIT LENGTH per year. Length must be same units as
          LENGTH property. Default is 0.1 fault per unit length per year.
        range: float
        required: false
        annotations:
          order: 37
          dss_default: float(0.1)
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed or raising on import).
        todos:
          - "Requires CIM extension to roundtrip (e.g. on FailureStatistic or AssetFailureInfo)."

      # (38) pctperm
      pct_perm:
        description: >-
          Percent of failures that become permanent. Default is 20.
        range: float
        required: false
        annotations:
          order: 38
          dss_name: "pctperm"
          dss_default: float(20.0)
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed or raising on import).
        todos:
          - "Requires CIM extension to roundtrip."

      # (39) repair
      repair:
        description: >-
          Hours to repair. Default is 3 hr.
        range: float
        required: false
        annotations:
          order: 39
          dss_default: float(3.0)
        comments:
          - >-
            Import: untranscribed; reliability data; no home in the network profile parts. Export:
            not written, not in CIM (untranscribed or raising on import).
        todos:
          - "Requires CIM extension to roundtrip."

      # (40) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 40
        close_mappings:
          - cim:PerLengthImpedance.calculatedFrequency
        comments:
          - >-
            Import: structural; the line's own impedance's calculatedFrequency and the frequency of
            its b; unset: the deck's. Export: not written, Options.defaultbasefreq is the
            deck's.
        todos:
          - "Extract base frequency from circuit-level CIM attributes for non-60 Hz systems."

      # (41) enabled
      enabled:
        description: >-
          Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 41
          dss_default: "true"
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: copied to ACLineSegment.normallyInService, Switch.normallyInService. Export:
            get_in_service(which='normal'); unset -> not written.

      # (42) like
      like:
        description: >-
          Make like another object, e.g.: New Capacitor.C2 like=c1 ...
        range: string
        required: false
        annotations:
          order: 42
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.

