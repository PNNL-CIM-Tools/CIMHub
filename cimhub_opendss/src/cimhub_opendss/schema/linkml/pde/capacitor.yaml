id: https://gridappsd.github.io/dss-graph/pde/capacitor
name: capacitor
title: OpenDSS Capacitor Component Schema
description: >-
  LinkML schema for OpenDSS Capacitor objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-21).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types
  - ../common_enums

classes:
  Capacitor:
    description: >-
      A Capacitor object in OpenDSS representing a shunt or series capacitor
      bank connected to the distribution system.
    class_uri: dss:Capacitor
    exact_mappings:
      - cim:LinearShuntCompensator
    comments:
      - >-
        Import: one LinearShuntCompensator cap_ + name with one section
        (capacitor.cimtbl); a CapControl adds its RegulatingControl by an
        Update. Export: one Capacitor per LinearShuntCompensator.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: LinearShuntCompensator.name, mRID = cap_ + name, lowercased.
            Export: Names, the Capacitor namespace.

      # (1) bus1
      bus1:
        description: >-
          Name of first bus of 2-terminal capacitor. If only one bus specified,
          Bus2 defaults to this bus, Node 0 (Yg shunt bank).
        range: string
        required: false
        annotations:
          order: 1
        close_mappings:
          - cim:Terminal.ConnectivityNode
          - cim:Terminal.phases
        comments:
          - >-
            Import: the node and phases, as a load's (1/2/3 = A/B/C). Export:
            bus_ref of the phase conductors; a wye's neutral is node 0, so it
            must be grounded.

      # (2) bus2
      bus2:
        description: >-
          Name of 2nd bus. Defaults to all phases connected to first bus, node 0.
        range: string
        required: false
        annotations:
          order: 2
        comments:
          - >-
            Import: raises when set (an ungrounded wye or a series capacitor);
            no deck in the sweep sets it. Export: not written; a shunt has one
            terminal.

      # (3) phases
      phases:
        description: >-
          Number of phases.
        range: integer
        required: false
        annotations:
          order: 3
          dss_default: int(3)
        comments:
          - >-
            Import: structural; the conductor count, default 3. Export: the
            phase conductors; a delta across two is 1.

      # (4) kvar
      kvar:
        description: >-
          Total kvar, if one step, or ARRAY of kvar ratings for each step.
          Evenly divided among phases.
        range: float
        multivalued: true
        required: false
        minimum_value: 0.0
        annotations:
          order: 4
          dss_default: float(1200.0)
        exact_mappings:
          - cim:ShuntCompensator.nomQ
        close_mappings:
          - cim:LinearShuntCompensator.bPerSection
        comments:
          - >-
            Import: nomQ (kVAr), the total over the phases; more than one step
            raises; default 1200; with kv, bPerSection = nomQ / nomU^2. Export:
            get_shunt_reactive_power at the maximum section and nominal voltage.

      # (5) kv
      kv:
        description: >-
          For 2, 3-phase, kV phase-phase. Otherwise specify actual can rating.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 5
          dss_default: float(12.47)
        exact_mappings:
          - cim:ShuntCompensator.nomU
        close_mappings:
          - cim:LinearShuntCompensator.bPerSection
        comments:
          - >-
            Import: nomU (kV) as rated (LN for 1-phase wye, else LL); default
            12.47; also in bPerSection. Export: nomU (kV).

      # (6) conn
      conn:
        description: >-
          ={wye | delta |LN |LL}  Default is wye, which is equivalent to LN.
        range: ConnectionType
        required: false
        annotations:
          order: 6
          dss_default: string(wye)
        close_mappings:
          - cim:ShuntCompensator.phaseConnection
          - cim:ShuntCompensator.grounded
        comments:
          - >-
            Import: wye -> Y, grounded; delta -> D, not grounded; default wye.
            Export: Y/Yn -> wye, D -> delta; others raise.

      # (7) cmatrix
      cmatrix:
        description: >-
          Nodal cap. matrix, lower triangle, microfarads. All steps are assumed
          the same if this property is used.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 7
          dss_format: matrix
        comments:
          - >-
            Import: raises when set (a capacitance matrix instead of kvar).
            Export: not written; kvar carries the susceptance.

      # (8) cuf
      cuf:
        description: >-
          ARRAY of Capacitance, each phase, for each step, microfarads.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 8
        todos:
          - "Exporter: B → µF per-phase path not yet implemented; cuf is not written on export."
        comments:
          - >-
            Import: raises when set (microfarads instead of kvar). Export: not
            written; kvar carries the susceptance.

      # (9) R
      R:
        description: >-
          ARRAY of series resistance in each phase (line), ohms. Default is 0.0.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 9
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.seriesR) to roundtrip."
        comments:
          - >-
            Import: 0 is untranscribed, nonzero raises (a series R is not
            mapped). Export: unset.

      # (10) XL
      XL:
        description: >-
          ARRAY of series inductive reactance(s) in each phase (line) for
          filter, ohms at base frequency. Default is 0.0.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 10
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.seriesXL) to roundtrip."
        comments:
          - >-
            Import: 0 is untranscribed, nonzero raises (a series reactor is not
            mapped). Export: unset.

      # (11) Harm
      Harm:
        description: >-
          ARRAY of harmonics to which each step is tuned. Zero = no filter.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 11
        todos:
          - "Requires CIM extension (e.g. cim:LinearShuntCompensator.filterHarmonic) to roundtrip."
        comments:
          - >-
            Import: untranscribed (the tuning harmonic of the R/XL filter).
            Export: unset.

      # (12) Numsteps
      Numsteps:
        description: >-
          Number of steps in this capacitor bank. Default = 1.
        range: integer
        required: false
        annotations:
          order: 12
          dss_default: int(1)
        close_mappings:
          - cim:ShuntCompensator.maximumSections
        comments:
          - >-
            Import: maximumSections = 1; more than 1 raises (unequal steps would
            need a NonlinearShuntCompensator). Export: not written;
            maximumSections other than 1 raises.

      # (13) states
      states:
        description: >-
          ARRAY of integers {1|0} states representing the state of each step (on|off).
        range: integer
        required: false
        multivalued: true
        annotations:
          order: 13
        close_mappings:
          - cim:ShuntCompensator.sections
          - cim:ShuntCompensator.normalSections
        comments:
          - >-
            Import: sections = normalSections = the steps closed; default all
            closed. Export: [sections]; normalSections is not written.

      # (14) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 14
        todos:
          - "Converter not yet implemented; requires OperationalLimitSet + CurrentLimit creation."
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Import: raises when set (an OperationalLimitSet, as a line's); no
            deck in the sweep sets it. Export: unset.

      # (15) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 15
        todos:
          - "Converter not yet implemented; requires OperationalLimitSet + CurrentLimit creation."
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Import: raises when set (an OperationalLimitSet, as a line's); no
            deck in the sweep sets it. Export: unset.

      # (16) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: float
        required: false
        annotations:
          order: 16
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (17) pctperm
      pctperm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        annotations:
          order: 17
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (18) repair
      repair:
        description: >-
          Hours to repair.
        range: float
        required: false
        annotations:
          order: 18
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Import: untranscribed (reliability data; no home in the network
            profile parts). Export: unset.

      # (19) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 19
        todos:
          - "Extract base frequency from circuit-level CIM attributes for non-60Hz systems."
        comments:
          - >-
            Import: untranscribed (no home on a compensator; bPerSection is at
            the model's frequency). Export: unset.

      # (20) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 20
          dss_default: "true"
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: normallyInService; default true. Export:
            get_in_service(which='normal'); unset -> not written.

      # (21) like
      like:
        description: >-
          Make like another object, e.g.: New Capacitor.C2 like=c1 ...
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.

# Enums are imported from common_enums.yaml
