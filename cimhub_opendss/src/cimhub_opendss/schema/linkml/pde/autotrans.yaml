id: https://gridappsd.github.io/dss-graph/pde/autotrans
name: autotrans
title: OpenDSS Autotrans Component Schema
description: >-
  LinkML schema for OpenDSS Autotrans objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-50).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Autotrans:
    description: >-
      A Autotrans object in OpenDSS representing an auto-transformer where the
      series and common windings share a magnetic core. Winding 1 is the series
      (high-side) winding; winding 2 is the common winding.
    class_uri: dss:Autotrans
    close_mappings:
      - cim:AutoTransformer
    comments:
      - >-
        The spoke does not convert Autotrans: it is not in MAPPING_ORDER (the
        master counts it as not mapped) and no exporter writes it. A CIM
        AutoTransformer or VoltageRegulator exports as a DSS Transformer, and a
        regulated Transformer imports as a VoltageRegulator with
        AutoTransformerEnds.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Not converted. Would be the AutoTransformer's name.

      # (1) phases
      phases:
        description: >-
          Number of phases this AutoTrans.
        range: integer
        required: false
        annotations:
          order: 1
        comments:
          - >-
            Not converted: the phase count is on the ends' Terminals.

      # (2) windings
      windings:
        description: >-
          Number of windings, this AutoTrans. Typically 2 for a 2-winding auto-transformer.
        range: integer
        required: false
        annotations:
          order: 2
        comments:
          - >-
            Not converted: one AutoTransformerEnd per winding.

      # (3) wdg
      wdg:
        description: >-
          Set this = to the number of the winding you wish to define. Used as
          index selector for subsequent winding properties.
        range: integer
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Not converted: a DSS winding selector, resolved at parse time.

      # (4) bus
      bus:
        description: >-
          Bus connection spec for the active winding (set by wdg property).
        range: string
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Not converted: buses is the array form.

      # (5) conn
      conn:
        description: >-
          Connection of this winding {Series, wye*, Delta, LN, LL}.
        range: string
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Not converted: conns is the array form.

      # (6) kV
      kV:
        description: >-
          For 2-or 3-phase, enter phase-phase kV rating. Otherwise, enter
          actual winding voltage rating.
        range: float
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Not converted: kVs is the array form.

      # (7) kVA
      kVA:
        description: >-
          Base kVA rating of the winding.
        range: float
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Not converted: kVAs is the array form.

      # (8) tap
      tap:
        description: >-
          Per unit tap that this winding is on. Default is 1.0.
        range: string
        required: false
        annotations:
          order: 8
        todos:
          - "tap/taps[] is parsed but not converted. If implemented, it should create a RatioTapChanger on the winding's PowerTransformerEnd with step derived from the per-unit tap value."
        comments:
          - >-
            Not converted: taps is the array form.

      # (9) %R
      pct_R:
        description: >-
          Percent ac resistance this winding. Default is 0.2%.
        range: float
        required: false
        annotations:
          order: 9
          dss_name: "%R"
        comments:
          - >-
            Not converted: pct_Rs is the array form.

      # (10) Rdcohms
      Rdcohms:
        description: >-
          Winding dc resistance in OHMS. Default is 0.
        range: integer
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Not converted: DC winding resistance; no home on an
            AutoTransformerEnd.

      # (11) Core
      Core:
        description: >-
          {Shell*|5-leg|3-Leg|1-phase|core-1-phase|4-leg} Core Type.
        range: string
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Not converted: no home in the network profile parts.

      # (12) buses
      buses:
        description: >-
          Use this to specify all the bus connections at once using an array.
          Array form of the winding bus property.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 12
        close_mappings:
          - cim:Terminal.ConnectivityNode
          - cim:Terminal.phases
        comments:
          - >-
            Not converted: would be each AutoTransformerEnd's Terminal.

      # (13) conns
      conns:
        description: >-
          Use this to specify all the Winding connections at once using an array.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 13
        close_mappings:
          - cim:TransformerEnd.grounded
        comments:
          - >-
            Not converted: an AutoTransformerEnd has no connectionKind, only
            grounded.

      # (14) kVs
      kVs:
        description: >-
          Use this to specify the kV ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 14
        close_mappings:
          - cim:AutoTransformerEnd.baseU
        comments:
          - >-
            Not converted: would be the AutoTransformerEnd nameplate baseU (kV).

      # (15) kVAs
      kVAs:
        description: >-
          Use this to specify the kVA ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 15
        close_mappings:
          - cim:AutoTransformerEnd.ratedS
        comments:
          - >-
            Not converted: would be the AutoTransformerEnd ratedS (kVA).

      # (16) taps
      taps:
        description: >-
          Use this to specify the per-unit tap positions of all windings at once.
        range: string
        required: false
        annotations:
          order: 16
        todos:
          - "Not implemented; see tap todos."
        close_mappings:
          - cim:TapChanger.step
        comments:
          - >-
            Not converted: would be a RatioTapChanger step.

      # (17) XHX
      XHX:
        description: >-
          Use this to specify the percent reactance, H-L (winding 1 to winding 2).
          Default is 7.
        range: float
        required: false
        annotations:
          order: 17
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Not converted: would be the 1-2 mesh x.

      # (18) XHT
      XHT:
        description: >-
          Use this to specify the percent reactance, H-T (winding 1 to winding 3).
          Default is 35.
        range: float
        required: false
        annotations:
          order: 18
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Not converted: would be the 1-3 mesh x.

      # (19) XXT
      XXT:
        description: >-
          Use this to specify the percent reactance, L-T (winding 2 to winding 3).
          Default is 30.
        range: float
        required: false
        annotations:
          order: 19
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Not converted: would be the 2-3 mesh x.

      # (20) XSCarray
      XSCarray:
        description: >-
          Use this to specify the percent reactance between all pairs of windings
          as an array. Replaces XHX, XHT, XXT for transformers with more than
          3 windings.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 20
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Not converted: the array form of the mesh x.

      # (21) thermal
      thermal:
        description: >-
          Thermal time constant of the AutoTrans in hours.
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Not converted: thermal model; no home in the network profile parts.

      # (22) n
      n:
        description: >-
          n Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Not converted: thermal model; no home in the network profile parts.

      # (23) m
      m:
        description: >-
          m Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Not converted: thermal model; no home in the network profile parts.

      # (24) flrise
      flrise:
        description: >-
          Temperature rise, deg C, for full load.
        range: string
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Not converted: thermal model; no home in the network profile parts.

      # (25) hsrise
      hsrise:
        description: >-
          Hot spot temperature rise, deg C.
        range: string
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Not converted: thermal model; no home in the network profile parts.

      # (26) %loadloss
      pct_loadloss:
        description: >-
          Percent load loss at full load. Winding resistance losses.
        range: float
        required: false
        annotations:
          order: 26
          dss_name: "%loadloss"
        todos:
          - "%loadloss not read by the importer. If implemented, it should follow the same fallback used for regular Transformer: when neither %R nor %Rs is given, split %loadloss evenly across windings to derive each winding's %R."
        close_mappings:
          - cim:TransformerMeshImpedance.r
        comments:
          - >-
            Not converted: an AutoTransformer's winding resistance is the mesh
            r.

      # (27) %noloadloss
      pct_noloadloss:
        description: >-
          Percent no load losses at rated excitation voltage. Core losses.
        range: float
        required: false
        annotations:
          order: 27
          dss_name: "%noloadloss"
        comments:
          - >-
            Not converted: an AutoTransformerEnd has no core admittance.

      # (28) normhkVA
      normhkVA:
        description: >-
          Normal maximum kVA rating of H winding (winding 1+2).
        range: float
        required: false
        annotations:
          order: 28
        todos:
          - "Operational limit converter not yet implemented for transformers. Should map to a CurrentLimit or ApparentPowerLimit on the H winding terminal."
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Not converted: ratings are untranscribed.

      # (29) emerghkVA
      emerghkVA:
        description: >-
          Emergency (contingency) kVA rating of H winding (winding 1+2).
        range: float
        required: false
        annotations:
          order: 29
        todos:
          - "Emergency operational limit converter not yet implemented."
        close_mappings:
          - cim:ApparentPowerLimit.value
        comments:
          - >-
            Not converted: ratings are untranscribed.

      # (30) sub
      sub:
        description: >-
          ={Yes|No}  Designates whether this AutoTrans is to be considered a
          substation.
        range: boolean
        required: false
        annotations:
          order: 30
        todos:
          - "sub is not converted. If implemented, it should place the PowerTransformer in a Substation EquipmentContainer, using subname for the container's name."
        comments:
          - >-
            Not converted: DSS report flag.

      # (31) MaxTap
      MaxTap:
        description: >-
          Max per unit tap for the active winding. Default is 1.10.
        range: string
        required: false
        annotations:
          order: 31
        todos:
          - "No RatioTapChanger is created by the importer. MaxTap/MinTap/NumTaps should together populate RatioTapChanger.highStep/lowStep/stepVoltageIncrement on the tapped winding's PowerTransformerEnd."
        close_mappings:
          - cim:TapChanger.highStep
        comments:
          - >-
            Not converted: would be a RatioTapChanger range.

      # (32) MinTap
      MinTap:
        description: >-
          Min per unit tap for the active winding. Default is 0.90.
        range: string
        required: false
        annotations:
          order: 32
        todos:
          - "Not implemented; see MaxTap todos."
        close_mappings:
          - cim:TapChanger.lowStep
        comments:
          - >-
            Not converted: would be a RatioTapChanger range.

      # (33) NumTaps
      NumTaps:
        description: >-
          Total number of taps between min and max tap. Default is 32.
        range: integer
        required: false
        annotations:
          order: 33
        todos:
          - "Not implemented; see MaxTap todos."
        close_mappings:
          - cim:RatioTapChanger.stepVoltageIncrement
        comments:
          - >-
            Not converted: would be a RatioTapChanger range.

      # (34) subname
      subname:
        description: >-
          Substation Name. Used when sub=Yes.
        range: string
        required: false
        annotations:
          order: 34
        todos:
          - "Not implemented; see sub todos."
        comments:
          - >-
            Not converted: DSS report label.

      # (35) %imag
      pct_imag:
        description: >-
          Percent magnetizing current.
        range: float
        required: false
        annotations:
          order: 35
          dss_name: "%imag"
        comments:
          - >-
            Not converted: an AutoTransformerEnd has no core admittance.

      # (36) ppm_antifloat
      ppm_antifloat:
        description: >-
          ppm (parts per million) anti-float factor. Default=1 ppm. Prevents
          floating buses.
        range: float
        required: false
        annotations:
          order: 36
        comments:
          - >-
            Not converted: numerical aid of the DSS solver.

      # (37) %Rs
      pct_Rs:
        description: >-
          Use this property to specify all the winding ac %resistances using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 37
          dss_name: "%Rs"
        close_mappings:
          - cim:TransformerMeshImpedance.r
        comments:
          - >-
            Not converted: an AutoTransformer's winding resistance is the mesh
            r.

      # (38) bank
      bank:
        description: >-
          Name of the bank this transformer is part of, for CIM, MultiSpeak,
          and other interfaces.
        range: string
        required: false
        annotations:
          order: 38
        todos:
          - "bank is not converted. If implemented, it should group single-phase auto-transformer units sharing the same bank name into a TransformerTank."
        comments:
          - >-
            Not converted: each transformer would be its own container.

      # (39) XfmrCode
      XfmrCode:
        description: >-
          Name of a library entry for transformer properties. References an
          XfmrCode object.
        range: string
        required: false
        annotations:
          order: 39
        todos:
          - "XfmrCode is not read on import. If implemented, it should resolve to a catalog object by name and set PowerTransformer.AssetDatasheet."
        comments:
          - >-
            Not converted: the template classes name Transformer codes only.

      # (40) XRConst
      XRConst:
        description: >-
          ={Yes|No} Default is NO. If Yes, X/R ratio is constant with
          frequency.
        range: boolean
        required: false
        annotations:
          order: 40
        comments:
          - >-
            Not converted: harmonics option.

      # (41) LeadLag
      LeadLag:
        description: >-
          {Lead | Lag (default) | ANSI (default) | Euro } Designation in
          mixed Delta-wye connections of the relationship between HV to LV
          winding.
        range: string
        required: false
        annotations:
          order: 41
        comments:
          - >-
            Not converted: phase displacement; no home in the network profile
            parts.

      # (42) WdgCurrents
      WdgCurrents:
        description: >-
          (Read only) Makes winding currents available via return on query.
        range: float
        required: false
        annotations:
          order: 42
        comments:
          - >-
            Not converted: a read-only operational output.

      # (43) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 43
        todos:
          - "Operational limit converter not yet implemented for auto-transformers."
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Not converted: ratings are untranscribed.

      # (44) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 44
        todos:
          - "Emergency operational limit converter not yet implemented."
        close_mappings:
          - cim:CurrentLimit.value
        comments:
          - >-
            Not converted: ratings are untranscribed.

      # (45) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: string
        required: false
        annotations:
          order: 45
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Not converted: reliability data.

      # (46) pctperm
      pctperm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        annotations:
          order: 46
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Not converted: reliability data.

      # (47) repair
      repair:
        description: >-
          Hours to repair.
        range: string
        required: false
        annotations:
          order: 47
        todos:
          - "Requires CIM extension to roundtrip."
        comments:
          - >-
            Not converted: reliability data.

      # (48) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 48
        comments:
          - >-
            Not converted: no home on a transformer.

      # (49) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 49
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Not converted: would be normallyInService.

      # (50) like
      like:
        description: >-
          Make like another object, e.g.: New Autotrans.AT2 like=AT1 ...
        range: string
        required: false
        annotations:
          order: 50
        comments:
          - >-
            Not converted: resolved by the reader before mapping.
