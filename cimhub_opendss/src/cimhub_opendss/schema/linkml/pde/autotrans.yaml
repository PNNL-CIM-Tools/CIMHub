id: https://gridappsd.github.io/dss-graph/pde/autotrans
name: autotrans
title: OpenDSS Autotrans Component Schema
description: >-
  LinkML schema for OpenDSS Autotrans objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-50).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://iec.ch/TC57/CIM100#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Autotrans:
    description: >-
      A Autotrans object in OpenDSS representing an auto-transformer where the
      series and common windings share a magnetic core. Winding 1 is the series
      (high-side) winding; winding 2 is the common winding.
    class_uri: dss:Autotrans
    exact_mappings:
      - cim:PowerTransformer
    comments:
      - >-
        OpenDSS Autotrans maps to CIM PowerTransformer + PowerTransformerEnd (one per
        winding), TransformerMeshImpedance (for short-circuit reactances XHX/XHT/XXT),
        and TransformerCoreAdmittance (no-load losses, winding 1 only). Key difference
        from regular Transformer: uses XHX/XHT/XXT naming instead of XHL/XHT/XLT; every
        winding is imported as connectionKind Y, grounded, with zero ground impedance
        (CIM has no explicit auto-transformer WindingConnection type). There is no
        dedicated Autotrans exporter; export of a converted PowerTransformer is handled
        by the same code path as a regular Transformer.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - "Direct name mapping; no conversion needed."

      # (1) phases
      phases:
        description: >-
          Number of phases this AutoTrans.
        range: integer
        required: false
        annotations:
          order: 1
        comments:
          - "Import: inferred from bus connection specs. Not stored directly on CIM PowerTransformer (phase count is implicit in Terminal/End configuration)."

      # (2) windings
      windings:
        description: >-
          Number of windings, this AutoTrans. Typically 2 for a 2-winding auto-transformer.
        range: integer
        required: false
        annotations:
          order: 2
        related_mappings:
          - cim:PowerTransformerEnd
        comments:
          - "Import: creates one PowerTransformerEnd per winding. Export: len(PowerTransformer.PowerTransformerEnd)."

      # (3) wdg
      wdg:
        description: >-
          Set this = to the number of the winding you wish to define. Used as
          index selector for subsequent winding properties.
        range: integer
        required: false
        annotations:
          order: 3
        comments:
          - "OpenDSS-only (N/A): index selector consumed at parse time; no CIM equivalent."

      # (4) bus
      bus:
        description: >-
          Bus connection spec for the active winding (set by wdg property).
        range: string
        required: false
        annotations:
          order: 4
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - "Each winding bus maps to a Terminal → ConnectivityNode. buses[] is the array form of the same property."

      # (5) conn
      conn:
        description: >-
          Connection of this winding {Series, wye*, Delta, LN, LL}.
        range: string
        required: false
        annotations:
          order: 5
        exact_mappings:
          - cim:PowerTransformerEnd.connectionKind
        comments:
          - "Import: 'wye'/'wye-g' → WindingConnection.Y; 'delta' → WindingConnection.D. Export: reverse enum lookup. Auto-transformer windings are typically Y-connected in CIM."

      # (6) kV
      kV:
        description: >-
          For 2-or 3-phase, enter phase-phase kV rating. Otherwise, enter
          actual winding voltage rating.
        range: float
        required: false
        annotations:
          order: 6
        exact_mappings:
          - cim:PowerTransformerEnd.ratedU
        comments:
          - "Import: PowerTransformerEnd.ratedU = Voltage(kV, 'kV'). Export: kV = ratedU.to('kV'). CIM stores in V (SI base). kVs[] is the array form."

      # (7) kVA
      kVA:
        description: >-
          Base kVA rating of the winding.
        range: float
        required: false
        annotations:
          order: 7
        exact_mappings:
          - cim:PowerTransformerEnd.ratedS
        comments:
          - "Import: PowerTransformerEnd.ratedS = ApparentPower(kVA, 'kVA'). Export: kVA = ratedS.to('kVA'). CIM stores in VA (SI base). kVAs[] is the array form."

      # (8) tap
      tap:
        description: >-
          Per unit tap that this winding is on. Default is 1.0.
        range: string
        required: false
        annotations:
          order: 8
        comments:
          - "OpenDSS-only (N/A) for now: the current converter reads tap into an internal per-winding parameter but never uses it to create a RatioTapChanger; no CIM field is set from this property. taps[] is the array form."
        todos:
          - "tap/taps[] is parsed but not converted. If implemented, it should create a RatioTapChanger on the winding's PowerTransformerEnd with step derived from the per-unit tap value."

      # (9) %R
      pct_R:
        description: >-
          Percent ac resistance this winding. Default is 0.2%.
        range: float
        required: false
        annotations:
          order: 9
          dss_name: "%R"
        close_mappings:
          - cim:PowerTransformerEnd.r
        comments:
          - >-
            Import: for each winding, the percent resistance is taken from %Rs[winding]
            if given, else from %R (applied to every winding), else a default of 0.5
            percent; PowerTransformerEnd.r = Resistance(Zbase × pct_R / 100, 'ohm'),
            where Zbase = kV² × 1000 / kVA using that winding's own kV and kVA. Export:
            there is no dedicated Autotrans exporter, so the converted PowerTransformer
            is written back out by the generic Transformer exporter, which emits
            %r=<value> on every winding's continuation line using the same Zbase
            formula in reverse. The exported DSS text always uses the Transformer
            object type and XHL/XHT/XLT reactance naming, not Autotrans/XHX/XHT/XXT
            (see class-level comments).

      # (10) Rdcohms
      Rdcohms:
        description: >-
          Winding dc resistance in OHMS. Default is 0.
        range: integer
        required: false
        annotations:
          order: 10
        comments:
          - "OpenDSS-only (N/A): DC winding resistance for loss calculation; no separate CIM field on PowerTransformerEnd (CIM r is AC resistance)."

      # (11) Core
      Core:
        description: >-
          {Shell*|5-leg|3-Leg|1-phase|core-1-phase|4-leg} Core Type.
        range: string
        required: false
        annotations:
          order: 11
        comments:
          - "OpenDSS-only (N/A): core construction type; no CIM equivalent in the standard profile."

      # (12) buses
      buses:
        description: >-
          Use this to specify all the bus connections at once using an array.
          Array form of the winding bus property.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 12
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - "Array form of bus property; each element maps to a Terminal → ConnectivityNode for the corresponding winding."

      # (13) conns
      conns:
        description: >-
          Use this to specify all the Winding connections at once using an array.
        range: string
        multivalued: true
        required: false
        annotations:
          order: 13
        exact_mappings:
          - cim:PowerTransformerEnd.connectionKind
        comments:
          - "Array form of conn property. Each element maps to PowerTransformerEnd.connectionKind via the same enum lookup."

      # (14) kVs
      kVs:
        description: >-
          Use this to specify the kV ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 14
        exact_mappings:
          - cim:PowerTransformerEnd.ratedU
        comments:
          - "Array form of kV property. Each element maps to the corresponding PowerTransformerEnd.ratedU."

      # (15) kVAs
      kVAs:
        description: >-
          Use this to specify the kVA ratings of all windings at once using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:PowerTransformerEnd.ratedS
        comments:
          - "Array form of kVA property. Each element maps to the corresponding PowerTransformerEnd.ratedS."

      # (16) taps
      taps:
        description: >-
          Use this to specify the per-unit tap positions of all windings at once.
        range: string
        required: false
        annotations:
          order: 16
        comments:
          - "OpenDSS-only (N/A) for now: array form of tap; not converted by the current importer (see tap comments)."
        todos:
          - "Not implemented; see tap todos."

      # (17) XHX
      XHX:
        description: >-
          Use this to specify the percent reactance, H-L (winding 1 to winding 2).
          Default is 7.
        range: float
        required: false
        annotations:
          order: 17
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: creates a TransformerMeshImpedance between windings 1 and 2, with
            x = x0 = Zbase × XHX / 100, where Zbase uses winding 1's own kV together
            with the primary winding's kVA. The paired TransformerMeshImpedance.r/r0
            is set from the sum of the two windings' %R (see %R comments), not from
            XHX itself. No separate zero-sequence reactance is derived; x0 always
            equals x. Export: recovered as the generic Transformer exporter's XHL
            field, using the same Zbase convention in reverse; the exported DSS text
            uses Transformer/XHL naming, not Autotrans/XHX (see class-level comments).
            Name equivalent to XHL in regular Transformer.

      # (18) XHT
      XHT:
        description: >-
          Use this to specify the percent reactance, H-T (winding 1 to winding 3).
          Default is 35.
        range: float
        required: false
        annotations:
          order: 18
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: same TransformerMeshImpedance formula as XHX (see XHX comments),
            applied to the winding 1-to-3 pair; only used when 3 or more windings are
            present. Export: recovered as the generic Transformer exporter's XHT
            field (see XHX comments).

      # (19) XXT
      XXT:
        description: >-
          Use this to specify the percent reactance, L-T (winding 2 to winding 3).
          Default is 30.
        range: float
        required: false
        annotations:
          order: 19
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: same TransformerMeshImpedance formula as XHX (see XHX comments),
            applied to the winding 2-to-3 pair; only used when 3 or more windings are
            present. Export: recovered as the generic Transformer exporter's XLT
            field (see XHX comments).

      # (20) XSCarray
      XSCarray:
        description: >-
          Use this to specify the percent reactance between all pairs of windings
          as an array. Replaces XHX, XHT, XXT for transformers with more than
          3 windings.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 20
        close_mappings:
          - cim:TransformerMeshImpedance.x
        comments:
          - >-
            Import: array form giving one %Xsc entry per winding pair, in the order
            produced by iterating pairs (i, k) with i < k over winding indices; each
            entry uses the same TransformerMeshImpedance formula as XHX (see XHX
            comments). Used in place of XHX/XHT/XXT for transformers with more than
            3 windings. If fewer entries are given than there are winding pairs, the
            remaining pairs default to 10.0 percent (higher than the default used for
            a regular Transformer). Export: for more than 3 windings, the generic
            Transformer exporter recovers the full pairwise list as Xscarray using
            the same convention in reverse (see XHX comments).

      # (21) thermal
      thermal:
        description: >-
          Thermal time constant of the AutoTrans in hours.
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - "OpenDSS-only (N/A): thermal model parameter; no CIM equivalent in the standard profile."

      # (22) n
      n:
        description: >-
          n Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - "OpenDSS-only (N/A): IEEE C57 thermal exponent; no CIM equivalent."

      # (23) m
      m:
        description: >-
          m Exponent for thermal properties in IEEE C57.
        range: string
        required: false
        annotations:
          order: 23
        comments:
          - "OpenDSS-only (N/A): IEEE C57 thermal exponent; no CIM equivalent."

      # (24) flrise
      flrise:
        description: >-
          Temperature rise, deg C, for full load.
        range: string
        required: false
        annotations:
          order: 24
        comments:
          - "OpenDSS-only (N/A): thermal rating parameter; no CIM equivalent in the standard profile."

      # (25) hsrise
      hsrise:
        description: >-
          Hot spot temperature rise, deg C.
        range: string
        required: false
        annotations:
          order: 25
        comments:
          - "OpenDSS-only (N/A): hot spot thermal rating; no CIM equivalent."

      # (26) %loadloss
      pct_loadloss:
        description: >-
          Percent load loss at full load. Winding resistance losses.
        range: float
        required: false
        annotations:
          order: 26
          dss_name: "%loadloss"
        comments:
          - >-
            OpenDSS-only (N/A) for now: the current converter never reads %loadloss;
            no CIM field is set from this property. (%R/%Rs, not %loadloss, is what
            drives PowerTransformerEnd.r for auto-transformers — see %R comments.)
        todos:
          - "%loadloss not read by the importer. If implemented, it should follow the same fallback used for regular Transformer: when neither %R nor %Rs is given, split %loadloss evenly across windings to derive each winding's %R."

      # (27) %noloadloss
      pct_noloadloss:
        description: >-
          Percent no load losses at rated excitation voltage. Core losses.
        range: float
        required: false
        annotations:
          order: 27
          dss_name: "%noloadloss"
        close_mappings:
          - cim:TransformerCoreAdmittance.g
        comments:
          - >-
            Import: a TransformerCoreAdmittance is created on winding 1 only when
            %noloadloss or %imag is nonzero, with g = g0 = %noloadloss / 100 / Zbase,
            where Zbase uses winding 1's own kV and kVA. Export: the generic
            Transformer exporter recovers %noloadloss = g × Zbase × 100 using the same
            Zbase convention; if no TransformerCoreAdmittance is present, it falls
            back to a catalog-based (NoLoadTest) recovery path instead.

      # (28) normhkVA
      normhkVA:
        description: >-
          Normal maximum kVA rating of H winding (winding 1+2).
        range: float
        required: false
        annotations:
          order: 28
        related_mappings:
          - cim:OperationalLimit
        todos:
          - "Operational limit converter not yet implemented for transformers. Should map to a CurrentLimit or ApparentPowerLimit on the H winding terminal."

      # (29) emerghkVA
      emerghkVA:
        description: >-
          Emergency (contingency) kVA rating of H winding (winding 1+2).
        range: float
        required: false
        annotations:
          order: 29
        related_mappings:
          - cim:OperationalLimit
        todos:
          - "Emergency operational limit converter not yet implemented."

      # (30) sub
      sub:
        description: >-
          ={Yes|No}  Designates whether this AutoTrans is to be considered a
          substation.
        range: boolean
        required: false
        annotations:
          order: 30
        comments:
          - "OpenDSS-only (N/A) for now: not read by the current importer; no CIM field is set from this property."
        todos:
          - "sub is not converted. If implemented, it should place the PowerTransformer in a Substation EquipmentContainer, using subname for the container's name."

      # (31) MaxTap
      MaxTap:
        description: >-
          Max per unit tap for the active winding. Default is 1.10.
        range: string
        required: false
        annotations:
          order: 31
        comments:
          - "OpenDSS-only (N/A) for now: the current importer never creates a RatioTapChanger for an auto-transformer winding (see tap comments), so MaxTap is not read into any CIM field."
        todos:
          - "No RatioTapChanger is created by the importer. MaxTap/MinTap/NumTaps should together populate RatioTapChanger.highStep/lowStep/stepVoltageIncrement on the tapped winding's PowerTransformerEnd."

      # (32) MinTap
      MinTap:
        description: >-
          Min per unit tap for the active winding. Default is 0.90.
        range: string
        required: false
        annotations:
          order: 32
        comments:
          - "OpenDSS-only (N/A) for now: not read by the current importer (see MaxTap comments)."
        todos:
          - "Not implemented; see MaxTap todos."

      # (33) NumTaps
      NumTaps:
        description: >-
          Total number of taps between min and max tap. Default is 32.
        range: integer
        required: false
        annotations:
          order: 33
        comments:
          - "OpenDSS-only (N/A) for now: not read by the current importer; if implemented, would combine with MaxTap/MinTap to derive RatioTapChanger.stepVoltageIncrement = (MaxTap - MinTap) / NumTaps (see MaxTap comments)."
        todos:
          - "Not implemented; see MaxTap todos."

      # (34) subname
      subname:
        description: >-
          Substation Name. Used when sub=Yes.
        range: string
        required: false
        annotations:
          order: 34
        comments:
          - "OpenDSS-only (N/A) for now: not read by the current importer (see sub comments)."
        todos:
          - "Not implemented; see sub todos."

      # (35) %imag
      pct_imag:
        description: >-
          Percent magnetizing current.
        range: float
        required: false
        annotations:
          order: 35
          dss_name: "%imag"
        close_mappings:
          - cim:TransformerCoreAdmittance.b
        comments:
          - >-
            Import: same TransformerCoreAdmittance created as for %noloadloss (see
            %noloadloss comments), with b = b0 = %imag / 100 / Zbase. Export: the
            generic Transformer exporter recovers %imag = b × Zbase × 100 using the
            same Zbase convention (or the catalog-based fallback if no
            TransformerCoreAdmittance is present).

      # (36) ppm_antifloat
      ppm_antifloat:
        description: >-
          ppm (parts per million) anti-float factor. Default=1 ppm. Prevents
          floating buses.
        range: float
        required: false
        annotations:
          order: 36
        comments:
          - "OpenDSS-only (N/A): numerical stability parameter; no CIM equivalent."

      # (37) %Rs
      pct_Rs:
        description: >-
          Use this property to specify all the winding ac %resistances using an array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 37
          dss_name: "%Rs"
        close_mappings:
          - cim:PowerTransformerEnd.r
        comments:
          - "Array form of %R property. Each element maps to the corresponding PowerTransformerEnd.r via the same percent-to-ohm conversion."

      # (38) bank
      bank:
        description: >-
          Name of the bank this transformer is part of, for CIM, MultiSpeak,
          and other interfaces.
        range: string
        required: false
        annotations:
          order: 38
        comments:
          - "OpenDSS-only (N/A) for now: not read by the current importer; no TransformerTank grouping is created for an Autotrans."
        todos:
          - "bank is not converted. If implemented, it should group single-phase auto-transformer units sharing the same bank name into a TransformerTank."

      # (39) XfmrCode
      XfmrCode:
        description: >-
          Name of a library entry for transformer properties. References an
          XfmrCode object.
        range: string
        required: false
        annotations:
          order: 39
        related_mappings:
          - cim:PowerTransformer.AssetDatasheet
        comments:
          - >-
            Import: not read by the current importer; PowerTransformer.AssetDatasheet
            is never set for an Autotrans. Export: if AssetDatasheet happens to be set
            (e.g. by another tool), the generic Transformer exporter writes
            XfmrCode=AssetDatasheet.name.
        todos:
          - "XfmrCode is not read on import. If implemented, it should resolve to a catalog object by name and set PowerTransformer.AssetDatasheet."

      # (40) XRConst
      XRConst:
        description: >-
          ={Yes|No} Default is NO. If Yes, X/R ratio is constant with
          frequency.
        range: boolean
        required: false
        annotations:
          order: 40
        comments:
          - "OpenDSS-only (N/A): frequency dependence flag; no CIM equivalent."

      # (41) LeadLag
      LeadLag:
        description: >-
          {Lead | Lag (default) | ANSI (default) | Euro } Designation in
          mixed Delta-wye connections of the relationship between HV to LV
          winding.
        range: string
        required: false
        annotations:
          order: 41
        comments:
          - "OpenDSS-only (N/A): phase displacement designation; no standard CIM field on PowerTransformerEnd for this."

      # (42) WdgCurrents
      WdgCurrents:
        description: >-
          (Read only) Makes winding currents available via return on query.
        range: float
        required: false
        annotations:
          order: 42
        comments:
          - "OpenDSS-only (N/A): read-only operational output; no CIM equivalent."

      # (43) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 43
        related_mappings:
          - cim:CurrentLimit
        todos:
          - "Operational limit converter not yet implemented for auto-transformers."

      # (44) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 44
        related_mappings:
          - cim:CurrentLimit
        todos:
          - "Emergency operational limit converter not yet implemented."

      # (45) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: string
        required: false
        annotations:
          order: 45
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip."

      # (46) pctperm
      pctperm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        annotations:
          order: 46
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip."

      # (47) repair
      repair:
        description: >-
          Hours to repair.
        range: string
        required: false
        annotations:
          order: 47
        comments:
          - "Reliability parameter; no CIM equivalent in the standard profile."
        todos:
          - "Requires CIM extension to roundtrip."

      # (48) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 48
        comments:
          - "Not stored on CIM PowerTransformer; base frequency is a circuit-level property in CIM."

      # (49) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 49
        comments:
          - "OpenDSS-only (N/A): if False, converter returns None and no CIM object is created."

      # (50) like
      like:
        description: >-
          Make like another object, e.g.: New Autotrans.AT2 like=AT1 ...
        range: string
        required: false
        annotations:
          order: 50
        comments:
          - "OpenDSS-only (N/A): DSS template/copy directive resolved at parse time; no CIM equivalent."
