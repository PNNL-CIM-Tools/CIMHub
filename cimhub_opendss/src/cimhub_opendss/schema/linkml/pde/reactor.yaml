id: https://gridappsd.github.io/dss-graph/pde/reactor
name: reactor
title: OpenDSS Reactor Component Schema
description: >-
  LinkML schema for OpenDSS Reactor objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-27).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Reactor:
    description: >-
      A Reactor object in OpenDSS representing a series or shunt impedance branch.
      Two-terminal reactors (bus1 + bus2) are mapped to CIM SeriesCompensator.
      A single-terminal (shunt) reactor raises on import.
    class_uri: dss:Reactor
    close_mappings:
      - cim:SeriesCompensator
    comments:
      - >-
        Import: a two-terminal series Reactor becomes a SeriesCompensator in reactor.cimtbl (r0 = r,
        x0 = x). A shunt or neutral reactor (no bus2, or bus2 on bus1's bus) raises, as do kvar,
        matrices and the Z forms. Export: SeriesCompensator is written as a Reactor
        (exporter/reactor.py).
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to SeriesCompensator.name; mRID = rx_ + name, lowercased. Export: Names,
            the Reactor namespace.

      # (1) bus1
      bus1:
        description: >-
          Name of first bus. Primary terminal connection.
        range: string
        required: false
        annotations:
          order: 1
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node1 and the phases (the line rule). Export: terminal_buses
            (line.py): the first terminal on the phase conductors.

      # (2) bus2
      bus2:
        description: >-
          Name of 2nd bus. If absent, this is a single-terminal shunt reactor.
        range: string
        required: false
        annotations:
          order: 2
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node2; unset or on bus1's bus (a shunt or neutral reactor) raises.
            Export: terminal_buses: the second terminal.

      # (3) phases
      phases:
        description: >-
          Number of phases.
        range: integer
        required: false
        annotations:
          order: 3
          dss_default: int(3)
        related_mappings:
          - cim:Terminal.phases
        comments:
          - "Import: structural; the conductor count; default 3. Export: the phase conductors."

      # (4) kvar
      kvar:
        description: >-
          Total kvar, all phases. Used to derive reactance when X is not specified.
        range: float
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (X from kvar and kV). Export: not written, R and X carry the impedance; r0/x0
            other than r/x raise.

      # (5) kv
      kv:
        description: >-
          For 2, 3-phase, kV phase-phase. Used with kvar to derive reactance.
        range: float
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed; acts only with kvar, which raises. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (6) conn
      conn:
        description: >-
          ={wye | delta |LN |LL}  Default is wye, which is equivalent to LN.
        range: string
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: untranscribed; a series reactor has no neutral. Export: not written,
            untranscribed or raising on import; not in CIM.

      # (7) Rmatrix
      Rmatrix:
        description: >-
          Resistance matrix, lower triangle, ohms at base frequency.
        range: integer
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.
        todos:
          - "Phase-impedance matrix path not yet implemented for Reactor."

      # (8) Xmatrix
      Xmatrix:
        description: >-
          Reactance matrix, lower triangle, ohms at base frequency.
        range: integer
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.
        todos:
          - "Phase-impedance matrix path not yet implemented for Reactor."

      # (9) Parallel
      Parallel:
        description: >-
          {Yes | No}  Default=No. If Yes, model as a parallel R-L combination
          instead of series.
        range: boolean
        required: false
        annotations:
          order: 9
          dss_default: "false"
        comments:
          - >-
            Import: structural; raises when yes; no deck in the sweep sets it. Export: not written,
            R and X carry the impedance; r0/x0 other than r/x raise.

      # (10) R
      R:
        description: >-
          Resistance (in series with reactance), each phase, ohms.
        range: float
        required: false
        annotations:
          order: 10
          dss_default: float(0.0)
        close_mappings:
          - cim:SeriesCompensator.r
          - cim:SeriesCompensator.r0
        comments:
          - >-
            Import: copied to SeriesCompensator.r (ohm), SeriesCompensator.r0 (ohm); per phase; r0 =
            r (no mutual); default 0. Export: get_series_compensator r (ohm).

      # (11) X
      X:
        description: >-
          Reactance, each phase, ohms at base frequency.
        range: float
        required: false
        annotations:
          order: 11
        close_mappings:
          - cim:SeriesCompensator.x
          - cim:SeriesCompensator.x0
        comments:
          - >-
            Import: copied to SeriesCompensator.x (ohm), SeriesCompensator.x0 (ohm); per phase; x0 =
            x (no mutual); unset raises. Export: get_series_compensator x (ohm).

      # (12) Rp
      Rp:
        description: >-
          Resistance in parallel with R and X (the entire branch). Represents
          core loss equivalent.
        range: float
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (a parallel R). Export: not written, R and X carry the impedance; r0/x0 other
            than r/x raise.

      # (13) Z1
      Z1:
        description: >-
          Positive-sequence impedance, ohms, as a 2-element array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.

      # (14) Z2
      Z2:
        description: >-
          Negative-sequence impedance, ohms, as a 2-element array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.

      # (15) Z0
      Z0:
        description: >-
          Zero-sequence impedance, ohms, as a 2-element array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 15
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.

      # (16) Z
      Z:
        description: >-
          Alternative way of defining R and X properties as a complex array.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 16
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, R and X carry the impedance; r0/x0 other than r/x raise.

      # (17) RCurve
      RCurve:
        description: >-
          Name of XYCurve object describing per-unit variation of phase
          resistance, R, vs. frequency.
        range: float
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (18) LCurve
      LCurve:
        description: >-
          Name of XYCurve object describing per-unit variation of phase
          inductance, L=X/w, vs. frequency.
        range: float
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one. Export: not written, untranscribed or raising on import; not in CIM.

      # (19) LmH
      LmH:
        description: >-
          Inductance, mH. Alternate way to specify X at base frequency.
        range: float
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep sets it, so a mapping waits
            for one (X from an inductance). Export: not written, R and X carry the impedance; r0/x0
            other than r/x raise.

      # (20) normamps
      normamps:
        description: >-
          Normal rated current.
        range: float
        required: false
        annotations:
          order: 20
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; instance OperationalLimitSet rx_<name>_limits: CurrentLimit _norm
            (olt_normal); nothing from the engine's kvar-derived default. Export: get_current_limits
            normal (A); unset -> not written.

      # (21) emergamps
      emergamps:
        description: >-
          Maximum or emerg current.
        range: float
        required: false
        annotations:
          order: 21
        close_mappings:
          - cim:CurrentLimit.normalValue
        comments:
          - >-
            Import: structural; CurrentLimit _emerg (olt_emergency) in rx_<name>_limits. Export:
            get_current_limits emergency (A); unset -> not written.

      # (22) faultrate
      faultrate:
        description: >-
          Failure rate per year.
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed; a reliability setting; no home in the network profile parts.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Requires CIM extension to roundtrip."

      # (23) pctperm
      pctperm:
        description: >-
          Percent of failures that become permanent.
        range: float
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Import: untranscribed; a reliability setting; no home in the network profile parts.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Requires CIM extension to roundtrip."

      # (24) repair
      repair:
        description: >-
          Hours to repair.
        range: string
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Import: untranscribed; a reliability setting; no home in the network profile parts.
            Export: not written, untranscribed or raising on import; not in CIM.
        todos:
          - "Requires CIM extension to roundtrip."

      # (25) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: untranscribed; no home on a compensator; x is at the model's frequency. Export:
            not written, untranscribed or raising on import; not in CIM.

      # (26) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 26
          dss_default: "true"
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: copied to SeriesCompensator.normallyInService; default true. Export:
            get_in_service(which='normal'); unset -> not written.

      # (27) like
      like:
        description: >-
          Make like another object, e.g.: New Reactor.R2 like=R1 ...
        range: string
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
