id: https://gridappsd.github.io/dss-graph/other/vsource
name: vsource
title: OpenDSS Vsource Component Schema
description: >-
  LinkML schema for OpenDSS Vsource objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-35).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Vsource:
    description: >-
      A Vsource object in OpenDSS representing an ideal voltage source (slack bus)
      in the distribution system. Used to represent the transmission-system
      equivalent or a substation source.
    class_uri: dss:Vsource
    exact_mappings:
      - cim:EnergySource
    comments:
      - >-
        Import: a Vsource becomes an EnergySource on its bus in vsource.cimtbl; the Thevenin
        impedance is copied (R1, X1, R0, X0) or derived from MVAsc/Isc and x/r
        (thevenin_from_short_circuit). Z1, Z0, Z2, puZ and bus2 raise.
      - >-
        Export: one Vsource per EnergySource through get_source (exporter/vsource.py); a 1-phase
        source is written as the MVAsc group.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: copied to EnergySource.name; mRID = src_ + name, lowercased. Export: Names; the
            circuit's source is always `source`.

      # (1) bus1
      bus1:
        description: >-
          Name of bus to which the main terminal (1) is connected.
        range: string
        required: false
        annotations:
          order: 1
          dss_default: sourcebus
        related_mappings:
          - cim:Terminal.ConnectivityNode
        comments:
          - >-
            Import: structural; node, and phases from its conductors; default sourcebus. Export:
            bus_ref(get_terminal_nodes, get_source.phases).

      # (2) basekv
      basekv:
        description: >-
          Base Source kV, usually phase-phase (L-L) unless positive-sequence or
          single-phase model. Default is 115 kV.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 2
          dss_default: float(115.0)
        exact_mappings:
          - cim:EnergySource.nominalVoltage
        comments:
          - "Import: copied to EnergySource.nominalVoltage (kV). Export: get_source.nominal_u (kV)."

      # (3) pu
      pu:
        description: >-
          Per unit of the base voltage that the source is actually operating at.
          Default is 1.0.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 3
          dss_default: float(1.0)
        close_mappings:
          - cim:EnergySource.voltageMagnitude
        comments:
          - "Import: derived; voltageMagnitude (kV) = basekv x pu. Export: get_source.magnitude_pu."

      # (4) angle
      angle:
        description: >-
          Phase angle in degrees of first phase. Default is 0 degrees.
        range: float
        required: false
        annotations:
          order: 4
          dss_default: float(0.0)
        exact_mappings:
          - cim:EnergySource.voltageAngle
        comments:
          - >-
            Import: copied to EnergySource.voltageAngle (deg). Export: rule, get_source.angle (deg);
            unset -> 0, the reference angle.

      # (5) frequency
      frequency:
        description: >-
          Source frequency. Default = circuit base frequency.
        range: float
        unit:
          ucum_code: Hz
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed; the master's BaseFrequency is the deck's. Export: not written,
            Options.defaultbasefreq is the deck's.

      # (6) phases
      phases:
        description: >-
          Number of phases. Default = 3.
        range: integer
        required: false
        annotations:
          order: 6
          dss_default: int(3)
        related_mappings:
          - cim:Terminal.phases
        comments:
          - >-
            Import: structural; 3 = ABC, 1 = the phase of bus1's conductor. Export: the phase
            conductors: 3 or 1, any other count raises.

      # (7) MVAsc3
      MVAsc3:
        description: >-
          MVA Short circuit, 3-phase fault. Used to derive positive-sequence
          impedance.
        range: float
        required: false
        annotations:
          order: 7
          dss_default: float(2000.0)
        close_mappings:
          - cim:EnergySource.r
          - cim:EnergySource.x
        comments:
          - >-
            Import: derived; r, x (thevenin_from_short_circuit). Export: 1-phase: kV^2 / abs(Z1)
            (short_circuit_from_thevenin).

      # (8) MVAsc1
      MVAsc1:
        description: >-
          MVA Short Circuit, 1-phase fault. Used to derive zero-sequence impedance.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(2100.0)
        close_mappings:
          - cim:EnergySource.r0
          - cim:EnergySource.x0
        comments:
          - >-
            Import: derived; r0, x0 (thevenin_from_short_circuit). Export: 1-phase: 3 kV^2 / abs(2
            Z1 + Z0).

      # (9) x1r1
      x1r1:
        description: >-
          Positive-sequence X/R ratio. Used with MVAsc3 to derive R1, X1.
        range: float
        required: false
        annotations:
          order: 9
          dss_default: float(4.0)
        close_mappings:
          - cim:EnergySource.r
          - cim:EnergySource.x
        comments:
          - >-
            Import: derived; r, x (thevenin_from_short_circuit). Export: 1-phase: x / r; r = 0
            raises.

      # (10) x0r0
      x0r0:
        description: >-
          Zero-sequence X/R ratio. Used with MVAsc1 to derive R0, X0.
        range: float
        required: false
        annotations:
          order: 10
          dss_default: float(3.0)
        close_mappings:
          - cim:EnergySource.r0
          - cim:EnergySource.x0
        comments:
          - >-
            Import: derived; r0, x0 (thevenin_from_short_circuit). Export: 1-phase: x0 / r0; r0 = 0
            raises.

      # (11) Isc3
      Isc3:
        description: >-
          Alternate method of defining source impedance via 3-phase fault current, amps.
        range: float
        required: false
        unit:
          ucum_code: A
        annotations:
          order: 11
        close_mappings:
          - cim:EnergySource.r
          - cim:EnergySource.x
        comments:
          - >-
            Import: derived; the 3-phase short-circuit kVA (kvasc_from_isc), then as MVAsc3, r and x
            in kohm. Export: not written, the ohms
            or the MVAsc group carries the same impedance.

      # (12) Isc1
      Isc1:
        description: >-
          Alternate method of defining source impedance via single-phase fault current, amps.
        range: float
        required: false
        unit:
          ucum_code: A
        annotations:
          order: 12
        close_mappings:
          - cim:EnergySource.r0
          - cim:EnergySource.x0
        comments:
          - >-
            Import: derived; the 1-phase short-circuit kVA (kvasc_from_isc), then as MVAsc1, r0 and
            x0 in kohm. Export: not written, the ohms
            or the MVAsc group carries the same impedance.

      # (13) R1
      R1:
        description: >-
          Positive-sequence resistance, ohms. Alternate way to define source impedance.
        range: float
        required: false
        annotations:
          order: 13
        exact_mappings:
          - cim:EnergySource.r
        comments:
          - >-
            Import: copied to EnergySource.r (ohm). Export: 3-phase: get_source.impedance.r (ohm);
            r, x, r0, x0 unset raises (DSS takes one group).

      # (14) X1
      X1:
        description: >-
          Positive-sequence reactance, ohms.
        range: float
        required: false
        annotations:
          order: 14
        exact_mappings:
          - cim:EnergySource.x
        comments:
          - "Import: copied to EnergySource.x (ohm). Export: 3-phase: get_source.impedance.x (ohm)."

      # (15) R0
      R0:
        description: >-
          Zero-sequence resistance, ohms.
        range: float
        required: false
        annotations:
          order: 15
        exact_mappings:
          - cim:EnergySource.r0
        comments:
          - "Import: copied to EnergySource.r0 (ohm). Export: 3-phase: get_source.impedance.r0 (ohm)."

      # (16) X0
      X0:
        description: >-
          Zero-sequence reactance, ohms.
        range: float
        required: false
        annotations:
          order: 16
        exact_mappings:
          - cim:EnergySource.x0
        comments:
          - "Import: copied to EnergySource.x0 (ohm). Export: 3-phase: get_source.impedance.x0 (ohm)."

      # (17) ScanType
      ScanType:
        description: >-
          {pos*| zero | none} Maintain specified sequence for harmonic solution.
        range: string
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: untranscribed; harmonic solution setting; no home in the network profile parts.
            Export: not written, not in CIM (untranscribed on import).

      # (18) Sequence
      Sequence:
        description: >-
          {pos*| neg | zero} Set the phase angles for the specified symmetrical
          component sequence for non-harmonic solution modes.
        range: string
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: untranscribed; harmonic solution setting; no home in the network profile parts.
            Export: not written, not in CIM (untranscribed on import).

      # (19) bus2
      bus2:
        description: >-
          Name of bus to which 2nd terminal is connected. Default is the floating
          neutral node.
        range: string
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: structural; raises when set: an ungrounded (series) source has no source-shape
            home. Export: not written, an EnergySource has one terminal.

      # (20) Z1
      Z1:
        description: >-
          Positive-sequence equivalent source impedance, ohms, as a 2-element
          complex array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, the ohms or the MVAsc group carries the same impedance.
        todos:
          - "Converter does not currently consume Z1 as an r/x source; would need to be added to the import fallback chain to roundtrip models that only set Z1."

      # (21) Z0
      Z0:
        description: >-
          Zero-sequence equivalent source impedance, ohms, as a 2-element
          complex array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, the ohms or the MVAsc group carries the same impedance.
        todos:
          - "Converter does not currently consume Z0 as an r0/x0 source; would need to be added to the import fallback chain to roundtrip models that only set Z0."

      # (22) Z2
      Z2:
        description: >-
          Negative-sequence equivalent source impedance, ohms, as a 2-element
          complex array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, r2/x2 set and different from r/x raises: the Z2 group is
            not mapped (nor imported).

      # (23) puZ1
      puZ1:
        description: >-
          Positive-sequence impedance in per-unit on the baseMVA base, as a 2-element
          complex array [R, X].
        range: float
        multivalued: true
        required: false
        annotations:
          order: 23
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, the ohms or the MVAsc group carries the same impedance.
        todos:
          - "Converter does not currently consume puZ1 as an r/x source; would need to be added to the import fallback chain to roundtrip models that only set puZ1."

      # (24) puZ0
      puZ0:
        description: >-
          Zero-sequence impedance in per-unit.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, the ohms or the MVAsc group carries the same impedance.
        todos:
          - "Converter does not currently consume puZ0 as an r0/x0 source; would need to be added to the import fallback chain to roundtrip models that only set puZ0."

      # (25) puZ2
      puZ2:
        description: >-
          Negative-sequence impedance in per-unit.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one. Export: not written, the ohms or the MVAsc group carries the same impedance.

      # (26) baseMVA
      baseMVA:
        description: >-
          Base MVA for converting per-unit impedances. Default is 100 MVA.
        range: float
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: structural; raises when set: no deck in the sweep uses it, so a mapping waits
            for one (the base of puZ1/puZ0/puZ2). Export: not written, the ohms or the MVAsc group
            carries the same impedance.

      # (27) Yearly
      Yearly:
        description: >-
          LOADSHAPE object to use for the per-unit voltage for YEARLY-mode
          simulations.
        range: string
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: untranscribed; time series; no home in the network profile parts. Export: not
            written, not in CIM (untranscribed on import).
        todos:
          - "Loadshape converter not yet implemented."

      # (28) Daily
      Daily:
        description: >-
          LOADSHAPE object to use for the per-unit voltage for DAILY-mode
          simulations.
        range: string
        required: false
        annotations:
          order: 28
        comments:
          - >-
            Import: untranscribed; time series; no home in the network profile parts. Export: not
            written, not in CIM (untranscribed on import).
        todos:
          - "Loadshape converter not yet implemented."

      # (29) Duty
      Duty:
        description: >-
          LOADSHAPE object to use for the per-unit voltage for DUTYCYCLE-mode
          simulations.
        range: string
        required: false
        annotations:
          order: 29
        comments:
          - >-
            Import: untranscribed; time series; no home in the network profile parts. Export: not
            written, not in CIM (untranscribed on import).
        todos:
          - "Loadshape converter not yet implemented."

      # (30) Model
      Model:
        description: >-
          {Thevenin* | Ideal} Specifies whether the Vsource is to be considered
          a Thevenin short circuit model or a quasi-ideal voltage source.
        range: string
        required: false
        annotations:
          order: 30
        comments:
          - >-
            Import: untranscribed; Thevenin or ideal source model; no home on EnergySource. Export:
            not written, not in CIM (untranscribed on import).

      # (31) puZideal
      puZideal:
        description: >-
          Per-unit series impedance when Model=Ideal.
        range: float
        multivalued: true
        required: false
        annotations:
          order: 31
        comments:
          - >-
            Import: untranscribed; the ideal model's impedance; no home on EnergySource. Export: not
            written, not in CIM (untranscribed on import).

      # (32) spectrum
      spectrum:
        description: >-
          Name of harmonic spectrum for this source.
        range: string
        required: false
        annotations:
          order: 32
        comments:
          - >-
            Import: untranscribed; harmonic solution setting; no home in the network profile parts.
            Export: not written, not in CIM (untranscribed on import).

      # (33) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 33
        comments:
          - >-
            Import: untranscribed; the master's BaseFrequency is the deck's. Export: not written,
            Options.defaultbasefreq is the deck's.

      # (34) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 34
        exact_mappings:
          - cim:Equipment.normallyInService
        comments:
          - >-
            Import: copied to EnergySource.normallyInService. Export:
            get_in_service(which='normal'); unset -> not written.

      # (35) like
      like:
        description: >-
          Make like another object, e.g.: New Vsource.V2 like=V1 ...
        range: string
        required: false
        annotations:
          order: 35
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping. Export: not written,
            the writer never writes like=.
