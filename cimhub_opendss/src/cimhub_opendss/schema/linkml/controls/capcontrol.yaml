id: https://gridappsd.github.io/dss-graph/controls/capcontrol
name: capcontrol
title: OpenDSS Capcontrol Component Schema
description: >-
  LinkML schema for OpenDSS Capcontrol objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-26).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Capcontrol:
    description: >-
      A Capcontrol object in OpenDSS representing a capacitor bank control that
      monitors a line or transformer and switches the capacitor ON or OFF.
    class_uri: dss:Capcontrol
    exact_mappings:
      - cim:RegulatingControl
    comments:
      - >-
        Import: one RegulatingControl cc_ + name on the monitored Terminal
        (capcontrol.cimtbl); its capacitor gets RegulatingControl, aVRDelay and
        controlEnabled by an Update. Export: one CapControl per
        RegulatingControl that regulates one LinearShuntCompensator.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: RegulatingControl.name, mRID = cc_ + name, lowercased.
            Export: Names, the CapControl namespace.

      # (1) element
      element:
        description: >-
          Full object name of the circuit element (typically a line or transformer)
          to which the capacitor control's PT and/or CT are connected.
        range: string
        required: false
        annotations:
          order: 1
        close_mappings:
          - cim:RegulatingControl.Terminal
        comments:
          - >-
            Import: the Terminal of the Line (ln_ or sw_) or Capacitor (cap_) it
            names; another element class raises. Export: Line.<name> or
            Capacitor.<name> of the monitored Terminal's equipment.

      # (2) terminal
      terminal:
        description: >-
          Number of the terminal of the circuit element to which the CapControl
          is connected. Default is 1.
        range: integer
        required: false
        annotations:
          order: 2
          dss_default: int(1)
        close_mappings:
          - cim:RegulatingControl.Terminal
        comments:
          - >-
            Import: the element's terminal, default 1. Export: the monitored
            Terminal's sequenceNumber.

      # (3) capacitor
      capacitor:
        description: >-
          Name of Capacitor element which the CapControl controls.
        range: string
        required: false
        annotations:
          order: 3
        close_mappings:
          - cim:RegulatingCondEq.RegulatingControl
        comments:
          - >-
            Import: the Update row on cap_<capacitor>; a capacitor no New
            defines raises. Export: the one LinearShuntCompensator the control
            regulates.

      # (4) type
      type:
        description: >-
          {Current | voltage | kvar | PF | time | Follow} Control type.
          Default is current.
        range: string
        required: false
        annotations:
          order: 4
          dss_default: string(current)
        close_mappings:
          - cim:RegulatingControl.mode
        comments:
          - >-
            Import: voltage -> voltage, current -> currentFlow, kvar ->
            reactivePower, time -> timeScheduled; PF and Follow raise; default
            current. Export: the reverse; other modes raise.

      # (5) PTratio
      PTratio:
        description: >-
          Ratio of the PT that converts the monitored voltage to the control voltage.
          Default is 60.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 5
          dss_default: float(60.0)
        exact_mappings:
          - cim:RegulatingControl.ptRatio
        comments:
          - >-
            Import: ptRatio; default 60. Export: ptRatio; unset raises for a
            voltage control.

      # (6) CTratio
      CTratio:
        description: >-
          Ratio of the CT from line amps to control ampere setting for current
          and kvar control types. Default is 60.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 6
          dss_default: float(60.0)
        exact_mappings:
          - cim:RegulatingControl.ctRatio
        comments:
          - >-
            Import: ctRatio; default 60. Export: ctRatio; unset raises for a
            current control.

      # (7) ONsetting
      ONsetting:
        description: >-
          Value at which the control arms to switch the capacitor ON (or ratchet
          up a step). Default is 300 amps.
        range: float
        required: false
        annotations:
          order: 7
          dss_default: float(300.0)
          dss_name: "on"
        close_mappings:
          - cim:RegulatingControl.targetValue
        comments:
          - >-
            Import: derived; targetValue = (ON + OFF) / 2, voltage x PTratio
            (V), current x CTratio (A), kvar in kvar (targetValueUnitMultiplier
            k), time in hours; ON on the wrong side of OFF raises; default 300. Export: targetValue -+
            targetDeadband / 2, divided by the ratio.

      # (8) OFFsetting
      OFFsetting:
        description: >-
          Value at which the control arms to switch the capacitor OFF.
          Default is 200 amps.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(200.0)
          dss_name: "off"
        close_mappings:
          - cim:RegulatingControl.targetDeadband
        comments:
          - >-
            Import: derived; targetDeadband = abs(OFF - ON), scaled as
            ONsetting; default 200. Export: targetValue +- targetDeadband / 2;
            an unset deadband raises.

      # (9) Delay
      Delay:
        description: >-
          Time delay, in seconds, from when the control is armed before it sends
          the switching command to turn ON. Default is 15 s.
        range: float
        required: false
        annotations:
          order: 9
          dss_default: float(15.0)
        exact_mappings:
          - cim:ShuntCompensator.aVRDelay
        comments:
          - >-
            Import: aVRDelay (s) on the compensator's Update row; default 15.
            Export: aVRDelay (s); unset -> not written.

      # (10) VoltOverride
      VoltOverride:
        description: >-
          {Yes | No}  Default is No. If Yes, enables the VoltOverride feature
          using Vmax and Vmin limits.
        range: boolean
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: untranscribed (a voltage override band of a kvar or current
            control; maxAllowedTargetValue limits the target, not the voltage).
            Export: unset.

      # (11) Vmax
      Vmax:
        description: >-
          Maximum voltage, in volts, above which control is forced ON regardless
          of control type setting.
        range: float
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: untranscribed (the VoltOverride band, volts on the PT
            secondary). Export: unset.

      # (12) Vmin
      Vmin:
        description: >-
          Minimum voltage, in volts, below which control is forced OFF regardless
          of control type setting.
        range: float
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: untranscribed (the VoltOverride band, volts on the PT
            secondary). Export: unset.

      # (13) DelayOFF
      DelayOFF:
        description: >-
          Time delay, in seconds, for control to turn OFF when present state is ON.
          Default is 15 s.
        range: float
        required: false
        annotations:
          order: 13
          dss_default: float(15.0)
        comments:
          - >-
            Import: untranscribed (CIM has one aVRDelay (Delay); DSS solution
            control). Export: unset.

      # (14) DeadTime
      DeadTime:
        description: >-
          Dead time after capacitor is turned OFF before it can be turned back ON.
          Default is 300 s.
        range: float
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: untranscribed (DSS solution control; no home in the network
            profile parts). Export: unset.

      # (15) CTPhase
      CTPhase:
        description: >-
          Number of the phase being monitored for CURRENT control or one of
          {AVG | MAX | MIN} for all phases. Default is 1.
        range: string
        required: false
        annotations:
          order: 15
        comments:
          - >-
            Import: raises when set (a CT phase); no deck in the sweep sets it,
            so a mapping waits for one. Export: unset.

      # (16) PTPhase
      PTPhase:
        description: >-
          Number of the phase being monitored for VOLTAGE control or one of
          {AVG | MAX | MIN} for all phases. Default is 1.
        range: string
        required: false
        annotations:
          order: 16
          dss_default: int(1)
        close_mappings:
          - cim:RegulatingControl.monitoredPhase
        comments:
          - >-
            Import: monitoredPhase = the phase of the monitored terminal's
            conductor PTPhase (default 1); AVG, MAX and MIN raise. Export: the
            1-based place of monitoredPhase among the monitored equipment's
            conductors.

      # (17) VBus
      VBus:
        description: >-
          Name of bus to use for voltage override function. Defaults to monitored
          element bus.
        range: string
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: raises when set (remote voltage sensing); no deck in the
            sweep sets it, so a mapping waits for one. Export: unset.

      # (18) EventLog
      EventLog:
        description: >-
          {Yes/True* | No/False} Default is YES for CapControl. If Yes, writes
          switching events to a log.
        range: boolean
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: untranscribed (DSS report flag). Export: unset.

      # (19) UserModel
      UserModel:
        description: >-
          Name of DLL containing user-written CapControl model.
        range: string
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: raises when set (a user model); no deck in the sweep sets
            it, so a mapping waits for one. Export: unset.

      # (20) UserData
      UserData:
        description: >-
          String that gets passed to the user-written CapControl model.
        range: string
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: raises when set (user data); no deck in the sweep sets it,
            so a mapping waits for one. Export: unset.

      # (21) pctMinkvar
      pctMinkvar:
        description: >-
          For PF control option, min percent of total bank kvar at which control
          will close capacitor switch. Default is 50.
        range: float
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed (used only by PF control, which raises).
            Export: unset.

      # (22) Reset
      Reset:
        description: >-
          {Yes | No} If Yes, forces Reset of this CapControl.
        range: boolean
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed (a command, not a setting). Export: unset.

      # (23) ControlSignal
      ControlSignal:
        description: >-
          Name of the load shape used for controlling the connection/disconnection
          of the capacitor to the grid.
        range: string
        required: false
        annotations:
          order: 23
        todos:
          - "Loadshape converter not yet implemented. ControlSignal LoadShape reference should map to a CIM SeasonDayTypeSchedule."
        comments:
          - >-
            Import: raises when set (a control signal); no deck in the sweep
            sets it, so a mapping waits for one. Export: unset.

      # (24) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 24
        comments:
          - >-
            Import: untranscribed (no home on a control). Export: unset.

      # (25) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 25
          dss_default: "true"
        exact_mappings:
          - cim:RegulatingControl.enabled
          - cim:RegulatingCondEq.controlEnabled
        comments:
          - >-
            Import: the control's enabled and the compensator's controlEnabled;
            default true. Export: the control's enabled; the compensator's must
            agree.

      # (26) like
      like:
        description: >-
          Make like another object, e.g.: New Capcontrol.CC2 like=CC1 ...
        range: string
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
