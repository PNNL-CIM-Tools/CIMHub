id: https://gridappsd.github.io/dss-graph/controls/recloser
name: recloser
title: OpenDSS Recloser Component Schema
description: >-
  LinkML schema for OpenDSS Recloser objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-27).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Recloser:
    description: >-
      A Recloser object in OpenDSS.
    class_uri: dss:Recloser
    close_mappings:
      - cim:Recloser
    comments:
      - >-
        Import: a Line with Switch=y that a Recloser switches is a cim:Recloser
        in line.cimtbl, with one RecloseSequence per reclosure; no Recloser
        object is written. Export: a Recloser writes its Line (Switch=y) and
        this control, disabled.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        comments:
          - >-
            Import: untranscribed; the switch takes the Line's name and the
            Recloser names no CIM object. Export: Names, the switch's.

      # (1) MonitoredObj
      MonitoredObj:
        description: >-
          Full object name of the circuit element, typically a line, transformer, load, or generator, to which the Recloser's PT and/or CT are connected
        range: string
        required: false
        annotations:
          order: 1
        comments:
          - >-
            Import: structural; the Switch=y Line it switches when SwitchedObj
            is unset. Export: written as Line.<the switch's Line name>.

      # (2) MonitoredTerm
      MonitoredTerm:
        description: >-
          Number of the terminal of the circuit element to which the Recloser is connected
        range: integer
        required: false
        annotations:
          order: 2
        comments:
          - >-
            Import: untranscribed; the switch opens both terminals in CIM, so
            DSS's terminal choice has no home. Export: unset.

      # (3) SwitchedObj
      SwitchedObj:
        description: >-
          Name of circuit element switch that the Recloser controls
        range: string
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: structural; the Switch=y Line this control switches, ahead
            of MonitoredObj. Export: not written; the engine takes MonitoredObj.

      # (4) SwitchedTerm
      SwitchedTerm:
        description: >-
          Number of the terminal of the controlled element in which the switch is controlled by the Recloser
        range: integer
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: untranscribed; the switch opens both terminals in CIM, so
            DSS's terminal choice has no home. Export: unset.

      # (5) NumFast
      NumFast:
        description: >-
          Number of Fast (fuse saving) operations
        range: integer
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (6) PhaseFast
      PhaseFast:
        description: >-
          Name of the TCC Curve object that determines the Phase Fast trip
        range: float
        required: false
        annotations:
          order: 6
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (7) PhaseDelayed
      PhaseDelayed:
        description: >-
          Name of the TCC Curve object that determines the Phase Delayed trip
        range: float
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (8) GroundFast
      GroundFast:
        description: >-
          Name of the TCC Curve object that determines the Ground Fast trip
        range: float
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (9) GroundDelayed
      GroundDelayed:
        description: >-
          Name of the TCC Curve object that determines the Ground Delayed trip
        range: float
        required: false
        annotations:
          order: 9
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (10) PhaseTrip
      PhaseTrip:
        description: >-
          Multiplier or actual phase amps for the phase TCC curve
        range: string
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (11) GroundTrip
      GroundTrip:
        description: >-
          Multiplier or actual ground amps (3I0) for the ground TCC curve
        range: string
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (12) PhaseInst
      PhaseInst:
        description: >-
          Actual amps for instantaneous phase trip which is assumed to happen in 0
        range: string
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (13) GroundInst
      GroundInst:
        description: >-
          Actual amps for instantaneous ground trip which is assumed to happen in 0
        range: string
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (14) Reset
      Reset:
        description: >-
          Reset time in sec for Recloser
        range: string
        required: false
        annotations:
          order: 14
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (15) Shots
      Shots:
        description: >-
          Total Number of fast and delayed shots to lockout
        range: integer
        required: false
        annotations:
          order: 15
          dss_default: int(4)
        close_mappings:
          - cim:RecloseSequence
        comments:
          - >-
            Import: Shots - 1 RecloseSequences, <switch>_rs<n>; unset, the
            engine's 4 (defaulted); above 4 without RecloseIntervals raises.
            Export: the RecloseSequences + 1; none -> 1.

      # (16) RecloseIntervals
      RecloseIntervals:
        description: >-
          Array of reclose intervals
        range: float
        multivalued: true
        required: false
        annotations:
          order: 16
          dss_default: "[0.5 2 2]"
        exact_mappings:
          - cim:RecloseSequence.recloseDelay
        comments:
          - >-
            Import: recloseDelay (s) of reclosure n = RecloseIntervals[n];
            unset, 0.5 2 2 (defaulted); both given and disagreeing raise.
            Export: each recloseDelay (s) in recloseStep order.

      # (17) Delay
      Delay:
        description: >-
          Fixed delay time (sec) added to Recloser trip time
        range: string
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: untranscribed (control timing; no home on a Switch). Export:
            unset.

      # (18) Action
      Action:
        description: >-
          DEPRECATED
        range: string
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: raises when set (the deprecated form of State); no deck in
            the sweep sets it. Export: unset.

      # (19) TDPhFast
      TDPhFast:
        description: >-
          Time dial for Phase Fast trip curve
        range: string
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (20) TDGrFast
      TDGrFast:
        description: >-
          Time dial for Ground Fast trip curve
        range: string
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (21) TDPhDelayed
      TDPhDelayed:
        description: >-
          Time dial for Phase Delayed trip curve
        range: string
        required: false
        annotations:
          order: 21
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (22) TDGrDelayed
      TDGrDelayed:
        description: >-
          Time dial for Ground Delayed trip curve
        range: string
        required: false
        annotations:
          order: 22
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset; the engine's default.

      # (23) Normal
      Normal:
        description: >-
          {Open | Closed} Normal state of the recloser
        range: string
        required: false
        annotations:
          order: 23
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.normalOpen
        comments:
          - >-
            Import: Switch.normalOpen from Open/Closed; with an Open command on
            the line they must agree. Export: get_switch_state(normal); written
            only when open in either state.

      # (24) State
      State:
        description: >-
          {Open | Closed} Actual state of the recloser
        range: string
        required: false
        annotations:
          order: 24
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.open
        comments:
          - >-
            Import: Switch.open from Open/Closed; with an Open command on the
            line they must agree. Export: get_switch_state(actual or the
            caller's choice); written only when open in either state.

      # (25) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 25
        comments:
          - >-
            Import: untranscribed (no home on a switch). Export: unset.

      # (26) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: untranscribed (a disabled control leaves its switch in
            place). Export: a Fuse or Recloser is written disabled until its
            trip settings have a CIM home.

      # (27) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
