id: https://gridappsd.github.io/dss-graph/controls/fuse
name: fuse
title: OpenDSS Fuse Component Schema
description: >-
  LinkML schema for OpenDSS Fuse objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-13).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Fuse:
    description: >-
      A Fuse object in OpenDSS.
    class_uri: dss:Fuse
    close_mappings:
      - cim:Fuse
    comments:
      - >-
        Import: a Line with Switch=y that a Fuse switches is a cim:Fuse in
        line.cimtbl; no Fuse object is written. Export: a Fuse writes its Line
        (Switch=y) and this control, disabled.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        comments:
          - >-
            Import: untranscribed; the switch takes the Line's name and the Fuse
            names no CIM object. Export: Names, the switch's.

      # (1) MonitoredObj
      MonitoredObj:
        description: >-
          Full object name of the circuit element, typically a line, transformer, load, or generator, to which the Fuse is connected
        range: string
        required: false
        annotations:
          order: 1
        comments:
          - >-
            Import: structural; the Switch=y Line it switches when SwitchedObj
            is unset. Export: written as Line.<the switch's Line name>.

      # (2) MonitoredTerm
      MonitoredTerm:
        description: >-
          Number of the terminal of the circuit element to which the Fuse is connected
        range: integer
        required: false
        annotations:
          order: 2
        comments:
          - >-
            Import: untranscribed; the switch opens both terminals in CIM, so
            DSS's terminal choice has no home. Export: unset.

      # (3) SwitchedObj
      SwitchedObj:
        description: >-
          Name of circuit element switch that the Fuse controls
        range: string
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: structural; the Switch=y Line this control switches, ahead
            of MonitoredObj. Export: not written; the engine takes MonitoredObj.

      # (4) SwitchedTerm
      SwitchedTerm:
        description: >-
          Number of the terminal of the controlled element in which the switch is controlled by the Fuse
        range: integer
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: untranscribed; the switch opens both terminals in CIM, so
            DSS's terminal choice has no home. Export: unset.

      # (5) FuseCurve
      FuseCurve:
        description: >-
          Name of the TCC Curve object that determines the fuse blowing
        range: string
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed (protection setting; no home in cim18v17's
            protection function blocks). Export: unset.

      # (6) RatedCurrent
      RatedCurrent:
        description: >-
          Multiplier or actual phase amps for the phase TCC curve
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(1.0)
        exact_mappings:
          - cim:Switch.ratedCurrent
        comments:
          - >-
            Import: Fuse.ratedCurrent (A) on the switch's row. Export:
            Switch.ratedCurrent (A).

      # (7) Delay
      Delay:
        description: >-
          Fixed delay time (sec) added to Fuse blowing time determined from the TCC curve
        range: float
        required: false
        annotations:
          order: 7
        comments:
          - >-
            Import: untranscribed (control timing; no home on a Switch). Export:
            unset.

      # (8) Action
      Action:
        description: >-
          DEPRECATED
        range: string
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: raises when set (the deprecated form of State); no deck in
            the sweep sets it. Export: unset.

      # (9) Normal
      Normal:
        description: >-
          ARRAY of strings {Open | Closed} representing the Normal state of the fuse in each phase of the controlled element
        range: string
        multivalued: true
        required: false
        annotations:
          order: 9
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.normalOpen
        comments:
          - >-
            Import: Switch.normalOpen from Open/Closed; with an Open command on
            the line they must agree. Export: get_switch_state(normal); written
            only when open in either state.

      # (10) State
      State:
        description: >-
          ARRAY of strings {Open | Closed} representing the Actual state of the fuse in each phase of the controlled element
        range: string
        multivalued: true
        required: false
        annotations:
          order: 10
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.open
        comments:
          - >-
            Import: Switch.open from Open/Closed; with an Open command on the
            line they must agree. Export: get_switch_state(actual or the
            caller's choice); written only when open in either state.

      # (11) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: untranscribed (no home on a switch). Export: unset.

      # (12) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 12
        comments:
          - >-
            Import: untranscribed (a disabled control leaves its switch in
            place). Export: a Fuse or Recloser is written disabled until its
            trip settings have a CIM home.

      # (13) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 13
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
