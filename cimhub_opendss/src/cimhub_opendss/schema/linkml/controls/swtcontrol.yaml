id: https://gridappsd.github.io/dss-graph/controls/swtcontrol
name: swtcontrol
title: OpenDSS Swtcontrol Component Schema
description: >-
  LinkML schema for OpenDSS Swtcontrol objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-11).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Swtcontrol:
    description: >-
      A Swtcontrol object in OpenDSS.
    class_uri: dss:Swtcontrol
    related_mappings:
      - cim:Switch
    comments:
      - >-
        Import: no object is written; its Line (Switch=y) is a LoadBreakSwitch
        unless a Fuse or Recloser names it, and the control only sets the switch
        state. Export: an open switch that is neither a Fuse nor a Recloser
        writes a SwtControl.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        comments:
          - >-
            Import: untranscribed; the switch takes the Line's name and the
            SwtControl names no CIM object. Export: Names, the switch's.

      # (1) SwitchedObj
      SwitchedObj:
        description: >-
          Name of circuit element switch that the SwtControl operates
        range: string
        required: false
        annotations:
          order: 1
        comments:
          - >-
            Import: structural; names the Switch=y Line this control switches (a
            Line without Switch=y raises). Export: written as Line.<the switch's
            Line name>.

      # (2) SwitchedTerm
      SwitchedTerm:
        description: >-
          Terminal number of the controlled element switch
        range: integer
        required: false
        annotations:
          order: 2
        comments:
          - >-
            Import: untranscribed; the switch opens both terminals in CIM, so
            DSS's terminal choice has no home. Export: unset.

      # (3) Action
      Action:
        description: >-
          {Open | Close}  After specified delay time, and if not locked, causes the controlled switch to open or close
        range: string
        required: false
        annotations:
          order: 3
        comments:
          - >-
            Import: raises when set (the deprecated form of State); no deck in
            the sweep sets it. Export: unset.

      # (4) Lock
      Lock:
        description: >-
          {Yes | No} Delayed action
        range: boolean
        required: false
        annotations:
          order: 4
        comments:
          - >-
            Import: untranscribed (control lock; no home on a Switch). Export:
            unset.

      # (5) Delay
      Delay:
        description: >-
          Operating time delay (sec) of the switch
        range: float
        required: false
        annotations:
          order: 5
        comments:
          - >-
            Import: untranscribed (control timing; no home on a Switch). Export:
            unset.

      # (6) Normal
      Normal:
        description: >-
          {Open | Closed] Normal state of the switch
        range: string
        required: false
        annotations:
          order: 6
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.normalOpen
        comments:
          - >-
            Import: Switch.normalOpen from Open/Closed; with an Open command on
            the line they must agree. Export: get_switch_state(normal); written
            only when open in either state.

      # (7) State
      State:
        description: >-
          {Open | Closed] Present state of the switch
        range: string
        required: false
        annotations:
          order: 7
          dss_default: string(closed)
        exact_mappings:
          - cim:Switch.open
        comments:
          - >-
            Import: Switch.open from Open/Closed; with an Open command on the
            line they must agree. Export: get_switch_state(actual or the
            caller's choice); written only when open in either state.

      # (8) Reset
      Reset:
        description: >-
          {Yes | No} If Yes, forces Reset of switch to Normal state and removes Lock independently of any internal reset command for mode change, etc
        range: boolean
        required: false
        annotations:
          order: 8
        comments:
          - >-
            Import: untranscribed (a command, not a setting). Export: unset.

      # (9) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings
        range: float
        required: false
        annotations:
          order: 9
        comments:
          - >-
            Import: untranscribed (no home on a switch). Export: unset.

      # (10) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled
        range: boolean
        required: false
        annotations:
          order: 10
        comments:
          - >-
            Import: untranscribed (a disabled control leaves its switch in
            place). Export: unset.

      # (11) like
      like:
        description: >-
          Make like another object, e
        range: string
        required: false
        annotations:
          order: 11
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
