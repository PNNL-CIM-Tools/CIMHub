id: https://gridappsd.github.io/dss-graph/controls/regcontrol
name: regcontrol
title: OpenDSS Regcontrol Component Schema
description: >-
  LinkML schema for OpenDSS Regcontrol objects. Attributes are ordered to match
  the positional indices required by the OpenDSS parser (1-38).
version: 1.0.0

prefixes:
  linkml: https://w3id.org/linkml/
  dss: https://gridappsd.github.io/dss-graph/
  cim: http://cim.ucaiug.io/cim101/draft#

default_prefix: dss
default_range: string

imports:
  - linkml:types

classes:
  Regcontrol:
    description: >-
      A Regcontrol object in OpenDSS representing a voltage regulator control
      that monitors a transformer winding and adjusts its tap to regulate
      voltage.
    class_uri: dss:Regcontrol
    exact_mappings:
      - cim:TapChangerControl
    close_mappings:
      - cim:RatioTapChanger
    comments:
      - >-
        Import: one TapChangerControl rc_ + name and one RatioTapChanger rc_ +
        name + _tap (regcontrol.cimtbl) on the controlled end of the transformer
        it names (a VoltageRegulator's AutoTransformerEnd, or an LTC's
        PowerTransformerEnd). Export: one RegControl per TapChangerControl;
        another mode raises.
    attributes:
      name:
        description: Object name. Must be unique per object type.
        range: string
        required: true
        identifier: true
        exact_mappings:
          - cim:IdentifiedObject.name
        comments:
          - >-
            Import: TapChangerControl.name and RatioTapChanger.name. Export:
            Names, the RegControl namespace.

      # (1) transformer
      transformer:
        description: >-
          Name of Transformer or AutoTrans element to which the RegControl
          is connected.
        range: string
        required: false
        annotations:
          order: 1
        close_mappings:
          - cim:RatioTapChanger.TransformerEnd
        comments:
          - >-
            Import: structural; the regulator or LTC, a Transformer no New
            defines or two RegControls name raises. Export: the DSS Transformer
            of the tap's unit.

      # (2) winding
      winding:
        description: >-
          Number of the winding of the transformer element that the RegControl
          is monitoring. Default is 1.
        range: integer
        required: false
        annotations:
          order: 2
          dss_default: int(1)
        close_mappings:
          - cim:RatioTapChanger.TransformerEnd
          - cim:RegulatingControl.Terminal
        comments:
          - >-
            Import: the end xf_<transformer>_<winding> holds the tap changer and
            its Terminal is monitored; default 1. Export: the winding whose end
            holds the RatioTapChanger.

      # (3) vreg
      vreg:
        description: >-
          Voltage regulator setting, in VOLTS, for the winding being controlled.
          Default is 120 V.
        range: float
        required: false
        annotations:
          order: 3
          dss_default: float(120.0)
        close_mappings:
          - cim:RegulatingControl.targetValue
        comments:
          - >-
            Import: derived; targetValue (V) = vreg x ptratio
            (secondary_to_primary); default 120. Export: targetValue / ptRatio.

      # (4) band
      band:
        description: >-
          Bandwidth in VOLTS for the controlled bus (full bandwidth). Default is 3 V.
        range: float
        required: false
        annotations:
          order: 4
          dss_default: float(3.0)
        close_mappings:
          - cim:RegulatingControl.targetDeadband
        comments:
          - >-
            Import: derived; targetDeadband (V) = band x ptratio; default 3.
            Export: targetDeadband / ptRatio.

      # (5) ptratio
      ptratio:
        description: >-
          Ratio of the PT that converts the controlled winding voltage to the
          regulator control voltage. Default is 60.
        range: float
        required: false
        minimum_value: 0.0
        annotations:
          order: 5
          dss_default: float(60.0)
        exact_mappings:
          - cim:RegulatingControl.ptRatio
          - cim:TapChanger.ptRatio
        comments:
          - >-
            Import: ptRatio on the control and the tap changer; default 60.
            Export: ptRatio (the two must agree; unset raises).

      # (6) CTprim
      CTprim:
        description: >-
          Rating, in Amperes, of the primary CT rating for which the line amps
          convert to control rated amps. Default is 300 A.
        range: float
        required: false
        annotations:
          order: 6
          dss_default: float(300.0)
        close_mappings:
          - cim:TapChanger.ctRating
          - cim:TapChanger.ctRatio
        comments:
          - >-
            Import: ctRating (A) = CTprim, ctRatio = CTprim / 0.2 (the DSS CT
            secondary); default 300. Export: ctRating (A); ctRatio is not read.

      # (7) R
      R:
        description: >-
          R setting on the line drop compensator in the regulator, expressed in
          VOLTS.
        range: float
        required: false
        annotations:
          order: 7
          dss_default: float(0.0)
        close_mappings:
          - cim:TapChangerControl.lineDropR
          - cim:TapChangerControl.lineDropCompensation
        comments:
          - >-
            Import: derived; lineDropR (ohm) = R x ptratio / CTprim,
            compensation on when R or X is nonzero. Export: lineDropR x CTprim /
            ptRatio.

      # (8) X
      X:
        description: >-
          X setting on the line drop compensator in the regulator, expressed in
          VOLTS.
        range: float
        required: false
        annotations:
          order: 8
          dss_default: float(0.0)
        close_mappings:
          - cim:TapChangerControl.lineDropX
        comments:
          - >-
            Import: derived; lineDropX (ohm) = X x ptratio / CTprim. Export:
            lineDropX x CTprim / ptRatio.

      # (9) bus
      bus:
        description: >-
          Name of a bus (busname.nn.nn.nn) for remote voltage sensing. When set,
          the regulator monitors this bus instead of the transformer winding.
        range: string
        required: false
        annotations:
          order: 9
        comments:
          - >-
            Import: raises when set (remote sensing); no deck in the sweep sets
            it, so a mapping waits for one. Export: unset.

      # (10) delay
      delay:
        description: >-
          Time delay, in seconds, from when the voltage goes out of band to when
          tap changing begins. Default is 15 s.
        range: float
        required: false
        annotations:
          order: 10
          dss_default: float(15.0)
        exact_mappings:
          - cim:TapChanger.initialDelay
        comments:
          - >-
            Import: initialDelay (s); default 15. Export: initialDelay; unset ->
            not written.

      # (11) reversible
      reversible:
        description: >-
          {Yes |No*} Indicates whether the regulator has a reverse operation mode.
        range: boolean
        required: false
        annotations:
          order: 11
          dss_default: "false"
        exact_mappings:
          - cim:TapChangerControl.reversible
        comments:
          - >-
            Import: reversible; default false. Export: reversible.

      # (12) revvreg
      revvreg:
        description: >-
          Voltage setting in volts for operation in the reverse direction.
          Default is 120 V.
        range: float
        required: false
        annotations:
          order: 12
          dss_default: float(120.0)
        close_mappings:
          - cim:RegulatingControl.reverseTargetValue
        comments:
          - >-
            Import: derived; reverseTargetValue (V) = revvreg x ptratio; default
            120. Export: reverseTargetValue / ptRatio.

      # (13) revband
      revband:
        description: >-
          Bandwidth for operating in the reverse direction. Default is 3 V.
        range: float
        required: false
        annotations:
          order: 13
          dss_default: float(3.0)
        close_mappings:
          - cim:RegulatingControl.reverseTargetDeadband
        comments:
          - >-
            Import: derived; reverseTargetDeadband (V) = revband x ptratio;
            default 3. Export: reverseTargetDeadband / ptRatio.

      # (14) revR
      revR:
        description: >-
          R line drop compensator setting for reverse direction.
        range: float
        required: false
        annotations:
          order: 14
          dss_default: float(0.0)
        close_mappings:
          - cim:TapChangerControl.reverseLineDropR
        comments:
          - >-
            Import: derived; reverseLineDropR (ohm) = revR x ptratio / CTprim.
            Export: reverseLineDropR x CTprim / ptRatio.

      # (15) revX
      revX:
        description: >-
          X line drop compensator setting for reverse direction.
        range: float
        required: false
        annotations:
          order: 15
          dss_default: float(0.0)
        close_mappings:
          - cim:TapChangerControl.reverseLineDropX
        comments:
          - >-
            Import: derived; reverseLineDropX (ohm) = revX x ptratio / CTprim.
            Export: reverseLineDropX x CTprim / ptRatio.

      # (16) tapdelay
      tapdelay:
        description: >-
          Delay in sec between tap changes. Default is 2 s.
        range: float
        required: false
        annotations:
          order: 16
          dss_default: float(2.0)
        exact_mappings:
          - cim:TapChanger.subsequentDelay
        comments:
          - >-
            Import: subsequentDelay (s); default 2. Export: subsequentDelay;
            unset -> not written.

      # (17) debugtrace
      debugtrace:
        description: >-
          {Yes | No* }  Default is no. If true, writes debug trace to file.
        range: boolean
        required: false
        annotations:
          order: 17
        comments:
          - >-
            Import: untranscribed (DSS report flag). Export: unset.

      # (18) maxtapchange
      maxtapchange:
        description: >-
          Maximum allowable tap change per control iteration in STATIC control
          mode. Default is 16.
        range: float
        required: false
        annotations:
          order: 18
        comments:
          - >-
            Import: untranscribed (DSS solution control; no home in the network
            profile parts). Export: unset.

      # (19) inversetime
      inversetime:
        description: >-
          {Yes | No* } Default is no. If yes, time delays decrease inversely
          with magnitude of voltage excursion.
        range: boolean
        required: false
        annotations:
          order: 19
        comments:
          - >-
            Import: untranscribed (DSS solution control; no home in the network
            profile parts). Export: unset.

      # (20) tapwinding
      tapwinding:
        description: >-
          Winding containing the actual taps, if different than the WINDING property.
        range: string
        required: false
        annotations:
          order: 20
        comments:
          - >-
            Import: raises when set (a tap winding other than the monitored
            one); no deck in the sweep sets it, so a mapping waits for one.
            Export: unset.

      # (21) vlimit
      vlimit:
        description: >-
          Voltage Limit for bus to which regulated winding is connected. Default
          is 0 (no limit).
        range: float
        required: false
        annotations:
          order: 21
        todos:
          - "Converter bug: uses tcc.limitVoltage (not a real TapChangerControl field) instead of tcc.maxLimitVoltage on both import and export."
        close_mappings:
          - cim:TapChangerControl.maxLimitVoltage
        comments:
          - >-
            Import: raises when set; no deck in the sweep sets it, so a mapping
            waits for one. Export: a control with a voltage limit raises.

      # (22) PTphase
      PTphase:
        description: >-
          For multi-phase transformers, the number of the phase being monitored
          or one of {MAX | MIN} for all phases. Default is 1.
        range: integer
        required: false
        annotations:
          order: 22
          dss_default: int(1)
        close_mappings:
          - cim:RegulatingControl.monitoredPhase
        comments:
          - >-
            Import: monitoredPhase = the phase of the winding's conductor
            PTphase (default 1); MAX and MIN raise. Export: the 1-based place of
            monitoredPhase among the winding's phase conductors.

      # (23) revThreshold
      revThreshold:
        description: >-
          kW reverse power threshold for reversing the direction of the regulator.
          Default is 100 kW.
        range: float
        required: false
        annotations:
          order: 23
          dss_default: float(100.0)
        exact_mappings:
          - cim:TapChangerControl.reversingPowerThreshold
        comments:
          - >-
            Import: reversingPowerThreshold (kW); default 100. Export:
            reversingPowerThreshold (kW).

      # (24) revDelay
      revDelay:
        description: >-
          Time Delay in seconds for executing the reversing action once the
          threshold for reversing has been exceeded. Default is 60 s.
        range: float
        required: false
        annotations:
          order: 24
          dss_default: float(60.0)
        exact_mappings:
          - cim:TapChangerControl.reversingDelay
        comments:
          - >-
            Import: reversingDelay (s); default 60. Export: reversingDelay (s).

      # (25) revNeutral
      revNeutral:
        description: >-
          {Yes | No*} Default is no. If yes, regulator goes to neutral tap in
          reverse direction.
        range: boolean
        required: false
        annotations:
          order: 25
          dss_default: "false"
        exact_mappings:
          - cim:TapChangerControl.reverseToNeutral
        comments:
          - >-
            Import: reverseToNeutral; default false. Export: reverseToNeutral.

      # (26) EventLog
      EventLog:
        description: >-
          {Yes/True* | No/False} Default is YES for regulator control.
        range: string
        required: false
        annotations:
          order: 26
        comments:
          - >-
            Import: untranscribed (DSS report flag). Export: unset.

      # (27) RemotePTRatio
      RemotePTRatio:
        description: >-
          PT ratio required to convert actual voltage at the remote bus to control
          voltage when regulating a remote bus.
        range: float
        required: false
        annotations:
          order: 27
        comments:
          - >-
            Import: raises when set (remote sensing); no deck in the sweep sets
            it, so a mapping waits for one. Export: unset.

      # (28) TapNum
      TapNum:
        description: >-
          An integer number indicating the tap position that the controlled
          transformer winding tap position is currently at.
        range: integer
        required: false
        annotations:
          order: 28
        close_mappings:
          - cim:TapChanger.step
        comments:
          - >-
            Import: raises when set (a tap position that overrides the
            transformer's tap); no deck in the sweep sets it. Export: unset.

      # (29) Reset
      Reset:
        description: >-
          {Yes | No} If Yes, forces Reset of this RegControl.
        range: boolean
        required: false
        annotations:
          order: 29
        comments:
          - >-
            Import: untranscribed (a command, not a setting). Export: unset.

      # (30) LDC_Z
      LDC_Z:
        description: >-
          Z value for Beckwith LDC_Z control option. Complex impedance in ohms.
        range: float
        required: false
        annotations:
          order: 30
        comments:
          - >-
            Import: raises when set (a line-drop impedance); no deck in the
            sweep sets it, so a mapping waits for one. Export: unset.

      # (31) rev_Z
      rev_Z:
        description: >-
          Reverse Z value for Beckwith LDC_Z control option.
        range: float
        required: false
        annotations:
          order: 31
        comments:
          - >-
            Import: raises when set (a reverse line-drop impedance); no deck in
            the sweep sets it, so a mapping waits for one. Export: unset.

      # (32) Cogen
      Cogen:
        description: >-
          {Yes|No*} Default is No. Cogen mode — sets direction of power flow
          sensing for reverse operation.
        range: boolean
        required: false
        annotations:
          order: 32
        comments:
          - >-
            Import: raises when set (cogeneration); no deck in the sweep sets
            it, so a mapping waits for one. Export: unset.

      # (33) idle
      idle:
        description: >-
          {Yes|No*} Default is No. If Yes, disables tap changing.
        range: boolean
        required: false
        annotations:
          order: 33
        comments:
          - >-
            Import: raises when set (idle mode); no deck in the sweep sets it,
            so a mapping waits for one. Export: unset.

      # (34) idleReverse
      idleReverse:
        description: >-
          {Yes|No*} Default is No. If Yes, disables tap changing in reverse mode.
        range: boolean
        required: false
        annotations:
          order: 34
        comments:
          - >-
            Import: raises when set (idle mode); no deck in the sweep sets it,
            so a mapping waits for one. Export: unset.

      # (35) idleForward
      idleForward:
        description: >-
          {Yes|No*} Default is No. If Yes, disables tap changing in forward mode.
        range: boolean
        required: false
        annotations:
          order: 35
        comments:
          - >-
            Import: raises when set (idle mode); no deck in the sweep sets it,
            so a mapping waits for one. Export: unset.

      # (36) basefreq
      basefreq:
        description: >-
          Base Frequency for ratings.
        range: float
        required: false
        annotations:
          order: 36
        comments:
          - >-
            Import: untranscribed (no home on a control). Export: unset.

      # (37) enabled
      enabled:
        description: >-
          {Yes|No or True|False} Indicates whether this element is enabled.
        range: boolean
        required: false
        annotations:
          order: 37
          dss_default: "true"
        exact_mappings:
          - cim:RegulatingControl.enabled
          - cim:TapChanger.controlEnabled
        comments:
          - >-
            Import: the control's enabled and the tap's controlEnabled; default
            true. Export: the control's enabled; the tap's must agree.

      # (38) like
      like:
        description: >-
          Make like another object, e.g.: New Regcontrol.RC2 like=RC1 ...
        range: string
        required: false
        annotations:
          order: 38
        comments:
          - >-
            Import: untranscribed; the reader resolves like= before mapping.
            Export: never written.
