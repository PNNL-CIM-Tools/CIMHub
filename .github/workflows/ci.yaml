name: CI

# Tests what ships: every package is built with --no-sources and its wheel installed with its PyPI dependencies,
# as the publish-*.yml workflows do before a release. [tool.uv.sources] points at the workspace and at sibling
# ../CIM-* checkouts for local development only, so CI needs neither the siblings nor a token for them.

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: Leak gate
        run: scripts/leak-gate.sh

      - name: Build
        run: |
          uv build --no-sources --all-packages --out-dir dist
          uvx twine check --strict dist/*

      - name: Install the wheels with their PyPI dependencies
        run: |
          uv venv wheels
          uv export --frozen --only-group dev --no-emit-workspace --no-hashes > dev-requirements.txt
          # with the time-points extra, so core's time_points tests run against it
          uv pip install --python wheels -r dev-requirements.txt dist/*.whl "cimhub-core[time-points]"

      - name: Test the wheels (one pytest process per package)
        run: PYTEST=wheels/bin/pytest scripts/test-all.sh
