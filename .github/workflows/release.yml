---
name: Release

# Publishes the CIMHub packages to PyPI, in lockstep (one version for all, tagged v<version>):
#   develop -> the next alpha of the target in the pyproject.toml files (3.0.0 -> 3.0.0a1, 3.0.0a2, ...)
#   main    -> the target itself (3.0.0)
# The version is derived from what is already released and never committed, so nothing pushes to the
# protected branches; .github/scripts/release_version.sh has the rules. Pushes that change no released
# package are skipped; a manual run on develop or main always releases.
#
# The cim-graph stack comes from PyPI here: [tool.uv.sources] points at sibling checkouts for local
# development only, so the build takes --no-sources, and the tests run against the built wheels installed
# with their PyPI dependencies. A release whose code needs an unreleased upstream fails there, before
# anything is published.
#
# Uses PyPI Trusted Publishing (OIDC); no API token is stored. One-time setup:
#   1. PyPI -> each project in PACKAGES -> Publishing -> add a GitHub publisher: owner PNNL-CIM-Tools,
#      repo CIMHub, workflow release.yml, environment pypi (a pending publisher for a new project)
#   2. GitHub repo -> Settings -> Environments -> create "pypi"

on:
  push:
    branches: [develop, main]
    paths:
      - cimhub_core/src/**
      - cimhub_core/pyproject.toml
      - cimhub_opendss/src/**
      - cimhub_opendss/pyproject.toml
  workflow_dispatch:

permissions: {}

# One release per branch at a time, so each run sees the versions the previous one released
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Published in this order (spokes depend on core). cimhub_gdm joins once cim-builder is on PyPI;
  # add its paths above when it does.
  PACKAGES: cimhub_core cimhub_opendss

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags, for release_version.sh
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: Leak gate
        run: scripts/leak-gate.sh

      - name: Set version
        id: version
        run: |
          version=$(bash .github/scripts/release_version.sh "$GITHUB_REF_NAME" $PACKAGES)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          for package in $PACKAGES; do
            uv build --no-sources "$package" --out-dir dist
          done
          uvx twine check --strict dist/*

      - name: Install the wheels with their PyPI dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv wheels
          uv export --frozen --only-group dev --no-emit-workspace --no-hashes > dev-requirements.txt
          uv pip install --python wheels --find-links dist -r dev-requirements.txt \
            $(for package in $PACKAGES; do echo "${package//_/-}==$VERSION"; done)

      - name: Test the wheels
        run: PYTEST=wheels/bin/pytest scripts/test-all.sh ${PACKAGES//cimhub_/}

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job so only this one, which runs no build code, can mint a PyPI token
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/cimhub-core/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC); no long-lived API token
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish to PyPI
        run: |
          for package in $PACKAGES; do
            uv publish --trusted-publishing always dist/"$package"-*
          done

  github-release:
    # After PyPI, so a v* tag only exists for a version that was published
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write  # create the tag and the GitHub release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ github.ref_name == 'develop' }}
        run: |
          gh release create "v$VERSION" dist/*.tar.gz dist/*.whl --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --generate-notes --prerelease="$PRERELEASE"
