---
name: Publish cimhub-core

# Publishes cimhub-core to PyPI on its own (each package has its own publish-<package>.yml):
#   develop -> the next alpha of the target in cimhub_core/pyproject.toml (3.0.0 -> 3.0.0a1, 3.0.0a2, ...)
#   main    -> the target itself (3.0.0)
# The version is derived from what cimhub-core already released and never committed, so nothing pushes to
# the protected branches; .github/scripts/release_version.sh has the rules. Only pushes that change this
# package release it; a manual run on develop or main always releases.
#
# The cim-graph stack and the other cimhub packages come from PyPI here: [tool.uv.sources] points at
# sibling checkouts and the workspace for local development only, so the build takes --no-sources, and the
# tests run against the built wheel installed with its PyPI dependencies. A release whose code needs an
# unreleased dependency fails there, before anything is published.
#
# Uses PyPI Trusted Publishing (OIDC); no API token is stored. One-time setup:
#   1. PyPI -> cimhub-core -> Publishing -> add a GitHub publisher: owner PNNL-CIM-Tools, repo CIMHub,
#      workflow publish-cimhub-core.yml, environment pypi (a pending publisher for a new project)
#   2. GitHub repo -> Settings -> Environments -> create "pypi"

on:
  push:
    branches: [develop, main]
    paths:
      - cimhub_core/src/**
      - cimhub_core/pyproject.toml
  workflow_dispatch:

permissions: {}

# One release per branch at a time, so each run sees the versions the previous one released
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE: cimhub_core

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # tags, for release_version.sh
          persist-credentials: false

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.11'

      - name: Leak gate
        run: scripts/leak-gate.sh

      - name: Set version
        id: release
        run: bash .github/scripts/release_version.sh "$GITHUB_REF_NAME" "$PACKAGE" | tee -a "$GITHUB_OUTPUT"

      - name: Build
        run: |
          uv build --no-sources "$PACKAGE" --out-dir dist
          uvx twine check --strict dist/*

      - name: Install the wheel with its PyPI dependencies
        env:
          REQUIREMENT: ${{ steps.release.outputs.name }}==${{ steps.release.outputs.version }}
        run: |
          uv venv wheels
          uv export --frozen --only-group dev --no-emit-workspace --no-hashes > dev-requirements.txt
          uv pip install --python wheels --find-links dist -r dev-requirements.txt "$REQUIREMENT"

      - name: Test the wheel
        run: PYTEST=wheels/bin/pytest scripts/test-all.sh "$PACKAGE"

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    # Separate job, which runs no build code, so only it can mint a PyPI token. The GitHub release comes
    # after the upload, so a tag only exists for a version that was published.
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/project/cimhub-core/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # PyPI Trusted Publishing (OIDC); no long-lived API token
      contents: write  # create the tag and the GitHub release
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/

      - name: Install UV
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          PRERELEASE: ${{ github.ref_name == 'develop' }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" \
            --generate-notes ${PREVIOUS_TAG:+--notes-start-tag "$PREVIOUS_TAG"} --prerelease="$PRERELEASE"
