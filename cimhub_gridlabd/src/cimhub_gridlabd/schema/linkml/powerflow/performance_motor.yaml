id: https://gridlabd.org/schema/glm/powerflow/performance_motor
name: performance_motor
description: GridLAB-D performance_motor class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  performance_motor:
    description: 'REQUIRED: allocate and initialize an object.

      @param obj a pointer to a pointer of the last object in the list

      @param parent a pointer to the parent of this object

      @return 1 for a successfully created object, 0 for error


      Inherits from: node


      Type: Instance (network topology element)'
    comments:
    - CIMHub does not convert this class. The importer reads no property of it and lists it, with
      its count, on the master's not-mapped comment; the exporter writes none.
    is_a: node
    attributes:
      motor_status:
        range: string
        required: false
        description: the current status of the motor
        annotations:
          order: 1
          value_type: string
          native_name: motor_status
      motor_status_number:
        range: integer
        required: false
        description: the current status of the motor as an integer
        annotations:
          order: 2
          value_type: int
          native_name: motor_status_number
      Pbase:
        range: float
        required: false
        description: motor rated size
        unit:
          ucum_code: W
        annotations:
          order: 3
          value_type: float
          precision: 6
          native_name: Pbase[W]
      power_value:
        range: Complex
        required: false
        description: motor power consumption
        unit:
          ucum_code: VA
        annotations:
          order: 4
          value_type: complex
          native_name: power_value[VA]
      power_factor:
        range: float
        required: false
        description: Compressor power factor
        unit:
          ucum_code: pu
        annotations:
          order: 5
          value_type: float
          precision: 6
          native_name: power_factor[pu]
      delta_f_val:
        range: float
        required: false
        description: Frequency change value for compressor sensitivities
        annotations:
          order: 6
          value_type: float
          precision: 6
          native_name: delta_f_val
      Vbrk:
        range: float
        required: false
        description: Compressor motor breakdown voltage
        unit:
          ucum_code: pu
        annotations:
          order: 7
          value_type: float
          precision: 6
          native_name: Vbrk[pu]
      Vstallbrk:
        range: float
        required: false
        description: Intersection point for power curve and power stall curve - calculated
        annotations:
          order: 8
          value_type: float
          precision: 6
          native_name: Vstallbrk
      Vstall:
        range: float
        required: false
        description: Compressor stall threshold voltage
        unit:
          ucum_code: pu
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: Vstall[pu]
      Vrst:
        range: float
        required: false
        description: Voltage at which motor can restart
        unit:
          ucum_code: pu
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: Vrst[pu]
      P_val:
        range: float
        required: false
        description: real power portion of motor power consumption calculation
        unit:
          ucum_code: pu
        annotations:
          order: 11
          value_type: float
          precision: 6
          native_name: P_val[pu]
      Q_val:
        range: float
        required: false
        description: reactive power portion of motor power consumption calculation
        unit:
          ucum_code: pu
        annotations:
          order: 12
          value_type: float
          precision: 6
          native_name: Q_val[pu]
      P_0:
        range: float
        required: false
        description: Computed power curve initialization point - real power
        unit:
          ucum_code: pu
        annotations:
          order: 13
          value_type: float
          precision: 6
          native_name: P_0[pu]
      Q_0:
        range: float
        required: false
        description: Computed power curve initialization point - reactive power
        unit:
          ucum_code: pu
        annotations:
          order: 14
          value_type: float
          precision: 6
          native_name: Q_0[pu]
      K_p1:
        range: float
        required: false
        description: Real power coefficient for running state 1, puP/puV
        unit:
          ucum_code: pu
        annotations:
          order: 15
          value_type: float
          precision: 6
          native_name: K_p1[pu]
      K_q1:
        range: float
        required: false
        description: Reactive power coefficient for running state 1, puQ/puV
        unit:
          ucum_code: pu
        annotations:
          order: 16
          value_type: float
          precision: 6
          native_name: K_q1[pu]
      K_p2:
        range: float
        required: false
        description: Real power coefficient for running state 2, puP/puV
        unit:
          ucum_code: pu
        annotations:
          order: 17
          value_type: float
          precision: 6
          native_name: K_p2[pu]
      K_q2:
        range: float
        required: false
        description: Reactive power coefficient for running state 2, puQ/puV
        unit:
          ucum_code: pu
        annotations:
          order: 18
          value_type: float
          precision: 6
          native_name: K_q2[pu]
      N_p1:
        range: float
        required: false
        description: Real power exponent for running state 1
        annotations:
          order: 19
          value_type: float
          precision: 6
          native_name: N_p1
      N_q1:
        range: float
        required: false
        description: Reactive power exponent for running state 1
        annotations:
          order: 20
          value_type: float
          precision: 6
          native_name: N_q1
      N_p2:
        range: float
        required: false
        description: Real power exponent for running state 2
        annotations:
          order: 21
          value_type: float
          precision: 6
          native_name: N_p2
      N_q2:
        range: float
        required: false
        description: Reactive power exponent for running state 2
        annotations:
          order: 22
          value_type: float
          precision: 6
          native_name: N_q2
      CmpKpf:
        range: float
        required: false
        description: Real power frequency sensitivity in puP/puf
        unit:
          ucum_code: pu
        annotations:
          order: 23
          value_type: float
          precision: 6
          native_name: CmpKpf[pu]
      CmpKqf:
        range: float
        required: false
        description: Reactive power frequency sensitivity in puQ/puf
        unit:
          ucum_code: pu
        annotations:
          order: 24
          value_type: float
          precision: 6
          native_name: CmpKqf[pu]
      stall_impedance:
        range: Complex
        required: false
        description: compressor stall imepdance
        unit:
          ucum_code: pu
        annotations:
          order: 25
          value_type: complex
          native_name: stall_impedance[pu]
      stall_resistance:
        range: float
        required: false
        description: compressor stall resistance
        unit:
          ucum_code: pu
        annotations:
          order: 26
          value_type: float
          precision: 6
          native_name: stall_resistance[pu]
      stall_reactance:
        range: float
        required: false
        description: compressor stall reactance
        unit:
          ucum_code: pu
        annotations:
          order: 27
          value_type: float
          precision: 6
          native_name: stall_reactance[pu]
      Tstall:
        range: float
        required: false
        description: stall time
        unit:
          ucum_code: s
        annotations:
          order: 28
          value_type: float
          precision: 6
          native_name: Tstall[s]
      reconnect_time:
        range: float
        required: false
        description: reconnect time after a trip
        unit:
          ucum_code: s
        annotations:
          order: 29
          value_type: float
          precision: 6
          native_name: reconnect_time[s]
      Pinit:
        range: float
        required: false
        description: Initial assumed real power loading of connected terminal
        unit:
          ucum_code: pu
        annotations:
          order: 30
          value_type: float
          precision: 6
          native_name: Pinit[pu]
      Vinit:
        range: float
        required: false
        description: Initial assumed voltage value of connected terminal
        unit:
          ucum_code: pu
        annotations:
          order: 31
          value_type: float
          precision: 6
          native_name: Vinit[pu]
      stall_time_tracker:
        range: float
        required: false
        description: internal stall time tracker variable
        unit:
          ucum_code: s
        annotations:
          order: 32
          value_type: float
          precision: 6
          native_name: stall_time_tracker[s]
      reconnect_time_tracker:
        range: float
        required: false
        description: internal reconnect time tracker variable
        unit:
          ucum_code: s
        annotations:
          order: 33
          value_type: float
          precision: 6
          native_name: reconnect_time_tracker[s]
