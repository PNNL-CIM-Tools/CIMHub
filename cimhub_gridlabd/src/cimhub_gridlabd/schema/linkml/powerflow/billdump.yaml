id: https://gridlabd.org/schema/glm/powerflow/billdump
name: billdump
description: GridLAB-D billdump class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  billdump:
    comments:
    - CIMHub does not convert this class. The importer reads no property of it and lists it, with
      its count, on the master's not-mapped comment; the exporter writes none.
    is_a: glm_object
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file billdump.cpp

      @{


      Inherits from: gld_object


      Note: Inherits from gld_object (not in powerflow module)'
    attributes:
      group:
        range: string
        required: false
        description: the group ID to output data for (all nodes if empty)
        annotations:
          order: 1
          value_type: string
          native_name: group
      runtime:
        range: string
        required: false
        description: the time to check voltage data
        annotations:
          order: 2
          value_type: string
          native_name: runtime
      filename:
        range: string
        required: false
        description: the file to dump the voltage data into
        annotations:
          order: 3
          value_type: string
          native_name: filename
      runcount:
        range: integer
        required: false
        description: the number of times the file has been written to
        annotations:
          order: 4
          value_type: int
          native_name: runcount
      meter_type:
        range: string
        required: false
        description: describes whether to collect from 3-phase or S-phase meters
        annotations:
          order: 5
          value_type: string
          native_name: meter_type
