id: https://gridlabd.org/schema/glm/powerflow/link
name: link
description: GridLAB-D link class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  link:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file link.cpp

      @addtogroup powerflow_link Link

      @ingroup powerflow_object

      @par Fault support

      The following conditions are used to describe a fault impedance @e X

      (e.g., 1e-6), between phase @e x and neutral or group, or between phases @e
      x

      and @e y, and leaving phase @e z unaffected at iteration @e t:

      - @e phase-to-phase contact on the link

      - @e Forward-sweep: @f$

      V_x(t) = V_y(t) = 0,

      A = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 0 & 0 \

      0 & 0 & 1 @end{array} @right) ,

      B = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 0 & 0 \

      0 & 0 & p @end{array} @right)

      @f$

      where @e p is the previous value

      when @e x = phase A and @e y = phase B;

      - @e Back-sweep: @f$

      c = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 0 & 0 \

      0 & 0 & 0 @end{array} @right) ,

      d = @left( @begin{array}{ccc}

      @frac{1}{X} & 0 & 0 \

      0 & @frac{1}{X} & 0 \

      0 & 0 & p @end{array} @right)

      @f$ when @e x = phase A and @e y = phase B;

      - @e phase-to-ground contact on the link

      - @e Forward-sweep: @f$

      V_x(t) = 0,

      A = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 1 & 0 \

      0 & 0 & 1 @end{array} @right) ,

      B = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & p & p \

      0 & p & p @end{array} @right)

      @f$

      where @e p is the previous value

      when @e x = phase A;

      - @e Back-sweep: @f$

      c = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 0 & 0 \

      0 & 0 & 0 @end{array} @right) ,

      d = @left( @begin{array}{ccc}

      @frac{1}{X} & 0 & 0 \

      0 & p & 0 \

      0 & 0 & p @end{array} @right)

      @f$ when @e x = phase A;

      - @e phase-to-neutral contact on the link

      - @e Forward-sweep: @f$

      V_x(t) = -V_N,

      A = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 1 & 0 \

      0 & 0 & 1 @end{array} @right) ,

      B = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & p & p \

      0 & p & p @end{array} @right)

      @f$

      where @e p is the previous value

      when @e x = phase A;

      - @e Back-sweep: @f$

      c = @left( @begin{array}{ccc}

      0 & 0 & 0 \

      0 & 0 & 0 \

      0 & 0 & 0 @end{array} @right) ,

      d = @left( @begin{array}{ccc}

      @frac{1}{X} & 0 & 0 \

      0 & p & 0 \

      0 & 0 & p @end{array} @right)

      @f$ when @e x = phase A;

      @{


      Inherits from: powerflow_object


      Type: Instance (network topology element)


      CIM Mapping: TBD'
    is_a: powerflow_object
