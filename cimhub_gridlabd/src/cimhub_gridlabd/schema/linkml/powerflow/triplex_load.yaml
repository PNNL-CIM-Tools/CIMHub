        unit:
          ucum_code: VA
        annotations:
          order: 33
          value_type: complex
          native_name: indiv_measured_power_1[VA]
      indiv_measured_power_2:
        range: Complex
        required: false
        description: current measured power on phase 2
        unit:
          ucum_code: VA
        annotations:
