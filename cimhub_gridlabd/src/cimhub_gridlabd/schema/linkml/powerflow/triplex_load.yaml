        unit:
          ucum_code: pu
        annotations:
          order: 50
          value_type: float
          precision: 6
          native_name: current_fraction_1[pu]
      impedance_fraction_1:
        close_mappings:
          - cim:LoadResponseCharacteristic.pConstantImpedance
