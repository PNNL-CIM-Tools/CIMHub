id: https://gridlabd.org/schema/glm/powerflow/triplex_load
name: triplex_load
description: GridLAB-D triplex_load class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  triplex_load:
    description: 'Copyright (C) 2013 Battelle Memorial Institute

      @file triplex_load.cpp

      @addtogroup triplex_load

      @ingroup triplex_node

      Triplex_load objects represent static loads and export both voltages and

      current.

      @{


      Inherits from: triplex_node


      Type: Instance (network topology element)'
    is_a: triplex_node
    exact_mappings:
      - cim:EnergyConsumer
    close_mappings:
      - cim:ConformLoad
    comments:
      - >-
        Import: EnergyConsumer on s1, s2 (the legs 1, 2), mRID ld_ + name, and
        the 240 V part 12 as a second delta EnergyConsumer ld_ + name + _12
        (triplex_load.cimtbl); a ConformLoad of the group when the base reads a
        player or schedule. Export: EnergyConsumer, ConformLoad and
        NonConformLoad on a split-phase bus: a wye one as the legs, a delta one
        as the 240 V part (a <name>_12 delta next to <name> is its 12 again).
    attributes:
      load_class:
        range: LoadClass
        required: false
        description: Flag to track load type, not currently used for anything except
          sorting
        annotations:
          order: 1
          value_type: string
          native_name: load_class
      load_priority:
        range: LoadPriority
        required: false
        description: Load classification based on priority
        annotations:
          order: 2
          value_type: string
          native_name: load_priority
      constant_power_1:
        close_mappings:
          - cim:EnergyConsumer.p
          - cim:EnergyConsumer.q
          - cim:EnergyConsumerPhase.p
          - cim:EnergyConsumerPhase.q
        comments:
          - >-
            Import: EnergyConsumer.p (W) and q (VAr), and EnergyConsumerPhase.p,
            q when the phases differ; with base_power it raises. Export: not
            written; the base_power form is.
        range: Complex
        required: false
        description: constant power load on split phase 1, specified as VA
        unit:
          ucum_code: VA
        annotations:
          order: 3
          value_type: complex
          native_name: constant_power_1[VA]
      constant_power_2:
        close_mappings:
          - cim:EnergyConsumer.p
          - cim:EnergyConsumer.q
          - cim:EnergyConsumerPhase.p
          - cim:EnergyConsumerPhase.q
        comments:
          - >-
            Import: EnergyConsumer.p (W) and q (VAr), and EnergyConsumerPhase.p,
            q when the phases differ; with base_power it raises. Export: not
            written; the base_power form is.
        range: Complex
        required: false
        description: constant power load on split phase 2, specified as VA
        unit:
          ucum_code: VA
        annotations:
          order: 4
          value_type: complex
          native_name: constant_power_2[VA]
      constant_power_12:
        close_mappings:
          - cim:EnergyConsumer.p
          - cim:EnergyConsumer.q
          - cim:EnergyConsumerPhase.p
          - cim:EnergyConsumerPhase.q
        comments:
          - >-
            Import: EnergyConsumer.p (W) and q (VAr), and EnergyConsumerPhase.p,
            q when the phases differ; with base_power it raises. Export: not
            written; the base_power form is.
        range: Complex
        required: false
        description: constant power load on split phase 12, specified as VA
        unit:
          ucum_code: VA
        annotations:
          order: 5
          value_type: complex
          native_name: constant_power_12[VA]
      constant_power_1_real:
        range: float
        required: false
        description: constant power load on spit phase 1, real only, specified as
          W
        unit:
          ucum_code: W
        annotations:
          order: 6
          value_type: float
          precision: 6
          native_name: constant_power_1_real[W]
      constant_power_2_real:
        range: float
        required: false
        description: constant power load on phase 2, real only, specified as W
        unit:
          ucum_code: W
        annotations:
          order: 7
          value_type: float
          precision: 6
          native_name: constant_power_2_real[W]
      constant_power_12_real:
        range: float
        required: false
        description: constant power load on phase 12, real only, specified as W
        unit:
          ucum_code: W
        annotations:
          order: 8
          value_type: float
          precision: 6
          native_name: constant_power_12_real[W]
      constant_power_1_reac:
        range: float
        required: false
        description: constant power load on phase 1, imaginary only, specified as
          VAr
        unit:
          ucum_code: VAr
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: constant_power_1_reac[VAr]
      constant_power_2_reac:
        range: float
        required: false
        description: constant power load on phase 2, imaginary only, specified as
          VAr
        unit:
          ucum_code: VAr
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: constant_power_2_reac[VAr]
      constant_power_12_reac:
        range: float
        required: false
        description: constant power load on phase 12, imaginary only, specified as
          VAr
        unit:
          ucum_code: VAr
        annotations:
          order: 11
          value_type: float
          precision: 6
          native_name: constant_power_12_reac[VAr]
      constant_current_1:
        comments:
          - >-
            Import: raises when set, as every explicit constant_current and
            constant_impedance form (_real, _reac). Export: not written; the
            base_power form is.
        range: Complex
        required: false
        description: constant current load on phase 1, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 12
          value_type: complex
          native_name: constant_current_1[A]
      constant_current_2:
        range: Complex
        required: false
        description: constant current load on phase 2, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 13
          value_type: complex
          native_name: constant_current_2[A]
      constant_current_12:
        range: Complex
        required: false
        description: constant current load on phase 12, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 14
          value_type: complex
          native_name: constant_current_12[A]
      constant_current_1_real:
        range: float
        required: false
        description: constant current load on phase 1, real only, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 15
          value_type: float
          precision: 6
          native_name: constant_current_1_real[A]
      constant_current_2_real:
        range: float
        required: false
        description: constant current load on phase 2, real only, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 16
          value_type: float
          precision: 6
          native_name: constant_current_2_real[A]
      constant_current_12_real:
        range: float
        required: false
        description: constant current load on phase 12, real only, specified as Amps
        unit:
          ucum_code: A
        annotations:
          order: 17
          value_type: float
          precision: 6
          native_name: constant_current_12_real[A]
      constant_current_1_reac:
        range: float
        required: false
        description: constant current load on phase 1, imaginary only, specified as
          Amps
        unit:
          ucum_code: A
        annotations:
          order: 18
          value_type: float
          precision: 6
          native_name: constant_current_1_reac[A]
      constant_current_2_reac:
        range: float
        required: false
        description: constant current load on phase 2, imaginary only, specified as
          Amps
        unit:
          ucum_code: A
        annotations:
          order: 19
          value_type: float
          precision: 6
          native_name: constant_current_2_reac[A]
      constant_current_12_reac:
        range: float
        required: false
        description: constant current load on phase 12, imaginary only, specified
          as Amps
        unit:
          ucum_code: A
        annotations:
          order: 20
          value_type: float
          precision: 6
          native_name: constant_current_12_reac[A]
      constant_impedance_1:
        comments:
          - >-
            Import: raises when set (see constant_current_1). Export: not
            written; the base_power form is.
        range: Complex
        required: false
        description: constant impedance load on phase 1, specified as Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 21
          value_type: complex
          native_name: constant_impedance_1[Ohm]
      constant_impedance_2:
        range: Complex
        required: false
        description: constant impedance load on phase 2, specified as Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 22
          value_type: complex
          native_name: constant_impedance_2[Ohm]
      constant_impedance_12:
        range: Complex
        required: false
        description: constant impedance load on phase 12, specified as Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 23
          value_type: complex
          native_name: constant_impedance_12[Ohm]
      constant_impedance_1_real:
        range: float
        required: false
        description: constant impedance load on phase 1, real only, specified as Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 24
          value_type: float
          precision: 6
          native_name: constant_impedance_1_real[Ohm]
      constant_impedance_2_real:
        range: float
        required: false
        description: constant impedance load on phase 2, real only, specified as Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 25
          value_type: float
          precision: 6
          native_name: constant_impedance_2_real[Ohm]
      constant_impedance_12_real:
        range: float
        required: false
        description: constant impedance load on phase 12, real only, specified as
          Ohms
        unit:
          ucum_code: Ohm
        annotations:
          order: 26
          value_type: float
          precision: 6
          native_name: constant_impedance_12_real[Ohm]
      constant_impedance_1_reac:
        range: float
        required: false
        description: constant impedance load on phase 1, imaginary only, specified
