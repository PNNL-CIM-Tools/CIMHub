        range: float
        required: false
        description: in similar format as ZIPload, this is the power factor of the
          phase 1 constant impedance portion of load
        unit:
          ucum_code: pu
        annotations:
          order: 42
          value_type: float
          precision: 6
          native_name: impedance_pf_1[pu]
