            makes a ConformLoad of the group. Export: the sum of |S| of the ZIP
            parts of the phase's p and q, <player>.value*base on a scheduled
            ConformLoad.
        range: float
        required: false
        description: in similar format as ZIPload, this represents the nominal power
          on phase 2 before applying ZIP fractions
        unit:
          ucum_code: VA
        annotations:
          order: 38
          value_type: float
          precision: 6
          native_name: base_power_2[VA]
      base_power_12:
        close_mappings:
          - cim:EnergyConsumer.p
          - cim:EnergyConsumer.q
          - cim:EnergyConsumerPhase.p
          - cim:EnergyConsumerPhase.q
        comments:
          - >-
            Import: split by the fractions and power factors at nominal voltage
            into EnergyConsumer.p (W) and q (VAr), and EnergyConsumerPhase.p, q
            when the phases differ; <player>.value*K or <schedule>*K is K and
            makes a ConformLoad of the group. Export: the sum of |S| of the ZIP
            parts of the phase's p and q, <player>.value*base on a scheduled
            ConformLoad.
        range: float
        required: false
        description: in similar format as ZIPload, this represents the nominal power
          on phase 12 before applying ZIP fractions
        unit:
          ucum_code: VA
        annotations:
          order: 39
          value_type: float
          precision: 6
          native_name: base_power_12[VA]
      power_pf_1:
        close_mappings:
          - cim:EnergyConsumer.q
          - cim:EnergyConsumerPhase.q
        comments:
          - >-
            Import: with base_power, sets the power part's q from its p (default
            1; pf 0 is all Q). Export: P/|S| of the power part, negative when
            its Q is.
        range: float
        required: false
        description: in similar format as ZIPload, this is the power factor of the
          phase 1 constant power portion of load
        unit:
          ucum_code: pu
        annotations:
          order: 40
          value_type: float
          precision: 6
          native_name: power_pf_1[pu]
      current_pf_1:
