      power_fraction_1:
        close_mappings:
          - cim:LoadResponseCharacteristic.pConstantPower
          - cim:LoadResponseCharacteristic.qConstantPower
        comments:
          - >-
            Import: with base_power, the power part's share of p and q makes
            EnergyConsumer.LoadResponse, the shared constant power row or a zip_
            LoadResponseCharacteristic row (p/qConstantPower); default 0, and
            the power fraction is 1 - I - Z when they do not sum to 1. Export:
            |S| of the power part over base_power, from get_load_response.
        range: float
        required: false
        description: this is the constant power fraction of base power on phase 1
        unit:
          ucum_code: pu
        annotations:
          order: 49
          value_type: float
          precision: 6
          native_name: power_fraction_1[pu]
      current_fraction_1:
        close_mappings:
          - cim:LoadResponseCharacteristic.pConstantCurrent
          - cim:LoadResponseCharacteristic.qConstantCurrent
        comments:
          - >-
            Import: with base_power, the current part's share of p and q makes
