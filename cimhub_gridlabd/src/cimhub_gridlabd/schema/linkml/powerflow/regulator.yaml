id: https://gridlabd.org/schema/glm/powerflow/regulator
name: regulator
description: GridLAB-D regulator class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  regulator:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file regulator.cpp

      @addtogroup powerflow_regulator Regulator

      @ingroup powerflow

      @{


      Inherits from: link


      Type: Instance (network topology element)'
    is_a: link
    exact_mappings:
    - cim:VoltageRegulator
    close_mappings:
    - cim:RatioTapChanger
    - cim:TapChangerControl
    comments:
    - "Import: VoltageRegulator, mRID xf_ + name (INDIVIDUAL: name + _<phase>) (regulator.cimtbl), with two AutoTransformerEnds, a TapChangerControl (rc_) and a RatioTapChanger per unit; a regulator_configuration's values go on every unit. Export: VoltageRegulator is written as it."
    attributes:
      configuration:
        comments:
        - "Import: a regulator_configuration; its values land on every unit, CIM has no regulator template. Export: written as its own <regulator>_config."
        range: string
        required: false
        description: reference to the regulator_configuration object used to determine
          regulator properties
        annotations:
          order: 1
          value_type: string
          native_name: configuration
      tap_A:
        close_mappings:
        - cim:TapChanger.step
        comments:
        - "Import: RatioTapChanger.step of phase A's unit, over tap_pos_A. Export: tap_pos_A of the configuration, step - neutralStep."
        range: integer
        required: false
        description: current tap position of tap A
        annotations:
          order: 2
          value_type: string
          native_name: tap_A
      tap_B:
        close_mappings:
        - cim:TapChanger.step
        comments:
        - "Import: RatioTapChanger.step of phase B's unit, over tap_pos_B. Export: tap_pos_B of the configuration, step - neutralStep."
        range: integer
        required: false
        description: current tap position of tap B
        annotations:
          order: 3
          value_type: string
          native_name: tap_B
      tap_C:
        close_mappings:
        - cim:TapChanger.step
        comments:
        - "Import: RatioTapChanger.step of phase C's unit, over tap_pos_C. Export: tap_pos_C of the configuration, step - neutralStep."
        range: integer
        required: false
        description: current tap position of tap C
        annotations:
          order: 4
          value_type: string
          native_name: tap_C
      msg_mode:
        range: string
        required: false
        description: messages regarding remote node voltage to come internally from
          gridlabd or externally through co-simulation. Set to EXTERNAL only if you
          have co-simulation enabled
        annotations:
          order: 5
          value_type: string
          native_name: msg_mode
      remote_voltage_A:
        range: Complex
        required: false
        description: remote node voltage, Phase A to ground
        unit:
          ucum_code: V
        annotations:
          order: 6
          value_type: complex
          native_name: remote_voltage_A[V]
      remote_voltage_B:
        range: Complex
        required: false
        description: remote node voltage, Phase B to ground
        unit:
          ucum_code: V
        annotations:
          order: 7
          value_type: complex
          native_name: remote_voltage_B[V]
      remote_voltage_C:
        range: Complex
        required: false
        description: remote node voltage, Phase C to ground
        unit:
          ucum_code: V
        annotations:
          order: 8
          value_type: complex
          native_name: remote_voltage_C[V]
      tap_A_change_count:
        range: float
        required: false
        description: count of all physical tap changes on phase A since beginning
          of simulation (plus initial value)
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: tap_A_change_count
      tap_B_change_count:
        range: float
        required: false
        description: count of all physical tap changes on phase B since beginning
          of simulation (plus initial value)
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: tap_B_change_count
      tap_C_change_count:
        range: float
        required: false
        description: count of all physical tap changes on phase C since beginning
          of simulation (plus initial value)
        annotations:
          order: 11
          value_type: float
          precision: 6
          native_name: tap_C_change_count
      sense_node:
        related_mappings:
        - cim:RegulatingControl.Terminal
        comments:
        - "Import: REMOTE_NODE must name the regulator's own to bus, as OUTPUT_VOLTAGE (the control's Terminal is end 2); elsewhere raises. Export: not written."
        range: string
        required: false
        description: Node to be monitored for voltage control in remote sense mode
        annotations:
          order: 12
          value_type: string
          native_name: sense_node
      regulator_resistance:
        range: float
        required: false
        description: The resistance value of the regulator when it is not blown.
        unit:
          ucum_code: Ohm
        annotations:
          order: 13
          value_type: float
          precision: 6
          native_name: regulator_resistance[Ohm]
