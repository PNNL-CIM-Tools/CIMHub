id: https://gridlabd.org/schema/glm/powerflow/overhead_line
name: overhead_line
description: GridLAB-D overhead_line class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  overhead_line:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file overhead_line.cpp

      @addtogroup overhead_line

      @ingroup line

      @{


      Inherits from: line


      Type: Instance (network topology element)'
    close_mappings:
      - cim:ACLineSegment
    comments:
      - >-
        Import: ACLineSegment, mRID ln_ + name (overhead_line.cimtbl). Export: an ACLineSegment
        on a geometry without a cable, or on a matrix impedance, is written as it.
    is_a: line
