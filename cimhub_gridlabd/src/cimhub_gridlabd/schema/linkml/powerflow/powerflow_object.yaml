id: https://gridlabd.org/schema/glm/powerflow/powerflow_object
name: powerflow_object
description: GridLAB-D powerflow_object class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  powerflow_object:
    is_a: glm_object
    description: "Copyright (C) 2008 Battelle Memorial Institute\n@file powerflow_object.cpp\n\
      @addtogroup powerflow_object Powerflow objects (abstract)\n@ingroup powerflow\n\
      The powerflow_object class is an abstract class that implements\nbasic elements\
      \ of powerflow solutions.  There are two critical\npieces of information:\n\
      -# @p phases indicates the phases which are connected by this object.\nThis\
      \ may be any feasible combination of the phase flags\n- @p PHASE_A for phase\
      \ A connections\n- @p PHASE_B for phase B connections\n- @p PHASE_C for phase\
      \ C connections\n- @p PHASE_N for neutral connections\n- @p PHASE_D for delta\
      \ connections (implies A, B, C);\n- @p PHASE_A for split connections (requires\
      \ one of A, B, or C);\n- @p PHASE_ABC for three phase connections\n- @p PHASE_ABCN\
      \ for three phase connections with separate\nneutral\n-# @p reference_bus indicates\
      \ the bus for the reference frequency and\nvoltage at which the solution is\
      \ to be computed.  The current solution method\ndoes not change the frequency\
      \ nor does it consider the frequency in the\npowerflow calculated.  The parameter\
      \ is only to be used to adjust\nfrequency-sensitive loads, such as Grid-Friendly<sup>TM</sup>\
      \ devices.\nIn addition, each powerflow_object defined must specify what it's\
      \ parent\nobject is for the purposes of establishing the evaluation order through\
      \ the\nranks. The reference bus is also propagated using the rank order.\nThe\
      \ powerflow_object provides optional support for outage conditions\nwhen compiled\
      \ with the SUPPORT_OUTAGES flag is defined in powerflow_object.h.\nWhen enabled\
      \ the following parameters are also defined\n-# @p condition indicates the device's\
      \ operating condition with respect\nto abnormal phase configuration that would\
      \ require special\nconsideration during the powerflow solution.  This can be\
      \ any combination of\ntwo of the following\n- @p OC_NORMAL for no abnormal configuration\
      \ (excludes all\nothers)\n- @p OC_PHASE_A_CONTACT phase A in contact\n- @p OC_PHASE_B_CONTACT\
      \ phase B in contact\n- @p OC_PHASE_C_CONTACT phase C in contact\n- @p OC_NEUTRAL_CONTACT\
      \ neutral in contact\n- @p OC_SPLIT_1_CONTACT split line 1 in contact\n- @p\
      \ OC_SPLIT_2_CONTACT split line 2 in contact\n- @p OC_SPLIT_N_CONTACT split\
      \ line N in contact\n- @p OC_GROUND_CONTACT ground in contact\n- @p OC_PHASE_A_OPEN\
      \ phase A is open\n- @p OC_PHASE_B_OPEN phase B is open\n- @p OC_PHASE_C_OPEN\
      \ phase C is open\n- @p OC_NEUTRAL_OPEN neutral is open\n- @p OC_SPLIT_1_OPEN\
      \ split line 1 is open\n- @p OC_SPLIT_2_OPEN split line 2 is open\n- @p OC_SPLIT_N_OPEN\
      \ split neutral is open\n- @p OC_GROUND_OPEN ground connection is open\n-# @p\
      \ solution indicates whether special solution methods are required.\nThe base\
      \ powerflow_object only recognized the normal solution method\n(#PS_NORMAL),\
      \ but each object may add its own identifiers, so long as it does\nnot conflict\
      \ any identifiers in the object inheritance hierarchy.  When\n#SUPPORT_OUTAGES\
      \ is defined, the flag #PS_OUTAGE is also defined and can be\nused to engage\
      \ an alternate solution method.\n@par Outage support\nWhen <code>SUPPORT_OUTAGES</code>\
      \ is defined, the @p postsync pass will\nexamine whether\n@p condition and @p\
      \ solution are matched.  If there is an inconsistency\n(i.e., @p <code>condition\
      \ != OC_NORMAL &&</code> @p <code>solution ==\nPS_NORMAL</code> or\n@p <code>condition\
      \ == OC_NORMAL &&</code> @p <code>solution !=\nPS_NORMAL</code>), then they\
      \ will be reconciled and the solver will iterate\nagain. Object derived from\
      \ powerflow_object can inspect the value of @p\ncondition to determine whether\
      \ they can use the normal powerflow solution\nmethod, or an alternative method\
      \ that is appropriate for abnormal conditions.\nBe aware that this may result\
      \ in a change of state in some other object\nthat may cause the solver to reiterate.\
      \ It is highly recommended that\nstate changes to OC_NORMAL have a non-zero\
      \ delay built in (i.e., allow the\nclock to advanced).\tFailure to do so may\
      \ result in non-convergence\nof the solver.\n@{\n\nInherits from: gld_object\n\
      \nType: Instance (network topology element)\n\nNote: Inherits\
      \ from gld_object (not in powerflow module)"
    attributes:
      phases:
        related_mappings:
        - cim:Terminal.phases
        comments:
        - "Import: structural. Bus: a child's conductors must be a subset of its root's. Switch: Terminal phases, A B C with N dropped, blank when ABC. Series_reactor: Terminal.phases when fewer than three. Swing bus: EnergySource.phases, blank when ABC. Export: the A, B, C of the terminals on the bus, then N (S on a split-phase bus); a switch or reactor side 1's A, B, C."
        range: string
        required: false
        annotations:
          order: 1
          value_type: string
          native_name: phases
      nominal_voltage:
        close_mappings:
        - cim:BaseVoltage.nominalVoltage
        - cim:EnergySource.nominalVoltage
        comments:
        - "Import: not copied; the topology walk gives the BaseVoltage, and a bus value over 10 percent off it is listed in bus.cimtbl. On a swing bus: EnergySource.nominalVoltage (V as written), line to line. Export: BaseVoltage LL / sqrt 3 (three phase), LL (single phase), LL / 2 (split phase leg); a substation: EnergySource.nominalVoltage / sqrt 3."
        range: float
        required: false
        unit:
          ucum_code: V
        annotations:
          order: 2
          value_type: float
          precision: 6
          native_name: nominal_voltage[V]
      inrush_integration_method:
        range: string
        required: false
        description: Integration method for in-rush
        annotations:
          order: 3
          value_type: string
          native_name: inrush_integration_method
      condition:
        range: string
        required: false
        annotations:
          order: 4
          value_type: string
          native_name: condition
      solution:
        range: string
        required: false
        annotations:
          order: 5
          value_type: string
          native_name: solution
