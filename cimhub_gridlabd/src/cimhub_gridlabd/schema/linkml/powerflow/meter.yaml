id: https://gridlabd.org/schema/glm/powerflow/meter
name: meter
description: GridLAB-D meter class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  meter:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file meter.cpp

      @addtogroup powerflow_meter Meter

      @ingroup powerflow

      @note The meter object now only implements polyphase meters.  For a

      singlephase meter, see the triplex_meter object.

      Distribution meter can be either single phase or polyphase meters.

      For polyphase meters, the line voltages are nominally 277V line-to-line,

      and 480V line-to-ground.  The ground is not presented explicitly (it is

      assumed).

      Total cumulative energy, instantantenous power and peak demand are

      metered.

      @{


      Inherits from: node


      Type: Instance (network topology element)


      CIM Mapping: TBD'
    is_a: node
    attributes:
      measured_real_energy:
        range: float
        required: false
        description: metered real energy consumption, cummalitive
        unit:
          ucum_code: Wh
        annotations:
          order: 1
          value_type: float
          separator: ','
          precision: 6
          native_name: measured_real_energy[Wh]
      measured_real_energy_delta:
        range: float
        required: false
        description: delta in metered real energy consumption from last specified
          measured_energy_delta_timestep
        unit:
          ucum_code: Wh
        annotations:
          order: 2
          value_type: float
          separator: ','
          precision: 6
          native_name: measured_real_energy_delta[Wh]
      measured_reactive_energy:
