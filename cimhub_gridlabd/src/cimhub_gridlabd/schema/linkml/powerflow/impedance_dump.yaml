id: https://gridlabd.org/schema/glm/powerflow/impedance_dump
name: impedance_dump
description: GridLAB-D impedance_dump class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  impedance_dump:
    is_a: glm_object
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file impedance_dump.cpp

      @{


      Inherits from: gld_object


      CIM Mapping: TBD


      Note: Inherits from gld_object (not in powerflow module)'
    attributes:
      group:
        range: string
        required: false
        description: the group ID to output data for (all links if empty)
        annotations:
          order: 1
          value_type: string
          native_name: group
      filename:
        range: string
        required: false
        description: the file to dump the current data into
        annotations:
          order: 2
          value_type: string
          native_name: filename
      runtime:
        range: string
        required: false
        description: the time to check voltage data
        annotations:
          order: 3
          value_type: string
          native_name: runtime
      runcount:
        range: integer
        required: false
        description: the number of times the file has been written to
        annotations:
          order: 4
          value_type: int
          native_name: runcount
