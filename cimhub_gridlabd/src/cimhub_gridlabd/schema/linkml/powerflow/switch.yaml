id: https://gridlabd.org/schema/glm/powerflow/switch
name: switch
description: GridLAB-D switch class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  switch:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file switch_object.cpp

      @addtogroup powerflow switch_object

      @ingroup powerflow

      Implements a switch object.

      @{


      Inherits from: link


      Type: Instance (network topology element)'
    exact_mappings:
    - cim:LoadBreakSwitch
    close_mappings:
    - cim:Breaker
    - cim:Disconnector
    - cim:Jumper
    - cim:Switch
    comments:
    - "Import: LoadBreakSwitch, mRID sw_ + name (switch.cimtbl). Export: every Switch not a Fuse, Recloser or Sectionaliser (LoadBreakSwitch, Breaker, Disconnector, Jumper, plain Switch), as GridLAB-D has no breaker."
    is_a: link
    attributes:
      phase_A_state:
        comments:
        - "Import: structural; on a phase the switch has it must equal status, else raises (no SwitchPhase). Export: not written."
        range: string
        required: false
        description: Defines the current state of the phase A switch
        annotations:
          order: 1
          value_type: string
          native_name: phase_A_state
      phase_B_state:
        comments:
        - "Import: structural; on a phase the switch has it must equal status, else raises (no SwitchPhase). Export: not written."
        range: string
        required: false
        description: Defines the current state of the phase B switch
        annotations:
          order: 2
          value_type: string
          native_name: phase_B_state
      phase_C_state:
        comments:
        - "Import: structural; on a phase the switch has it must equal status, else raises (no SwitchPhase). Export: not written."
        range: string
        required: false
        description: Defines the current state of the phase C switch
        annotations:
          order: 3
          value_type: string
          native_name: phase_C_state
      operating_mode:
        range: string
        required: false
        description: Defines whether the switch operates in a banked or per-phase
          control mode
        annotations:
          order: 4
          value_type: string
          native_name: operating_mode
      switch_impedance:
        range: Complex
        required: false
        description: Impedance value of the swtich when closed
        unit:
          ucum_code: Ohm
        annotations:
          order: 5
          value_type: complex
          native_name: switch_impedance[Ohm]
      switch_resistance:
        range: float
        required: false
        description: Resistance portion of impedance value of the switch when it is
          closed.
        unit:
          ucum_code: Ohm
        annotations:
          order: 6
          value_type: float
          precision: 6
          native_name: switch_resistance[Ohm]
      switch_reactance:
        range: float
        required: false
        description: Reactance portion of impedance value of the switch when it is
          closed.
        unit:
          ucum_code: Ohm
        annotations:
          order: 7
          value_type: float
          precision: 6
          native_name: switch_reactance[Ohm]
