id: https://gridlabd.org/schema/glm/powerflow/triplex_meter
name: triplex_meter
description: GridLAB-D triplex_meter class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  triplex_meter:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file triplex_meter.cpp

      @addtogroup powerflow_triplex_meter Meter

      @ingroup powerflow

      Distribution triplex_meter can be either single phase or polyphase

      triplex_meters. Single phase triplex_meters present three lines to objects

      - Line 1-G: 120V,

      - Line 2-G: 120V

      - Line 3-G: 0V

      - Line 1-2: 240V

      - Line 2-3: 120V

      - Line 1-3: 120V

      Total cumulative energy, instantantenous power and peak demand are

      triplex_metered.

      @{


      Inherits from: triplex_node


      Type: Instance (network topology element)'
    exact_mappings:
    - cim:ConnectivityNode
    comments:
    - "Import: ConnectivityNode, mRID = name (bus.cimtbl), as a triplex_node; metering and billing slots are not converted; power_1, power_2, power_12 set raises. Export: not written; a split-phase ConnectivityNode is a triplex_node."
    is_a: triplex_node
    attributes:
      measured_real_energy:
        range: float
        required: false
        description: metered real energy consumption
        unit:
          ucum_code: Wh
        annotations:
          order: 1
          value_type: float
          precision: 6
          native_name: measured_real_energy[Wh]
      measured_real_energy_delta:
        range: float
        required: false
        description: delta in metered real energy consumption from last specified
          measured_energy_delta_timestep
        unit:
          ucum_code: Wh
        annotations:
          order: 2
          value_type: float
          precision: 6
          native_name: measured_real_energy_delta[Wh]
      measured_reactive_energy:
        range: float
        required: false
        description: metered reactive energy consumption
        unit:
          ucum_code: VAh
        annotations:
          order: 3
          value_type: float
          precision: 6
          native_name: measured_reactive_energy[VAh]
      measured_reactive_energy_delta:
        range: float
        required: false
        description: delta in metered reactive energy consumption from last specified
          measured_energy_delta_timestep
        unit:
          ucum_code: VAh
        annotations:
          order: 4
          value_type: float
          precision: 6
          native_name: measured_reactive_energy_delta[VAh]
      measured_energy_delta_timestep:
        range: float
        required: false
        description: Period of timestep for real and reactive delta energy calculation
        unit:
          ucum_code: s
        annotations:
          order: 5
          value_type: float
          precision: 6
          native_name: measured_energy_delta_timestep[s]
      measured_power:
        range: Complex
        required: false
        description: metered power
        unit:
          ucum_code: VA
        annotations:
          order: 6
          value_type: complex
          native_name: measured_power[VA]
      indiv_measured_power_1:
        range: Complex
        required: false
        description: metered power, phase 1
        unit:
          ucum_code: VA
        annotations:
          order: 7
          value_type: complex
          native_name: indiv_measured_power_1[VA]
      indiv_measured_power_2:
        range: Complex
        required: false
        description: metered power, phase 2
        unit:
          ucum_code: VA
        annotations:
          order: 8
          value_type: complex
          native_name: indiv_measured_power_2[VA]
      indiv_measured_power_N:
        range: Complex
        required: false
        description: metered power, phase N
        unit:
          ucum_code: VA
        annotations:
          order: 9
          value_type: complex
          native_name: indiv_measured_power_N[VA]
      measured_demand:
        range: float
        required: false
        description: metered demand (peak of power)
        unit:
