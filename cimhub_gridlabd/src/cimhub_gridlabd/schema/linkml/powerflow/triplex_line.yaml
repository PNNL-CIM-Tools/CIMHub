id: https://gridlabd.org/schema/glm/powerflow/triplex_line
name: triplex_line
description: GridLAB-D triplex_line class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  triplex_line:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file triplex_line.cpp

      @addtogroup triplex_line

      @ingroup line

      @{


      Inherits from: line


      Type: Instance (network topology element)'
    close_mappings:
      - cim:ACLineSegment
    comments:
      - >-
        Import: ACLineSegment, mRID ln_ + name (triplex_line.cimtbl). Export: an ACLineSegment
        on phases s1 and s2 is written as it; its phases are the buses' service letter then S,
        and the importer writes s1s2N.
    is_a: line
