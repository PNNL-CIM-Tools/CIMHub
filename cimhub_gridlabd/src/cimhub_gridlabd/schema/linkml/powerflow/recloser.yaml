id: https://gridlabd.org/schema/glm/powerflow/recloser
name: recloser
description: GridLAB-D recloser class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  recloser:
    description: 'Copyright (C) 2011 Battelle Memorial Institute

      @file recloser.cpp

      @addtogroup powerflow recloser

      @ingroup powerflow

      Implements a recloser object.

      @{


      Inherits from: switch


      Type: Instance (network topology element)'
    exact_mappings:
    - cim:Recloser
    comments:
    - "Import: Recloser, mRID sw_ + name (recloser.cimtbl). Export: every Recloser."
    is_a: switch
    attributes:
      retry_time:
        comments:
        - "Not converted. Protection setting; its home is RecloseSequence, which waits for the protection model."
        range: float
        required: false
        description: the amount of time in seconds to wait before the recloser attempts
          to close
        unit:
          ucum_code: s
        annotations:
          order: 1
          value_type: float
          precision: 6
          native_name: retry_time[s]
      max_number_of_tries:
        comments:
        - "Not converted. Protection setting; see retry_time."
        range: float
        required: false
        description: the number of times the recloser will try to close before permanently
          opening
        annotations:
          order: 2
          value_type: float
          precision: 6
          native_name: max_number_of_tries
      number_of_tries:
        range: float
        required: false
        description: Current number of tries recloser has attempted
        annotations:
          order: 3
          value_type: float
          precision: 6
          native_name: number_of_tries
