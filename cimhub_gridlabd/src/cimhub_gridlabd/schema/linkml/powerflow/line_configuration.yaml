id: https://gridlabd.org/schema/glm/powerflow/line_configuration
name: line_configuration
description: GridLAB-D line_configuration class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  line_configuration:
    close_mappings:
      - cim:WireConfiguration
      - cim:WireSequenceConfiguration
      - cim:PerLengthPhaseImpedance
      - cim:PhaseImpedanceData
    comments:
      - >-
        Import: geometry (spacing + conductor_X) becomes a WireConfiguration, mRID wc_ + name,
        with one WireSequenceConfiguration per conductor; a matrix (z, c) becomes a template
        PerLengthPhaseImpedance, mRID lc_ + name, with its PhaseImpedanceData and a
        WireConfiguration lc_<name>_wc that holds it (line_configuration.cimtbl). A record with
        both raises. Export: a geometry line's WireConfiguration and a matrix line's
        PerLengthImpedance are each written as one line_configuration per way the lines use them
        (<template>_<letters> when more than one).
    is_a: glm_object
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file line_configuration.cpp

      @addtogroup line_configuration

      @ingroup line

      @{


      Inherits from: powerflow_library


      Type: Configuration (physical asset template)


      Note: Inherits from powerflow_library (not in powerflow module)'
    attributes:
      conductor_A:
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; geometry: one WireSequenceConfiguration, sequenceNumber 1..n in
            ABCN order, WireInfo = the conductor's mRID. Export: the wire at the line phase's
            sequence number.
        range: string
        required: false
        annotations:
          order: 1
          value_type: string
          native_name: conductor_A
      conductor_B:
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; geometry: one WireSequenceConfiguration, sequenceNumber 1..n in
            ABCN order, WireInfo = the conductor's mRID. Export: the wire at the line phase's
            sequence number.
        range: string
        required: false
        annotations:
          order: 2
          value_type: string
          native_name: conductor_B
      conductor_C:
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; geometry: one WireSequenceConfiguration, sequenceNumber 1..n in
            ABCN order, WireInfo = the conductor's mRID. Export: the wire at the line phase's
            sequence number.
        range: string
        required: false
        annotations:
          order: 3
          value_type: string
          native_name: conductor_C
      conductor_N:
        related_mappings:
          - cim:WireSequenceConfiguration.WireInfo
        comments:
          - >-
            Import: structural; geometry: one WireSequenceConfiguration, sequenceNumber 1..n in
            ABCN order, WireInfo = the conductor's mRID. Export: the wire at the line phase's
            sequence number.
        range: string
        required: false
        annotations:
          order: 4
          value_type: string
          native_name: conductor_N
      spacing:
        related_mappings:
          - cim:WireConfiguration.WireSpacing
        comments:
          - >-
            Import: structural; geometry: WireConfiguration.WireSpacing = spc_ + spacing.
            Export: the line_spacing of the line's phases.
        range: string
        required: false
        annotations:
          order: 5
          value_type: string
          native_name: spacing
      z11:
        close_mappings:
          - cim:PhaseImpedanceData.r
          - cim:PhaseImpedanceData.x
        comments:
          - >-
            Import: matrix: PhaseImpedanceData.r and .x (ohm/mile), the real and imaginary
            parts, one row per lower-triangle element with rows and columns compacted to 1..n;
            z_ij must equal z_ji; an unset mutual term is 0. Export: r + jx of
            get_line_phase_impedance_matrix by phase letter, neutral rows Kron-reduced out.
        range: Complex
        required: false
        unit:
          ucum_code: Ohm/mile
        annotations:
          order: 6
          value_type: complex
          native_name: z11[Ohm/mile]
      z12:
