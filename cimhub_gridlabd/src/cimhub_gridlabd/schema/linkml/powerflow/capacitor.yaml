id: https://gridlabd.org/schema/glm/powerflow/capacitor
name: capacitor
description: GridLAB-D capacitor class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  capacitor:
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file capacitor.cpp

      @addtogroup capacitor

      @ingroup powerflow

      @{


      Inherits from: node


      Type: Instance (network topology element)'
    is_a: node
    exact_mappings:
    - cim:LinearShuntCompensator
    close_mappings:
    - cim:RegulatingControl
    comments:
    - "Import: LinearShuntCompensator, mRID cap_ + name (capacitor.cimtbl), one unit per set of phases that switch together (INDIVIDUAL VOLT: name + _<phase>); VOLT adds a RegulatingControl (cc_). Export: LinearShuntCompensator is written as it, a delta unit raises."
    attributes:
      pt_phase:
        related_mappings:
        - cim:RegulatingControl.monitoredPhase
        comments:
        - "Import: VOLT: the units that get a control (INDIVIDUAL) or the gang unit's monitored phase (BANK); D raises. Export: VOLT: the monitored phases."
        range: string
        required: false
        description: Phase(s) that the PT is on, used as measurement points for control
        annotations:
          order: 1
          value_type: string
          native_name: pt_phase
      phases_connected:
        related_mappings:
        - cim:ShuntCompensator.phaseConnection
        - cim:ShuntCompensator.grounded
        comments:
        - "Import: the unit's phases (else phases): wye, grounded; D raises. Export: written as phases."
        range: string
        required: false
        description: phases capacitors connected to
        annotations:
          order: 2
          value_type: string
          native_name: phases_connected
      switchA:
        close_mappings:
        - cim:ShuntCompensator.sections
        - cim:ShuntCompensator.normalSections
        comments:
        - "Import: sections = normalSections, 1 if CLOSED else 0; default OPEN; a gang unit's must agree. Export: CLOSED when the unit's actual sections are in, phase A."
        range: string
        required: false
        description: capacitor A switch open or close
        annotations:
          order: 3
          value_type: string
          native_name: switchA
      switchB:
        close_mappings:
        - cim:ShuntCompensator.sections
        - cim:ShuntCompensator.normalSections
        comments:
        - "Import: sections = normalSections, 1 if CLOSED else 0; default OPEN; a gang unit's must agree. Export: CLOSED when the unit's actual sections are in, phase B."
        range: string
        required: false
        description: capacitor B switch open or close
        annotations:
          order: 4
          value_type: string
          native_name: switchB
      switchC:
        close_mappings:
        - cim:ShuntCompensator.sections
        - cim:ShuntCompensator.normalSections
        comments:
        - "Import: sections = normalSections, 1 if CLOSED else 0; default OPEN; a gang unit's must agree. Export: CLOSED when the unit's actual sections are in, phase C."
        range: string
        required: false
        description: capacitor C switch open or close
        annotations:
          order: 5
          value_type: string
          native_name: switchC
      control:
        related_mappings:
        - cim:RegulatingCondEq.RegulatingControl
        comments:
        - "Import: VOLT adds a RegulatingControl; MANUAL (default) none; VAR, VARVOLT and CURRENT raise. Export: VOLT for an enabled voltage RegulatingControl, else MANUAL."
        range: Control
        required: false
        description: control operation strategy
        annotations:
          order: 6
          value_type: string
          native_name: control
      cap_A_switch_count:
        range: float
        required: false
        description: number of switch operations on Phase A
        annotations:
          order: 7
          value_type: float
          precision: 6
          native_name: cap_A_switch_count
      cap_B_switch_count:
        range: float
        required: false
        description: number of switch operations on Phase B
        annotations:
          order: 8
          value_type: float
          precision: 6
          native_name: cap_B_switch_count
      cap_C_switch_count:
        range: float
        required: false
        description: number of switch operations on Phase C
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: cap_C_switch_count
      voltage_set_high:
        close_mappings:
        - cim:RegulatingControl.targetValue
        - cim:RegulatingControl.targetDeadband
        comments:
        - "Import: targetValue (V) = the midpoint of low and high, targetDeadband = high - low. Export: VOLT: target + deadband / 2."
        range: float
        required: false
        description: Turn off if voltage is above this set point
        unit:
          ucum_code: V
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: voltage_set_high[V]
      voltage_set_low:
        close_mappings:
        - cim:RegulatingControl.targetValue
        - cim:RegulatingControl.targetDeadband
        comments:
        - "Import: with voltage_set_high. Export: VOLT: target - deadband / 2."
        range: float
        required: false
        description: Turns on if voltage is below this set point
        unit:
          ucum_code: V
        annotations:
          order: 11
          value_type: float
          precision: 6
          native_name: voltage_set_low[V]
      voltage_deadband_center:
        range: float
        required: false
        description: The voltage deadband center
        unit:
          ucum_code: V
        annotations:
          order: 12
          value_type: float
          precision: 6
          native_name: voltage_deadband_center[V]
      voltage_deadband:
        range: float
        required: false
        description: The deadband between voltage_set_high and voltage_set_low
        unit:
          ucum_code: V
        annotations:
          order: 13
          value_type: float
          precision: 6
          native_name: voltage_deadband[V]
      VAr_set_high:
        range: float
        required: false
        description: high VAR set point for VAR control (turn off)
        unit:
          ucum_code: VAr
        annotations:
          order: 14
          value_type: float
          precision: 6
          native_name: VAr_set_high[VAr]
      VAr_set_low:
        range: float
        required: false
        description: low VAR set point for VAR control (turn on)
        unit:
          ucum_code: VAr
        annotations:
          order: 15
          value_type: float
          precision: 6
          native_name: VAr_set_low[VAr]
      VAr_deadband_center:
        range: float
        required: false
        description: The VAr deadband center
        unit:
          ucum_code: VAr
        annotations:
          order: 16
          value_type: float
          precision: 6
          native_name: VAr_deadband_center[VAr]
      VAr_deadband:
        range: float
        required: false
        description: The deadband between VAr_set_high and VAr_set_low
        unit:
          ucum_code: VAr
        annotations:
          order: 17
          value_type: float
          precision: 6
          native_name: VAr_deadband[VAr]
      current_set_low:
        range: float
        required: false
        description: high current set point for current control mode (turn on)
        unit:
          ucum_code: A
        annotations:
          order: 18
          value_type: float
          precision: 6
          native_name: current_set_low[A]
      current_set_high:
        range: float
        required: false
        description: low current set point for current control mode (turn off)
        unit:
          ucum_code: A
        annotations:
          order: 19
          value_type: float
          precision: 6
          native_name: current_set_high[A]
      current_deadband_center:
        range: float
        required: false
        description: The current deadband center
        unit:
          ucum_code: A
        annotations:
          order: 20
          value_type: float
          precision: 6
          native_name: current_deadband_center[A]
      current_deadband:
        range: float
        required: false
        description: The deadband between current_set_high and current_set_low
        unit:
          ucum_code: A
        annotations:
          order: 21
          value_type: float
          precision: 6
          native_name: current_deadband[A]
      capacitor_A:
        close_mappings:
        - cim:ShuntCompensator.nomQ
        - cim:LinearShuntCompensator.bPerSection
        comments:
        - "Import: nomQ (VAr) = the unit's phase sum, bPerSection (S) = nomQ / nomU^2; a phase not connected is dropped. Export: phase A's Q at nominal voltage, every section in."
        range: float
        required: false
        description: Capacitance value for phase A or phase AB
        unit:
          ucum_code: VAr
        annotations:
          order: 22
          value_type: float
          precision: 6
          native_name: capacitor_A[VAr]
      capacitor_B:
        close_mappings:
        - cim:ShuntCompensator.nomQ
        - cim:LinearShuntCompensator.bPerSection
        comments:
        - "Import: nomQ (VAr) = the unit's phase sum, bPerSection (S) = nomQ / nomU^2; a phase not connected is dropped. Export: phase B's Q at nominal voltage, every section in."
        range: float
        required: false
        description: Capacitance value for phase B or phase BC
        unit:
          ucum_code: VAr
        annotations:
          order: 23
          value_type: float
          precision: 6
          native_name: capacitor_B[VAr]
      capacitor_C:
        close_mappings:
        - cim:ShuntCompensator.nomQ
        - cim:LinearShuntCompensator.bPerSection
        comments:
        - "Import: nomQ (VAr) = the unit's phase sum, bPerSection (S) = nomQ / nomU^2; a phase not connected is dropped. Export: phase C's Q at nominal voltage, every section in."
        range: float
        required: false
        description: Capacitance value for phase C or phase CA
        unit:
          ucum_code: VAr
        annotations:
          order: 24
          value_type: float
          precision: 6
          native_name: capacitor_C[VAr]
      cap_nominal_voltage:
        close_mappings:
        - cim:ShuntCompensator.nomU
        comments:
        - "Import: nomU (V) is the phase-to-neutral rating (else nominal_voltage) x sqrt 3 on 2-3 phases. Export: nomU line to neutral."
        range: float
        required: false
        description: Nominal voltage for the capacitor. Used for calculation of capacitance
          value
        unit:
          ucum_code: V
        annotations:
          order: 25
          value_type: float
          precision: 6
          native_name: cap_nominal_voltage[V]
      time_delay:
        close_mappings:
        - cim:ShuntCompensator.aVRDelay
        comments:
        - "Import: aVRDelay (s) = dwell_time + time_delay. Export: see dwell_time."
        range: float
        required: false
        description: control time delay
        unit:
          ucum_code: s
        annotations:
          order: 26
          value_type: float
          precision: 6
          native_name: time_delay[s]
      dwell_time:
        close_mappings:
        - cim:ShuntCompensator.aVRDelay
        comments:
        - "Import: with time_delay. Export: VOLT: aVRDelay."
        range: float
        required: false
        description: Time for system to remain constant before a state change will
          be passed
        unit:
          ucum_code: s
        annotations:
          order: 27
          value_type: float
          precision: 6
          native_name: dwell_time[s]
      lockout_time:
        range: float
        required: false
        description: Time for capacitor to remain locked out from further switching
          operations (VARVOLT control)
        unit:
          ucum_code: s
        annotations:
          order: 28
          value_type: float
          precision: 6
          native_name: lockout_time[s]
      remote_sense:
        range: string
        required: false
        description: Remote object for sensing values used for control schemes
        annotations:
          order: 29
          value_type: string
          native_name: remote_sense
      remote_sense_B:
        range: string
        required: false
        description: Secondary Remote object for sensing values used for control schemes
          (VARVOLT uses two)
        annotations:
          order: 30
          value_type: string
          native_name: remote_sense_B
      control_level:
        comments:
        - "Import: INDIVIDUAL (default) VOLT is a unit per phase; BANK one gang unit. Export: VOLT: INDIVIDUAL on one phase, BANK on more."
        range: ControlLevel
        required: false
        description: define bank or individual control
        annotations:
          order: 31
          value_type: string
          native_name: control_level
