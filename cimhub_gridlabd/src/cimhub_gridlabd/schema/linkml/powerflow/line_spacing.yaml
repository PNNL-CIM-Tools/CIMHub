id: https://gridlabd.org/schema/glm/powerflow/line_spacing
name: line_spacing
description: GridLAB-D line_spacing class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
  cim: http://cim.ucaiug.io/cim101/draft#
default_prefix: glm
default_range: string
classes:
  line_spacing:
    close_mappings:
      - cim:ConductorDistanceSpacing
      - cim:XYSpacing
    comments:
      - >-
        Import: ConductorDistanceSpacing + ConductorDistance, mRID spc_ + name, isTemplate true
        (line_spacing.cimtbl); GLM gives distances, not coordinates. Export: the WireSpacing of
        a geometry line (ConductorDistanceSpacing or XYSpacing), one per way the lines use it
        (<spacing>_<letters>).
    is_a: glm_object
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file line_spacing.cpp

      @addtogroup line_spacing

      @ingroup line

      @{


      Inherits from: powerflow_library


      Type: Configuration (physical asset template)


      Note: Inherits from powerflow_library (not in powerflow module)'
    attributes:
      distance_AB:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase A, toPhase B;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 1
          value_type: float
          precision: 6
          native_name: distance_AB[ft]
      distance_BC:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase B, toPhase C;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 2
          value_type: float
          precision: 6
          native_name: distance_BC[ft]
      distance_AC:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase A, toPhase C;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 3
          value_type: float
          precision: 6
          native_name: distance_AC[ft]
      distance_AN:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase A, toPhase N;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 4
          value_type: float
          precision: 6
          native_name: distance_AN[ft]
      distance_BN:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase B, toPhase N;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 5
          value_type: float
          precision: 6
          native_name: distance_BN[ft]
      distance_CN:
        exact_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: ConductorDistance.distance, in its written unit, fromPhase C, toPhase N;
            ends numbered 1..n over the spacing's phases; unset or 0: no row. Export:
            get_stored_distances between the two phases' sequence numbers; absent: unset.
        range: float
        required: false
        unit:
          ucum_code: ft
        annotations:
          order: 6
          value_type: float
          precision: 6
          native_name: distance_CN[ft]
      distance_AE:
        close_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: a ConductorDistance from phase A to a position of kind earth; unset or 0: no
            row. Export: the stored height of that position (an XYSpacing's y; a line with a
            ySpacingOffset raises).
        range: float
        required: false
        description: distance between phase A wire and earth
        unit:
          ucum_code: ft
        annotations:
          order: 7
          value_type: float
          precision: 6
          native_name: distance_AE[ft]
      distance_BE:
        close_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: a ConductorDistance from phase B to a position of kind earth; unset or 0: no
            row. Export: the stored height of that position (an XYSpacing's y; a line with a
            ySpacingOffset raises).
        range: float
        required: false
        description: distance between phase B wire and earth
        unit:
          ucum_code: ft
        annotations:
          order: 8
          value_type: float
          precision: 6
          native_name: distance_BE[ft]
      distance_CE:
        close_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: a ConductorDistance from phase C to a position of kind earth; unset or 0: no
            row. Export: the stored height of that position (an XYSpacing's y; a line with a
            ySpacingOffset raises).
        range: float
        required: false
        description: distance between phase C wire and earth
        unit:
          ucum_code: ft
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: distance_CE[ft]
      distance_NE:
        close_mappings:
          - cim:ConductorDistance.distance
        comments:
          - >-
            Import: a ConductorDistance from phase N to a position of kind earth; unset or 0: no
            row. Export: the stored height of that position (an XYSpacing's y; a line with a
            ySpacingOffset raises).
        range: float
        required: false
        description: distance between neutral wire and earth
        unit:
          ucum_code: ft
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: distance_NE[ft]
