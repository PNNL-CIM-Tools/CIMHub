id: https://gridlabd.org/schema/glm/generators/inverter_dyn
name: inverter_dyn
description: GridLAB-D inverter_dyn class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  inverter_dyn:
    comments:
    - CIMHub does not convert this class. The importer reads no property of it and lists it, with
      its count, on the master's not-mapped comment; the exporter writes none.
    is_a: glm_object
    description: 'Common items ***


      Inherits from: gld_object


      Type: Instance (network topology element)


      Note: Inherits from gld_object (not in generators module)'
    attributes:
      control_mode:
        range: string
        required: false
        description: 'Inverter control mode: grid-forming or grid-following'
        annotations:
          order: 1
          value_type: string
          native_name: control_mode
      grid_following_mode:
        range: string
        required: false
        description: grid-following mode, positive sequency or balanced three phase
          power
        annotations:
          order: 2
          value_type: string
          native_name: grid_following_mode
      grid_forming_mode:
        range: string
        required: false
        description: grid-forming mode, CONSTANT_DC_BUS or DYNAMIC_DC_BUS
        annotations:
          order: 3
          value_type: string
          native_name: grid_forming_mode
      P_f_droop_setting_mode:
        range: string
        required: false
        description: Definition of P-f droop curve
        annotations:
          order: 4
          value_type: string
          native_name: P_f_droop_setting_mode
      phaseA_I_Out:
        range: Complex
        required: false
        description: AC current on A phase in three-phase system
        unit:
          ucum_code: A
        annotations:
          order: 5
          value_type: complex
          native_name: phaseA_I_Out[A]
      phaseB_I_Out:
