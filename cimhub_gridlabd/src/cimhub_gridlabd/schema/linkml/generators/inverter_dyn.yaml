        annotations:
          order: 7
          value_type: complex
          native_name: phaseC_I_Out[A]
      phaseA_I_Out_PU:
        range: Complex
        required: false
        description: AC current on A phase in three-phase system, pu
        unit:
          ucum_code: pu
        annotations:
          order: 8
          value_type: complex
          native_name: phaseA_I_Out_PU[pu]
