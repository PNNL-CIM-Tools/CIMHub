id: https://gridlabd.org/schema/glm/generators/controller_dg
name: controller_dg
description: GridLAB-D controller_dg class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  controller_dg:
    is_a: glm_object
    description: 'GridLAB-D controller_dg class


      Inherits from: gld_object


      Type: Instance (network topology element)


      CIM Mapping: TBD


      Note: Inherits from gld_object (not in generators module)'
    attributes:
      groupid_dg:
        range: string
        required: false
        description: the group ID of the dg objects the controller controls.
        annotations:
          order: 1
          value_type: string
          separator: ','
          native_name: groupid_dg
      ki:
        range: float
        required: false
        description: parameter of the propotional control
        annotations:
          order: 2
          value_type: float
          separator: ','
          precision: 6
          native_name: ki
      kp:
        range: float
        required: false
        description: parameter of the integral control
        annotations:
          order: 3
          value_type: float
          separator: ','
          precision: 6
          native_name: kp
      gain:
        range: float
        required: false
        description: Gain of the controller
        annotations:
          order: 4
          value_type: float
          separator: ','
          precision: 6
          native_name: gain
      ki_QV:
        range: float
        required: false
        description: parameter of the propotional control for secondary voltage control
        annotations:
          order: 5
          value_type: float
          separator: ','
          precision: 6
          native_name: ki_QV
      kp_QV:
        range: float
        required: false
        description: parameter of the integral control for secondary voltage control
        annotations:
          order: 6
          value_type: float
          separator: ','
          precision: 6
          native_name: kp_QV
      gain_QV:
