          value_type: string
          native_name: Gen_status
      Gen_type:
        range: GenType
        required: false
        description: 'COP: Standard synchronous generator; is also used to ''fake''
          a doubly-fed induction generator for now'
        annotations:
          order: 2
          value_type: string
          native_name: Gen_type
      Gen_mode:
        range: string
        required: false
        description: 'COP: Maintains the real and reactive output at the terminals
