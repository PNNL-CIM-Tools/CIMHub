id: https://gridlabd.org/schema/glm/generators/diesel_dg
name: diesel_dg
description: GridLAB-D diesel_dg class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  diesel_dg:
