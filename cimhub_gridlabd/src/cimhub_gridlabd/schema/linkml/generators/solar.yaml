id: https://gridlabd.org/schema/glm/generators/solar
name: solar
description: GridLAB-D solar class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  solar:
    is_a: glm_object
    description: '// Assumptions:

      1. All solar panels are tilted as per the site latitude to perform at their
      best efficiency

      2. All the solar cells are connected in series in a solar module

      3. 600Volts, 5/7.6 Amps, 200 Watts PV system is used for all residential , commercial
      and industrial applications. The number of modules will vary based on the surface
      area

      4. A power derating of 10-15% is applied to take account of power losses and
      conversion in-efficiencies of the inverter.

      // References:

      1. Photovoltaic Module Thermal/Wind performance: Long-term monitoring and Model
      development for energy rating , Solar program review meeting 2003, Govindswamy
      Tamizhmani et al

      2. COMPARISON OF ENERGY PRODUCTION AND PERFORMANCE FROM FLAT-PLATE PHOTOVOLTAIC
      MODULE TECHNOLOGIES DEPLOYED AT FIXED TILT, J.A. del Cueto

      3. Solar Collectors and Photovoltaic in energyPRO

      4. Calculation of the polycrystalline PV module temperature using a simple method
      of energy balance


      Inherits from: gld_object


      Type: Instance (network topology element)


      CIM Mapping: TBD


      Note: Inherits from gld_object (not in generators module)'
    attributes:
      pvc_Pmax_calc_simp_mode:
        range: boolean
        required: false
        description: If the simple mode is selected, the pvc_Pmax = pvc_U_m_V * pvc_I_m_A.
        annotations:
          order: 1
          value_type: bool
          separator: ','
          native_name: pvc_Pmax_calc_simp_mode
      t_ref_cels:
        range: float
        required: false
        description: The referenced temperature
        unit:
          ucum_code: degC
        annotations:
          order: 2
          value_type: float
          separator: ','
          precision: 6
          native_name: t_ref_cels[degC]
      S_ref_wpm2:
        range: float
        required: false
        description: The referenced insolation
        unit:
          ucum_code: W/m^2
        annotations:
          order: 3
          value_type: float
          separator: ','
          precision: 6
          native_name: S_ref_wpm2[W/m^2]
      pvc_a1_inv_cels:
        range: float
        required: false
        description: In the calculation of dI, this is the coefficient that adjusts
          the difference between t (temperature) and pvc_t_ref_cels (referenced temperature)
        annotations:
          order: 4
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_a1_inv_cels
      pvc_b1_inv_cels:
        range: float
        required: false
        description: In the calculation of dU, this is the coefficient that adjusts
          the difference between t (temperature) and pvc_t_ref_cels (referenced temperature)
        annotations:
          order: 5
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_b1_inv_cels
      pvc_U_oc_V:
        range: float
        required: false
        description: The open circuit voltage
        unit:
          ucum_code: V
        annotations:
          order: 6
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_U_oc_V[V]
      pvc_I_sc_A:
        range: float
        required: false
        description: The short circuit current
        unit:
          ucum_code: A
        annotations:
          order: 7
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_I_sc_A[A]
      pvc_U_m_V:
        range: float
        required: false
        description: Voltage at maximum power point
        unit:
          ucum_code: V
        annotations:
          order: 8
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_U_m_V[V]
      pvc_I_m_A:
        range: float
        required: false
        description: Current at maximum power point
        unit:
          ucum_code: A
        annotations:
          order: 9
          value_type: float
          separator: ','
          precision: 6
          native_name: pvc_I_m_A[A]
      MAX_NR_ITERATIONS:
        range: integer
        required: false
        description: The allowed maximum number of newton-raphson itrations
        annotations:
          order: 10
          value_type: string
          separator: ','
          native_name: MAX_NR_ITERATIONS
      x0_root_rt:
        range: float
        required: false
        description: Set the initial guess at this extra percentage of the absolute
          x value at the extreme point
        annotations:
          order: 11
          value_type: float
          separator: ','
          precision: 6
          native_name: x0_root_rt
      DOA_NR_ITERATIONS:
        range: float
        required: false
        description: Set the degree of accuracy of newton-raphson method
        annotations:
          order: 12
          value_type: float
          separator: ','
          precision: 6
          native_name: DOA_NR_ITERATIONS
      panel_type:
        range: string
        required: false
        annotations:
          order: 13
          value_type: string
          separator: ','
          native_name: panel_type
      SOLAR_TILT_MODEL:
        range: string
        required: false
        description: solar tilt model used to compute insolation values
        annotations:
          order: 14
          value_type: string
          separator: ','
          native_name: SOLAR_TILT_MODEL
      SOLAR_POWER_MODEL:
        range: string
        required: false
        annotations:
          order: 15
          value_type: string
          separator: ','
          native_name: SOLAR_POWER_MODEL
      a_coeff:
        range: float
        required: false
        description: a coefficient for module temperature correction formula
        annotations:
          order: 16
          value_type: float
          separator: ','
          precision: 6
          native_name: a_coeff
      b_coeff:
        range: float
        required: false
        description: b coefficient for module temperature correction formula
        unit:
          ucum_code: s/m
        annotations:
          order: 17
          value_type: float
          separator: ','
          precision: 6
          native_name: b_coeff[s/m]
      dT_coeff:
        range: float
        required: false
        description: Temperature difference coefficient for module temperature correction
          formula
        unit:
          ucum_code: m*m*degC/kW
        annotations:
          order: 18
          value_type: float
          separator: ','
          precision: 6
          native_name: dT_coeff[m*m*degC/kW]
      T_coeff:
        range: float
        required: false
        description: Maximum power temperature coefficient for module temperature
          correction formula
        unit:
          ucum_code: '%/degC'
        annotations:
          order: 19
          value_type: float
          separator: ','
          precision: 6
          native_name: T_coeff[%/degC]
      NOCT:
        range: float
        required: false
        unit:
          ucum_code: degF
        annotations:
          order: 20
          value_type: float
          separator: ','
          precision: 6
          native_name: NOCT[degF]
      Tmodule:
        range: float
        required: false
        unit:
          ucum_code: degF
        annotations:
          order: 21
          value_type: float
          separator: ','
          precision: 6
          native_name: Tmodule[degF]
      Tambient:
        range: float
        required: false
        unit:
          ucum_code: degC
        annotations:
          order: 22
          value_type: float
          separator: ','
          precision: 6
          native_name: Tambient[degC]
      wind_speed:
        range: float
        required: false
        unit:
          ucum_code: mph
        annotations:
          order: 23
          value_type: float
          separator: ','
          precision: 6
          native_name: wind_speed[mph]
      ambient_temperature:
        range: float
        required: false
        description: Current ambient temperature of air
        unit:
          ucum_code: degF
        annotations:
          order: 24
          value_type: float
          separator: ','
          precision: 6
          native_name: ambient_temperature[degF]
      Insolation:
