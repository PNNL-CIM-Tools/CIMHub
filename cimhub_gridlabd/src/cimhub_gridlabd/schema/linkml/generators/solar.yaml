          separator: ','
          precision: 6
          native_name: Rinternal[Ohm]
      Rated_Insolation:
        range: float
        required: false
        unit:
          ucum_code: W/sf
        annotations:
          order: 27
          value_type: float
          separator: ','
          precision: 6
          native_name: Rated_Insolation[W/sf]
      Pmax_temp_coeff:
        range: float
        required: false
        annotations:
          order: 28
