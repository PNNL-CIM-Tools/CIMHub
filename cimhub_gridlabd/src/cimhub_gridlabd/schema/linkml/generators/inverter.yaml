id: https://gridlabd.org/schema/glm/generators/inverter
name: inverter
description: GridLAB-D inverter class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  inverter:
    is_a: glm_object
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file inverter.cpp

      @defgroup inverter

      @ingroup generators

      @{


      Inherits from: gld_object


      Type: Instance (network topology element)


      CIM Mapping: TBD


      Note: Inherits from gld_object (not in generators module)'
    attributes:
      inverter_type:
        range: string
        required: false
        description: 'LEGACY MODEL: Sets efficiencies and other parameters; if using
          four_quadrant_control_mode, set this to FOUR_QUADRANT'
        annotations:
          order: 1
          value_type: string
          separator: ','
          native_name: inverter_type
      four_quadrant_control_mode:
        range: string
        required: false
        description: 'FOUR QUADRANT MODEL: Activates various control modes'
        annotations:
          order: 2
          value_type: string
          separator: ','
          native_name: four_quadrant_control_mode
      pf_reg:
        range: string
        required: false
        description: Activate (or not) power factor regulation in four_quadrant_control_mode
        annotations:
          order: 3
          value_type: string
          separator: ','
          native_name: pf_reg
      generator_status:
        range: string
        required: false
        description: describes whether the generator is online or offline
        annotations:
          order: 4
          value_type: string
          separator: ','
          native_name: generator_status
      generator_mode:
        range: GeneratorMode
        required: false
        description: 'LEGACY MODEL: Selects generator control mode when using legacy
          model; in non-legacy models, this should be SUPPLY_DRIVEN.'
        annotations:
          order: 5
          value_type: string
          separator: ','
          native_name: generator_mode
      inverter_convergence_criterion:
        range: float
        required: false
        description: The maximum change in error threshold for exitting deltamode.
        annotations:
          order: 6
          value_type: float
          separator: ','
          precision: 6
          native_name: inverter_convergence_criterion
      current_convergence:
        range: float
        required: false
        description: Convergence criterion for current changes on first timestep -
          basically initialization of system
        unit:
          ucum_code: A
        annotations:
          order: 7
          value_type: float
          separator: ','
          precision: 6
          native_name: current_convergence[A]
      V_In:
        range: float
        required: false
        description: DC voltage
        unit:
          ucum_code: V
        annotations:
          order: 8
          value_type: float
          separator: ','
          precision: 6
          native_name: V_In[V]
      I_In:
        range: float
        required: false
        description: DC current
        unit:
          ucum_code: A
        annotations:
          order: 9
          value_type: float
          separator: ','
          precision: 6
          native_name: I_In[A]
      P_In:
        range: float
        required: false
        description: DC power
        unit:
          ucum_code: W
        annotations:
          order: 10
          value_type: float
          separator: ','
          precision: 6
          native_name: P_In[W]
      VA_Out:
        range: Complex
        required: false
        description: AC power
        unit:
          ucum_code: VA
        annotations:
          order: 11
          value_type: complex
          separator: ','
          native_name: VA_Out[VA]
      Vdc:
