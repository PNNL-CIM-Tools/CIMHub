          ucum_code: degF
        annotations:
          order: 31
          value_type: float
          precision: 6
          native_name: Tcontrol[degF]
      current_tank_status:
        range: string
        required: false
        annotations:
          order: 32
          value_type: string
          native_name: current_tank_status
