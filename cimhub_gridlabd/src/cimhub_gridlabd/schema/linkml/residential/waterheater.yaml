        unit:
          ucum_code: s
        annotations:
          order: 36
          value_type: float
          precision: 6
          native_name: fortran_sim_time[s]
      waterheater_power:
        range: float
        required: false
        description: the current power draw from the fortran water heater.
        unit:
          ucum_code: kW
        annotations:
          order: 37
          value_type: float
          precision: 6
          native_name: waterheater_power[kW]
      load_state:
        range: string
        required: false
        annotations:
          order: 38
          value_type: string
          native_name: load_state
      actual_voltage:
        range: float
        required: false
        annotations:
          order: 39
