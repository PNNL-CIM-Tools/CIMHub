          precision: 6
          native_name: circular_flow_rate[gpm]
      T_mixing_valve:
        range: float
        required: false
        description: 'MULTILAYER MODEL: Reference temperature to which mixing valve
          operate.'
        unit:
          ucum_code: degF
        annotations:
          order: 50
          value_type: float
          precision: 6
          native_name: T_mixing_valve[degF]
      lower_heating_element_state:
        range: string
        required: false
        description: 'MULTILAYER MODEL: The state of the lower heating element in
          the tank.'
        annotations:
          order: 51
          value_type: string
          native_name: lower_heating_element_state
      upper_heating_element_state:
        range: string
        required: false
        description: 'MULTILAYER MODEL: The state of the upper heating element in
          the tank.'
        annotations:
          order: 52
          value_type: string
          native_name: upper_heating_element_state
