    - CIMHub does not convert this class. The importer reads no property of it and lists it, with
      its count, on the master's not-mapped comment; the exporter writes none.
    is_a: residential_enduse
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file clotheswasher.cpp

      @addtogroup clotheswasher

      @ingroup residential

      The clotheswasher simulation is based on an hourly demand profile attached to
      the object.

      The internal heat gain is calculated using a specified fraction of installed
      power.

      The queue is used to determine the probability of a load being run during that
      hour.

      Demand is added to the queue until the queue becomes large enough to trigger
      an event.

      The motor model is simplified in that it assume the motor all the time during
      the load run

      (which is not really true).  The duration of the load is a configurable parameter.

      Motor stalling is implemented when the voltage is below about 0.7 puV.  A stalled
      motor

      remains in the constant impedance state for about 10 seconds before tripping
      off.  When

      tripped, the motor will attempt a restart after about 60 seconds, regardless
      of voltage.

      @{


      Inherits from: residential_enduse


      Type: Instance (network topology element)


      Note: Inherits from residential_enduse (not in residential module)'
