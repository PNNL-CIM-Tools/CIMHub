      floor_area:
        range: float
        required: false
        description: area of the house's ground floor
        unit:
          ucum_code: sf
        annotations:
          order: 1
          value_type: float
          precision: 6
          native_name: floor_area[sf]
      gross_wall_area:
        range: float
        required: false
        description: total exterior wall area
        unit:
          ucum_code: sf
        annotations:
          order: 2
          value_type: float
          precision: 6
          native_name: gross_wall_area[sf]
      ceiling_height:
        range: float
        required: false
        description: height of the house's ceiling, across all floors
        unit:
          ucum_code: ft
        annotations:
          order: 3
          value_type: float
          precision: 6
          native_name: ceiling_height[ft]
      aspect_ratio:
        range: float
        required: false
        description: ratio of the length to the width of the house's ground footprint
        annotations:
          order: 4
          value_type: float
          precision: 6
          native_name: aspect_ratio
      envelope_UA:
        range: float
        required: false
        description: insulative UA value of the house, based on insulation thickness
          and surface area
        unit:
          ucum_code: Btu/degF*h
        annotations:
          order: 5
          value_type: float
          precision: 6
          native_name: envelope_UA[Btu/degF*h]
      window_wall_ratio:
        range: float
        required: false
