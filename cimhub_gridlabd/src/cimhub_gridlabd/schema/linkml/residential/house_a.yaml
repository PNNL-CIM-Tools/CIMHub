classes:
  house_a:
    is_a: residential_enduse
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file house.cpp

      @addtogroup house

      @ingroup residential

      The house object implements a single family home.  The house

      only includes the heating/cooling system and the power panel.

      All other end-uses must be explicitly defined and attached to the

      panel using the house::attach() method.

      Residential panels use a split secondary transformer:

      @verbatim

      -----)||(------------------ 1    <-- 120V

      )||(      120V         ^

      1puV )||(----------- 3(N)  240V  <-- 0V

      )||(      120V         v

      -----)||(------------------ 2    <-- 120V

      @endverbatim

      120V objects are assigned alternatively to circuits 1-3 and 2-3 in the

      order in which they call attach. 240V objects are assigned to circuit 1-2

      Circuit breakers will open on over-current with respect to the maximum

      current given by load when house::attach() was called.  After a breaker opens,

      it is reclosed within an average of 5 minutes (on an exponential distribution).

      Each time the breaker is reclosed, the breaker failure probability is

      increased. The probability of failure is always 1/N where N is initially a

      large number (e.g., 100). N is progressively decremented until it reaches 1
      and

      the probability of failure is 100%.

      The house model considers the following four major heat gains/losses

      that contribute to the building heating/cooling load:

      1.  Conduction through exterior walls, roof and fenestration (based on

      envelope UA)

      2.  Air infiltration (based on specified air change rate)

      3.  Solar radiation (based on CLTD model and using tmy data)

      4.  Internal gains from lighting, people, equipment and other end use

      objects.

      The heating/cooling load is calculated as below:

      Q = U x A x @f$ CLTD_c @f$

      where

      Q = cooling load for roof, wall or fenestration (Btu/h)

      U = overall heat transfer coefficient for roof, wall or

      fenestration  @f$ (Btu/h.ft^2.degF) @f$

      A = area of wall, roof or fenestration @f$ (ft^2) @f$

      @f$ CLTD_c  @f$ = corrected cooling load temperature difference

      (degF)

      @f$ CLTD_c = CLTD + LM + (78 - T_{air}) + (T_{out} - 85) @f$

      where

      CLTD = temperature difference based on construction types (taken

      from ASHRAE Handbook)

      LM = correction for latitude based on tables from ASHRAE

      Handbook

      @f$ T_{air} @f$ = room air temperature (degF)

      @f$ T_{out} @f$ = average outdoor air temperature on a design

      day (degF)

      The Equivalent Thermal Parameter (ETP) approach is used to model the

      residential loads and energy consumption.  Solving the ETP model simultaneously

      for T_{air} and T_{mass}, the heating/cooling loads can be obtained as a

      function of time.

      In the current implementation, the HVAC equipment is defined as part of

      the house and attached to the electrical panel with a 50 amp/220-240V circuit.

      @par Credits

      The original concept for ETP was developed by Rob Pratt and Todd Taylor

      around 1990. The first derivation and implementation of the solution was done

      by Ross Guttromson and David Chassin for PDSS in 2004.

      @par Billing system

      Contract terms are defined according to which contract type is being

      used.  For subsidized and fixed price contracts, the terms are defined using

      the following format:

      @code

      period=[YQMWDH];fee=[$/period];energy=[c/kWh];

      @endcode

      Time-use contract terms are defined using

      @code

      period=[YQMWDH];fee=[$/period];offpeak=[c/kWh];onpeak=[c/kWh];hours=[int24mask];

      @endcode

      When TOU includes critical peak pricing, use

      @code

      period=[YQMWDH];fee=[$/period];offpeak=[c/kWh];onpeak=[c/kWh];hours=[int24mask]>;critical=[$/kWh];

      @endcode

      RTP is defined using

      @code

      period=[YQMWDH];fee=[$/period];bid_fee=[$/bid];market=[name];

      @endcode

      Demand pricing uses

      @code

      period=[YQMWDH];fee=[$/period];energy=[c/kWh];demand_limit=[kW];demand_price=[$/kW];

      @endcode

      @{


      Inherits from: residential_enduse


      Type: Instance (network topology element)


      CIM Mapping: TBD


      Note: Inherits from residential_enduse (not in residential module)'
