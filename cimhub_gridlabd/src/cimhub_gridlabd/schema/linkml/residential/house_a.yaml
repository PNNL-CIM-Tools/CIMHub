        required: false
        description: volume of air exchanged between the house and exterior per hour
        annotations:
          order: 8
          value_type: float
          precision: 6
          native_name: airchange_per_hour
      solar_gain:
        range: float
        required: false
        description: thermal solar input
        unit:
          ucum_code: Btu/h
        annotations:
          order: 9
          value_type: float
          precision: 6
          native_name: solar_gain[Btu/h]
      heat_cool_gain:
        range: float
        required: false
        description: thermal gain rate of the installed HVAC
        unit:
          ucum_code: Btu/h
        annotations:
          order: 10
          value_type: float
          precision: 6
          native_name: heat_cool_gain[Btu/h]
      thermostat_deadband:
