id: https://gridlabd.org/schema/glm/residential/range
name: range
description: GridLAB-D range class
imports:
- linkml:types
- ../types/common
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
default_range: string
classes:
  range:
    is_a: residential_enduse
    description: 'Copyright (C) 2008 Battelle Memorial Institute

      @file range.cpp

      @addtogroup range

      @ingroup residential

      The range simulation is based on a demand profile attached to the object.

      The internal heat gain is calculated as the demand fraction of installed power.

      @{


      Inherits from: residential_enduse


      Type: Instance (network topology element)


      CIM Mapping: TBD


      Note: Inherits from residential_enduse (not in residential module)'
    attributes:
      oven_volume:
        range: float
        required: false
        description: the volume of the oven
        unit:
          ucum_code: gal
        annotations:
          order: 1
          value_type: float
          separator: ','
          precision: 6
          native_name: oven_volume[gal]
      oven_UA:
        range: float
        required: false
        description: the UA of the oven (surface area divided by R-value)
        unit:
          ucum_code: Btu/degF*h
        annotations:
          order: 2
          value_type: float
          separator: ','
          precision: 6
          native_name: oven_UA[Btu/degF*h]
