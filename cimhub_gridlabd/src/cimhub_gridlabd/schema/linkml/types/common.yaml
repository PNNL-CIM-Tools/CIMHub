id: https://gridlabd.org/schema/glm/types/common
name: common_types
description: Common types and enumerations for GridLAB-D GLM schema
imports:
- linkml:types
prefixes:
  linkml: https://w3id.org/linkml/
  glm: https://gridlabd.org/schema/glm/
default_prefix: glm
classes:
  Complex:
    description: Complex number with real and imaginary components
    attributes:
      real:
        range: float
        required: true
        description: Real component
      imag:
        range: float
        required: true
        description: Imaginary component
  glm_object:
    abstract: true
    description: >-
      The header properties GridLAB-D gives every object (core/object.c), whatever its class. They are not
      published by the class, so the C++ scrape does not see them. name is the identifier: GridLAB-D names are
      unique across the whole model; an unnamed object is called <class>:<id>.
    attributes:
      name:
        range: string
        identifier: true
        required: true
        description: The object's name; unique across the model.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: name
      parent:
        range: string
        description: The parent object's name. A child node is solved as its parent's bus; a nested object block sets it to the enclosing object.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: parent
      groupid:
        range: string
        description: Free-text group label.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: groupid
      latitude:
        range: string
        description: Latitude, as written (decimal degrees or GridLAB-D's 37N26:12 form).
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: latitude
      longitude:
        range: string
        description: Longitude, as written.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: longitude
      in_svc:
        range: string
        description: Timestamp the object enters service.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: in_svc
      out_svc:
        range: string
        description: Timestamp the object leaves service.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: out_svc
      rank:
        range: string
        description: Solver rank.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: rank
      flags:
        range: string
        description: Core object flags.
        annotations:
          order: 0
          value_type: string
          separator: ','
          native_name: flags
