[build-system]
requires = ["setuptools~=80.9"]
build-backend = "setuptools.build_meta"

[project]
name = "cimhub_gdm"
description = "CIMHub GDM converter: grid-data-models DistributionSystem -> cim18v17 through CIM-Builder"
readme = "README.md"
version = "2.1.0"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  { name = "Alex Anderson", email = "19935503+AAndersn@users.noreply.github.com" },
  { name = "Tylor Slay" },
  { name = "Kapil Duwadi" },
  { name = "Nathan Gray" },
  { name = "Craig Allwardt", email = "3979063+craig8@users.noreply.github.com" },
  { name = "Andy Fisher" },
]
maintainers = [
  { name = "Pacific Northwest National Laboratory", email = "gridappsd@pnnl.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
  "cimhub-core[time-points]>=2.1.0a1,<2.2",
  "cim-builder>=0.1.1a1,<0.2",
  "cim-tables>=0.1.1a1,<0.2",
  "grid-data-models~=2.4",
  "pyarrow>=18",
]

[project.urls]
"Homepage" = "https://github.com/PNNL-CIM-Tools/CIMHub"
"Bug Tracker" = "https://github.com/PNNL-CIM-Tools/CIMHub/issues"

[tool.setuptools]
packages = { find = { where = ["src"] } }
